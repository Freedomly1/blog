<script type="text/markdown" id="md-reading-40-books">
去年这个时候，我在笔记本的扉页写下一行字：**今年读 40 本书**。

写的时候挺心虚的。因为前一年我大概只读完了 6 本，剩下的二十几本都停在第三章，书签像一排小小的墓碑。

## 我以前的读法是错的

很长一段时间，我把读书当成一项必须完成的任务：从第一页开始，逐字逐句，读完才算「读过」。这套方法在学校里管用，因为教材本来就是为了被完整读完而写的。但大部分书不是。

一本 300 页的书里，真正对你有用的可能只有 30 页。剩下的部分——铺垫、举例、作者的个人经历——不是不重要，只是此刻与你无关。

> 阅读不是把书从头到尾搬运一遍，而是在书里找到能解决你当下问题的那些句子。

想通这一点之后，我给自己定了四条规则。

## 规则一：允许弃书

这是最难的一条，也是最有效的一条。

我给自己一个「50 页豁免权」：读 50 页还没有任何一处想划线，就合上，放回书架。不内疚，不记账。

一年下来我弃了 17 本。听起来很浪费，但正因为我敢弃，才敢开始。

## 规则二：一次只读三本

同时读的书不超过三本，并且必须分工明确：

| 角色 | 类型 | 时间 |
| --- | --- | --- |
| 主读 | 需要连续思考的书 | 早上 40 分钟 |
| 副读 | 轻松的非虚构 | 通勤、排队 |
| 重读 | 读过的旧书 | 睡前 15 分钟 |

主读负责推进，副读负责填补碎片时间，重读负责把好东西再吸一遍。三本之外一律排队。

## 规则三：读完立刻写 300 字

不写笔记的书，等于没读。

我的笔记格式极其简单，只有三行：

1. 这本书想解决什么问题
2. 它给出的最反直觉的答案
3. 我下周打算拿它做什么

第三条最重要。**没有行动项的知识，只是收藏品。**

## 规则四：让书出现在路上

我在三个地方各放了一本书：床头、包里、办公室抽屉。手机上的读书 App 只留了一个，且删掉了所有推送。

原理很朴素：降低开始阅读的摩擦，提高开始刷手机的摩擦。

## 这一年读到了什么

四十本里，有 6 本值得反复读：

- 《深度工作》
- 《禅与摩托车维修艺术》
- 《写作这回事》
- 《设计中的设计》
- 《人类简史》
- 《瓦尔登湖》

它们有个共同点：都不是教你「怎么做」，而是让你重新看一遍「为什么要做」。

## 明年的目标

不设数量了。改成：**每季度重读一本旧书**。

书不是用来刷新的数字，是用来反复经过的路。走得慢一点，反而记得住。
</script>

<script type="text/markdown" id="md-container-queries">
做了六年响应式，我最近才彻底换掉一种习惯：不再用媒体查询给组件加断点。

## 老办法的问题

假设有一个卡片组件，它既在侧边栏里，也在主内容区里。用媒体查询，你只能这样写：

```css
@media (min-width: 720px) {
  .card { flex-direction: row; }
}
```

问题是：这句话描述的是**屏幕**，而组件关心的是**自己**。同一个卡片放在 280px 的侧边栏里，屏幕再宽它也不该横排。

于是你开始写 `.sidebar .card`、`.main .card` 这样越来越长的选择器，组件和布局耦合在一起，复用变成奢望。

## 容器查询解决什么

容器查询把「宽度」这个概念还给组件自己：

```css
.card-wrap {
  container-type: inline-size;
  container-name: card;
}

@container card (min-width: 480px) {
  .card { flex-direction: row; }
}
```

只要 `.card-wrap` 自己够宽，卡片就变成横向；它多宽取决于父级布局，而不是浏览器窗口。组件终于可以真正地「放到哪里都成立」。

## 三个实战细节

### 一、别忘了容器类型的代价

`container-type: inline-size` 会让元素建立独立的布局上下文，它的高度不再参与父级的内在尺寸计算。在 grid 或 flex 中这通常是你要的；但在需要「内容撑高」的场景里会踩坑。

### 二、把单位换成 cqw

容器单位让内部尺寸跟着容器走：

```css
@container card (min-width: 480px) {
  .card__title { font-size: clamp(1rem, 3.2cqw, 1.6rem); }
}
```

这比 `vw` 更符合直觉：字号跟着卡片走，而不是跟着窗口走。侧边栏里的标题不会因为屏幕宽就突然变大。

### 三、用容器查询做「密度」

我最喜欢的一个用法，是让它自动切换信息密度：

```css
@container card (max-width: 320px) {
  .card__excerpt,
  .card__tags { display: none; }
}
```

不用 JS，不用 ResizeObserver，也不用给每种布局各写一套组件。

## 什么时候还是该用媒体查询

媒体查询没有过时。它擅长的是「环境」：

- 暗色模式：`prefers-color-scheme`
- 减少动效：`prefers-reduced-motion`
- 打印样式
- 极端的全局断点，比如移动端隐藏侧边栏

一句话总结：**环境用媒体查询，组件用容器查询。**

## 兼容性

截至 2026 年，所有主流浏览器都已支持容器查询，包括内联尺寸查询和常用的样式查询子集。真正需要担心的不是浏览器，而是你的设计系统有没有把「组件宽度」当成一等公民。

如果你的设计稿里，同一个组件在不同位置有不同长相，那容器查询不是可选项，是必需品。
</script>

<script type="text/markdown" id="md-whitespace">
刚做设计的时候，我有个毛病：觉得页面上空着的地方浪费了。于是塞小图标、塞说明文字、塞分割线。结果页面很满，但没人愿意看。

后来才明白，留白不是没放东西的地方，**它就是设计的一部分**。

## 层次一：间距是关系

两个元素之间的距离，直接告诉用户它们有多亲。

- 8px：同一组内的兄弟
- 16px：同一个模块的不同部分
- 32px：不同模块之间
- 64px 以上：不同章节

这套数字本身不重要，重要的是**一致**。如果 12px 和 14px 混用，用户说不出哪里别扭，但会觉得「乱」。

> 规则：距离只有三档——很近、有点远、很远。超过三档，人眼就分辨不出来了。

## 层次二：留白是节奏

好的页面有呼吸。全篇等距的间距，像一段没有标点的句子。

我的做法是给每个区块一个「密度标签」：

| 区域 | 密度 | 行高 | 段距 |
| --- | --- | --- | --- |
| 首屏 | 疏 | 1.9 | 2em |
| 正文 | 中 | 1.75 | 1.2em |
| 列表 | 密 | 1.5 | 0.5em |

首屏疏，是为了让你停下来；正文中，是为了让你读下去；列表密，是为了让你扫得快。

## 层次三：留白是态度

这一层最玄，但也最真实。

一个页面上留了大片空白，意味着作者相信内容自己会说话。反过来，如果一个页面到处都在抢注意力——弹窗、角标、红点、跑马灯——它传达的其实是焦虑。

我喜欢的站大多有个共同点：一屏只说一件事。

## 一个可执行的练习

拿你正在做的页面，把所有非内容的元素（分割线、装饰图标、说明性小字）先全部删掉，截个图。

然后把它们一个个加回来，每加一个问自己：**没有它，用户会误解吗？**

如果答案是「不会，只是没那么好看」，那就别加。

留白的最高境界，是别人根本没注意到它。
</script>

<script type="text/markdown" id="md-workflow-2026">
每年我都会重装一次自己的工作流。今年这一次改动最小，但最稳。写下来，也给未来的自己留个存档。

## 全景图

我的流程只有四步：**收集 → 澄清 → 推进 → 归档**。

听起来像 GTD，但细节更粗糙，也更适合我这种容易把系统过度设计的人。

## 一、收集：只有一个入口

所有想法、链接、待办，全部进同一个 Inbox。不是三个，不是按项目分，就是一个。

我用的工具换过很多次，从 Notion 到 Obsidian 到纯文本，但入口数量始终是一。原因很简单：**多一个入口，就多一次「这条该放哪」的决策**，而决策会消耗意志力。

现在我的 Inbox 是一个 `inbox.md` 文件，手机和电脑都能一秒打开。

## 二、澄清：每天十分钟

早上的第一件事不是干活，是把昨晚和今早堆进 Inbox 的东西过一遍。

每条只问一个问题：**它下一步是什么？**

| 情况 | 处理 |
| --- | --- |
| 两分钟能做完 | 立刻做 |
| 有明确下一步 | 变成一个具体的任务 |
| 是个想法 | 移进「笔记」，标上主题 |
| 暂时没用 | 删掉 |

「删掉」这一步最容易被跳过。但不删，Inbox 就会变成一个越堆越高的杂物间，最后你连打开它的欲望都没有。

## 三、推进：每天只推三件事

我不做长清单。每天早上从任务池里挑三件，写在纸上，做完划掉。

三件里必须有一件是「推进型」的——写一段、做一版、跑一次——而不是「响应型」的（回消息、开会、填表）。

响应型的事永远做不完，它们会自己找上门。推进型的事不会，你不主动安排，它就永远停在原地。

## 四、归档：周五下午半小时

- 完成的任务 → 归档
- 没完成的 → 重新评估，超过三周没动的直接删
- 本周的笔记 → 打标签，放进永久笔记
- 写一段 200 字的周回顾

周回顾不写情绪，只写三件事：做成了什么、卡在哪、下周最重要的一件事是什么。

## 关于工具

我现在的组合：

- 纯文本 + Git：所有笔记
- 一个极简待办 App：只有今天
- 纸质笔记本：思考和画图
- 日历：只放真正有时间的约定

工具越少，系统越可能活下来。

## 一点提醒

不要为了工作流而工作流。如果你花在维护系统上的时间超过了你真正做事的时间，那这个系统就是负债。

好的系统应该让你**忘记它的存在**。
</script>

<script type="text/markdown" id="md-blog-as-second-brain">
我用过几乎所有笔记工具。它们很好，但有一个共同的问题：写给自己看的东西，很容易变成垃圾。

不是因为懒，是因为**没有读者**。

## 公开写作的压力是好的压力

同样一个想法，写在私人笔记里你会写：

> Kafka 好像和消息队列有关，改天查查。

写在博客里，你必须先查清楚，因为你不知道谁会看到。这个「先查清楚」的动作，就是学习的发生。

## 我的三层结构

现在我的知识管理分三层。

### 第一层：碎片

每天随手记的东西。不整理，不分类，一个月后清空一次。绝大多数会消失，这很正常。

### 第二层：笔记

值得展开的想法。每条笔记是一个独立的小卡片，有自己的标题，能用一段话说清楚。标准是：**如果三个月后的我看到它，能不能直接理解？**

### 第三层：文章

当某个主题积累了四五条笔记，我就把它们缝成一篇文章，发到博客上。

这一步是整条流水线的关键。因为「缝」的过程会暴露所有逻辑漏洞——你以为想通的地方，一写就露馅。

## 博客是索引，不是仓库

我不指望博客保存所有东西。它是**索引**：告诉未来的我，这个主题我曾经想到哪一步，证据在哪，结论是什么。

具体的资料留在笔记里，博客只放结论和推理过程。

## 一个副作用

写博客这几年，我最大的收获不是读者，是**检索能力**。

因为经常要回答「我以前是不是写过这个」，我养成了给每篇文章起清晰标题、给每段起小标题的习惯。这个习惯反过来让我的笔记也变得好找了。

> 你写下的东西的价值，取决于你以后能不能找到它。

## 从今天开始

如果你想开始，不要写「我的第一篇博客」。写你最近解决的一个具体问题，哪怕只有 500 字。

具体的、小的、真实的东西，永远比宏大的开场白更有价值。
</script>

<script type="text/markdown" id="md-vite-build-optimization">
接手一个中型后台项目，`vite build` 要 12.4 秒。听起来不算灾难，但加上 CI 和部署，一次发布要等三分钟。于是我花了一个下午，只做一件事：优化构建，不动业务代码。

结果是 2.8 秒。

## 先测量，别猜

第一件事是打开构建分析：

```bash
vite build --mode production
```

然后在 `vite.config.ts` 里加上可视化：

```ts
import { visualizer } from 'rollup-plugin-visualizer'

export default defineConfig({
  plugins: [
    visualizer({ gzipSize: true, filename: 'stats.html' })
  ]
})
```

打开 `stats.html`，问题一目了然：

1. 一个 UI 组件库被整包引入，占了四成
2. 图标库每个图标都打进来了
3. 有几个只在一处用到的图表库被静态引入
4. 所有路由都同步加载

## 改动一：按需引入组件库

原来是整包引入：

```ts
import { Button, Table, Modal } from 'antd'
```

改成按需引入，配合 `unplugin-vue-components` 或 `unplugin-react-components` 自动解析。这一项把包体砍掉了 38%。

## 改动二：图标按名引入

```ts
// 之前：整包
import * as Icons from '@ant-design/icons'

// 之后：只有用到的
import { SearchOutlined } from '@ant-design/icons'
```

图标库是最容易被忽略的胖子，一个 import 就可能带进几千个 SVG。

## 改动三：重库改动态引入

图表、富文本、代码高亮这类东西，首屏根本用不到：

```ts
const Chart = defineAsyncComponent(() => import('@/components/Chart.vue'))
```

配合路由级懒加载，首屏 JS 从 1.8MB 降到 620KB。

## 改动四：给构建减负

这一条不减少产物，但显著减少构建时间。把 `build.target` 提到项目实际支持的基线：

```ts
build: {
  target: 'es2020',
  cssCodeSplit: true,
  reportCompressedSize: false
}
```

`reportCompressedSize: false` 单独就能省 1 秒多——它只是不再计算并打印 gzip 体积，CI 里根本没人看。

## 结果

| 指标 | 之前 | 之后 |
| --- | --- | --- |
| 构建时间 | 12.4s | 2.8s |
| 首屏 JS（gzip） | 1.8MB | 620KB |
| 产物文件数 | 214 | 96 |

## 学到的

优化的顺序永远是：**测量 → 找出最大的那个 → 只改它 → 再测量**。

凭直觉猜的话，我大概率会去折腾 sourcemap 和压缩插件，而它们加起来只占 8%。

先看数据，比什么都快。
</script>

<script type="text/markdown" id="md-five-afternoons">
七月，我回到长大的小城住了半个月。每天下午四点出门，走到天黑回家。没有目的地，也没有耳机。

## 第一个下午：菜市场

菜市场在河边，棚顶是铁皮的，下过雨后叮叮当当。

卖鱼的女人坐在蓝色塑料盆中间，手里一把刀，杀鱼的动作像在削一支铅笔。她问我：「要哪条？」我说随便。她说：「随便的鱼不好吃。」

最后我买了一条鲫鱼，她帮我刮了鳞，又送了两根葱。

## 第二个下午：旧书店

新华书店二楼拐角，有一家开了二十年的旧书店。老板在打瞌睡，风扇对着他吹。

书架上的书按「老板觉得」分类：武侠在一摞，言情在另一摞，中间夹着一本《拖拉机维修手册》。

我翻到一本 1998 年的《读者》，定价 2.5 元。纸已经发黄，但字很清楚。里面有一篇文章讲「如何度过一个无聊的下午」，我站着读完了。

结账时老板说：「五块。」我说书后面写着 2.5。他说：「现在物价涨了。」

## 第三个下午：河堤

河堤上种了一排樟树，树荫很密。有老人在下棋，围观的人比下棋的多。

我坐在台阶上看水。水面有油污的光，也有晚霞的光，两种光混在一起，看不出哪个更脏。

一个小孩在放风筝，风筝卡在树上了。他仰着头看了很久，然后自己走了。我本来想去帮忙，但我也不会爬树。

## 第四个下午：中学门口

学校放假了，门口只有一家文具店开着。

老板娘还记得我，说：「你以前老来买笔芯。」我说是啊。她说：「现在没人买笔芯了，都买盲盒。」

店里确实有一整面墙的盲盒，塑料小人排得整整齐齐。我买了两支笔芯，一块钱。

## 第五个下午：下雨

最后一天下雨，我没带伞，站在便利店门口等。

雨点打在遮阳棚上，声音很密。便利店的店员在整理货架，把过期的饭团挑出来，摆成一排。

雨停了，我走回家。路过菜市场，卖鱼的女人正在收摊，她冲我点了点头。

## 之后

回到城市后，我偶尔会想起那五个下午。

什么都没发生，也没想明白什么道理。但那种「时间不被使用」的感觉，我很久没有过了。

我们总在问「今天做了什么」。或许有些日子，就是用来不做什么的。
</script>

<script type="text/markdown" id="md-deep-work">
五年前第一次读《深度工作》，我记住的是方法：关手机、定时间、做记录。

这次重读，我划下的全是另一类句子——关于**为什么**。

## 书里最扎心的一句话

> 深度工作的能力正在变得越来越稀有，而与此同时，它的价值正在变得越来越高。

这句话写于 2016 年。放到 2026 年看，前半句更真了，后半句也更真了。

## 我的三个误区

### 误区一：以为忙碌等于产出

以前我觉得，只要一天到晚在处理事情，就是努力工作。但书里区分得很清楚：

- **深度工作**：在无干扰状态下进行的高认知活动，能创造新价值，且难以复制
- **浮浅工作**：不需要太多认知努力的事务性任务，容易复制

回看我的一天，深度工作的时间大概只有 90 分钟，其余全是浮浅工作。而这 90 分钟贡献了 80% 的成果。

### 误区二：以为随时能进入状态

书里提到一个概念叫「注意力残留」：当你从任务 A 切换到任务 B，一部分注意力还留在 A 上。

频繁切换的人，从来没有真正进入过任何一个任务。

所以我以前那些「边写代码边回消息」的下午，实际上两边都做得很差。

### 误区三：以为休息是浪费时间

纽波特提出：**深度工作需要像运动员一样训练和恢复**。

不是「工作到累再休息」，而是「按节奏工作，按节奏恢复」。他建议每 90 分钟休息一次，且休息时不要碰屏幕。

## 我打算做的三件事

1. 每天一个 90 分钟的无干扰块，手机放另一个房间
2. 把收件箱集中处理两次，上午 11 点、下午 4 点，其余时间关闭通知
3. 给浮浅工作定量，每天不超过 2 小时，超出就砍

## 一点质疑

书里对社交媒体的态度偏严厉，认为它们只是「任何益处法」的产物——只要有一点点好处，就合理化大量使用。

我部分同意，但不完全。对创作者来说，平台也是分发渠道，完全退出并不现实。

我的折中方案是：**把消费和创作分开**。消费限时，创作专注。

## 最后

这本书真正改变我的不是技巧，是一种视角：

注意力不是取之不尽的资源，它更像体力——用完了就没了，而且需要恢复。

怎么花它，决定了你成为什么样的人。
</script>

<script type="text/markdown" id="md-letter-to-myself">
三年前的今天，你发出了第一篇博客。浏览量 12，其中 3 个是你自己刷的。

你在结尾写：「希望以后能一直写下去。」

现在我可以回答你了：写了 87 篇，没有断更超过一个月。但过程和你想的不一样。

## 你以为的坚持，是每天都写

不是的。

我试过日更，坚持了 19 天，然后崩了。崩的那天我写了三段废话，删掉，又写，又删，最后关电脑睡觉。

真正让我写下来的，不是意志力，是**降低门槛**：

- 不要求每篇都完整
- 允许写 300 字的短记
- 允许写「没想明白」的东西

## 你以为的读者，是很多人

不是的。

三年里，平均每篇阅读量不到 100。最多的一篇有 4000 多，是被某个社区转载了；最少的一篇有 3 个。

但那 3 个人里，有一个给我写了很长的邮件，说那篇文章帮他解决了一个困扰半年的问题。

那一刻我明白了：**写作的价值不取决于读者的数量，而取决于有没有一个人真的被帮到**。

## 你以为的瓶颈，是没东西可写

不是的。

瓶颈永远是「不敢写」。怕写得浅，怕被人笑，怕观点过时。

后来我发现一个真相：你觉得浅的东西，对三个月前的自己也是新的。而三个月前的你，比陌生人更接近你的读者。

## 你以为的收获，是流量

不是的。

三年写下来，我最大的收获是：

1. **想清楚了几个问题**。写之前以为懂，写的时候才发现漏洞
2. **认识了几个人**。都是通过文章找来的，聊得很深
3. **有了一个可以回看的时间轴**。翻旧文章，能看到自己怎么变的

## 给你的三条建议

**一、别等准备好。** 第一篇永远不完美，但它必须存在，否则第二篇不会来。

**二、别追热点。** 热点会过期，你的思考不会。写你真正在意的东西。

**三、别删旧文。** 哪怕写得幼稚，那也是你走过的路。我现在最珍惜的，就是那些现在写不出来的句子。

## 最后

三年后的你，还是会在深夜打开编辑器，还是会为一个句子纠结半小时，还是会在发布后反复刷新看有没有人留言。

但你已经不焦虑了。

因为你终于知道，写东西这件事，本来就是为了自己。
</script>

<script type="text/markdown" id="md-local-first">
去年我的一个笔记服务宣布停止运营，给了 30 天导出窗口。

我导出了 2000 多条笔记，格式是一堆嵌套的 JSON，图片链接全部指向一个即将关闭的 CDN。

那次之后，我开始认真对待「本地优先」。

## 什么是本地优先

本地优先（Local-first）不等于「不用云」，而是：

- **数据的主副本在你的设备上**
- 应用在离线时完整可用
- 同步是可选的增强，不是前提
- 你随时可以把数据完整带走

对比一下：

| | 云端优先 | 本地优先 |
| --- | --- | --- |
| 断网 | 不可用 | 完整可用 |
| 数据所有权 | 平台 | 你 |
| 迁移成本 | 高 | 低 |
| 协作 | 天然支持 | 需要额外方案 |
| 冲突处理 | 服务端 | 客户端（CRDT 等） |

## 我现在的组合

### 笔记：纯文本 + Git

所有笔记是 `.md` 文件，放在一个 Git 仓库里。同步靠私有远程仓库，冲突靠手动合并——一年也就发生两三次。

好处是：任何编辑器都能打开，二十年后大概也还能。

### 照片：本地硬盘 + 异地备份

原图在主机的硬盘里，按年月分目录。备份用增量同步到一块移动硬盘，每月一次。

云相册只用来分享，不作为唯一存储。

### 密码：开源密码管理器

数据加密后放在自己的服务器上，客户端本地解密。

### 阅读：RSS

不再依赖推荐算法。订阅的源存在本地，读完的标记也存在本地。

## 代价是什么

本地优先不是免费的：

1. **要自己备份**。3-2-1 原则：3 份副本，2 种介质，1 份异地
2. **协作更难**。别人没法直接编辑你的文件
3. **要付学习成本**。Git、同步工具、加密，都有门槛

如果你只是记个购物清单，这些都不值得。但如果你有十年份的笔记、照片、代码，那控制权就很重要。

## 一个判断标准

我现在的判断很简单：**这份数据，如果明天这个服务消失了，我还能不能拿回来？**

如果答案是「不能」，那它就不该是我唯一的副本。

方便很重要，但方便的前提是，东西还是你的。
</script>


<script type="text/markdown" id="md-robot-vision">
写一个能用手柄方向键控制的小车，大概是最容易「看起来做完了」的项目。真正花了时间的，全是做完之后才冒出来的账：固件看门狗、转发回环、速度不生效、以及视觉该放在哪一层。

这篇把那些账一次算清。

## 起点：一个只有方向盘的控制台

最初的需求只有一句：能用上下左右控制一个机器人。

最小实现是零依赖的 Node 服务 + 一个单页：服务端 20Hz 步进虚拟机器人，浏览器通过 SSE 看画面，按下方向键就 `POST /api/input`，多端同时按就取方向并集。键盘 WASD、触屏长按、急停，两天就顺手了。

顺到我一直以为它已经能用——直到开始接真实硬件。

## 问题一：按住两秒，车自己停了

固件里有看门狗：**1.5 秒收不到指令就停车**。这是必要的，WiFi 断了、页面关了，车不该继续冲。

但服务端当时只在「方向变化」时发一次请求。按住不动，就没有变化——1.5 秒后，车自己停了。

修法不是把看门狗调大（那等于把安全机制废掉），而是补心跳：

```js
function syncHardware(cmd) {
  if (!hardware.enabled) return;
  const now = Date.now();
  const changed = cmd !== hardware.lastDir;
  const needBeat = cmd !== 'stop' && now - hardware.lastSentAt > 500;
  if (!changed && !needBeat) return;
  hardware.lastDir = cmd;
  hardware.lastSentAt = now;
  forwardDir(cmd);
}
```

按住「上」两秒，硬件实际收到的是这样一串：

```
/api/speed?value=60      ← 开启转发时同步当前速度
/api/move?dir=stop       ← 初始状态
/api/move?dir=up         ← 按下，立刻发
/api/move?dir=up         ← 心跳 512ms
/api/move?dir=up         ← 心跳 502ms
/api/move?dir=up         ← 心跳 504ms
/api/move?dir=stop       ← 松手，立刻停
```

八条请求，有节奏、有上界。心跳不是「多发几次保险」，它是在**同时满足两个约束**：固件的安全阈值，和控制台的低流量。

## 问题二：我把转发地址填成了自己

测转发时图省事，硬件地址填了 `http://127.0.0.1:8787`——也就是这个控制台自己。

于是它把 `/api/move` 发给自己，那个路径不存在；顺手又发了一次 `/api/speed`，而这个接口会把速度再转发一次……

四秒，一万一千九百三十二次请求。

这看起来像「测试时的蠢操作」，其实是产品缺陷：只要用户填错地址（填了控制台自己的地址、或者同一台机器上的另一个实例），服务就会自己打自己，直到把 CPU 吃满。所谓「用户不会这么填」从来不是理由。

加自环检测：

```js
function isSelfTarget(baseUrl) {
  const u = new URL(baseUrl);
  const port = u.port || (u.protocol === 'https:' ? '443' : '80');
  if (String(port) !== String(PORT)) return false;
  // 同端口 + 本机任一地址（localhost / 127.0.0.1 / 网卡 IP / ::1）
  return localAddresses.has(u.hostname);
}
```

现在填自己会被直接拒绝，并关掉转发：

> 地址指向控制台自己，会形成回环，已拒绝

顺带把速度也做成「只在数值变化时下发」——同一类问题的另一面：高频重复的写操作，本身就是 bug 温床。

## 问题三：拖速度滑杆，车没变快

速度只改了服务端的仿真参数，没往硬件发。补了 `/api/speed?value=0..100`，固件用 PWM 改占空比。

## 加转向时，先承认一个事实

差速车**不能横移**。

虚拟画面里「左右」是平移，看着直观；真车上做不到。这个差异如果不写清楚，接车的人第一反应是「坏了」。

所以加了独立的旋转通道，而不是复用左右：

- 新增 `rotateLeft / rotateRight` 输入，和 `heading`（0° 朝上，顺时针）
- 左右同时按互相抵消，符合差速车的直觉
- 画布上的车头三角按 `heading` 画，旋转时外圈加虚线提示
- 固件里 `left/right` 和 `rotate-*` 是同一个动作：左右轮反向、原地转

要真横移，得换麦克纳姆轮或全向轮——那是另一套轮系，另一篇再写。

## token：挡的不是攻击者，是「随手打开」

服务监听所有网卡，同一局域网谁打开地址都能开走这台车。于是除 `/api/health` 外全部要 token：

- 启动时生成并打印**带 token 的完整地址**
- 三种传法：`x-robot-token` 请求头、`?token=` 查询参数、页面自动带
- 比较用 `crypto.timingSafeEqual`，等长才比，避免时序泄漏
- 页面从 URL 读一次就 `history.replaceState` 抹掉，免得截图或转发时把 token 带出去
- `/api/health` 故意开放：只回存活与在线端数，不暴露任何控制能力，方便探活

它挡不住真正想看的人，但它挡住了「随手点开一个链接就能开车」这件事。这个定位要说清楚，不能让用户以为它是账号体系。

## 视觉：为什么放在浏览器里

三条理由，按重要性排：

1. **画面不出本机**。摄像头帧如果先传到服务端再回来，等于把家里实时画面上传了一遍。
2. **延迟低**。本地像素运算，从取帧到出指令是毫秒级。
3. **不引入依赖**。服务端要跑 OpenCV 或模型，就得装一堆东西；浏览器已经自带摄像头和 Canvas。

链路不长：

```
摄像头帧 → 缩到 160×120 → 逐点 RGB→HSV
        → 色相距离 ≤ 容差，且 S≥0.35、V≥0.2（滤掉灰白黑）
        → 质心 + 包围盒 → 相对画面中心的偏差（-1 ~ 1）
        → 死区 0.10 → 上/下/左/右 → POST /api/input
```

几个刻意的选择：

- **控制环 12.5Hz**（80ms 一次），不是每帧都发请求。渲染可以 60fps，控制不需要。
- **目标丢失 400ms 就松手**，宁可停住，也不要拿过期坐标继续冲。
- **采样点少于 12 个、或面积 <0.4% 当噪声**，避免把反光点当目标。
- **状态回调限频 10Hz**，rAF 每帧写 DOM 会让低端机发涩。

最值得说的是这个：**视觉没有新开接口**。它就是一个 headless 客户端在发 `/api/input`，`clientId` 是 `<页面客户端>-vision`。

好处是全部的既有机制自动复用：硬件转发、多端方向合并、看门狗、急停，一行没改。而且它和手动方向盘各占一路，方向取并集——你按住 W 的时候，视觉的指令不会把你的覆盖掉，你松手它接着接管。

## 怎么确认它是对的

视觉最容易「看着能动就算过」。所以我把算法拆成纯函数单独测：

- 三原色 RGB→HSV（红 0°、绿 120°、蓝 240°、灰饱和度为 0）
- 色相跨 0/360 的最短距离（350° 与 10° 相差 20°，不是 340°）
- 居中红块 → 质心误差 ≤2px、包围盒宽度符合
- 偏右红块 → 质心落在右半侧、上半侧
- 空画面 / 纯灰画面 → 判空（灰色饱和度低，不能算目标）
- 4×4 的小红块 → 当噪声丢掉
- 容差 10 不认橙红（色相 ~30°），容差 45 才认
- 偏差 → 指令：左偏只发左、中心不动、右下同时发右和下、无目标全松

八条全过。浏览器里剩下的只有「取帧」和「画叠加层」——这两件事出错，眼睛一看就知道，不需要测试兜底。

## 还差什么

- **摄像头只在 https 或 localhost 下可用**。手机用 `http://192.168.x.x:8787` 访问会被浏览器直接拒绝，这不是代码问题，是安全策略。要手机端视觉，得给服务配 HTTPS。
- **颜色追踪吃光照**。取色时让目标占画面十分之一以上、避开强反光；换房间换灯就得重新取色。
- **不认语义**。它知道「这块红色在右边」，不知道「这是椅子」。要认类别得换模型——好在替换点在 `detect()` 一处，后面的「偏差 → 指令」逻辑一行不用改。

写完这些，我最大的感受是：**能动的 demo 和能用的工具之间，隔着的全是这类不起眼的账**。看门狗和心跳的配合、回环的自查、token 的定位、视觉该放在哪一层——没有一个写在最初的需求里，但每一个都决定它能不能真的拿去用。
</script>

<script type="text/markdown" id="md-cpp-memory">
很多人学 C 的方式是抄代码，抄到指针就开始崩。问题不在语法，在于脑子里没有一张内存地图。先把地图画出来，剩下的都是自然推论。

## 四块内存区

程序跑起来，内存大致分成四块：

| 区域 | 放什么 | 生命周期 |
| --- | --- | --- |
| 代码区 | 编译后的机器指令 | 整个进程 |
| 静态区（.data / .bss） | 全局变量、`static` 变量 | 整个进程 |
| 栈（stack） | 局部变量、函数参数、返回地址 | 随函数进出，自动回收 |
| 堆（heap） | `malloc` / `new` 出来的内存 | 手动申请，手动释放 |

一个例子就能看出区别：

```c
#include <stdio.h>
#include <stdlib.h>

int g_count = 0;            /* 静态区，已初始化 -> .data */
int g_zero;                 /* 静态区，未初始化 -> .bss，自动清零 */

void demo(void) {
    int local = 42;                     /* 栈：函数返回即失效 */
    static int calls = 0;               /* 静态区：只初始化一次，跨调用保持 */
    int *heap = malloc(sizeof(int));    /* 堆：指针在栈，数据在堆 */
    if (!heap) return;

    *heap = 7;
    calls++;
    printf("%d %d %d\n", local, calls, *heap);

    free(heap);   /* 释放的是堆上那块，指针本身仍是野指针 */
}
```

## 三个必须记住的结论

**1. 栈上的东西不能往外传。** 最经典的错误：

```c
char *bad(void) {
    char buf[16] = "hello";
    return buf;          /* 返回栈地址，函数一结束内容就被覆盖 */
}
```

编译器一般会警告，但很多人忽略警告。正确做法有三条：调用方传缓冲区进来、用 `static`（不可重入，慎用）、或者 `malloc` 后由调用方 `free`。

**2. `free` 之后指针不会变空。** `free(p)` 只把这块内存还给分配器，`p` 的值还在，再读就是未定义行为。习惯是 `free(p); p = NULL;`。

**3. 堆和栈的容量不是一个量级。** 栈通常只有几 MB（Linux 默认 8MB），递归太深或 `int arr[1000000]` 会直接栈溢出；堆能用到物理内存上限。

## 手写一个动态数组

把上面几条用起来，写个能自动扩容的 `int` 数组，这是理解「指针 + 堆 + 容量」最省力的练习：

```c
typedef struct {
    int *data;
    size_t len;
    size_t cap;
} IntVec;

int vec_push(IntVec *v, int x) {
    if (v->len == v->cap) {
        size_t ncap = v->cap ? v->cap * 2 : 4;
        int *np = realloc(v->data, ncap * sizeof(int));
        if (!np) return -1;          /* 失败时原指针仍然有效，别直接覆盖 */
        v->data = np;
        v->cap = ncap;
    }
    v->data[v->len++] = x;
    return 0;
}

void vec_free(IntVec *v) {
    free(v->data);
    v->data = NULL;
    v->len = v->cap = 0;
}
```

注意 `realloc` 那段：**必须用临时指针接返回值**。写成 `v->data = realloc(v->data, ...)` 一旦失败，原指针就丢了，那块内存再也释放不掉（内存泄漏）。

## 排查内存问题的工具

- **Valgrind**：`valgrind --leak-check=full ./a.out`，泄漏、越界、未初始化读都能报出来
- **AddressSanitizer**：编译时加 `-fsanitize=address -g`，比 Valgrind 快很多，日常开发更实用
- **`-Wall -Wextra`**：把警告当错误看（`-Werror`），能挡掉一半的低级错误

## 练习

用 `IntVec` 实现：读入一行数字，去重后排序输出。要求全程只用堆内存、最后只 `free` 一次，再用 ASan 跑一遍确认没有泄漏。

## 一句话总结

C 没有垃圾回收，不是因为它落后，而是因为**它把内存的控制权完整交给了你**。掌握了这份控制权，你才知道上层语言替你做了什么。
</script>


<script type="text/markdown" id="md-cpp-pointers-arrays">
「数组名就是指针」——这句话只在**表达式求值**的时候近似成立。一旦遇到 `sizeof`、`&`、`decltype`，它立刻不成立。

## 实验一：sizeof 的差别

```cpp
#include <cstdio>

void f(int a[]) {              // 形参里的 [] 等价于 *
    printf("%zu\n", sizeof(a));   // 8（64 位下指针大小）
}

int main() {
    int a[10];
    printf("%zu\n", sizeof(a));   // 40
    f(a);
}
```

同一个 `a`，在 `main` 里是 40 字节的数组对象，传进函数就退化成了 8 字节的指针。**这就是「退化」（decay）**：数组在多数表达式中会退化为指向首元素的指针。

## 实验二：& 的差别

```cpp
int a[10];
int (*p1)[10] = &a;   // 指向「整个数组」的指针，类型 int(*)[10]
int *p2 = a;          // 指向首元素，类型 int*
p1 + 1;               // 跳过 40 字节
p2 + 1;               // 跳过 4 字节
```

`&a` 的类型是「数组指针」，加一跨整个数组。这个知识点在读复杂声明时很关键。

## 实验三：不能赋值

```cpp
int a[10], b[10];
// a = b;             // 错误：数组不是左值，不能被赋值
std::copy(b, b + 10, a);   // 正确做法
```

数组名在大多数语境下是右值，不能被赋值、不能自增。

## 实验四：越界不报错，才是真危险

```cpp
int a[3] = {1, 2, 3};
a[3] = 42;      // 未定义行为，可能踩坏别的变量，也可能什么都不发生
```

C++ 不做边界检查。三种防法：
1. 用 `std::array<int,3>`，`at()` 会抛 `std::out_of_range`
2. 用 `std::vector<int>`，同样有 `at()`
3. 开发期开 `-fsanitize=address`，越界立即崩在出错那行

## 现代 C++ 的写法

裸数组只剩两个合理场景：需要极致性能的固定尺寸缓冲区、以及和外设/C 接口打交道。其余时候：

```cpp
#include <array>
#include <vector>
#include <span>

std::array<int, 4> fixed{1, 2, 3, 4};   // 编译期定长，零开销，知道自己的大小
std::vector<int> dyn{1, 2, 3};          // 运行期变长，自动管理内存

void process(std::span<const int> view);  // C++20：既能接数组也能接 vector，不退化
```

`std::span` 是目前传递「一段连续数据」的最佳参数类型：它同时携带指针和长度，解决了退化导致丢长度的问题。

## 传参的三条经验

| 场景 | 参数类型 |
| --- | --- |
| 只读、不修改 | `std::span<const T>` 或 `const std::vector<T>&` |
| 需要修改 | `std::span<T>` 或 `std::vector<T>&` |
| 需要接管所有权 | `std::vector<T>`（按值传，配合 `std::move`） |

## 练习

写一个 `void scale(std::span<int> xs, int k)`，对任意容器（`std::array`、`std::vector`、C 数组）都能调用，并验证三种实参都编译通过、长度信息没有丢失。

## 一句话总结

数组是**对象**，指针是**地址**。C++ 的演进方向，就是把「指针 + 长度」这种容易出错的手工组合，收进 `span` / `vector` / `array` 这些有类型的容器里。
</script>


<script type="text/markdown" id="md-cpp-raii">
Java 有 `try-finally`，Go 有 `defer`，C++ 有**析构函数**。只要对象是在栈上创建的，函数以任何方式退出——正常返回、`return`、抛异常——析构函数都会被执行。这就是 RAII（Resource Acquisition Is Initialization）。

## RAII 的本质：把资源绑到对象生命周期上

```cpp
class FileHandle {
public:
    explicit FileHandle(const char *path) : fp_(std::fopen(path, "rb")) {
        if (!fp_) throw std::runtime_error("open failed");
    }
    ~FileHandle() { if (fp_) std::fclose(fp_); }

    FileHandle(const FileHandle &) = delete;             // 禁止拷贝
    FileHandle &operator=(const FileHandle &) = delete;

    std::FILE *get() const { return fp_; }

private:
    std::FILE *fp_;
};

void read_once() {
    FileHandle f("data.bin");     // 构造即获取
    parse(f.get());               // 中途抛异常也没关系
}                                 // 离开作用域，文件自动关闭
```

如果没有 RAII，`parse` 抛异常的那条路径就会漏掉 `fclose`。手写 `try/catch` 兜底，代码会变成一坨。

## unique_ptr：独占所有权

```cpp
#include <memory>

auto p = std::make_unique<Widget>(1, 2);   // 推荐：make_ 系列，异常安全
// std::unique_ptr<Widget> q = p;          // 错误：不能拷贝
std::unique_ptr<Widget> q = std::move(p);   // 正确：转移所有权，p 变成 nullptr

void take(std::unique_ptr<Widget> w);       // 明确表示「我要接管」
void look(const Widget &w);                 // 明确表示「我只是看看」
```

`unique_ptr` 和裸指针一样快（大小为 0 开销，释放无额外成本），**默认就该用它**。

自定义删除器处理特殊资源：

```cpp
auto deleter = [](std::FILE *f) { std::fclose(f); };
std::unique_ptr<std::FILE, decltype(deleter)> fp(std::fopen("a.txt", "r"), deleter);
```

## shared_ptr：共享所有权，慎用

```cpp
auto a = std::make_shared<Config>();
auto b = a;                  // 引用计数 +1
std::weak_ptr<Config> w = a; // 不增加计数，用来看对象是否还活着
```

三个必须知道的坑：

1. **循环引用会泄漏**。A 持有 B 的 `shared_ptr`，B 也持有 A 的，计数永远不归零。解法是把其中一条边改成 `weak_ptr`。
2. **`shared_ptr` 有额外开销**：一个控制块 + 原子计数操作，别在热路径上传来传去。
3. **不要用同一个裸指针构造两个 `shared_ptr`**：

```cpp
Widget *raw = new Widget();
std::shared_ptr<Widget> a(raw);
std::shared_ptr<Widget> b(raw);   // 两个独立控制块，会 double free
```

## 选型口诀

| 需求 | 选择 |
| --- | --- |
| 默认场景、独占资源 | `std::unique_ptr` |
| 确实需要多方共享生命周期 | `std::shared_ptr` |
| 观察但不持有 | `std::weak_ptr` |
| 传递引用、不涉及所有权 | `T&` / `const T&` / `std::span` |
| 绝不能用的 | 裸 `new` / 裸 `delete` |

## 三条落地规则

1. 构造函数里获取资源，析构函数里释放；中间不写 `try/catch`。
2. 一个类最多持有一个「拥有型」裸指针（内部实现细节），对外一律智能指针或引用。
3. 容器里存 `unique_ptr` 是合法的：`std::vector<std::unique_ptr<Base>>` 常用来做多态集合。

## 练习

把一段手写的 `new[] / delete[]` 数组代码改成 `std::vector`，再把其中「传给别的函数」的部分改成 `std::span`，用 ASan 验证没有泄漏。

## 一句话总结

C++ 的资源管理不靠自觉，靠**作用域**。把资源交给对象，剩下的交给编译器。
</script>


<script type="text/markdown" id="md-cpp-build">
写 C++ 的人迟早被两类报错拦住：`undefined reference to ...` 和 `multiple definition of ...`。它们都不是语法错误，而是**链接错误**——说明编译已经过了，是符号没对上。

## 四个阶段

```bash
g++ -E main.cpp -o main.i    # 预处理：展开 #include、宏、条件编译
g++ -S main.i   -o main.s    # 编译：生成汇编
g++ -c main.s   -o main.o    # 汇编：生成目标文件
g++ main.o -o main           # 链接：合并目标文件与库，解析符号
```

日常 `g++ main.cpp -o main` 是一条命令跑完四步，出问题时才需要手工拆开看。

**看预处理结果**是排查宏问题的利器：`g++ -E x.cpp | wc -l`，一个 `#include <iostream>` 就能展开出两万多行。

## 符号：链接器的语言

编译后每个函数、全局变量在目标文件里都有一个**符号**：

```bash
nm -C main.o        # 列出符号；-C 把修饰名还原成可读形式
# T main            T = 已定义的代码段符号
# U printf          U = 未定义，需要别人提供
```

- `U`（undefined）：我用到了，但不在这个文件里，链接时得找到
- `T`（text）：我定义了一个函数
- `B` / `D`（bss/data）：我定义了全局变量

`undefined reference` 的含义就是：**某个 `U` 符号，所有目标文件和库都翻遍了，没人定义它**。

## 六种常见原因

**1. 忘记把 .cpp 加进编译命令**

```bash
g++ main.cpp -o app                       # 漏了 util.cpp，报 undefined reference to add
g++ main.cpp util.cpp -o app              # 正确
```

**2. 只声明没定义**

```cpp
int add(int, int);        // 声明，编译通过
int main() { add(1, 2); } // 链接报错：没人定义 add
```

**3. 定义在头文件里，被多个 .cpp 包含**

```cpp
// util.h
int add(int a, int b) { return a + b; }   // 错：每个包含它的 .cpp 都定义一份
```

会得到 `multiple definition of add`。三种修法：加 `inline`、放进匿名命名空间、或者把定义挪到 .cpp。

**4. 忘了链接库，或库的顺序不对**

```bash
g++ main.cpp -o app -lm -lpthread        # 数学库、线程库要显式链接
g++ main.cpp -o app -lfoo                # 静态库顺序：被依赖的放后面
```

**5. C / C++ 混编没加 extern "C"**

```cpp
// C 头文件被 C++ 包含时
extern "C" {
    #include "c_lib.h"
}
```

否则 C++ 的名字修饰（name mangling）会让符号对不上。

**6. 模板定义写在 .cpp 里**

模板在实例化时需要看到完整定义，所以通常写在头文件。若一定要分离，需要用显式实例化 `template class Vec<int>;`。

## 一个可复现的最小案例

```bash
# a.cpp
int add(int a, int b) { return a + b; }

# main.cpp
int add(int, int);
int main() { return add(1, 2); }

g++ -c a.cpp          # 生成 a.o
g++ -c main.cpp       # 生成 main.o，此时 main.o 里 add 是 U
g++ main.o -o app     # 链接失败：undefined reference to add(int, int)
g++ main.o a.o -o app # 成功
```

亲手跑一遍，比看十篇文章都管用。

<script type="text/markdown" id="md-py-containers">
Python 的容器用起来太顺手，顺手到很多人不去想代价。可一旦数据量到十万级，选错容器就是几百倍的差距。

## list 是动态数组

```
内存布局： [ 元素0 | 元素1 | 元素2 | ... ][空闲容量]
```

- **按下标访问 `a[i]` 是 O(1)**：地址 = 起始地址 + i × 元素指针大小
- **尾部 append 平均 O(1)**：容量不够时按比例扩容（约 1.125 倍），摊销后仍算 O(1)
- **头部插入 `insert(0, x)` 是 O(n)**：后面所有元素都要往后挪
- **`in` 判断是 O(n)**：只能从头比到尾

```python
import timeit

a = list(range(100_000))
print(timeit.timeit(lambda: 99_999 in a, number=1000))   # 慢：每次都从头扫
```

需要频繁在两端进出，用 `collections.deque`（双向链表块），`appendleft` / `popleft` 都是 O(1)。

## dict / set 是哈希表

```
哈希表结构：
  index 0 → 空
  index 1 → (hash(a), key='name', value='kobe')
  ...
装载因子超过 2/3 时扩容并重新散列
```

- 查找/插入/删除**平均 O(1)**，最坏 O(n)（大量哈希冲突时）
- **key 必须可哈希**：不可变的 `int / str / tuple` 可以，`list / dict / set` 不行
- Python 3.7+ 的 dict **保证插入顺序**，所以它同时能干「有序映射」的活

```python
# 反例：把 list 当 key，直接 TypeError
# {[1, 2]: 'x'}   -> unhashable type: 'list'

# 正解：转成 tuple
{(1, 2): 'x'}
```

## 复杂度对照表（务必记住）

| 操作 | list | deque | set / dict |
| --- | --- | --- | --- |
| 按下标取 | O(1) | O(n) | — |
| 按值查找 `in` | O(n) | O(n) | **O(1)** |
| 头部插入 | O(n) | **O(1)** | — |
| 尾部追加 | O(1) 摊销 | **O(1)** | O(1) 摊销 |
| 有序遍历 | 按插入序 | 按插入序 | 3.7+ 按插入序 |
| 去重 | 需 `set()` 辅助 | — | 天然 |

## 五个立刻能用的重写

**1. 成员判断：list → set**

```python
# 慢：每次 O(n)
if user_id in [1, 2, 3, ..., 10000]:

# 快：O(1)
VALID_IDS = {1, 2, 3, ...}
if user_id in VALID_IDS:
```

**2. 计数：手写循环 → Counter**

```python
from collections import Counter
c = Counter(words)            # 一行完成，C 层加速
c.most_common(10)             # Top N
```

**3. 分组：循环 + setdefault → defaultdict**

```python
from collections import defaultdict

groups = defaultdict(list)
for item in rows:
    groups[item["type"]].append(item)   # 不用先判断 key 是否存在
```

**4. 双端队列：list 做队列 → deque**

```python
from collections import deque
q = deque()
q.append(x)       # 入队
q.popleft()       # 出队 O(1)；list.pop(0) 是 O(n)
```

**5. 拼接字符串：`+=` → `"".join()`**

```python
# 慢：每次 += 都可能新建字符串
s = ""
for w in words:
    s += w

# 快：一次分配
s = "".join(words)
```

## 一个真实的数量级差异

对 10 万条数据做「是否在集合中」的批量判断：

```python
import random, timeit

data = list(range(100_000))
queries = [random.randrange(100_000) for _ in range(1000)]

as_list = timeit.timeit(lambda: [q in data for q in queries], number=1)
as_set  = timeit.timeit(lambda: [q in set(data) for q in queries], number=1)
```

`as_list` 通常在 1 秒级，`as_set` 在毫秒级——**差三个数量级**。这不是魔法，是 O(n) 与 O(1) 的区别。

## 练习

拿一段你项目里的代码，找出所有 `x in [...]`、`list.pop(0)`、字符串 `+=` 的地方，逐个替换成上面对应写法，用 `timeit` 量一下前后差异。

## 一句话总结

选容器看三件事：**要不要按下标、要不要判成员、在哪一端进出**。想清楚这三点，性能问题基本不会出在选择上。
</script>


<script type="text/markdown" id="md-py-generators">
`for x in something` 这句话背后有一个固定协议，叫**可迭代协议**。理解了它，生成器就不再神秘。

## for 循环做了什么

```python
for x in obj:
    ...
```

等价于：

```python
it = iter(obj)          # 1. 取迭代器：调用 obj.__iter__()
while True:
    try:
        x = next(it)    # 2. 取下一个：调用 it.__next__()
    except StopIteration:
        break           # 3. 取完了
    ...
```

所以只要一个对象实现了 `__iter__` 并返回带 `__next__` 的对象，它就能被 for 遍历。

## 手写一个迭代器（看清协议）

```python
class Countdown:
    def __init__(self, start):
        self.n = start

    def __iter__(self):
        return self          # 自己就是迭代器

    def __next__(self):
        if self.n <= 0:
            raise StopIteration
        self.n -= 1
        return self.n + 1
```

`iter()` 与 `next()` 各司其职：前者返回迭代器，后者产出值并在结束时抛 `StopIteration`。

## 生成器：用 yield 自动实现协议

同一个倒计时，用生成器写：

```python
def countdown(n):
    while n > 0:
        yield n
        n -= 1
```

调用时**函数体一行都不执行**，只返回一个生成器对象。每次 `next()` 才跑到下一个 `yield`，然后**冻结现场**——局部变量、执行位置全部保留，下次从这里继续。

这就是「暂停」的真正含义：**栈帧被挂起，不是销毁**。

```python
g = countdown(3)
next(g)   # 3，函数停在 yield 那一行
next(g)   # 2，从上次的位置继续
```

## 为什么省内存

```python
def read_lines(path):
    with open(path, encoding="utf-8") as f:
        for line in f:          # 文件对象本身就是迭代器
            yield line.strip()

total = sum(len(l) for l in read_lines("big.txt"))
```

`read_lines` 全程只持有一行；如果用 `f.readlines()`，1GB 的文件会先变成 1GB 的列表。**惰性求值 = 用时间换空间**，处理大文件、日志、流式 API 时是标配。

## 生成器表达式与管道

```python
lines = read_lines("access.log")

ips = (l.split()[0] for l in lines)                 # 取第一列
internal = (ip for ip in ips if ip.startswith("10."))  # 过滤
count = sum(1 for _ in internal)                     # 消费
```

三个生成器串起来，内存里始终只流动一条记录。这就是「管道式处理」，和数据流的思路一致。

## 五个必须知道的细节

**1. 生成器只能遍历一次**

```python
g = (x for x in range(3))
list(g)   # [0, 1, 2]
list(g)   # []   —— 已经耗尽
```

需要重复遍历就重新创建，或者落成 list。

**2. `yield from` 委托子生成器**

```python
def chain(*its):
    for it in its:
        yield from it     # 比手写 for + yield 更快、更短
```

**3. 生成器里的 `return` 会结束迭代**，值挂在 `StopIteration.value` 上（`yield from` 能拿到）。

**4. 异常会从调用处注入**：`g.throw(ValueError)` 把异常抛进生成器内部的 `yield` 位置，用来做清理。

**5. 别在生成器里改外部可变状态**，调试时会很痛苦。

## 什么时候不该用生成器

- 需要多次遍历、随机访问、`len()`
- 需要排序（排序必须先全部读出来）
- 数据量小而逻辑简单——普通 list 更易读

## 练习

写一个 `tail(path, n)` 生成器，只保留最后 n 行（用 `deque(maxlen=n)`），再用它统计一个大日志里出现最多的 10 个 URL。

## 一句话总结

生成器不是「更省事的列表」，它是**可暂停的计算**。把「取数据」和「处理数据」拆成两个惰性阶段，内存和可读性会同时变好。
</script>


<script type="text/markdown" id="md-py-decorators">
装饰器的语法只有一行 `@something`，但它背后是「函数是一等对象 + 闭包」两个概念。把这两件事说清，装饰器就没难度了。

## 第一步：函数能当参数

```python
def call_twice(fn, x):
    return fn(fn(x))

call_twice(lambda v: v + 1, 1)   # 3
```

函数可以作为参数传入、作为返回值传出——这是装饰器成立的前提。

## 第二步：闭包

```python
def make_adder(n):
    def add(x):
        return x + n      # n 来自外层作用域，被「记住」了
    return add

add5 = make_adder(5)
add5(1)      # 6
```

`add` 返回后，`make_adder` 的栈帧本该消失，但 `n` 被闭包捕获保留了下来。装饰器就是「接收一个函数，返回一个新函数」的闭包。

## 第三步：最简装饰器

```python
import functools, time

def timing(fn):
    @functools.wraps(fn)              # 保留原函数的 __name__ / __doc__
    def wrapper(*args, **kwargs):
        t0 = time.perf_counter()
        try:
            return fn(*args, **kwargs)
        finally:
            dt = time.perf_counter() - t0
            print(f"{fn.__name__} 用时 {dt*1000:.1f} ms")
    return wrapper

@timing
def slow():
    time.sleep(0.1)

slow()   # 用时 100.3 ms
```

`@timing` 完全等价于 `slow = timing(slow)`。

**`functools.wraps` 不能省**：不加的话 `slow.__name__` 会变成 `wrapper`，日志、调试、序列化都会出问题。

## 第四步：带参数的装饰器

```python
def retry(times=3, delay=0.5):
    def decorator(fn):
        @functools.wraps(fn)
        def wrapper(*args, **kwargs):
            last = None
            for i in range(times):
                try:
                    return fn(*args, **kwargs)
                except Exception as e:
                    last = e
                    time.sleep(delay)
            raise last
        return wrapper
    return decorator

@retry(times=5, delay=0.2)
def fetch(url): ...
```

看懂三层的方法：**最外层收参数，中间层收函数，最内层收调用参数**。`@retry(times=5)` 先执行 `retry(times=5)` 拿到 `decorator`，再用它去装饰 `fetch`。

## 第五步：类装饰器与方法装饰

装饰器也能是类（用 `__call__`），适合需要保存状态的场景：

```python
class CountCalls:
    def __init__(self, fn):
        functools.update_wrapper(self, fn)
        self.fn = fn
        self.count = 0

    def __call__(self, *args, **kwargs):
        self.count += 1
        return self.fn(*args, **kwargs)
```

装饰方法时注意 `self`：`*args` 会把实例作为第一个参数传进来，一般不用特殊处理，但写死签名的装饰器会出问题。

## 四个生产环境常用例子

**1. 缓存**

```python
from functools import lru_cache

@lru_cache(maxsize=1024)
def fib(n):
    return n if n < 2 else fib(n - 1) + fib(n - 2)
```

**2. 权限校验**

```python
def require(role):
    def deco(fn):
        @functools.wraps(fn)
        def wrapper(user, *a, **kw):
            if role not in user.roles:
                raise PermissionError(f"需要 {role}")
            return fn(user, *a, **kw)
        return wrapper
    return deco
```

**3. 注册表（插件系统常用）**

```python
HANDLERS = {}

def handler(name):
    def deco(fn):
        HANDLERS[name] = fn       # 导入即注册，靠装饰器的副作用
        return fn
    return deco
```

**4. 事务 / 连接管理**

```python
def with_tx(fn):
    @functools.wraps(fn)
    def wrapper(*a, **kw):
        conn = get_conn()
        try:
            result = fn(conn, *a, **kw)
            conn.commit()
            return result
        except Exception:
            conn.rollback()
            raise
    return wrapper
```

## 三个坑

1. **忘了 `functools.wraps`**：签名、文档全丢，`inspect.signature` 也读不到参数。
2. **装饰顺序有讲究**：`@a @b def f` 等价于 `f = a(b(f))`，离函数近的先执行。
3. **异步函数要用异步装饰器**：装饰 `async def` 时必须返回 `async def`，否则 `await` 会失效。

```python
def async_timing(fn):
    @functools.wraps(fn)
    async def wrapper(*a, **kw):
        t0 = time.perf_counter()
        try:
            return await fn(*a, **kw)
        finally:
            print(time.perf_counter() - t0)
    return wrapper
```

## 练习

写一个 `@memoize` 装饰器，用一个 dict 做缓存，支持自定义 key 函数（默认用 `args`），并处理不可哈希参数（转成 `repr`）。

## 一句话总结

装饰器 = **闭包 + 函数替换**。三层嵌套不是语法要求，是「先收配置、再收函数」的自然结果。想清楚每一层在等什么，就不会写错。
</script>


<script type="text/markdown" id="md-py-gil">
GIL（全局解释器锁）让 CPython 同一时刻只有一个线程执行字节码。于是「多线程没用」成了流传最广的半句话——**它只对 CPU 密集型任务成立**。

## 先分清两类任务

| 类型 | 特征 | 例子 |
| --- | --- | --- |
| CPU 密集 | 一直在算，不让出 CPU | 图像处理、加密、大量循环 |
| I/O 密集 | 大部分时间在等 | 网络请求、读写磁盘、查数据库 |

GIL 只在**执行字节码**时持有。一旦线程发起 I/O，会主动释放 GIL，别的线程就能跑。所以 I/O 密集任务用线程是**真并行**。

## 实测一：CPU 密集，线程反而更慢

```python
import threading, time

def burn(n):
    while n > 0:
        n -= 1

def run(fn, workers):
    ts = [threading.Thread(target=fn, args=(10_000_000,)) for _ in range(workers)]
    t0 = time.perf_counter()
    [t.start() for t in ts]
    [t.join() for t in ts]
    return time.perf_counter() - t0

print("1 线程", run(burn, 1))
print("4 线程", run(burn, 4))   # 通常 >= 1 线程，因为要抢 GIL，有切换开销
```

结论：**CPU 密集任务加线程，不会变快，通常还更慢**（切换开销）。

## 实测二：I/O 密集，线程有效

```python
import time, threading, urllib.request

URLS = ["https://example.com"] * 8

def fetch(u):
    with urllib.request.urlopen(u, timeout=5) as r:
        r.read()

# 串行
t0 = time.perf_counter()
for u in URLS: fetch(u)
print("串行", time.perf_counter() - t0)

# 8 线程
t0 = time.perf_counter()
ts = [threading.Thread(target=fetch, args=(u,)) for u in URLS]
[t.start() for t in ts]; [t.join() for t in ts]
print("线程", time.perf_counter() - t0)
```

8 个请求大致能压到「一次请求」的量级——因为等待期间 GIL 是放开的。

## 实测三：多进程绕过 GIL

```python
from concurrent.futures import ProcessPoolExecutor
import time

def burn(n):
    while n > 0: n -= 1

if __name__ == "__main__":
    t0 = time.perf_counter()
    with ProcessPoolExecutor(max_workers=4) as ex:
        list(ex.map(burn, [10_000_000] * 4))
    print("4 进程", time.perf_counter() - t0)
```

每个进程有独立解释器和独立 GIL，**真正并行**。代价是：进程启动慢、内存翻倍、跨进程传数据要序列化（pickle）。

## 决策表

| 场景 | 首选 | 理由 |
| --- | --- | --- |
| 网络请求、爬虫、调 API | `asyncio` 或 线程池 | 等待多，单线程事件循环开销最小 |
| 磁盘 IO、数据库 | 线程池 | 阻塞式库也能直接跑 |
| 纯计算（图像、数值） | `ProcessPoolExecutor`，或换 NumPy | 绕过 GIL |
| 混合型 | 异步做编排 + 进程池跑重计算 | 各用所长 |
| 需要极低延迟的并发连接 | `asyncio` | 上万连接不必上万线程 |

## asyncio 最小可用模板

```python
import asyncio, aiohttp

async def fetch(session, url):
    async with session.get(url, timeout=5) as r:
        return await r.text()

async def main(urls):
    async with aiohttp.ClientSession() as s:
        return await asyncio.gather(*(fetch(s, u) for u in urls))

# asyncio.run(main(["https://example.com"] * 20))
```

要点：`async def` 里每个等待点都必须 `await`，一旦有同步阻塞调用（比如 `time.sleep`、`requests.get`），整个事件循环会被卡住——这是新手最常犯的错。

## 线程池的正确用法

```python
from concurrent.futures import ThreadPoolExecutor, as_completed

with ThreadPoolExecutor(max_workers=8) as ex:
    futs = {ex.submit(fetch, u): u for u in urls}
    for f in as_completed(futs):
        url = futs[f]
        try:
            print(url, len(f.result()))
        except Exception as e:
            print(url, "失败", e)
```

比手写 `Thread` + `join` 好在：异常能回传、有超时、能拿完成顺序。

## 三个容易踩的坑

1. **共享可变状态要加锁**：即使有 GIL，`x += 1` 也不是原子的（读-改-写三步），多个线程会丢更新。用 `threading.Lock`。
2. **进程池里不能传不可序列化对象**：lambda、打开的文件、数据库连接都不行。
3. **asyncio 里别用阻塞库**：`requests` 要换成 `aiohttp` / `httpx`，`time.sleep` 要换成 `asyncio.sleep`。

## 练习

拿一个「下载 20 个页面并统计词频」的任务，分别用串行、线程池、`asyncio` 实现，记录耗时；再把词频统计换成 CPU 密集版本，观察线程方案是否变慢。

## 一句话总结

GIL 不是「Python 不能并发」，而是**「CPython 的字节码只能一个一个跑」**。I/O 等的不是 CPU，所以线程和异步照样有效；真要并行算，就开进程。
</script>


<script type="text/markdown" id="md-ai-prompt">
大多数人写提示词的方式是「想到什么问什么」，然后抱怨模型不稳定。不稳定的根源往往不是模型，而是**输入本身有多种合理解释**。

## 一个五段式结构

任何稍复杂的任务，都按这五段写：

```
1. 角色与目标   你是谁，要完成什么
2. 输入         数据从哪来，格式是什么
3. 约束         必须遵守什么，禁止什么
4. 输出格式     要什么结构，给一个示例
5. 边界情况     信息不足时怎么办
```

例子（把会议记录整理成待办）：

```
你是会议纪要助理。目标：把下面的原始记录整理成可执行的待办清单。

输入：一段中文会议速记，可能有口语、重复、错别字。

约束：
- 只提取明确指派了「人 + 事」的条目
- 没有责任人的，归到「待认领」
- 不要脑补记录里没提到的截止日期

输出格式（JSON，不要多余文字）：
{"owner": "张伟", "task": "…", "due": "2026-12-01 或 null", "source": "原句摘录"}

边界：若整段没有可执行项，返回 {"items": []} 并在末尾用一句中文说明原因。
```

对比一句「帮我整理下会议纪要」，差别不在礼貌用语，而在**输出可被程序消费**。

## 三个真正有效的技巧

**1. Few-shot：给例子比给形容词有用**

「写得专业一点」是模糊指令；给两个「好 / 不好」的对照例子，模型立刻对齐。

```
示例 1（不合格）：这个功能已经做完了，没什么问题。
示例 2（合格）：该功能已完成开发并通过 12 条单测，剩余风险是并发写入未压测。
请按示例 2 的粒度重写下面这段：
```

**2. 拆步骤：把一次大判断拆成多次小判断**

一次性让模型「读懂合同并判断风险」准确率低；改成先抽取条款、再逐条判风险、最后汇总，准确率明显上升。原因很朴素：**每一步的上下文都更短、更聚焦**。

**3. 给格式：能约束就约束**

要求 JSON 就给 schema，要求列表就说「每行一条，不加序号」。结构化输出能省掉后面大量解析代码。

## 让模型「先想再答」

对推理类任务，加一句：

```
先列出你的判断依据（不超过 5 条），再给结论。
```

显式要求中间步骤，能减少跳跃式错误。注意：这只是提示技巧，不是保证——**结论仍然要抽查**。

## 怎么判断改动有效：建个小测试集

改提示词最大的坑是「感觉变好了」。做法很简单：

1. 收集 20–50 条真实输入，覆盖典型场景 + 边界（空输入、超长、含歧义）
2. 为每条写期望结果（关键字段值，不必逐字）
3. 每次改提示词，跑一遍，统计通过率
4. 只接受「通过率上升且没引入新失败」的改动

```python
cases = [
    {"input": "...", "expect_owner": "张伟"},
    {"input": "", "expect_items": []},
]

def score(prompt, cases):
    ok = 0
    for c in cases:
        out = call_llm(prompt, c["input"])
        ok += check(out, c)
    return ok / len(cases)
```

这段代码不到 20 行，却能把「调提示词」从玄学变成工程。

## 五个高频错误

| 错误 | 后果 | 改法 |
| --- | --- | --- |
| 一次塞太多任务 | 每个都做一半 | 拆成多轮或多次调用 |
| 只说「要准确」 | 模型无从对齐 | 给正反例 |
| 不给输出格式 | 每次结构都不一样 | 给 JSON schema 或示例 |
| 长文档不分段 | 中段信息被忽略 | 分块处理再汇总 |
| 把模型当数据库 | 编造事实 | 提供原文，要求「只依据给定材料」 |

## 一句关键的护栏

凡是要事实的场合，都加上：

```
只依据我提供的材料回答；材料里没有的，直接说「材料中未提及」，不要补充常识。
```

这句能挡掉相当一部分幻觉，代价是有时过于保守——但**宁可说不知道，也不要编**。

## 练习

把「总结这篇文章」改写成五段式提示，要求输出 `{summary, key_points[], open_questions[]}`，然后在 10 篇真实文章上跑，记录结构合规率。

## 一句话总结

提示词工程的本质是**接口设计**：输入有界、输出有型、失败有兜底。做到这三点，效果稳定一大半。
</script>


<script type="text/markdown" id="md-ai-rag">
RAG（检索增强生成）的目标很明确：**让模型的回答有出处，而不是靠记忆**。但实际效果差别巨大，差别几乎全在检索这一侧。

## 完整数据流

```
离线：文档 → 解析 → 切块 → 加语境 → 向量化 → 入库
在线：问题 → 改写 → 检索（向量 + 关键词） → 重排 → 拼上下文 → 生成 → 引用
```

每一步都能毁掉最终效果，下面按重要性排。

## 一、切块：最容易被低估的一步

固定按 500 字切，会把一个句子的主语和谓语切开，语义碎片化。

四条实践：

1. **按结构切**：Markdown 按标题、代码按函数、合同按条款、网页按段落
2. **块要有重叠**：前后各留 10–15% 重叠，避免边界信息丢失
3. **块要带语境**：每个块前面补一句「这是《XX 文档》第 3 章关于退款时效的部分」，再向量化
4. **块别太大**：300–800 字较常见；太大稀释语义，太小丢上下文

第 3 条是收益最高的一条。同一段「申请后 7 天内可退」，加上「退款政策」的语境后，被检索到的概率显著提升。

```python
def make_chunk(doc_title, section, text):
    header = f"《{doc_title}》{section}："
    return {
        "text": header + text,
        "meta": {"doc": doc_title, "section": section},
    }
```

## 二、混合检索：向量 + 关键词

纯向量检索的弱点很具体：**专有名词、型号、错误码、人名**。用户搜「ERR_5021」，向量模型未必认为它和文档里的那句相近，但 BM25 一搜就中。

所以生产环境基本都用两路召回再融合：

```python
def hybrid_search(q, k=20):
    vec_hits = vector_store.search(embed(q), k=k)
    kw_hits  = bm25.search(q, k=k)
    # RRF（倒数排名融合）：不比较分数，只比较名次
    scores = {}
    for rank, h in enumerate(vec_hits):
        scores[h.id] = scores.get(h.id, 0) + 1 / (60 + rank)
    for rank, h in enumerate(kw_hits):
        scores[h.id] = scores.get(h.id, 0) + 1 / (60 + rank)
    return sorted(scores.items(), key=lambda x: -x[1])[:k]
```

RRF 的好处是不用调权重，两路的分数尺度不同也能融合。

## 三、重排：把「相关」变成「最相关」

初检 20 条里往往有正确答案，但排在第 9 位，模型只读前 3 条就漏了。交叉编码器重排（cross-encoder）把「问题 + 候选块」一起送进模型打分，精度明显高于向量相似度。

```python
top = rerank(question, candidates, top_n=5)   # 常见做法：20 进 5 出
```

成本是多一次模型推理，收益是**上下文更短、答案更准**，通常划算。

## 四、问题改写

用户的问题是口语的、含指代的（「那它多久到账？」）。直接检索效果差。两步改写：

- **指代消解**：用对话历史把「它」替换成实体
- **多查询扩展**：生成 2–3 个同义问法，分别检索再合并

```python
def rewrite(q, history):
    prompt = (
        "把用户问题改写成独立的检索语句，补全指代，不要回答。
"
        f"历史：{history}
"
        f"问题：{q}
"
        "只输出改写后的句子。"
    )
    return llm(prompt)
```

## 五、生成：必须带引用

拼上下文时给每块编号，要求模型在句末标注来源：

```
材料：
[1] 《退款政策》第 3 条：签收后 7 天内可申请退款。
[2] 《物流说明》：偏远地区延迟 1-2 天。

要求：只依据材料回答，每个结论后标注 [编号]；材料不足则回答「资料中未提及」。
```

拿到 `[1]` 这样的标记后，前端就能做「点击跳原文」，用户可自行核验——这是 RAG 相对纯生成最大的价值。

## 六、评估：别只看「感觉答得好」

至少四个指标：

| 指标 | 含义 | 怎么测 |
| --- | --- | --- |
| 召回率 | 正确块有没有被检索到 | 人工标注 50 个问题的最佳块 |
| 命中排位 | 正确块排在第几 | 看前 5 的命中率 |
| 忠实度 | 答案是否只用了材料 | 人工抽查 + 断言检查 |
| 引用准确 | 标注的编号对不对 | 抽样比对 |

其中**先修召回**：召回不到，后面全白搭。

## 常见失败与对应修法

| 现象 | 多半是 | 修法 |
| --- | --- | --- |
| 答非所问 | 块太大/无语境 | 按结构切块 + 加语境头 |
| 型号搜不到 | 只有向量检索 | 加 BM25 混合 |
| 答案泛泛 | 上下文太长稀释 | 重排后只留 3–5 块 |
| 编造条款 | 没约束「只依据材料」 | 加护栏 + 强制引用 |
| 多轮跑偏 | 没做指代消解 | 先改写再检索 |

## 练习

拿一份 50 页的 PDF 手册，实现「结构切块 + 语境头 + 混合检索 + 重排」，用 20 个真实问题对照纯向量方案，记录前 5 命中率的变化。

## 一句话总结

RAG 的质量上限由**检索**决定，不是由模型决定。切块带语境、混合召回、重排收敛、强制引用——这四件事做完，才算「能用」。
</script>


<script type="text/markdown" id="md-ai-agent">
Agent 没有那么神秘。剥掉所有框架，它就是这段伪代码：

```
while 未达成目标 and 步数 < 上限:
    输出 = 模型(历史对话)
    if 输出是最终答案: break
    动作 = 解析(输出)
    结果 = 执行(动作)
    历史 += (动作, 结果)
```

所有复杂度都在**怎么让这个循环不出岔子**。

## 最小实现（不依赖任何框架）

```python
import json

TOOLS = {
    "read_file": lambda path: open(path, encoding="utf-8").read()[:4000],
    "list_dir":  lambda path: "
".join(os.listdir(path)),
}

def run(goal, max_steps=8):
    history = [{"role": "user", "content": goal}]
    for step in range(max_steps):
        msg = llm(history, tools=list(TOOLS))     # 要求模型输出 JSON 动作
        history.append(msg)

        if msg.get("final"):
            return msg["final"]

        name = msg.get("tool")
        if name not in TOOLS:                      # 幻觉工具名
            history.append({"role": "tool", "content": f"没有工具 {name}，可用：{list(TOOLS)}"})
            continue

        try:
            result = TOOLS[name](**msg.get("args", {}))
        except Exception as e:
            result = f"工具执行失败：{e}"           # 错误也要回灌，让模型自己纠
        history.append({"role": "tool", "content": str(result)[:4000]})

    return "达到最大步数仍未完成"
```

八十行以内能跑起来的 Agent，比任何框架都更容易调。

## 为什么工具设计比提示词重要

模型只会挑工具、填参数。工具定义模糊，它必然乱填。

```python
# 差：参数含义不清
{"name": "search", "params": {"q": "string"}}

# 好：名字自解释、参数有类型与示例、说明边界
{
  "name": "search_orders",
  "description": "按用户 ID 查订单，只能查最近 90 天；超过 90 天请改用 export_orders",
  "params": {
    "user_id": {"type": "string", "example": "u_10293"},
    "limit":   {"type": "integer", "default": 10, "max": 50}
  }
}
```

三条经验：
1. **一个工具只做一件事**，宁可多几个工具，也不要一个「万能工具」
2. **说明写清边界**（能做什么、不能做什么、失败时怎么办）
3. **参数尽量用枚举或 ID**，别让模型自由发挥字符串

## 五条防跑飞规则

**1. 步数上限**。没有上限的循环迟早烧钱。8–15 步对多数任务是合理区间。

**2. 幂等与授权**。写操作（发邮件、下单、删文件）必须显式确认，或至少记日志可回溯。

**3. 观察要截断**。工具返回 5 万字会挤爆上下文，取前 N 字 + 提示「已截断」。

**4. 允许失败重试，但要计数**。同一个工具连续失败 3 次，就该跳出循环并汇报，而不是无限重试。

**5. 全程留痕**。每一步的思考、动作、结果都落盘，出问题能复盘——这也是调试 Agent 唯一的办法。

## 让它「想清楚再动手」

在系统提示里固定三段式：

```
每轮先输出：
1) 我现在知道什么（事实）
2) 我还缺什么（缺口）
3) 下一步做什么（动作 + 参数）

再输出 JSON 动作。
```

这个结构能显著减少「跳步乱调工具」。

## 什么时候不该用 Agent

- 流程固定、步骤可枚举 → 直接写代码/工作流，更稳更便宜
- 一次问答能解决 → 普通 RAG 就够
- 对确定性要求极高（财务计算、合规判断）→ 用规则 + 模型只做解释

**Agent 的成本是不确定性**。只有当「路径无法预先枚举」时，它才划算。

## 一个真实的任务拆解示例

目标：「找出本周新增的 500 错误并定位到代码行」。

```
Step 1  query_logs(level="ERROR", code=500, since="7d")   → 得到 12 条
Step 2  group_by_stack(trace_ids)                          → 3 个堆栈
Step 3  search_code(symbol="OrderService::submit")         → 命中 2 个文件
Step 4  read_file(OrderService.cpp, 120-180)               → 定位到空指针
Step 5  final: 汇总原因 + 文件行号 + 建议
```

每一步的输出都是下一步的输入，中间任何一步失败都能停下来汇报——这才是「可控」。

## 练习

用上面的最小实现，做一个「查日志 → 定位代码 → 输出结论」的 Agent，要求：工具不超过 4 个、步数上限 8、每步落盘 JSONL，跑 3 个真实问题看它会在哪一步卡住。

## 一句话总结

Agent = **循环 + 工具 + 终止条件**。把它当工程问题而不是魔法：限制步数、约束工具、留下痕迹，它就能干活；否则它只是在替你烧 token。

<script type="text/markdown" id="md-ai-workflow">
同一个模型，有人用它省下每天两小时，有人用了一周就放弃。差别不在提示词技巧，而在**有没有把它嵌进流程**。

一条铁律先放这里：

> **AI 产出的一切，都必须经过一个你能执行的验收动作；没有验收动作的场景，不要交给 AI。**

## 场景一：读一个陌生代码库

低效做法：「这个项目是干什么的？」——得到一段泛泛而谈。

有效流程：

```
第 1 步  我先读：README、目录树、入口文件（10 分钟，自己读）
第 2 步  让 AI 只回答我能验证的问题：
        - 列出所有对外 HTTP 路由，标注文件:行号
        - 数据从哪个函数写入数据库
第 3 步  我抽查 3 条，验证行号对不对
第 4 步  让 AI 画调用链，我再对照代码补全
```

关键在**第 2 步的问题形态**：要的是「可核对的事实」，不是「理解与评价」。行号、函数名、调用关系都能验证；「设计得好不好」不能。

```text
请只根据我给你的文件，列出所有注册路由的位置。
输出格式：METHOD PATH 文件:行号 处理函数名
不要推测，找不到就写「未找到」。
```

## 场景二：写文档 / 写周报

低效做法：「帮我写个周报」——得到的是一堆漂亮但空洞的句子。

有效流程是**先给素材，再收紧格式**：

```
素材（我这周的真实动作）：
- 修了 3 个线上 bug：登录超时、导出乱码、分页越界
- 上线缓存层，P95 从 820ms 降到 210ms
- 和产品对齐了下季度需求边界

要求：
1. 按「做了什么 / 影响 / 风险 / 下周」四段写
2. 每条不超过两行，不写「赋能」「闭环」这类词
3. 数字必须来自素材，不要新增
```

验收动作很明确：**逐个数字回查素材**，凡素材里没有的数字一律删掉。这一步能挡掉大部分幻觉。

## 场景三：复盘一个故障

这是 AI 最能帮上忙的场景，因为复盘需要「从时间线里找因果」，而人容易陷进细节。

```
输入：告警时间线（原始日志时间戳）+ 变更记录 + 监控截图描述
任务：
1. 按时间排出一张表：时刻 / 事件 / 来源
2. 标出「变更」与「指标异常」的先后关系
3. 给出两个最可能的因果假设，各自需要什么证据才能证实
4. 列出当前缺失的信息（不要猜）
```

注意第 3 步要的是**假设 + 验证路径**，不是结论。人负责验证假设，AI 负责把线梳理清楚。

## 一条流程模板（任意场景通用）

```
① 输入：把原始材料贴进来（不要口述要点，会丢信息）
② 任务：一句话说明要产出什么
③ 约束：格式、长度、禁止事项（不要编造数字/引用）
④ 验收：我自己会怎么检查这份产出
```

第 ④ 条是分水岭。写不出验收方式，说明这个任务还不该交给 AI。

## 三件不要交给 AI 的事

1. **需要承担责任的判断**（合规、财务、人事结论）——它可以给材料和建议，签字的是你
2. **你自己没读懂的东西**——你无法验收，就会照单全收
3. **涉密与个人隐私数据**——上传前先确认数据边界，脱敏优先

## 日常怎么用才不累

- **固定三个高频提示词**，存成片段：读代码、改文案、写复盘。不要每次重新想
- **一次只让它做一件事**，串联比一次性下达五个任务可靠
- **保留聊天记录的分类**：一个项目一个会话，避免上下文互相污染
- **每周花十分钟整理**：哪些产出真用上了，哪些纯属浪费时间——这比学新技巧有用

## 练习

挑一件你这周做过三次的重复劳动（写提交信息、整理会议待办、核对数据），给它写出「输入—任务—约束—验收」四段，跑一周，记录节省的时间和出错次数。

## 一句话总结

AI 不会替你负责，它只是**把你的判断放大**。流程清晰、验收明确，它放大的是效率；流程混乱，它放大的是混乱。
</script>


<script type="text/markdown" id="md-cpp-start">
很多人卡在第一步：装完编译器，不知道下一步该做什么。先把「一条链路」跑通，后面才有意义。

## 一、装什么

| 系统 | 装什么 | 验证命令 |
| --- | --- | --- |
| Windows | MinGW-w64（推荐 MSYS2）或 Visual Studio 的 C++ 工作负载 | `gcc --version` |
| macOS | `xcode-select --install` | `clang --version` |
| Linux | `sudo apt install build-essential` | `gcc --version` |

看到版本号就算成功。**编译器不是编辑器**：写代码用 VS Code / CLion / 记事本都行，编译靠 `gcc`。

## 二、第一个程序

新建 `hello.c`：

```c
#include <stdio.h>   /* 引入标准输入输出库的声明 */

int main(void) {     /* 程序入口，返回一个整数给操作系统 */
    printf("Hello, 阿飞\n");
    return 0;        /* 0 表示正常结束 */
}
```

编译并运行：

```bash
gcc hello.c -o hello     # 编译：源文件 -> 可执行文件 hello
./hello                  # 运行（Windows 下是 hello.exe，直接敲 hello）
```

输出：

```
Hello, 阿飞
```

## 三、这条命令拆开看

```
gcc    hello.c   -o hello
 ↑        ↑        ↑
编译器   源文件    输出文件名
```

一次 `gcc` 其实做了四件事：预处理 → 编译 → 汇编 → 链接。想看每一步：

```bash
gcc -E hello.c -o hello.i    # 只做预处理（展开 #include）
gcc -S hello.i -o hello.s    # 生成汇编
gcc -c hello.s -o hello.o    # 生成目标文件
gcc hello.o   -o hello       # 链接成可执行文件
```

初学阶段不必背，但知道它分四步，后面理解“编译错误”和“链接错误”的区别会轻松很多。

## 四、怎么读报错

编译器报错是有格式的，读三段就够：

```
hello.c:3:5: error: expected ';' before 'return'
   ↑      ↑ ↑    ↑                          ↑
 文件名  行 列  严重级别                    具体原因
```

- `error`：必须改，改完才能生成程序
- `warning`：能编过，但很可能是 bug（**建议加 `-Wall` 把所有警告打开**）
- 报错行号常常指向“发现问题的地方”，而不是“出错的地方”——少写一个分号，往往在下一行才报

## 五、一个能交互的小程序

```c
#include <stdio.h>

int main(void) {
    char name[32];
    int age;

    printf("你叫什么名字？");
    if (scanf("%31s", name) != 1) return 1;   /* 限制宽度，防止越界 */

    printf("你好，%s。你今年多大了？", name);
    if (scanf("%d", &age) != 1) return 1;     /* 注意：整数要取地址 */

    printf("%s，%d 岁，明年你就 %d 岁了。\n", name, age, age + 1);
    return 0;
}
```

两个关键点：
1. `scanf` 读整数、浮点数必须传**地址**（`&age`）；读字符串数组名本身就是地址，不用 `&`
2. `%31s` 里的 31 是“最多读 31 个字符”，留一位给结尾的 `\0`——不加宽度限制是缓冲区溢出的经典来源

## 六、常见起步错误

| 现象 | 原因 | 解决 |
| --- | --- | --- |
| `undefined reference to main` | 没有 `main` 或拼错 | 检查函数名与签名 |
| `'stdio.h' file not found` | 编译器没装好/环境变量没配 | 重装工具链，确认 `gcc -v` 能找到头文件 |
| 中文输出乱码（Windows） | 控制台编码与源文件不一致 | 源文件存 UTF-8，或 `chcp 65001` |
| 程序一闪就关 | 双击运行没有终端停住 | 在终端里运行，或末尾加 `getchar()` |

## 七、练习

1. 把 `hello.c` 改成打印你的名字和今天的日期
2. 用 `gcc -Wall -Wextra` 重新编译，把所有警告都改到零
3. 故意删掉一个分号，观察报错行号指向哪里

## 一句话总结

先让**编译链跑通**，再学语法。你在终端里看到自己写的字被打印出来那一刻，学习曲线才真正开始。
</script>


<script type="text/markdown" id="md-cpp-types">
变量不是“一个名字”，它是**一块有大小、有解释方式的内存**。类型决定这两件事。

## 一、sizeof：亲手量一遍

```c
#include <stdio.h>

int main(void) {
    printf("char      %zu 字节\n", sizeof(char));
    printf("short     %zu 字节\n", sizeof(short));
    printf("int       %zu 字节\n", sizeof(int));
    printf("long      %zu 字节\n", sizeof(long));
    printf("long long %zu 字节\n", sizeof(long long));
    printf("float     %zu 字节\n", sizeof(float));
    printf("double    %zu 字节\n", sizeof(double));
    printf("pointer   %zu 字节\n", sizeof(void *));
    return 0;
}
```

64 位机器上典型输出：1 / 2 / 4 / 8 / 8 / 4 / 8 / 8。

注意 `long` 在 Windows 是 4 字节、Linux 是 8 字节——**所以跨平台代码里慎用 `long`**，要确定宽度就用 `<stdint.h>` 的 `int32_t` / `int64_t`。

## 二、整数溢出：不是“变大”，是“绕回去”

```c
#include <limits.h>
int x = INT_MAX;      /* 2147483647 */
x = x + 1;            /* 有符号溢出：未定义行为，常见结果是 -2147483648 */
```

无符号则是明确的模运算：

```c
unsigned char c = 255;
c = c + 1;            /* 结果 0，模 256 */
```

两个实用结论：
1. 用 `unsigned` 做循环变量要小心 `for (unsigned i = n; i >= 0; i--)` 会死循环（无符号永远 ≥ 0）
2. 金额别用 `float`，用整数分或 `double`；`0.1 + 0.2 != 0.3` 是二进制浮点的固有特性

## 三、char 存不存得下中文

`char` 只有 1 字节，能表示 0–255。一个中文字符在 UTF-8 里占 3 字节，所以：

```c
char c = '中';        /* 编译可能通过，但只留下一个字节，后续输出必乱 */
```

字符串要按**字节序列**理解：`"中"` 是 3 个 `char` 加一个 `\0`，共 4 字节。

```c
printf("%zu\n", sizeof("中"));   /* 4 */
```

## 四、i++ 与 ++i

```c
int i = 0;
int a = i++;   /* a = 0，i 变 1：先取值，再自增 */
int b = ++i;   /* i 先变 2，b = 2 */
```

单独一行写 `i++;` 时两者没区别。差别只在“表达式里还要用这个值”时。团队代码里建议：**需要用到值时不要依赖自增顺序**，拆成两行更清楚。

## 五、类型转换的两条铁律

```c
int a = 7, b = 2;
double r = a / b;        /* 3.0，不是 3.5：先做整数除法再转 */
double ok = (double)a / b;  /* 3.5：先转再除 */
```

```c
printf("%d\n", 3.7);     /* 错：格式符与类型不匹配，输出垃圾 */
printf("%.0f\n", 3.7);   /* 对 */
```

- **整数除法会截断**，要小数必须先转浮点
- **`printf` 的格式符必须与参数类型一致**，编译器不检查（`-Wformat` 会警告，务必开）

## 六、常量与命名

```c
const double PI = 3.1415926;   /* 推荐：有类型、可调试 */
#define MAX 100                /* 宏：纯文本替换，没有类型 */

enum Color { RED, GREEN, BLUE };  /* 一组相关常量，比裸数字可读 */
```

宏没有作用域也不做类型检查，能用 `const` / `enum` 就别用 `#define`。

## 七、练习

1. 打印所有整型的最大最小值（用 `<limits.h>`），验证你机器上的宽度
2. 写 `int a = 2147483647; a++;` 并打印结果，解释你看到的数
3. 用 `printf` 输出 `1/3` 的三种写法：整数除法、`float`、`double`，比较精度

## 一句话总结

类型的两个作用：**占多大地方**、**怎么解释这串二进制**。理解了这两点，溢出、截断、精度问题都不再神秘。
</script>


<script type="text/markdown" id="md-cpp-flow">
控制流本身没有难点，难的是**边界**。把边界想清楚，代码就稳了。

## 一、if：把“区间”写对

```c
/* 需求：分数 90 以上 A，80-89 B，70-79 C，其余 D */
if (score >= 90)      grade = 'A';
else if (score >= 80) grade = 'B';   /* 不用再写 score < 90，因为上面的分支已排除 */
else if (score >= 70) grade = 'C';
else                  grade = 'D';
```

两个习惯：
1. **顺序检查**：`else if` 从上往下匹配，条件要按“从严格到宽松”排
2. **浮点不要用 `==`**：`if (fabs(a - b) < 1e-9)` 才是比较相等

```c
/* 经典坑：= 与 == */
if (x = 1) { }        /* 赋值，恒为真，编译器只给警告 */
if (1 == x) { }       /* 把常量放左边，写错就编译报错 */
```

## 二、循环：三种写法各有适用场景

```c
/* 1. 次数确定 */
for (int i = 0; i < n; i++) { sum += a[i]; }

/* 2. 条件驱动，可能一次都不执行 */
while (fgets(buf, sizeof buf, fp) != NULL) { process(buf); }

/* 3. 至少执行一次 */
do {
    show_menu();
    scanf("%d", &choice);
} while (choice != 0);
```

`for` 里三个表达式都可省略，但省略条件就是死循环：

```c
for (;;) { ... }        /* 等价 while(1)，要靠 break 退出 */
```

## 三、break / continue 的边界

```c
for (int i = 0; i < 10; i++) {
    if (i == 3) continue;   /* 跳过本次，i 仍会 ++ */
    if (i == 8) break;      /* 直接跳出整个循环 */
    printf("%d ", i);       /* 输出 0 1 2 4 5 6 7 */
}
```

嵌套循环里 `break` **只跳出最内层**。要跳两层，用标志位或 `goto`（`goto` 在“多层退出”这一种场景是可接受的）。

## 四、函数：接口先想清楚

```c
/* 计算数组平均值；n 为 0 时返回 0，避免除零 */
double average(const double *a, int n) {
    if (n <= 0) return 0.0;          /* 边界先处理，别放在最后 */
    double sum = 0.0;
    for (int i = 0; i < n; i++) sum += a[i];
    return sum / n;
}
```

三条约定：
1. `const` 修饰只读参数，表明“我不会改你的数据”
2. 参数里带长度（`n`），不要指望函数能知道数组多长（数组会退化成指针）
3. **失败要有返回值语义**：返回 `-1` / `NULL` / 设 `errno`，调用方必须检查

## 五、递归：出口写在最前面

```c
/* 阶乘 */
long fact(int n) {
    if (n <= 1) return 1;        /* 出口：必须有，且要先判断 */
    return n * fact(n - 1);
}

/* 斐波那契：朴素递归是指数级，n=40 就要等很久 */
long fib(int n) {
    if (n < 2) return n;
    return fib(n - 1) + fib(n - 2);   /* 时间复杂度 O(2^n) */
}
```

朴素 `fib` 慢的原因是**重复计算**。两种改法：

```c
/* 1. 加记忆化 */
long memo[100] = {0};
long fib2(int n) {
    if (n < 2) return n;
    if (memo[n]) return memo[n];
    return memo[n] = fib2(n - 1) + fib2(n - 2);   /* O(n) */
}

/* 2. 改迭代 */
long fib3(int n) {
    long a = 0, b = 1;
    for (int i = 0; i < n; i++) { long t = a + b; a = b; b = t; }
    return a;
}
```

递归深度也有上限：默认栈只有几 MB，递归一万层就会**栈溢出**（段错误）。深层递归改迭代。

## 六、把三个东西拼起来：一个猜数字游戏

```c
#include <stdio.h>
#include <stdlib.h>
#include <time.h>

int main(void) {
    srand((unsigned)time(NULL));
    int target = rand() % 100 + 1, guess, tries = 0;

    do {
        printf("猜一个 1-100 的数：");
        if (scanf("%d", &guess) != 1) return 1;
        tries++;
        if (guess < target)      puts("小了");
        else if (guess > target) puts("大了");
    } while (guess != target);

    printf("对了，用了 %d 次。\n", tries);
    return 0;
}
```

## 七、练习

1. 把猜数字改成“最多 7 次”，超时输出答案
2. 写 `int max_of(const int *a, int n)`，用 `-Wall` 确保零警告
3. 用递归和迭代各写一遍“反转字符串”，比较代码长度与可读性

## 一句话总结

控制流的可靠来自**边界明确**：if 想清区间、循环想清终止、递归先写出口。这三点做到了，逻辑题基本不会写出 bug。
</script>


<script type="text/markdown" id="md-cpp-stl">
到了能写指针、能分文件的阶段，下一个台阶就是 STL。它的价值不是“少写代码”，而是**把容易出错的手工操作变成有约束的类型**。

## 一、三大件

| 组件 | 作用 | 例子 |
| --- | --- | --- |
| 容器 | 存数据 | `vector` `map` `set` `deque` |
| 迭代器 | 统一的遍历接口 | `begin()` `end()` |
| 算法 | 对区间做操作 | `sort` `find` `accumulate` |

算法不认识容器，只认识迭代器区间 `[first, last)`——这是 STL 能用少数算法覆盖所有容器的原因。

## 二、vector：默认就用它

```cpp
#include <vector>
#include <algorithm>
#include <numeric>

std::vector<int> v{5, 2, 9, 1};

v.push_back(7);                       // 尾部追加，均摊 O(1)
std::sort(v.begin(), v.end());        // 1 2 5 7 9
auto it = std::find(v.begin(), v.end(), 7);
int sum = std::accumulate(v.begin(), v.end(), 0);

for (int x : v) std::cout << x << ' ';   // 范围 for，最常用
```

`vector` 的三个要点：
- 连续内存，`&v[0]` 可以当 C 数组传给老接口
- 扩容会让**所有迭代器和指针失效**（容量按倍数增长）
- 提前 `v.reserve(1000)` 能避免多次扩容拷贝

## 三、map 与 unordered_map

```cpp
#include <map>
#include <unordered_map>

std::map<std::string, int> ordered;        // 红黑树：有序，O(log n)
std::unordered_map<std::string, int> hash; // 哈希表：无序，平均 O(1)
```

选择标准很朴素：**要按 key 排序就 `map`，只查不排序就 `unordered_map`**。

```cpp
for (const auto &kv : ordered)         // kv.first 是 key，kv.second 是 value
    std::cout << kv.first << "=" << kv.second << '\n';
```

注意 `m[key]` 在 key 不存在时会**插入一个默认值**。只想查不改，用 `find` 或 `contains`（C++20）：

```cpp
if (auto it = hash.find("kobe"); it != hash.end()) use(it->second);
```

## 四、模板：为什么写在头文件里

```cpp
template <typename T>
T max_of(const std::vector<T> &xs) {
    T best = xs[0];
    for (const auto &x : xs) if (x > best) best = x;
    return best;
}

max_of<int>({1, 2, 3});        // T = int
max_of<double>({1.5, 2.5});    // T = double
```

模板不是“运行时通用的函数”，而是**编译器按需生成多份代码**。生成发生在使用处，所以必须让编译器在使用时看到完整定义——这就是“模板实现要放头文件”的真实原因（不是规定，是机制）。

## 五、五个常见误用

**1. 边遍历边删**

```cpp
// 错：it 失效，行为未定义
for (auto it = v.begin(); it != v.end(); ++it)
    if (*it < 0) v.erase(it);

// 对：erase 返回下一个有效迭代器
for (auto it = v.begin(); it != v.end(); )
    it = (*it < 0) ? v.erase(it) : it + 1;
```

**2. 在循环里反复 `push_back` 不用 `reserve`**：容量反复翻倍，拷贝开销大。

**3. 用 `[]` 访问不存在的 key**：会静默插入，逻辑错还看不出来。

**4. `vector<bool>`**：这是特化版本，不是真正的 `bool` 数组，取地址会出问题。需要位图用 `std::bitset` 或 `vector<char>`。

**5. 拿 `size()` 和 `int` 比较**：`size()` 返回无符号，`v.size() - 1` 在空容器上会变成极大值。

```cpp
for (int i = 0; i < (int)v.size(); i++)   // 显式转换，避免符号问题
```

## 六、算法比手写循环更清楚

```cpp
#include <algorithm>

std::sort(v.begin(), v.end(), [](int a, int b) { return a > b; });  // 降序
auto n = std::count_if(v.begin(), v.end(), [](int x) { return x % 2 == 0; });
bool any = std::any_of(v.begin(), v.end(), [](int x) { return x > 100; });
v.erase(std::remove_if(v.begin(), v.end(), [](int x) { return x < 0; }), v.end());
```

最后一行是经典的 **erase-remove 惯用法**：`remove_if` 只把要保留的元素挪到前面并返回新逻辑结尾，真正的删除要 `erase`。

## 七、练习

1. 读入 20 个整数，用 `vector` 去重（`sort` + `unique`）后输出
2. 统计一段文本里每个单词出现的次数，分别用 `map` 和 `unordered_map` 实现，比较输出顺序
3. 写一个 `template<typename T> void print_all(const std::vector<T>&)`，验证能打印 `int`、`double`、`std::string`

## 一句话总结

STL 的意义是**把内存管理交给类型系统**：你描述“要什么”，它负责“怎么放”。学会它，C++ 才从“危险的 C”变成“能写大项目的语言”。
</script>


<script type="text/markdown" id="md-py-start">
Python 的优势是“写完就能跑”，但前置的三件事必须清楚：解释器版本、包管理、报错阅读。

## 一、装什么

| 系统 | 建议 | 验证 |
| --- | --- | --- |
| Windows | 官网安装包（勾选 Add to PATH） | `python --version` |
| macOS | `brew install python` | `python3 --version` |
| Linux | `sudo apt install python3 python3-pip` | `python3 --version` |

**版本建议 3.10+**（能用到 `match`、更好的类型提示）。看到 `Python 3.x.x` 就算成功。

一个常见混淆：

```
python  → 可能是 Python 2（老系统）
python3 → 明确是 Python 3
```

统一用 `python3` 更保险。

## 二、第一个脚本

新建 `hello.py`：

```python
name = "阿飞"
print(f"你好，{name}")
print("今天是", 2026, "年")
```

运行：

```bash
python3 hello.py
```

```
你好，阿飞
今天是 2026 年
```

`f"..."` 是 f-string，`{}` 里可以直接写变量或表达式：

```python
price, qty = 19.9, 3
print(f"合计 {price * qty:.2f} 元")   # :.2f 表示保留两位小数
```

## 三、交互式环境：验证想法最快

```bash
python3          # 进入 REPL
>>> 1 + 1
2
>>> exit()
```

不确定某个函数怎么用的时候，REPL 比新建文件快得多：

```python
>>> help(str.split)
>>> "a,b,c".split(",")
['a', 'b', 'c']
```

## 四、包管理：pip 与虚拟环境

```bash
python3 -m venv .venv          # 建虚拟环境（每个项目一个）
source .venv/bin/activate      # Windows: .venv\Scripts\activate
pip install requests           # 装包
pip freeze > requirements.txt  # 记录依赖
pip install -r requirements.txt
```

**为什么一定要用虚拟环境**：不同项目依赖不同版本，装在全局会互相打架。这个习惯从第一天就养成。

## 五、读懂报错（这是最重要的技能）

```
Traceback (most recent call last):
  File "hello.py", line 3, in <module>
    print(name)
NameError: name 'name' is not defined
```

从下往上读：
1. **最后一行**是错误类型与原因：`NameError: name 'name' is not defined`
2. **往上一行**是出错位置：`hello.py` 第 3 行
3. 中间是调用栈（简单脚本可以忽略）

四个新手最常遇到的错误：

| 错误 | 典型原因 |
| --- | --- |
| `NameError` | 变量名拼错 / 用了未定义的变量 |
| `IndentationError` | 缩进不一致（Tab 与空格混用） |
| `TypeError` | 类型不匹配，如 `"1" + 1` |
| `KeyError` | 字典里没有这个 key |

## 六、一个小而完整的脚本

读完一个文本文件，统计每个词出现的次数，输出前 5：

```python
from collections import Counter
from pathlib import Path

def top_words(path, n=5):
    text = Path(path).read_text(encoding="utf-8")
    words = text.replace("，", " ").replace("。", " ").split()
    return Counter(words).most_common(n)

if __name__ == "__main__":
    for word, count in top_words("input.txt"):
        print(f"{word}: {count}")
```

三个值得记住的点：
- `Path.read_text(encoding="utf-8")` 比 `open()` 省事，中文不会乱码
- `Counter` 一行完成计数
- `if __name__ == "__main__":` 让这个文件既能被导入、也能直接运行

## 七、练习

1. 让脚本接收命令行参数（`sys.argv` 或 `argparse`），文件名从命令行传
2. 故意制造一次 `KeyError`，练习从 Traceback 定位到行
3. 建一个虚拟环境，装 `requests`，写三行代码请求一个网页并打印状态码

## 一句话总结

Python 没有编译步骤，所以**报错就是你的编译器**。学会读 Traceback，学习速度会快好几倍。
</script>


<script type="text/markdown" id="md-py-types">
Python 里没有“声明类型”这一步，但每个值都有类型，且类型决定了它能做什么。

## 一、五种常用容器，一句话区分

| 类型 | 有序 | 可变 | 重复 | 典型用途 |
| --- | --- | --- | --- | --- |
| `str` | 是 | 否 | 允许 | 文本 |
| `list` | 是 | 是 | 允许 | 一组有序数据 |
| `tuple` | 是 | 否 | 允许 | 不可变的记录（坐标、返回多值） |
| `dict` | 是（3.7+） | 是 | key 唯一 | 键值映射 |
| `set` | 否 | 是 | 不允许 | 去重、集合运算 |

## 二、字符串：最常用的 8 个操作

```python
s = "  Hello, Python  "

s.strip()                 # 'Hello, Python'   去首尾空白
s.lower()                 # 转小写
s.replace("Python", "世界")  # 替换
",".join(["a", "b"])      # 'a,b'  用分隔符拼接
"a,b,c".split(",")        # ['a', 'b', 'c']
s.startswith("  He")      # True
f"{3.14159:.2f}"          # '3.14'  格式化
"abc".upper().center(9, "-")  # '---ABC---'
```

**字符串不可变**：所有“修改”都返回新字符串。

```python
s = "abc"
s[0] = "A"       # TypeError: 'str' object does not support item assignment
s = "A" + s[1:]  # 正确写法
```

## 三、列表：增删改查

```python
xs = [3, 1, 2]

xs.append(4)        # 尾部加
xs.insert(0, 9)     # 头部插（O(n)，大列表避免）
xs.extend([5, 6])   # 合并另一个列表
xs.remove(1)        # 删除第一个值 1（按值）
xs.pop()            # 弹出末尾（按位置）
xs.sort()           # 原地排序
sorted(xs, reverse=True)   # 返回新列表

xs[1:3]             # 切片，左闭右开
xs[::-1]            # 反转
[x * 2 for x in xs if x > 2]   # 列表推导式
```

## 四、字典：查表与迭代

```python
user = {"name": "阿飞", "age": 18}

user["name"]              # '阿飞'
user.get("email", "-")    # '-'  不存在时给默认值，不抛异常
user["email"] = "a@b.c"   # 新增
user.keys(); user.values(); user.items()

for k, v in user.items():
    print(k, v)
```

**用 `get` 还是 `[]`**：确定 key 存在用 `[]`（出错能暴露问题），不确定用 `get`。

## 五、set：去重与集合运算

```python
a, b = {1, 2, 3}, {3, 4}

a | b    # 并集 {1,2,3,4}
a & b    # 交集 {3}
a - b    # 差集 {1,2}

list(set([1, 2, 2, 3]))   # 去重（注意：不保证顺序）
```

## 六、可变与不可变：一个必踩的坑

```python
def add_item(x, items=[]):      # 错：默认参数只创建一次
    items.append(x)
    return items

add_item(1)   # [1]
add_item(2)   # [1, 2]  ← 期望是 [2]
```

正确写法：

```python
def add_item(x, items=None):
    if items is None:
        items = []
    items.append(x)
    return items
```

同理：

```python
a = [1, 2]
b = a          # 同一个对象，改 b 会影响 a
c = a.copy()   # 浅拷贝，改 c 不影响 a
```

## 七、怎么选：三问

1. **要不要按 key 取值？** 要 → `dict`
2. **要不要去重 / 做集合运算？** 要 → `set`
3. **顺序重要吗？** 重要 → `list`；不需要修改 → `tuple`

## 八、练习

1. 统计一段文本里每个字出现的次数，输出前 10（用 `dict` 或 `Counter`）
2. 有两个列表，求“都在里面”和“只在前者”的元素（用 `set`）
3. 写一个函数 `merge(a, b)` 合并两个字典，重复 key 以后者为准（试试 `{**a, **b}`）

## 一句话总结

容器选择靠三个问题：**按键取值、要不要去重、顺序要紧吗**。选对了，代码短一半；选错了，性能和可读性都受损。
</script>


<script type="text/markdown" id="md-py-flow-module">
能跑的脚本和能复用的代码，差在**结构**。这篇把控制流、函数、模块三件事串起来。

## 一、控制流：Python 的写法习惯

```python
if score >= 90:
    grade = "A"
elif score >= 80:      # 不用再写 score < 90
    grade = "B"
else:
    grade = "D"
```

Python 用**缩进表示代码块**，同一块必须一致（推荐 4 个空格，别和 Tab 混用）。

```python
for i in range(5):          # 0..4
    print(i)

for i, ch in enumerate("abc"):   # 同时拿下标和值
    print(i, ch)

for a, b in zip([1, 2], ["x", "y"]):   # 并行遍历
    print(a, b)

while queue:
    task = queue.pop()
    handle(task)
```

三个辅助语句：

```python
for x in xs:
    if x < 0:
        continue     # 跳过本次
    if x > 100:
        break        # 结束循环
else:
    print("循环正常跑完才会执行（没被 break）")   # for-else 很好用
```

## 二、函数：五种参数形态

```python
def f(a, b=2, *args, c=3, **kwargs):
    # a      位置参数
    # b      默认参数
    # args   额外位置参数，收成 tuple
    # c      仅关键字参数
    # kwargs 额外关键字参数，收成 dict
    return a, b, args, c, kwargs

f(1)                          # (1, 2, (), 3, {})
f(1, 5, 7, 8, c=9, d=10)      # (1, 5, (7, 8), 9, {'d': 10})
```

**默认参数别用可变对象**（`[]`、`{}`），它们只在定义时创建一次：

```python
def bad(x, acc=[]):        # 错
    acc.append(x); return acc

def good(x, acc=None):     # 对
    acc = [] if acc is None else acc
    acc.append(x); return acc
```

## 三、返回值：多值返回其实是 tuple

```python
def divide(a, b):
    if b == 0:
        return None, "除数不能为 0"
    return a / b, None

value, err = divide(6, 3)
if err:
    print(err)
```

比抛异常轻，但**别用来吞错误**——真的异常情况还是 `raise`。

## 四、作用域：LEGB

```
Local → Enclosing → Global → Builtin
```

```python
count = 0

def inc():
    global count      # 想改全局变量必须声明
    count += 1

def outer():
    n = 0
    def inner():
        nonlocal n    # 改外层函数变量
        n += 1
    inner()
    return n
```

不需要修改时，读全局变量不用声明。**能不用 `global` 就不用**——它让数据流向变难追踪。

## 五、模块与包：从脚本到工程

```
project/
├─ main.py
├─ utils/
│  ├─ __init__.py
│  ├─ text.py
│  └─ net.py
└─ requirements.txt
```

```python
# utils/text.py
def clean(s: str) -> str:
    return s.strip().lower()

# main.py
from utils.text import clean          # 绝对导入，推荐
print(clean("  Hello  "))
```

三个要点：
1. 目录里有 `__init__.py`（3.3+ 可以没有，但显式建更清楚）
2. **用绝对导入**，相对导入（`from .text import`）只在包内部好用，跑脚本时容易报错
3. 每个模块只做一件事，别写 `utils.py` 什么都往里塞

## 六、让文件既能导入又能运行

```python
# utils/text.py
def clean(s):
    return s.strip().lower()

if __name__ == "__main__":
    # 只有直接 python text.py 时才执行，被 import 时不执行
    print(clean("  Test  "))
```

这个小节是**工程化的起点**：函数可被复用，测试代码留在文件里不干扰调用方。

## 七、练习

1. 把上一篇的词频脚本拆成 `utils/text.py`（纯函数）+ `main.py`（命令行入口）
2. 写一个 `retry(fn, times=3)` 函数，失败重试，用到 `*args, **kwargs` 透传
3. 用 `for...else` 实现“在列表里找第一个偶数，找不到就打印提示”

## 一句话总结

函数让逻辑可复用，模块让代码可组合。**先写函数，再拆模块**，工程结构是长出来的，不是一开始就设计好的。
</script>


<script type="text/markdown" id="md-py-oop">
到了要写几百行的阶段，函数会开始互相传一堆参数。类解决的就是这个问题：**把相关的数据和行为放在一起**。

## 一、一个够用的类

```python
class Article:
    # 一篇文章：标题、正文、标签

    site = "阿飞观察站"        # 类属性：所有实例共享

    def __init__(self, title: str, body: str, tags=None):
        self.title = title                      # 实例属性
        self.body = body
        self.tags = list(tags or [])

    def words(self) -> int:
        return len(self.body)

    def summary(self, n: int = 40) -> str:
        text = self.body.replace("\n", " ")
        return text[:n] + ("…" if len(text) > n else "")

    def __repr__(self) -> str:                  # 打印时好看
        return f"<Article {self.title!r} {self.words()} 字>"


a = Article("科比与凌晨四点", "他每天四点起床训练……", ["人物"])
print(a, a.summary())
```

四个必备成员：`__init__`（初始化）、普通方法、`__repr__`（调试友好）、类属性（共享常量）。

## 二、继承与组合：优先组合

```python
class Draft(Article):                 # 继承：is-a
    def __init__(self, title, body, tags=None):
        super().__init__(title, body, tags)
        self.published = False

    def publish(self):
        self.published = True

class Site:                           # 组合：has-a，更常用
    def __init__(self):
        self.articles = []            # 站点“有”文章

    def add(self, article):
        self.articles.append(article)
```

判断标准：**“是”用继承，“有”用组合**。滥用继承会让改动一层层传下去，组合更容易替换。

## 三、dataclass：只装数据的类

```python
from dataclasses import dataclass, field

@dataclass
class Point:
    x: float
    y: float = 0.0
    tags: list = field(default_factory=list)   # 可变默认值要这样写
```

`@dataclass` 自动生成 `__init__`、`__repr__`、`__eq__`，省掉一堆样板代码。

## 四、异常：三种用法

**1. 捕获：只捕你能处理的**

```python
try:
    n = int(input("数字："))
except ValueError:
    print("不是合法数字")
else:
    print("输入了", n)      # 没异常才执行
finally:
    print("无论如何都执行")
```

**2. 抛出：把问题交给上层**

```python
def load(path):
    if not path.exists():
        raise FileNotFoundError(f"找不到文件：{path}")
    return path.read_text(encoding="utf-8")
```

**3. 自定义：让调用方能区分错误**

```python
class ConfigError(Exception):
    pass

def parse(cfg):
    if "port" not in cfg:
        raise ConfigError("缺少 port 字段")
```

三个反模式：
- `except Exception: pass` —— 静默吞掉一切，bug 从此消失（其实是藏起来）
- 用 `try/except` 代替 `if` 判空 —— 可读性差
- 捕获后不记录 —— 出问题无从排查

## 五、文件与 JSON：安全的读写

```python
from pathlib import Path
import json

p = Path("data/articles.json")

# 读
if p.exists():
    data = json.loads(p.read_text(encoding="utf-8"))

# 写：先写临时文件再替换，避免写到一半崩溃留个坏文件
tmp = p.with_suffix(".tmp")
tmp.write_text(json.dumps(data, ensure_ascii=False, indent=2), encoding="utf-8")
tmp.replace(p)
```

两个细节：
- `ensure_ascii=False` 让中文不被转成 `\uXXXX`
- `tmp.replace(p)` 是原子操作，比直接覆盖安全

## 六、上下文管理器：with 帮你收尾

```python
with open("a.txt", "w", encoding="utf-8") as f:
    f.write("hello")
# 离开 with 自动 close，即使中途抛异常
```

自己写一个也不难：

```python
from contextlib import contextmanager

@contextmanager
def timer(label):
    import time
    t0 = time.perf_counter()
    yield
    print(f"{label} 用时 {time.perf_counter() - t0:.3f}s")

with timer("解析"):
    do_something()
```

## 七、练习

1. 用 `@dataclass` 定义 `Article`，加 `words` 与 `summary` 方法
2. 写一个 `load_articles(path)`，文件不存在抛 `FileNotFoundError`，JSON 坏了抛 `ValueError`
3. 用 `contextmanager` 写一个 `chdir(path)`，进入目录后自动切回

## 一句话总结

类的价值是**把散落的参数收进一个概念里**；异常的价值是**让错误有明确出口**；文件操作的价值是**出问题时不留半成品**。这三件事做好，Python 代码才开始“可维护”。
</script>


<script type="text/markdown" id="md-sec-start">
很多同学入门安全的方式是下载一堆工具，见洞就扫。这样能出结果，但**说不清为什么**。真正的起点是判断框架。

## 一、CIA 三元组：保护的到底是什么

| 维度 | 含义 | 被破坏的例子 |
| --- | --- | --- |
| 机密性 Confidentiality | 只有该看的人能看 | 数据库被拖库、配置泄露 AK |
| 完整性 Integrity | 数据只能被合法方式修改 | 订单金额被改成 0.01 |
| 可用性 Availability | 该用的时候能用 | DDoS 打挂登录接口 |

任何漏洞，最终都能落到这三条之一（或组合）。判断一个风险值不值得修，也先问：它破坏哪一条、影响面多大。

## 二、威胁建模：四个问题

1. **我们在保护什么？**（资产：用户数据、支付能力、后台权限）
2. **谁想动它？**（对手：脚本小子、黑产、内部人员、APT）
3. **他会从哪进来？**（入口：表单、上传、第三方回调、运维通道）
4. **进来了能干什么？**（影响：读数据、改数据、横向到内网）

把四个问题写成一张表，比任何扫描报告都更能指导加固顺序。

```
资产            对手        入口              影响
用户手机号      黑产爬虫    /api/user/list    批量泄露 → 撞库
后台管理员      内部/外包   VPN + 弱口令     全站数据可改
支付回调        外部        签名校验缺失      0 元下单
```

## 三、攻击面：比漏洞更重要的概念

攻击面 = 所有「能被外部输入影响」的地方。它包括：

- **网络层**：暴露的端口、老版本中间件、管理后台是否公网可达
- **应用层**：所有接收参数的接口、文件上传、URL 跳转、模板渲染
- **身份层**：登录、找回密码、Token 生命周期、越权校验
- **供应链**：第三方 JS、npm 依赖、CI 构建脚本
- **人**：钓鱼邮件、弱口令、U 盘

**减少攻击面往往比修漏洞更有效**：把测试环境、管理后台、调试接口从公网收回去，能一次性消掉一大片风险。

## 四、常见攻击分类（知道名字就够入门）

| 类别 | 代表 | 一句话 |
| --- | --- | --- |
| 注入 | SQL 注入、命令注入 | 把用户输入当代码执行 |
| 跨站 | XSS、CSRF | 借用户的浏览器做事 |
| 越权 | 水平/垂直越权 | 能操作不属于自己的对象 |
| 文件 | 上传、包含、反序列化 | 让服务器执行我的文件/对象 |
| 认证 | 爆破、会话固定、JWT 伪造 | 拿到本不该有的身份 |
| 网络 | 中间人、DNS 劫持、DDoS | 在链路上做手脚 |
| 社会工程 | 钓鱼、冒充 | 攻人比攻系统便宜 |

## 五、一条能走通的学习路线

**大一大二：打地基**

- 计算机网络（TCP/IP、HTTP、DNS）、操作系统、数据结构
- 一门能写工具的脚本语言（Python 优先）
- 熟悉 Linux 命令行、会看日志

**大二大三：进靶场**

- 装好虚拟机环境：Kali + 靶机（DVWA、sqli-labs、VulnHub）
- 按 OWASP Top 10 逐个复现「成因 → 利用 → 修复」
- 学 Burp Suite 抓包改包，学 nmap 做资产探测
- 打 CTF 的 Web 与 Misc 方向，练的是「快速定位」的能力

**大三之后：选方向**

| 方向 | 核心能力 | 入门抓手 |
| --- | --- | --- |
| Web 渗透 | 漏洞原理与利用链 | 靶场 + SRC 挖洞 |
| 安全研发 | 写检测/防护系统 | WAF、扫描器源码 |
| 代码审计 | 读代码找危险点 | 开源项目审计 |
| 蓝队/应急 | 日志分析与溯源 | ATT&CK + SIEM |
| 密码学/协议 | 数学与协议设计 | TLS、国密标准 |

## 六、一条必须刻在脑子里的边界

**只对自己拥有或获得书面授权的系统做测试。**

《网络安全法》《刑法》285/286 条对「非法侵入」「非法获取数据」有明确规定，「我只是试试」不构成免责。练习一律在靶场、CTF 平台、自建环境里做；对真实目标，必须有授权书并约定测试范围与时间窗。

## 七、练习

1. 给你常用的一个网站画攻击面清单（只做观察，不发请求）
2. 用 DVWA 搭起环境，把 SQL 注入的「成因 → 利用 → 修复代码」写成一篇笔记
3. 给自己定一个学期目标：例如「完成 30 道 Web 题 + 读 2 本专著 + 写 1 个检测脚本」

## 一句话总结

安全是**在约束下做权衡**：没有绝对安全，只有「把风险降到可接受」。先建立框架，工具只是执行手段。
</script>


<script type="text/markdown" id="md-sec-web-basics">
Web 安全的大部分问题，源于同一个结构性事实：**浏览器会执行服务器返回的内容，而内容里混进了用户输入**。

## 一、先把 HTTP 看明白

一次请求的关键要素：

```
POST /api/login HTTP/1.1
Host: example.com
Cookie: session=abc123
Content-Type: application/json

{"user":"afei","pass":"******"}
```

安全相关的四个位置：

| 位置 | 风险 |
| --- | --- |
| URL / Query | 被日志、Referer、分享链接泄露 |
| Header | 伪造 `X-Forwarded-For` 绕过 IP 限制 |
| Cookie | 未设 HttpOnly 时能被 JS 读取 |
| Body | 注入类漏洞的主战场 |

## 二、Cookie 的三个安全属性

```
Set-Cookie: session=abc123; HttpOnly; Secure; SameSite=Lax; Path=/
```

- **HttpOnly**：JS 读不到，XSS 偷不走会话
- **Secure**：只走 HTTPS，防明文嗅探
- **SameSite**：`Lax` 挡掉大部分跨站请求伪造；`Strict` 更严但影响跳转体验

这三个属性能挡掉一大票「低门槛」攻击，成本却几乎为零。

## 三、同源策略：浏览器的底线

同源 = 协议 + 域名 + 端口 三者完全一致。

- `https://a.com` 与 `http://a.com` 不同源（协议不同）
- `https://a.com` 与 `https://a.com:8443` 不同源（端口不同）

同源策略限制的是**读取**：`a.com` 的 JS 不能读 `b.com` 的响应内容。但它**不限制发送请求**——这正是 CSRF 能成立的原因。

CORS 是服务器主动放宽：

```
Access-Control-Allow-Origin: https://a.com
Access-Control-Allow-Credentials: true
```

**最常见的错误配置**是 `Allow-Origin: *` 搭配 `Allow-Credentials: true`（浏览器会拒绝），或者把 Origin 原样反射回去——后者等于取消同源保护。

## 四、SQL 注入：把输入当代码

**成因**：字符串拼接。

```python
# 危险：输入 ' OR '1'='1 就能改变语义
sql = "SELECT * FROM users WHERE name = '" + name + "'"
```

**修复**：参数化查询（预编译），把「代码」和「数据」彻底分开。

```python
cur.execute("SELECT * FROM users WHERE name = %s", (name,))   # 正确
```

补充防线：

- 最小权限的数据库账号（Web 账号不该有 `DROP` 权限）
- 报错信息不回显给前端
- 输入校验是**辅助**，不是替代品

在 sqli-labs 的 Less-1 里能直观看到：加一个单引号，页面就报语法错误——这是存在注入的第一信号。

## 五、XSS：把脚本注入页面

三类，区别只在「脚本从哪进、存在哪」：

| 类型 | 位置 | 特点 |
| --- | --- | --- |
| 反射型 | URL 参数 → 页面 | 需要诱导点击 |
| 存储型 | 数据库 → 页面 | 一次注入，所有访问者中招 |
| DOM 型 | 前端 JS 直接写入 | 服务端日志里看不到 payload |

**成因**：把用户输入当 HTML 插入。

```js
el.innerHTML = userInput;        // 危险
el.textContent = userInput;      // 安全：当纯文本
```

**修复三原则**：
1. **按上下文转义**：HTML 转义 `& < > " '`，属性、JS、URL 各有各的规则
2. **能用文本就不用 HTML**：优先 `textContent`
3. **CSP 兜底**：`Content-Security-Policy: default-src 'self'`，即使漏了转义也能挡住内联脚本

## 六、CSRF：借你的身份发请求

**成因**：浏览器会自动带上目标站点的 Cookie，而攻击页面能让浏览器「顺手」发一个请求。

典型场景：用户登录了银行，访问了恶意页面，页面里有一个自动提交的表单，向银行发「转账」请求。

**修复**：
1. **CSRF Token**：表单带一次性随机值，服务端校验
2. **SameSite Cookie**：`Lax` 能挡住跨站 POST
3. **校验 Origin / Referer**：只接受自家来源
4. **敏感操作二次确认**：转账、改密要求重新输入密码

## 七、复现环境怎么搭

```bash
docker run -d -p 8081:80 vulnerables/web-dvwa     # DVWA
docker run -d -p 8082:80 acgpiano/sqli-labs       # sqli-labs
```

默认账号 `admin / password`，把安全等级调到 Low，逐关复现：

1. 先用正常输入确认功能
2. 加单引号/特殊字符，看报错与行为变化
3. 判断是「拼接」还是「过滤不严」
4. 写修复代码，再回来验证打不通

**只在本地靶场做这一步。**

## 八、练习

1. 在 DVWA 里完成 SQL 注入（Low → High），记录每级过滤了什么、怎么绕过、怎么修
2. 写一个带 CSRF Token 的登录+转账 demo，用攻击页面验证防护有效
3. 给你自己的页面加上 `CSP` 与 `SameSite=Lax`，用浏览器控制台观察变化

## 一句话总结

Web 漏洞的本质是**信任错了边界**：把输入当代码、把请求当本人、把浏览器当保险箱。把这三条边界守住，八成问题不会出现。
</script>


<script type="text/markdown" id="md-sec-crypto">
密码学的难点不在数学，而在**选对原语**。用错地方，再强的算法也没用。

## 一、三类原语，三种用途

| 原语 | 解决什么 | 代表算法 | 关键特性 |
| --- | --- | --- | --- |
| 对称加密 | 加密大量数据 | AES-256-GCM、ChaCha20 | 快，但双方要共享密钥 |
| 非对称加密 | 密钥交换、签名 | RSA、ECDH、Ed25519 | 慢，解决「怎么安全地共享密钥」 |
| 哈希 | 完整性、口令存储 | SHA-256、SHA-3、BLAKE3 | 单向、抗碰撞 |

一句话记住分工：**非对称负责「安全地商量出对称密钥」，对称负责「快速加密数据」，哈希负责「校验没被改」**。

## 二、哈希的三个必须知道的性质

1. **单向**：从摘要推不回原文
2. **抗碰撞**：找不到两个不同输入有相同摘要
3. **雪崩效应**：改一个字符，摘要面目全非

```bash
echo -n "hello" | sha256sum
echo -n "hellp" | sha256sum   # 完全不同
```

**口令存储必须用专门算法**：`bcrypt` / `scrypt` / `argon2`。它们故意慢、带盐，能抵抗彩虹表与 GPU 爆破。直接 `md5(password)` 是历史遗留错误。

```python
import bcrypt
h = bcrypt.hashpw(pw.encode(), bcrypt.gensalt(rounds=12))
ok = bcrypt.checkpw(pw.encode(), h)
```

## 三、AES-GCM：正确用法就三行

```python
from cryptography.hazmat.primitives.ciphers.aead import AESGCM
import os

key = AESGCM.generate_key(bit_length=256)
aes = AESGCM(key)
nonce = os.urandom(12)                 # 每条消息唯一，绝不能重复
ct = aes.encrypt(nonce, b"secret", b"aad")
pt = aes.decrypt(nonce, ct, b"aad")
```

**nonce 复用是致命错误**：GCM 下同一密钥重复 nonce 会泄露明文异或关系，密钥也可能被还原。

## 四、TLS 握手：四次往返干了什么

以 TLS 1.3 为例（已简化为 1-RTT）：

```
1. Client → Server:  支持的套件、随机数、密钥协商参数（ECDHE 公钥）
2. Server → Client:  选定套件、服务器 ECDHE 公钥、证书、签名
3. Client:           验证证书链（域名、有效期、签发者、吊销）
                     用 ECDHE 算出共享密钥 → 发 Finished
4. Server:           校验 Finished → 开始用对称密钥通信
```

三个要点：
- **前向保密**：用 ECDHE 而非 RSA 密钥传输，长期私钥泄露也不解历史流量
- **证书验证是信任根**：浏览器信任的是 CA 体系，自签证书必须手动信任
- **握手之后全是对称加密**：因为对称快

## 五、五个真实世界的误用

**1. 用 ECB 模式**：相同明文块 → 相同密文块，图象能看出轮廓（经典「企鹅图」）。永远别用 ECB。

**2. 硬编码密钥**：密钥进了 Git 历史，等于公开。用 KMS / 环境变量 / 密钥管理服务。

**3. 自己发明加密方案**：把两次 base64 当加密、把异或当混淆。**不要自创密码学**。

**4. 只加密不认证**：没有 MAC 的加密可被篡改（padding oracle）。用 AEAD（GCM、ChaCha20-Poly1305）。

**5. 口令加盐但盐是固定的**：等于没加。每条口令一个随机盐。

## 六、签名与验签：别把加密当签名

- **加密**：用对方公钥加密，只有对方私钥能解 → 保机密性
- **签名**：用自己私钥签，任何人用公钥能验 → 保完整性与身份

两者方向相反，混用会出严重问题（比如用 RSA 加密当签名，可被伪造）。

```python
from cryptography.hazmat.primitives.asymmetric.ed25519 import Ed25519PrivateKey
priv = Ed25519PrivateKey.generate()
sig = priv.sign(b"msg")
priv.public_key().verify(sig, b"msg")     # 验不过会抛异常
```

## 七、练习

1. 用 `openssl` 生成自签证书，本地起 HTTPS，观察浏览器告警
2. 写一个口令注册/登录流程，用 bcrypt，并验证数据库泄露后无法直接还原口令
3. 用 AES-GCM 加密一个文件，再故意改一个字节，观察解密失败（认证生效）

## 一句话总结

密码学的安全来自**正确使用**：选 AEAD、管好密钥与 nonce、口令用慢哈希、别自创方案。算法本身很少被攻破，实现和用法才是破口。
</script>


<script type="text/markdown" id="md-sec-recon">
真正的渗透测试里，**找到入口比利用漏洞更难**。信息收集就是把「看不见的资产」变成「可枚举的清单」。

## 一、两类手段：被动与主动

| 类型 | 特点 | 代表手段 |
| --- | --- | --- |
| 被动 | 不直接接触目标，难被发现 | 搜索引擎、证书透明日志、代码托管、招聘信息 |
| 主动 | 直接与目标交互，可能留日志 | 端口扫描、目录爆破、指纹识别 |

授权测试通常先被动、后主动；主动扫描要避开业务高峰，并按约定控制速率。

## 二、资产测绘的五个维度

```
域名 → 子域 → IP → 端口/服务 → 应用（框架、版本、路径）
```

每一层都可能暴露下一层：

- 主域收得紧，但 `test.` `dev.` `admin.` 子域常常裸奔
- 同一个 IP 上可能挂着几十个站点（虚拟主机），扫端口时容易漏
- 应用指纹（框架、中间件版本）直接对应已知漏洞库

## 三、子域发现的思路（不用工具也能想）

1. **证书透明日志**：任何签发过证书的域名都会被记录，是子域的金矿
2. **DNS 爆破**：用常见字典（dev、test、staging、admin、api、oss…）查询是否存在
3. **搜索引擎语法**：`site:`、`inurl:` 找到散落在各处的入口
4. **代码与配置泄露**：公开仓库里的 `.env`、CI 配置、前端 bundle 里的接口域名
5. **证书与备案信息**：企业备案下的其他域名

> 以上手段请仅用于**你拥有或书面授权的目标**；对第三方做子域爆破可能触犯法律。

## 四、端口与服务的判断

```bash
nmap -sV -T3 -p- --min-rate 1000 10.0.0.5      # 全端口 + 版本识别
nmap -sC -sV -p 80,443,8080,3306 10.0.0.5      # 常用端口 + 默认脚本
```

怎么读结果：

| 端口 | 服务 | 关注点 |
| --- | --- | --- |
| 22 | SSH | 版本漏洞、弱口令、是否对公网开放 |
| 80/443 | Web | 虚拟主机、目录、指纹 |
| 3306/6379/27017 | 数据库 | **不应公网可达**，可达即为高危 |
| 8080/8888 | 管理后台 | 默认口令、未授权访问 |
| 9200 | Elasticsearch | 未授权读取数据 |

**「不该暴露却暴露了」比「有漏洞」更常见**：Redis 未授权、ES 未授权、Jenkins 未授权，都是配置问题而非代码问题。

## 五、Web 指纹与应用面

```bash
whatweb https://target.com           # 框架、CMS、中间件
curl -I https://target.com           # 响应头泄露 Server、X-Powered-By
```

重点看三样：
1. **中间件与版本**（Nginx 1.18 / Tomcat 9.0.x）
2. **框架与 CMS**（Spring Boot、Shiro、ThinkPHP、WordPress）
3. **特征路径**（`/actuator`、`/druid`、`/swagger-ui.html`、`/.git/config`）

后面这些路径一旦可达，往往直接等于「配置泄露」或「未授权访问」。

## 六、把结果整理成资产表

```csv
域名,IP,端口,服务/版本,应用指纹,暴露面判断,优先级
api.target.com,1.2.3.4,443,Nginx 1.18 / Spring Boot,/actuator 可达,配置泄露,高
test.target.com,1.2.3.5,8080,Jenkins 2.3,未授权访问,高危,最高
www.target.com,1.2.3.6,443,Nginx,/admin 需登录,常规,中
```

这张表的价值：**让后续测试有优先级**。先把「未授权 + 配置泄露」清掉，再谈漏洞利用。

## 七、容易被忽略的三类线索

1. **前端 bundle**：源码里的接口路径、内网地址、AK/SK（`grep -r "api\." dist/`）
2. **错误页**：堆栈信息会暴露框架、路径、数据库类型
3. **历史快照**：Wayback 里可能有已下线的旧接口与测试页面

## 八、练习

1. 对你自己搭的靶场（如 VulnHub 机器）做一次完整测绘：子域、端口、指纹、目录
2. 把结果整理成上面的 CSV，按「未授权 > 配置泄露 > 版本漏洞」排优先级
3. 写一个 Python 脚本，批量读取域名列表并抓取响应头，输出中间件与版本

## 一句话总结

信息收集的目标不是「找得多」，而是**把资产变成有优先级的清单**。清单清楚了，测试才有方向，报告才有说服力。
</script>


<script type="text/markdown" id="md-sec-web-adv">
进阶漏洞有个共同点：**功能本身是正常的，被用在异常场景就出问题**。这类漏洞最难靠扫描器发现。

## 一、SSRF：让服务器替你去访问

**成因**：服务端接收 URL 并请求它（图片抓取、Webhook、URL 预览、PDF 渲染）。

**危害**：访问内网服务、云元数据接口、绕过 IP 白名单。

判断信号：任何「填一个链接，服务器去取」的功能。

修复要点：
1. **协议白名单**：只允许 http/https
2. **域名/IP 白名单**，而非黑名单（黑名单永远补不完）
3. **解析后校验**：先 DNS 解析，判断 IP 是否内网，再发请求（防 DNS 重绑定）
4. **禁止跟随重定向**，或每跳都重新校验
5. 云上用 IMDSv2 并限制元数据访问

```python
import ipaddress, socket

def is_public(host):
    ip = ipaddress.ip_address(socket.gethostbyname(host))
    return ip.is_global          # 拒绝 10./172.16./192.168./127.
```

## 二、XXE：XML 解析器读文件

**成因**：解析外部 XML 时允许外部实体。

```xml
<!-- 危险示例（仅靶场） -->
<!DOCTYPE r [<!ENTITY x SYSTEM "file:///etc/passwd">]>
<r>&x;</r>
```

**修复**：禁用 DTD 与外部实体。
