<script type="text/markdown" id="md-meditations">
马可·奥勒留是罗马皇帝，也是斯多葛派哲学家。这本书记录的不是一套思想体系，而是他写给自己的提醒——像我们今天存在备忘录里的那些话，本来不打算给任何人看。

> 一个人退到任何一个地方，都不如退入自己的心灵更为宁静和更少苦恼。
>
> —— 马可·奥勒留《沉思录》

第一遍读没什么感觉。后来有段时间工作很乱，每天被消息追着跑，再翻到这句，忽然懂了：他不是劝人避世，他是在说，**你唯一能随时回去的地方，是你自己的判断**。

## 斯多葛的两分法

整本书反复在讲一件事：把世界分成「我能控制的」和「我不能控制的」。

- 别人的看法：不能控制
- 已经发生的事：不能控制
- 我此刻做什么：能控制

> 你有力量控制自己的心灵，而不是外部事件。认识到这一点，你就会找到力量。
>
> —— 大意自译

这句话被成功学引用到烂。但放回原书，它并没有「所以你会成功」的暗示，反而是在说：**外部结果不在你手里，别把安宁押在上面**。

## 清晨那一段

书里有一段我几乎能背下来。清晨不想起床时，他这样提醒自己：

> 我这样是为了人的工作而起床吗？我生来不就是为了这个吗？
>
> —— 大意自译

不是「我要努力」，是「这是我存在的方式」。差别很大：前者靠意志，后者靠身份。靠意志的事很难长久，靠身份的事不太需要坚持。

## 我把它用在哪

去年项目最乱的时候，我给自己列过一张表：

| 焦虑的事 | 我能控制的部分 |
| --- | --- |
| 需求反复变更 | 多久同步一次、每次同步写什么 |
| 上线出事故 | 回滚流程有没有写清楚 |
| 别人怎么评价我 | 交付的东西是否经得起看 |

左边一列我一条也改不了，右边一列每一条都能动手。焦虑常常来自盯着左边使劲。

斯多葛不是让人躺平，是让人**把力气花在对的地方**。
</script>

<script type="text/markdown" id="md-to-live">
第一次读《活着》是在高铁上，三个小时读完。合上书的时候窗外正好进隧道，玻璃里映出自己的脸。

我一直以为这是一本讲苦难的书。这次重读，我觉得它讲的其实是**承受之后的继续**。

> 人是为活着本身而活着的，而不是为了活着之外的任何事物所活着。
>
> —— 余华《活着》中文版自序

这句话单拎出来很像鸡汤。放回小说里就不一样了：福贵不是想通了什么才活下来的，他是**没得选**。家珍走了，有庆走了，凤霞走了，二喜走了，苦根也走了，他还得赶着那头老牛下地。

活着在他那里不是一种选择，是一种惯性。余华把这个惯性写得极其安静。

## 那首民谣

书里反复出现一首歌谣，我每次读都会停一下：

> 少年去游荡，中年想掘藏，老年做和尚。
>
> —— 余华《活着》

福贵的一生刚好是这三句的反向播放。年轻时候他什么都想要，赌光了家产；中年他只想守住几亩地和一个家；老年他一个人，什么都不想要了。

## 月光像盐

全书我最喜欢的一句不是什么名言，是一个比喻：

> 月光照在路上，像是撒满了盐。
>
> —— 余华《活着》

有庆死的那一段，福贵背着儿子往回走。盐是撒在伤口上的东西，也是腌住食物让它不坏的东西。一个比喻同时写了疼和保存。

## 对我有什么用

我以前写东西总想「升华」——一件小事非要说出个大道理。余华提醒我，**克制比升华有力**。

他不解释福贵的感受，只写他看见什么、听见什么，剩下的交给读者。

现在写项目复盘我也这样：少写「我深刻认识到」，多写「那天下午我改到第七版，把原来的方案删了」。

具体，才可信。
</script>

<script type="text/markdown" id="md-from-the-soil">
> 从基层上看去，中国社会是乡土性的。
>
> —— 费孝通《乡土中国》开篇

这本书是费孝通 1947 年在西南联大和云南大学讲课的讲义，薄薄一本，七万多字。我读了三遍，每次都有新的地方对上号。

## 差序格局

全书最有名的概念。费孝通说，西方社会像「一捆一捆扎清楚的柴」，每个人属于哪个团体清清楚楚；中国社会像一块石头丢进水里，一圈一圈推出去。

> 我们的格局不是一捆一捆扎清楚的柴，而是好像把一块石头丢在水面上所发生的一圈圈推出去的波纹。每个人都是他社会影响所推出去的圈子的中心。
>
> —— 费孝通《乡土中国》

所以「自己人」不是一份固定名单，而是**随事而变的距离**。同一个亲戚，借钱的时候近，催债的时候远。

## 为什么熟人社会讲人情，不讲契约

乡土社会流动性低，一个人一辈子面对的是同一批人。在这种环境里，一次违约的代价是永久性的，所以不需要合同——面子比合同更管用。

> 乡土社会的信用并不是对契约的重视，而是发生于对一种行为的规矩熟悉到不假思索时的可靠性。
>
> —— 大意

现代城市的逻辑正相反：陌生人合作，必须靠契约。两套逻辑撞在一起，就有了各种拧巴。

## 一个具体的例子

过年回家，亲戚问我做什么工作。我说「前端工程师」，他们说「哦，修电脑的」。

在差序格局里，我的回答必须先落进他们熟悉的圈子，才能被理解。这不是他们的问题，是**两套坐标系没有交点**。

后来我学乖了：跟我妈说「做手机上看得到的页面」，跟表哥说「跟你店里那个收银系统差不多」。他们立刻就懂了，还顺带夸了我一句。

## 对我有什么用

做产品的时候，我越来越不信「用户会按流程图走」这种假设。真实的人按关系和习惯走。

费孝通写的是一九四几年的中国农村，但它解释的是**人如何在关系网里做决定**。这个底层逻辑，七十年没怎么变。
</script>

<script type="text/markdown" id="md-thinking-fast-and-slow">
> 生活中没有哪件事，在你想着它的时候，会像你以为的那么重要。
>
> —— 丹尼尔·卡尼曼《思考，快与慢》

卡尼曼是心理学家，拿的却是诺贝尔经济学奖。这本书讲的事情很简单：人会系统性地犯错，而且这些错误是可以预测的。

## 系统一和系统二

- **系统一**：快、自动、省力。看到 2+2 立刻知道是 4，认出熟人的脸。
- **系统二**：慢、费力、需要专注。算 17×24，填税表。

问题在于系统二很懒。大部分时间它把控制权交给系统一，只在遇到麻烦时才接管。

> 系统二处于低功率状态，只对最明显的错误进行监控。
>
> —— 大意

所以「我很理性」这句话，多半是系统一说的。

## 锚定效应

先看一个数字，再估计另一个，前者会影响后者，哪怕它们毫无关系。

书里的实验：先转一个随机轮盘，转到 10 或 65，再问「非洲国家占联合国的比例是多少」。看到 10 的人平均答 25%，看到 65 的人平均答 45%。

一个完全随机的数字，改变了他们对世界的判断。谈薪、看报价、读「原价 199，现价 99」的时候，都值得想起这件事。

## 损失厌恶

失去一百块的痛，大约要得到两百块才能抵消。

这解释了我自己的很多拖延：不是不想开始，是怕做砸。「做砸」是确定的损失，「不做」的痛苦要等到很久以后才来。

## 一个反直觉的结论

书里说：**专家直觉只在「可重复、有反馈」的环境里可靠**。下棋、消防可以；股票预测、政治判断不行。

这对我判断「该听谁的建议」很有用：一个人做了十年产品，如果他所在环境的反馈周期特别长、噪音特别大，他的直觉未必比你强多少。

## 最后

这本书读起来不轻松，因为你会不断在自己身上认出错觉。

但认出就是进步。系统一改不掉，只能靠系统二时不时检查一下——比如签字之前问一句：这个数字是谁放进我脑子里的？
</script>

<script type="text/markdown" id="md-the-stranger">
> 今天，妈妈死了。也许是在昨天，我搞不清。
>
> —— 加缪《局外人》开篇

这个开头被称为二十世纪最有名的开头之一。它出名的原因不是文笔，是**态度**：一个儿子在母亲去世当天，记不清日期。

审判默尔索的时候，检察官几乎不问他为什么开枪，反复问的是：你为什么没在葬礼上哭？

## 罪名不是杀人

默尔索犯了两个错。第一个是杀人，第二个是不肯演。

他在葬礼上喝了咖啡、抽了烟、看了风景；葬礼第二天去游泳，和女朋友看电影，还笑了。这些细节后来全部出现在法庭上。

人们不关心他为什么扣下扳机，只关心他是不是一个「正常人」。

## 荒诞是什么

加缪在《西西弗神话》里说，荒诞来自「人的呼唤」和「世界的沉默」之间的那道裂缝。

默尔索最后那一段爆发，是他第一次、也是唯一一次向世界索要回应。他喊出自己过去幸福、现在仍然幸福——不是因为他想通了，是因为他终于不再假装。

## 对我有什么用

我们每天都在表演。朋友圈要看起来过得好，周报要看起来做了很多事，面试要看起来很有热情。

默尔索的悲剧不是他不合群，是他**拒绝为不合群道歉**。

我做不到他那样，也不建议谁去学。但读完会留下一个小小的提醒：有些表演是必要的，有些只是习惯。分清楚这两者，人就轻松一点。
</script>

<script type="text/markdown" id="md-sapiens">
> 任何大规模人类合作的根基，都在于某种只存在于集体想象中的虚构故事。
>
> —— 尤瓦尔·赫拉利《人类简史》

这本书最容易被记住的是三个词：认知革命、农业革命、科学革命。但真正让我坐直的是上面这一句。

## 公司是什么

赫拉利举的例子是标致汽车。这家公司存在吗？你走进厂房，找不到「标致」这个东西，只能找到机器、工人和一堆股权文件。

标致存在，只因为**所有人都相信它存在**。这叫「互为主体的现实」——它不是谎言：谎言被戳破就失效，而它被戳破才会失效。

钱是更纯粹的例子。一张纸不能吃不能穿，但它能换面包，因为我们共同相信它值这个价。

## 农业革命是个陷阱？

书里最挑衅的观点：农业革命是「史上最大的骗局」。

> 人类以为自己驯化了小麦，其实是小麦驯化了人类。
>
> —— 大意

采集时代的人一天工作三四个小时，食物多样；农业时代的人日出而作，饮食单一，还要面对饥荒和瘟疫。

但人口增长了，于是没人能回头——更多粮食养活更多人，更多人需要更多粮食。

## 我们更快乐了吗

赫拉利没有给答案，但他提了一个很好的问题：历史学只记录朝代更替，从不记录「人的痛苦有没有减少」。

这让我想到自己做产品时常犯的错：只统计「功能上线了没有」，不统计「用户有没有因此少点麻烦」。前者是历史，后者才是生活。

## 一点警惕

这本书的宏大叙事很爽，也因此被批评「过度简化」。赫拉利自己在后记里也承认很多推论是思辨性的。

读它的正确方式不是背结论，是学那个动作：**把习以为常的东西重新问一遍「它凭什么存在」**。
</script>

<script type="text/markdown" id="md-courage-to-be-disliked">
> 一切烦恼都来自人际关系。
>
> —— 岸见一郎 / 古贺史健《被讨厌的勇气》

第一次读到，我觉得太绝对。读完才明白它锋利在哪：连「自卑」都是人际关系的产物——没有别人，你无从比较。

## 原因论 vs 目的论

弗洛伊德说：你现在的样子，是过去造成的。
阿德勒说：你现在的样子，是为了某个目的而选的。

书里的例子：一个人说自己不敢出门，因为有「脸红恐惧症」。

阿德勒的解读是：他先有了「不想出门」的目的，才需要「脸红」这个理由。不是脸红导致不出门，是不出门需要脸红。

> 不是过去的经历决定了你，而是你赋予了经历什么意义。
>
> —— 大意

这个观点很残酷，因为它取消了所有借口。但它也把主动权还给了你。

## 课题分离

判断标准只有一句：**这件事的后果由谁承担，就是谁的课题**。

- 我表白，是我的课题
- 对方接不接受，是对方的课题

> 你可以把马牵到河边，但不能强迫它喝水。
>
> —— 书中的比喻

我见过太多人（包括我自己）在别人的课题上耗尽力气：试图改变父母的看法，试图让同事喜欢自己。

## 所谓的自由

> 自由就是被别人讨厌。
>
> —— 《被讨厌的勇气》

不是「要被人讨厌」，是「不怕被人讨厌」。这两者差得很远：前者是攻击性，后者是**不再把评价权交出去**。

## 一点保留

我不完全接受目的论。有些创伤是真实的，不是「为了某个目的编出来的理由」。把一切都归因于选择，对处境糟糕的人太苛刻。

但书里有一个东西我留下了：在「过去决定我」和「我选择现在」之间，至少给自己留一个选项。
</script>

<script type="text/markdown" id="md-walden">
> 我到林中去，因为我希望谨慎地生活，只面对生活的基本事实，看看我是否学得到生活要教育我的东西，免得到了临死的时候，才发现我根本就没有生活过。
>
> —— 亨利·戴维·梭罗《瓦尔登湖》，徐迟 译

这本书 1854 年出版，卖得不好。梭罗生前大概没想到，它会成为两百年后都市人的精神安慰剂。

（顺带说一句：常被引作本书名句的「我步入丛林，因为我希望生活得有意义」，其实出自电影《死亡诗社》，不是梭罗。）

## 他算了一笔账

《经济篇》里，梭罗把盖房子的每一笔开销都列了出来：木板、旧窗、石灰、钉子……精确到几分钱。

> 我宁愿坐在南瓜上，也不愿挤在天鹅绒的垫子上。
>
> —— 大意

这不是清高，是**用算术对抗焦虑**。当你把「到底需要多少钱」算清楚，恐惧就少了一半。

## 平静的绝望

> 人类在过着静静的绝望的生活。
>
> —— 梭罗《瓦尔登湖》，徐迟 译

这句常被译成「大多数人都生活在平静的绝望中」，意思不差，但原文的语气更冷一点：不是「平静」，是「静静」——安静到连自己都没听见。

## 他不是隐士

很多人以为梭罗与世隔绝。其实他的小屋离镇子只有一英里多，他经常回去，也常有访客。

他要的不是逃开社会，是**把生活的成本降到最低，从而把时间还给自己**。

那两年里他种豆、测量、写作、接待访客，偶尔回镇上吃顿饭。独处是方法，不是目的。

## 对我有什么用

我没有去湖边盖房子的打算。但这两年我做了两件事：

一是算清楚自己每个月的最低开销；二是把「想要」和「需要」分开记账。

结果有点意外：让我焦虑的不是钱不够，是**不知道多少才够**。

梭罗给的答案很朴素——够活就行，剩下的时间用来活。
</script>

<script type="text/markdown" id="md-selfish-gene">
> 它们存在于你和我的躯体内，它们创造了我们，创造了我们的肉体和心灵，而保存它们正是我们存在的终极理由。
>
> —— 理查德·道金斯《自私的基因》结尾

这本书 1976 年出版。它最大的贡献不是「基因自私」这个说法，而是换了一个视角：**自然选择的基本单位不是个体，也不是物种，是基因**。

## 视角一换，很多东西就通了

为什么工蜂会为了蜂巢去死？从个体看是自杀；从基因看，它和蜂后共享大量基因，牺牲自己能让更多相同基因活下去。

为什么父母对子女的爱那么无条件？因为子女身上有父母一半的基因。

> 我们是生存机器，被盲目编程去保存那些叫作基因的自私分子。
>
> —— 大意

道金斯反复强调：「自私」只是个比喻，不是道德判断。基因没有意识，它只是碰巧被复制得更多。

## 模因

书里还发明了一个词：meme（模因）。文化也像基因一样复制、变异、竞争。

几十年后，这个词变成了「梗图」。道金斯大概没想到，但逻辑是一样的：能传播的，不一定是好的，只是**更容易被复制的**。

这一条对做产品、写文章都成立：传播力是一种独立的属性，它和正确性没有关系。

## 最动人的一段

全书最后一句，大意是：

> 我们在这个星球上唯一的造物主，就是我们自己。

前面写了三百页「你只是基因的机器」，最后一句却说：人类是唯一能理解这套规则的生物，因此也是唯一可能**反抗**它的生物。

我们不必听从基因的指令。这大概是科学写作里最漂亮的一次反转。

## 对我有什么用

我不再轻易说「这是人性」。很多被称为人性的东西，只是基因为了复制自己而设的默认值。

默认值可以改。前提是你先看见它。
</script>

<script type="text/markdown" id="md-one-hundred-years">
> 多年以后，面对行刑队，奥雷里亚诺·布恩迪亚上校将会回想起父亲带他去见识冰块的那个遥远的下午。
>
> —— 加西亚·马尔克斯《百年孤独》开篇

这一句被无数人模仿，包括莫言、余华、陈忠实。它到底厉害在哪？

## 一句话里的三个时间

- 「多年以后」——未来
- 「面对行刑队」——未来的某个具体场景
- 「回想起……那个遥远的下午」——过去

叙述者站在一个尚未抵达的时间点上，回望现在，又带出更早的记忆。时间被折叠了三次，而整句只用了四十来个字。

## 冰块

更妙的是那个宾语：**冰块**。

对一个还没见过冰的小镇来说，冰是奇迹。上校一生打了三十二场战争，最后记住的却是童年摸到冰的那一下。

宏大叙事被一个小小的触感击穿。这是马尔克斯惯用的手法：用最具体的东西，托住最抽象的命题。

## 一句真话，和一句假的

书里有一句我读过很多遍：

> 过去都是假的，回忆是一条没有归途的路，以往的一切春天都无法复原。
>
> —— 加西亚·马尔克斯《百年孤独》，范晔 译

顺便辟个谣。网上流传更广的是另一句：「生命中曾经有过的所有灿烂，终究都需要用寂寞来偿还。」它被印在无数文创本子上，也被安在马尔克斯头上——但原著和范晔译本里都没有这句话，是彻头彻尾的伪引文。

判断方法其实很简单：老马写句子是克制的，不押韵、不排比、不劝你。凡是一句话读起来像朋友圈文案的，多半不是他写的。

## 我在项目里试过

写需求文档的时候，我试着套用这个结构：

> 三个月后，当这个功能被第四次推翻时，我们会想起第一次评审会上那个被所有人忽略的问题。

同事说这句太文学了。但它确实让评审提前暴露了风险——那句话指向的问题，后来真的成了最大的坑。

## 一点提醒

这种句子不能多用。一本书里出现一次是神来之笔，出现十次是炫技。

写作也一样：**结构的花样救不了空洞的内容**。马尔克斯敢这么写，是因为他后面每一页都撑得住。
</script>

<script type="text/markdown" id="md-guns-germs-steel">
> 不同民族的历史遵循不同的道路前进，其原因是民族环境的差异，而不是民族自身在生物学上的差异。
>
> —— 贾雷德·戴蒙德《枪炮、病菌与钢铁》

这句话是全书论点，也是它被误读最多的地方。

## 一条推演链

戴蒙德的链条大致是：

**可驯化的动植物分布** → 农业剩余 → 人口密度 → 专业分工 → 文字、技术、国家 → 征服

关键在第一步。欧亚大陆有小麦、大麦、羊、牛、马；新几内亚只有芋头和猪；美洲有玉米但没有马。

> 粮食生产是枪炮、病菌与钢铁的终极原因。
>
> —— 大意

## 病菌那一章最狠

欧亚人征服美洲，死于刀枪的印第安人，远少于死于天花的。

病菌从哪里来？来自**人和家畜长期共处**。欧亚人养了牛、羊、猪、鸡上万年，身上带着抗体；美洲人几乎没有家畜，免疫系统一片空白。

> 人类历史上最大的人口屠杀，是病菌完成的。
>
> —— 大意

## 这不是种族主义

很多人把这本书读成「地理决定论」，甚至读成「某些民族天生不行」。这恰恰是戴蒙德反对的。

他说的是：**起跑线的差异来自环境，不来自人**。同一个族群换个大陆，结果会完全不同。

## 我做过一个很蠢的类比

写代码也有「地理」。

一个团队的代码质量，往往不取决于程序员多聪明，而取决于早期那几块地基——有没有测试、有没有 CI、命名规不规范。

地基定了，后面的人再努力也是在既定轨道上跑。所以与其抱怨「这届同事不行」，不如看看是不是「这片大陆不适合长小麦」。

现在我做新项目，第一周一定先把 lint、测试、部署流水线搭好。不是洁癖，是不想三百年后再来解释我们为什么落后。
</script>

<script type="text/markdown" id="md-republic">
> 他们从小就被锁在洞穴里，只能看见墙上的影子，并以为那就是全部的真实。
>
> —— 柏拉图《理想国》第七卷，洞穴寓言（大意）

这个寓言太有名，以至于容易滑过去。但它有几个细节值得慢慢看。

## 细节一：锁链是看不见的

柏拉图没说囚徒被铁链锁着，他说的是「被锁住脖子和腿，不能转头」。

不能转头，意味着他们甚至不知道背后有火、有通道、有人举着器物走过。

## 细节二：出去的人会疼

走出洞穴的人不是一下子就看见太阳的。他先看见影子，再看见实物，再看见夜空，最后才敢看太阳。

**认知升级是有生理成本的**。这一点常被鸡汤忽略：改变看法不是「想通」，是「疼过之后重新长出来」。

## 细节三：回去的人会被嘲笑

这是最残酷的部分。回到洞穴的人眼睛已经适应了光，在黑暗里反而看不清，于是被同伴嘲笑「出去一趟把眼睛弄坏了」。

> 他们说他上去把眼睛弄坏了，所以还是不要上去为好。
>
> —— 大意

## 今天我们的洞穴

我不认为刷短视频的人都是囚徒，也不认为读书的人都在洞外。这个二分法本身就是一种偷懒。

真正的问题是：**你还有没有能力转过头**？

- 你上一次改变一个坚持了很久的看法，是什么时候？
- 你能说出反对你观点的人，最有力的那条理由吗？
- 你的信息源里，有多少是你主动选的，多少是算法递过来的？

不必回答我。能问出来，就已经在转头了。
</script>

<script type="text/markdown" id="md-reading-40-books">
去年这个时候，我在笔记本的扉页写下一行字：**今年读 40 本书**。

写的时候挺心虚的。因为前一年我大概只读完了 6 本，剩下的二十几本都停在第三章，书签像一排小小的墓碑。

## 我以前的读法是错的

很长一段时间，我把读书当成一项必须完成的任务：从第一页开始，逐字逐句，读完才算「读过」。这套方法在学校里管用，因为教材本来就是为了被完整读完而写的。但大部分书不是。

一本 300 页的书里，真正对你有用的可能只有 30 页。剩下的部分——铺垫、举例、作者的个人经历——不是不重要，只是此刻与你无关。

> 阅读不是把书从头到尾搬运一遍，而是在书里找到能解决你当下问题的那些句子。

想通这一点之后，我给自己定了四条规则。

## 规则一：允许弃书

这是最难的一条，也是最有效的一条。

我给自己一个「50 页豁免权」：读 50 页还没有任何一处想划线，就合上，放回书架。不内疚，不记账。

一年下来我弃了 17 本。听起来很浪费，但正因为我敢弃，才敢开始。

## 规则二：一次只读三本

同时读的书不超过三本，并且必须分工明确：

| 角色 | 类型 | 时间 |
| --- | --- | --- |
| 主读 | 需要连续思考的书 | 早上 40 分钟 |
| 副读 | 轻松的非虚构 | 通勤、排队 |
| 重读 | 读过的旧书 | 睡前 15 分钟 |

主读负责推进，副读负责填补碎片时间，重读负责把好东西再吸一遍。三本之外一律排队。

## 规则三：读完立刻写 300 字

不写笔记的书，等于没读。

我的笔记格式极其简单，只有三行：

1. 这本书想解决什么问题
2. 它给出的最反直觉的答案
3. 我下周打算拿它做什么

第三条最重要。**没有行动项的知识，只是收藏品。**

## 规则四：让书出现在路上

我在三个地方各放了一本书：床头、包里、办公室抽屉。手机上的读书 App 只留了一个，且删掉了所有推送。

原理很朴素：降低开始阅读的摩擦，提高开始刷手机的摩擦。

## 这一年读到了什么

四十本里，有 6 本值得反复读：

- 《深度工作》
- 《禅与摩托车维修艺术》
- 《写作这回事》
- 《设计中的设计》
- 《人类简史》
- 《瓦尔登湖》

它们有个共同点：都不是教你「怎么做」，而是让你重新看一遍「为什么要做」。

## 明年的目标

不设数量了。改成：**每季度重读一本旧书**。

书不是用来刷新的数字，是用来反复经过的路。走得慢一点，反而记得住。
</script>

<script type="text/markdown" id="md-container-queries">
做了六年响应式，我最近才彻底换掉一种习惯：不再用媒体查询给组件加断点。

## 老办法的问题

假设有一个卡片组件，它既在侧边栏里，也在主内容区里。用媒体查询，你只能这样写：

```css
@media (min-width: 720px) {
  .card { flex-direction: row; }
}
```

问题是：这句话描述的是**屏幕**，而组件关心的是**自己**。同一个卡片放在 280px 的侧边栏里，屏幕再宽它也不该横排。

于是你开始写 `.sidebar .card`、`.main .card` 这样越来越长的选择器，组件和布局耦合在一起，复用变成奢望。

## 容器查询解决什么

容器查询把「宽度」这个概念还给组件自己：

```css
.card-wrap {
  container-type: inline-size;
  container-name: card;
}

@container card (min-width: 480px) {
  .card { flex-direction: row; }
}
```

只要 `.card-wrap` 自己够宽，卡片就变成横向；它多宽取决于父级布局，而不是浏览器窗口。组件终于可以真正地「放到哪里都成立」。

## 三个实战细节

### 一、别忘了容器类型的代价

`container-type: inline-size` 会让元素建立独立的布局上下文，它的高度不再参与父级的内在尺寸计算。在 grid 或 flex 中这通常是你要的；但在需要「内容撑高」的场景里会踩坑。

### 二、把单位换成 cqw

容器单位让内部尺寸跟着容器走：

```css
@container card (min-width: 480px) {
  .card__title { font-size: clamp(1rem, 3.2cqw, 1.6rem); }
}
```

这比 `vw` 更符合直觉：字号跟着卡片走，而不是跟着窗口走。侧边栏里的标题不会因为屏幕宽就突然变大。

### 三、用容器查询做「密度」

我最喜欢的一个用法，是让它自动切换信息密度：

```css
@container card (max-width: 320px) {
  .card__excerpt,
  .card__tags { display: none; }
}
```

不用 JS，不用 ResizeObserver，也不用给每种布局各写一套组件。

## 什么时候还是该用媒体查询

媒体查询没有过时。它擅长的是「环境」：

- 暗色模式：`prefers-color-scheme`
- 减少动效：`prefers-reduced-motion`
- 打印样式
- 极端的全局断点，比如移动端隐藏侧边栏

一句话总结：**环境用媒体查询，组件用容器查询。**

## 兼容性

截至 2026 年，所有主流浏览器都已支持容器查询，包括内联尺寸查询和常用的样式查询子集。真正需要担心的不是浏览器，而是你的设计系统有没有把「组件宽度」当成一等公民。

如果你的设计稿里，同一个组件在不同位置有不同长相，那容器查询不是可选项，是必需品。
</script>

<script type="text/markdown" id="md-whitespace">
刚做设计的时候，我有个毛病：觉得页面上空着的地方浪费了。于是塞小图标、塞说明文字、塞分割线。结果页面很满，但没人愿意看。

后来才明白，留白不是没放东西的地方，**它就是设计的一部分**。

## 层次一：间距是关系

两个元素之间的距离，直接告诉用户它们有多亲。

- 8px：同一组内的兄弟
- 16px：同一个模块的不同部分
- 32px：不同模块之间
- 64px 以上：不同章节

这套数字本身不重要，重要的是**一致**。如果 12px 和 14px 混用，用户说不出哪里别扭，但会觉得「乱」。

> 规则：距离只有三档——很近、有点远、很远。超过三档，人眼就分辨不出来了。

## 层次二：留白是节奏

好的页面有呼吸。全篇等距的间距，像一段没有标点的句子。

我的做法是给每个区块一个「密度标签」：

| 区域 | 密度 | 行高 | 段距 |
| --- | --- | --- | --- |
| 首屏 | 疏 | 1.9 | 2em |
| 正文 | 中 | 1.75 | 1.2em |
| 列表 | 密 | 1.5 | 0.5em |

首屏疏，是为了让你停下来；正文中，是为了让你读下去；列表密，是为了让你扫得快。

## 层次三：留白是态度

这一层最玄，但也最真实。

一个页面上留了大片空白，意味着作者相信内容自己会说话。反过来，如果一个页面到处都在抢注意力——弹窗、角标、红点、跑马灯——它传达的其实是焦虑。

我喜欢的站大多有个共同点：一屏只说一件事。

## 一个可执行的练习

拿你正在做的页面，把所有非内容的元素（分割线、装饰图标、说明性小字）先全部删掉，截个图。

然后把它们一个个加回来，每加一个问自己：**没有它，用户会误解吗？**

如果答案是「不会，只是没那么好看」，那就别加。

留白的最高境界，是别人根本没注意到它。
</script>

<script type="text/markdown" id="md-workflow-2026">
每年我都会重装一次自己的工作流。今年这一次改动最小，但最稳。写下来，也给未来的自己留个存档。

## 全景图

我的流程只有四步：**收集 → 澄清 → 推进 → 归档**。

听起来像 GTD，但细节更粗糙，也更适合我这种容易把系统过度设计的人。

## 一、收集：只有一个入口

所有想法、链接、待办，全部进同一个 Inbox。不是三个，不是按项目分，就是一个。

我用的工具换过很多次，从 Notion 到 Obsidian 到纯文本，但入口数量始终是一。原因很简单：**多一个入口，就多一次「这条该放哪」的决策**，而决策会消耗意志力。

现在我的 Inbox 是一个 `inbox.md` 文件，手机和电脑都能一秒打开。

## 二、澄清：每天十分钟

早上的第一件事不是干活，是把昨晚和今早堆进 Inbox 的东西过一遍。

每条只问一个问题：**它下一步是什么？**

| 情况 | 处理 |
| --- | --- |
| 两分钟能做完 | 立刻做 |
| 有明确下一步 | 变成一个具体的任务 |
| 是个想法 | 移进「笔记」，标上主题 |
| 暂时没用 | 删掉 |

「删掉」这一步最容易被跳过。但不删，Inbox 就会变成一个越堆越高的杂物间，最后你连打开它的欲望都没有。

## 三、推进：每天只推三件事

我不做长清单。每天早上从任务池里挑三件，写在纸上，做完划掉。

三件里必须有一件是「推进型」的——写一段、做一版、跑一次——而不是「响应型」的（回消息、开会、填表）。

响应型的事永远做不完，它们会自己找上门。推进型的事不会，你不主动安排，它就永远停在原地。

## 四、归档：周五下午半小时

- 完成的任务 → 归档
- 没完成的 → 重新评估，超过三周没动的直接删
- 本周的笔记 → 打标签，放进永久笔记
- 写一段 200 字的周回顾

周回顾不写情绪，只写三件事：做成了什么、卡在哪、下周最重要的一件事是什么。

## 关于工具

我现在的组合：

- 纯文本 + Git：所有笔记
- 一个极简待办 App：只有今天
- 纸质笔记本：思考和画图
- 日历：只放真正有时间的约定

工具越少，系统越可能活下来。

## 一点提醒

不要为了工作流而工作流。如果你花在维护系统上的时间超过了你真正做事的时间，那这个系统就是负债。

好的系统应该让你**忘记它的存在**。
</script>

<script type="text/markdown" id="md-blog-as-second-brain">
我用过几乎所有笔记工具。它们很好，但有一个共同的问题：写给自己看的东西，很容易变成垃圾。

不是因为懒，是因为**没有读者**。

## 公开写作的压力是好的压力

同样一个想法，写在私人笔记里你会写：

> Kafka 好像和消息队列有关，改天查查。

写在博客里，你必须先查清楚，因为你不知道谁会看到。这个「先查清楚」的动作，就是学习的发生。

## 我的三层结构

现在我的知识管理分三层。

### 第一层：碎片

每天随手记的东西。不整理，不分类，一个月后清空一次。绝大多数会消失，这很正常。

### 第二层：笔记

值得展开的想法。每条笔记是一个独立的小卡片，有自己的标题，能用一段话说清楚。标准是：**如果三个月后的我看到它，能不能直接理解？**

### 第三层：文章

当某个主题积累了四五条笔记，我就把它们缝成一篇文章，发到博客上。

这一步是整条流水线的关键。因为「缝」的过程会暴露所有逻辑漏洞——你以为想通的地方，一写就露馅。

## 博客是索引，不是仓库

我不指望博客保存所有东西。它是**索引**：告诉未来的我，这个主题我曾经想到哪一步，证据在哪，结论是什么。

具体的资料留在笔记里，博客只放结论和推理过程。

## 一个副作用

写博客这几年，我最大的收获不是读者，是**检索能力**。

因为经常要回答「我以前是不是写过这个」，我养成了给每篇文章起清晰标题、给每段起小标题的习惯。这个习惯反过来让我的笔记也变得好找了。

> 你写下的东西的价值，取决于你以后能不能找到它。

## 从今天开始

如果你想开始，不要写「我的第一篇博客」。写你最近解决的一个具体问题，哪怕只有 500 字。

具体的、小的、真实的东西，永远比宏大的开场白更有价值。
</script>

<script type="text/markdown" id="md-vite-build-optimization">
接手一个中型后台项目，`vite build` 要 12.4 秒。听起来不算灾难，但加上 CI 和部署，一次发布要等三分钟。于是我花了一个下午，只做一件事：优化构建，不动业务代码。

结果是 2.8 秒。

## 先测量，别猜

第一件事是打开构建分析：

```bash
vite build --mode production
```

然后在 `vite.config.ts` 里加上可视化：

```ts
import { visualizer } from 'rollup-plugin-visualizer'

export default defineConfig({
  plugins: [
    visualizer({ gzipSize: true, filename: 'stats.html' })
  ]
})
```

打开 `stats.html`，问题一目了然：

1. 一个 UI 组件库被整包引入，占了四成
2. 图标库每个图标都打进来了
3. 有几个只在一处用到的图表库被静态引入
4. 所有路由都同步加载

## 改动一：按需引入组件库

原来是整包引入：

```ts
import { Button, Table, Modal } from 'antd'
```

改成按需引入，配合 `unplugin-vue-components` 或 `unplugin-react-components` 自动解析。这一项把包体砍掉了 38%。

## 改动二：图标按名引入

```ts
// 之前：整包
import * as Icons from '@ant-design/icons'

// 之后：只有用到的
import { SearchOutlined } from '@ant-design/icons'
```

图标库是最容易被忽略的胖子，一个 import 就可能带进几千个 SVG。

## 改动三：重库改动态引入

图表、富文本、代码高亮这类东西，首屏根本用不到：

```ts
const Chart = defineAsyncComponent(() => import('@/components/Chart.vue'))
```

配合路由级懒加载，首屏 JS 从 1.8MB 降到 620KB。

## 改动四：给构建减负

这一条不减少产物，但显著减少构建时间。把 `build.target` 提到项目实际支持的基线：

```ts
build: {
  target: 'es2020',
  cssCodeSplit: true,
  reportCompressedSize: false
}
```

`reportCompressedSize: false` 单独就能省 1 秒多——它只是不再计算并打印 gzip 体积，CI 里根本没人看。

## 结果

| 指标 | 之前 | 之后 |
| --- | --- | --- |
| 构建时间 | 12.4s | 2.8s |
| 首屏 JS（gzip） | 1.8MB | 620KB |
| 产物文件数 | 214 | 96 |

## 学到的

优化的顺序永远是：**测量 → 找出最大的那个 → 只改它 → 再测量**。

凭直觉猜的话，我大概率会去折腾 sourcemap 和压缩插件，而它们加起来只占 8%。

先看数据，比什么都快。
</script>

<script type="text/markdown" id="md-five-afternoons">
七月，我回到长大的小城住了半个月。每天下午四点出门，走到天黑回家。没有目的地，也没有耳机。

## 第一个下午：菜市场

菜市场在河边，棚顶是铁皮的，下过雨后叮叮当当。

卖鱼的女人坐在蓝色塑料盆中间，手里一把刀，杀鱼的动作像在削一支铅笔。她问我：「要哪条？」我说随便。她说：「随便的鱼不好吃。」

最后我买了一条鲫鱼，她帮我刮了鳞，又送了两根葱。

## 第二个下午：旧书店

新华书店二楼拐角，有一家开了二十年的旧书店。老板在打瞌睡，风扇对着他吹。

书架上的书按「老板觉得」分类：武侠在一摞，言情在另一摞，中间夹着一本《拖拉机维修手册》。

我翻到一本 1998 年的《读者》，定价 2.5 元。纸已经发黄，但字很清楚。里面有一篇文章讲「如何度过一个无聊的下午」，我站着读完了。

结账时老板说：「五块。」我说书后面写着 2.5。他说：「现在物价涨了。」

## 第三个下午：河堤

河堤上种了一排樟树，树荫很密。有老人在下棋，围观的人比下棋的多。

我坐在台阶上看水。水面有油污的光，也有晚霞的光，两种光混在一起，看不出哪个更脏。

一个小孩在放风筝，风筝卡在树上了。他仰着头看了很久，然后自己走了。我本来想去帮忙，但我也不会爬树。

## 第四个下午：中学门口

学校放假了，门口只有一家文具店开着。

老板娘还记得我，说：「你以前老来买笔芯。」我说是啊。她说：「现在没人买笔芯了，都买盲盒。」

店里确实有一整面墙的盲盒，塑料小人排得整整齐齐。我买了两支笔芯，一块钱。

## 第五个下午：下雨

最后一天下雨，我没带伞，站在便利店门口等。

雨点打在遮阳棚上，声音很密。便利店的店员在整理货架，把过期的饭团挑出来，摆成一排。

雨停了，我走回家。路过菜市场，卖鱼的女人正在收摊，她冲我点了点头。

## 之后

回到城市后，我偶尔会想起那五个下午。

什么都没发生，也没想明白什么道理。但那种「时间不被使用」的感觉，我很久没有过了。

我们总在问「今天做了什么」。或许有些日子，就是用来不做什么的。
</script>

<script type="text/markdown" id="md-deep-work">
五年前第一次读《深度工作》，我记住的是方法：关手机、定时间、做记录。

这次重读，我划下的全是另一类句子——关于**为什么**。

## 书里最扎心的一句话

> 深度工作的能力正在变得越来越稀有，而与此同时，它的价值正在变得越来越高。

这句话写于 2016 年。放到 2026 年看，前半句更真了，后半句也更真了。

## 我的三个误区

### 误区一：以为忙碌等于产出

以前我觉得，只要一天到晚在处理事情，就是努力工作。但书里区分得很清楚：

- **深度工作**：在无干扰状态下进行的高认知活动，能创造新价值，且难以复制
- **浮浅工作**：不需要太多认知努力的事务性任务，容易复制

回看我的一天，深度工作的时间大概只有 90 分钟，其余全是浮浅工作。而这 90 分钟贡献了 80% 的成果。

### 误区二：以为随时能进入状态

书里提到一个概念叫「注意力残留」：当你从任务 A 切换到任务 B，一部分注意力还留在 A 上。

频繁切换的人，从来没有真正进入过任何一个任务。

所以我以前那些「边写代码边回消息」的下午，实际上两边都做得很差。

### 误区三：以为休息是浪费时间

纽波特提出：**深度工作需要像运动员一样训练和恢复**。

不是「工作到累再休息」，而是「按节奏工作，按节奏恢复」。他建议每 90 分钟休息一次，且休息时不要碰屏幕。

## 我打算做的三件事

1. 每天一个 90 分钟的无干扰块，手机放另一个房间
2. 把收件箱集中处理两次，上午 11 点、下午 4 点，其余时间关闭通知
3. 给浮浅工作定量，每天不超过 2 小时，超出就砍

## 一点质疑

书里对社交媒体的态度偏严厉，认为它们只是「任何益处法」的产物——只要有一点点好处，就合理化大量使用。

我部分同意，但不完全。对创作者来说，平台也是分发渠道，完全退出并不现实。

我的折中方案是：**把消费和创作分开**。消费限时，创作专注。

## 最后

这本书真正改变我的不是技巧，是一种视角：

注意力不是取之不尽的资源，它更像体力——用完了就没了，而且需要恢复。

怎么花它，决定了你成为什么样的人。
</script>

<script type="text/markdown" id="md-letter-to-myself">
三年前的今天，你发出了第一篇博客。浏览量 12，其中 3 个是你自己刷的。

你在结尾写：「希望以后能一直写下去。」

现在我可以回答你了：写了 87 篇，没有断更超过一个月。但过程和你想的不一样。

## 你以为的坚持，是每天都写

不是的。

我试过日更，坚持了 19 天，然后崩了。崩的那天我写了三段废话，删掉，又写，又删，最后关电脑睡觉。

真正让我写下来的，不是意志力，是**降低门槛**：

- 不要求每篇都完整
- 允许写 300 字的短记
- 允许写「没想明白」的东西

## 你以为的读者，是很多人

不是的。

三年里，平均每篇阅读量不到 100。最多的一篇有 4000 多，是被某个社区转载了；最少的一篇有 3 个。

但那 3 个人里，有一个给我写了很长的邮件，说那篇文章帮他解决了一个困扰半年的问题。

那一刻我明白了：**写作的价值不取决于读者的数量，而取决于有没有一个人真的被帮到**。

## 你以为的瓶颈，是没东西可写

不是的。

瓶颈永远是「不敢写」。怕写得浅，怕被人笑，怕观点过时。

后来我发现一个真相：你觉得浅的东西，对三个月前的自己也是新的。而三个月前的你，比陌生人更接近你的读者。

## 你以为的收获，是流量

不是的。

三年写下来，我最大的收获是：

1. **想清楚了几个问题**。写之前以为懂，写的时候才发现漏洞
2. **认识了几个人**。都是通过文章找来的，聊得很深
3. **有了一个可以回看的时间轴**。翻旧文章，能看到自己怎么变的

## 给你的三条建议

**一、别等准备好。** 第一篇永远不完美，但它必须存在，否则第二篇不会来。

**二、别追热点。** 热点会过期，你的思考不会。写你真正在意的东西。

**三、别删旧文。** 哪怕写得幼稚，那也是你走过的路。我现在最珍惜的，就是那些现在写不出来的句子。

## 最后

三年后的你，还是会在深夜打开编辑器，还是会为一个句子纠结半小时，还是会在发布后反复刷新看有没有人留言。

但你已经不焦虑了。

因为你终于知道，写东西这件事，本来就是为了自己。
</script>

<script type="text/markdown" id="md-local-first">
去年我的一个笔记服务宣布停止运营，给了 30 天导出窗口。

我导出了 2000 多条笔记，格式是一堆嵌套的 JSON，图片链接全部指向一个即将关闭的 CDN。

那次之后，我开始认真对待「本地优先」。

## 什么是本地优先

本地优先（Local-first）不等于「不用云」，而是：

- **数据的主副本在你的设备上**
- 应用在离线时完整可用
- 同步是可选的增强，不是前提
- 你随时可以把数据完整带走

对比一下：

| | 云端优先 | 本地优先 |
| --- | --- | --- |
| 断网 | 不可用 | 完整可用 |
| 数据所有权 | 平台 | 你 |
| 迁移成本 | 高 | 低 |
| 协作 | 天然支持 | 需要额外方案 |
| 冲突处理 | 服务端 | 客户端（CRDT 等） |

## 我现在的组合

### 笔记：纯文本 + Git

所有笔记是 `.md` 文件，放在一个 Git 仓库里。同步靠私有远程仓库，冲突靠手动合并——一年也就发生两三次。

好处是：任何编辑器都能打开，二十年后大概也还能。

### 照片：本地硬盘 + 异地备份

原图在主机的硬盘里，按年月分目录。备份用增量同步到一块移动硬盘，每月一次。

云相册只用来分享，不作为唯一存储。

### 密码：开源密码管理器

数据加密后放在自己的服务器上，客户端本地解密。

### 阅读：RSS

不再依赖推荐算法。订阅的源存在本地，读完的标记也存在本地。

## 代价是什么

本地优先不是免费的：

1. **要自己备份**。3-2-1 原则：3 份副本，2 种介质，1 份异地
2. **协作更难**。别人没法直接编辑你的文件
3. **要付学习成本**。Git、同步工具、加密，都有门槛

如果你只是记个购物清单，这些都不值得。但如果你有十年份的笔记、照片、代码，那控制权就很重要。

## 一个判断标准

我现在的判断很简单：**这份数据，如果明天这个服务消失了，我还能不能拿回来？**

如果答案是「不能」，那它就不该是我唯一的副本。

方便很重要，但方便的前提是，东西还是你的。
</script>


<script type="text/markdown" id="md-robot-vision">
写一个能用手柄方向键控制的小车，大概是最容易「看起来做完了」的项目。真正花了时间的，全是做完之后才冒出来的账：固件看门狗、转发回环、速度不生效、以及视觉该放在哪一层。

这篇把那些账一次算清。

## 起点：一个只有方向盘的控制台

最初的需求只有一句：能用上下左右控制一个机器人。

最小实现是零依赖的 Node 服务 + 一个单页：服务端 20Hz 步进虚拟机器人，浏览器通过 SSE 看画面，按下方向键就 `POST /api/input`，多端同时按就取方向并集。键盘 WASD、触屏长按、急停，两天就顺手了。

顺到我一直以为它已经能用——直到开始接真实硬件。

## 问题一：按住两秒，车自己停了

固件里有看门狗：**1.5 秒收不到指令就停车**。这是必要的，WiFi 断了、页面关了，车不该继续冲。

但服务端当时只在「方向变化」时发一次请求。按住不动，就没有变化——1.5 秒后，车自己停了。

修法不是把看门狗调大（那等于把安全机制废掉），而是补心跳：

```js
function syncHardware(cmd) {
  if (!hardware.enabled) return;
  const now = Date.now();
  const changed = cmd !== hardware.lastDir;
  const needBeat = cmd !== 'stop' && now - hardware.lastSentAt > 500;
  if (!changed && !needBeat) return;
  hardware.lastDir = cmd;
  hardware.lastSentAt = now;
  forwardDir(cmd);
}
```

按住「上」两秒，硬件实际收到的是这样一串：

```
/api/speed?value=60      ← 开启转发时同步当前速度
/api/move?dir=stop       ← 初始状态
/api/move?dir=up         ← 按下，立刻发
/api/move?dir=up         ← 心跳 512ms
/api/move?dir=up         ← 心跳 502ms
/api/move?dir=up         ← 心跳 504ms
/api/move?dir=stop       ← 松手，立刻停
```

八条请求，有节奏、有上界。心跳不是「多发几次保险」，它是在**同时满足两个约束**：固件的安全阈值，和控制台的低流量。

## 问题二：我把转发地址填成了自己

测转发时图省事，硬件地址填了 `http://127.0.0.1:8787`——也就是这个控制台自己。

于是它把 `/api/move` 发给自己，那个路径不存在；顺手又发了一次 `/api/speed`，而这个接口会把速度再转发一次……

四秒，一万一千九百三十二次请求。

这看起来像「测试时的蠢操作」，其实是产品缺陷：只要用户填错地址（填了控制台自己的地址、或者同一台机器上的另一个实例），服务就会自己打自己，直到把 CPU 吃满。所谓「用户不会这么填」从来不是理由。

加自环检测：

```js
function isSelfTarget(baseUrl) {
  const u = new URL(baseUrl);
  const port = u.port || (u.protocol === 'https:' ? '443' : '80');
  if (String(port) !== String(PORT)) return false;
  // 同端口 + 本机任一地址（localhost / 127.0.0.1 / 网卡 IP / ::1）
  return localAddresses.has(u.hostname);
}
```

现在填自己会被直接拒绝，并关掉转发：

> 地址指向控制台自己，会形成回环，已拒绝

顺带把速度也做成「只在数值变化时下发」——同一类问题的另一面：高频重复的写操作，本身就是 bug 温床。

## 问题三：拖速度滑杆，车没变快

速度只改了服务端的仿真参数，没往硬件发。补了 `/api/speed?value=0..100`，固件用 PWM 改占空比。

## 加转向时，先承认一个事实

差速车**不能横移**。

虚拟画面里「左右」是平移，看着直观；真车上做不到。这个差异如果不写清楚，接车的人第一反应是「坏了」。

所以加了独立的旋转通道，而不是复用左右：

- 新增 `rotateLeft / rotateRight` 输入，和 `heading`（0° 朝上，顺时针）
- 左右同时按互相抵消，符合差速车的直觉
- 画布上的车头三角按 `heading` 画，旋转时外圈加虚线提示
- 固件里 `left/right` 和 `rotate-*` 是同一个动作：左右轮反向、原地转

要真横移，得换麦克纳姆轮或全向轮——那是另一套轮系，另一篇再写。

## token：挡的不是攻击者，是「随手打开」

服务监听所有网卡，同一局域网谁打开地址都能开走这台车。于是除 `/api/health` 外全部要 token：

- 启动时生成并打印**带 token 的完整地址**
- 三种传法：`x-robot-token` 请求头、`?token=` 查询参数、页面自动带
- 比较用 `crypto.timingSafeEqual`，等长才比，避免时序泄漏
- 页面从 URL 读一次就 `history.replaceState` 抹掉，免得截图或转发时把 token 带出去
- `/api/health` 故意开放：只回存活与在线端数，不暴露任何控制能力，方便探活

它挡不住真正想看的人，但它挡住了「随手点开一个链接就能开车」这件事。这个定位要说清楚，不能让用户以为它是账号体系。

## 视觉：为什么放在浏览器里

三条理由，按重要性排：

1. **画面不出本机**。摄像头帧如果先传到服务端再回来，等于把家里实时画面上传了一遍。
2. **延迟低**。本地像素运算，从取帧到出指令是毫秒级。
3. **不引入依赖**。服务端要跑 OpenCV 或模型，就得装一堆东西；浏览器已经自带摄像头和 Canvas。

链路不长：

```
摄像头帧 → 缩到 160×120 → 逐点 RGB→HSV
        → 色相距离 ≤ 容差，且 S≥0.35、V≥0.2（滤掉灰白黑）
        → 质心 + 包围盒 → 相对画面中心的偏差（-1 ~ 1）
        → 死区 0.10 → 上/下/左/右 → POST /api/input
```

几个刻意的选择：

- **控制环 12.5Hz**（80ms 一次），不是每帧都发请求。渲染可以 60fps，控制不需要。
- **目标丢失 400ms 就松手**，宁可停住，也不要拿过期坐标继续冲。
- **采样点少于 12 个、或面积 <0.4% 当噪声**，避免把反光点当目标。
- **状态回调限频 10Hz**，rAF 每帧写 DOM 会让低端机发涩。

最值得说的是这个：**视觉没有新开接口**。它就是一个 headless 客户端在发 `/api/input`，`clientId` 是 `<页面客户端>-vision`。

好处是全部的既有机制自动复用：硬件转发、多端方向合并、看门狗、急停，一行没改。而且它和手动方向盘各占一路，方向取并集——你按住 W 的时候，视觉的指令不会把你的覆盖掉，你松手它接着接管。

## 怎么确认它是对的

视觉最容易「看着能动就算过」。所以我把算法拆成纯函数单独测：

- 三原色 RGB→HSV（红 0°、绿 120°、蓝 240°、灰饱和度为 0）
- 色相跨 0/360 的最短距离（350° 与 10° 相差 20°，不是 340°）
- 居中红块 → 质心误差 ≤2px、包围盒宽度符合
- 偏右红块 → 质心落在右半侧、上半侧
- 空画面 / 纯灰画面 → 判空（灰色饱和度低，不能算目标）
- 4×4 的小红块 → 当噪声丢掉
- 容差 10 不认橙红（色相 ~30°），容差 45 才认
- 偏差 → 指令：左偏只发左、中心不动、右下同时发右和下、无目标全松

八条全过。浏览器里剩下的只有「取帧」和「画叠加层」——这两件事出错，眼睛一看就知道，不需要测试兜底。

## 还差什么

- **摄像头只在 https 或 localhost 下可用**。手机用 `http://192.168.x.x:8787` 访问会被浏览器直接拒绝，这不是代码问题，是安全策略。要手机端视觉，得给服务配 HTTPS。
- **颜色追踪吃光照**。取色时让目标占画面十分之一以上、避开强反光；换房间换灯就得重新取色。
- **不认语义**。它知道「这块红色在右边」，不知道「这是椅子」。要认类别得换模型——好在替换点在 `detect()` 一处，后面的「偏差 → 指令」逻辑一行不用改。

写完这些，我最大的感受是：**能动的 demo 和能用的工具之间，隔着的全是这类不起眼的账**。看门狗和心跳的配合、回环的自查、token 的定位、视觉该放在哪一层——没有一个写在最初的需求里，但每一个都决定它能不能真的拿去用。
