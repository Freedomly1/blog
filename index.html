<script type="text/markdown" id="md-ai-workflow">
同一个模型，有人用它省下每天两小时，有人用了一周就放弃。差别不在提示词技巧，而在**有没有把它嵌进流程**。

一条铁律先放这里：

> **AI 产出的一切，都必须经过一个你能执行的验收动作；没有验收动作的场景，不要交给 AI。**

## 场景一：读一个陌生代码库

低效做法：「这个项目是干什么的？」——得到一段泛泛而谈。

有效流程：

```
第 1 步  我先读：README、目录树、入口文件（10 分钟，自己读）
第 2 步  让 AI 只回答我能验证的问题：
        - 列出所有对外 HTTP 路由，标注文件:行号
        - 数据从哪个函数写入数据库
第 3 步  我抽查 3 条，验证行号对不对
第 4 步  让 AI 画调用链，我再对照代码补全
```

关键在**第 2 步的问题形态**：要的是「可核对的事实」，不是「理解与评价」。行号、函数名、调用关系都能验证；「设计得好不好」不能。

```text
请只根据我给你的文件，列出所有注册路由的位置。
输出格式：METHOD PATH 文件:行号 处理函数名
不要推测，找不到就写「未找到」。
```

## 场景二：写文档 / 写周报

低效做法：「帮我写个周报」——得到的是一堆漂亮但空洞的句子。

有效流程是**先给素材，再收紧格式**：

```
素材（我这周的真实动作）：
- 修了 3 个线上 bug：登录超时、导出乱码、分页越界
- 上线缓存层，P95 从 820ms 降到 210ms
- 和产品对齐了下季度需求边界

要求：
1. 按「做了什么 / 影响 / 风险 / 下周」四段写
2. 每条不超过两行，不写「赋能」「闭环」这类词
3. 数字必须来自素材，不要新增
```

验收动作很明确：**逐个数字回查素材**，凡素材里没有的数字一律删掉。这一步能挡掉大部分幻觉。

## 场景三：复盘一个故障

这是 AI 最能帮上忙的场景，因为复盘需要「从时间线里找因果」，而人容易陷进细节。

```
输入：告警时间线（原始日志时间戳）+ 变更记录 + 监控截图描述
任务：
1. 按时间排出一张表：时刻 / 事件 / 来源
2. 标出「变更」与「指标异常」的先后关系
3. 给出两个最可能的因果假设，各自需要什么证据才能证实
4. 列出当前缺失的信息（不要猜）
```

注意第 3 步要的是**假设 + 验证路径**，不是结论。人负责验证假设，AI 负责把线梳理清楚。

## 一条流程模板（任意场景通用）

```
① 输入：把原始材料贴进来（不要口述要点，会丢信息）
② 任务：一句话说明要产出什么
③ 约束：格式、长度、禁止事项（不要编造数字/引用）
④ 验收：我自己会怎么检查这份产出
```

第 ④ 条是分水岭。写不出验收方式，说明这个任务还不该交给 AI。

## 三件不要交给 AI 的事

1. **需要承担责任的判断**（合规、财务、人事结论）——它可以给材料和建议，签字的是你
2. **你自己没读懂的东西**——你无法验收，就会照单全收
3. **涉密与个人隐私数据**——上传前先确认数据边界，脱敏优先

## 日常怎么用才不累

- **固定三个高频提示词**，存成片段：读代码、改文案、写复盘。不要每次重新想
- **一次只让它做一件事**，串联比一次性下达五个任务可靠
- **保留聊天记录的分类**：一个项目一个会话，避免上下文互相污染
- **每周花十分钟整理**：哪些产出真用上了，哪些纯属浪费时间——这比学新技巧有用

## 练习

挑一件你这周做过三次的重复劳动（写提交信息、整理会议待办、核对数据），给它写出「输入—任务—约束—验收」四段，跑一周，记录节省的时间和出错次数。

## 一句话总结

AI 不会替你负责，它只是**把你的判断放大**。流程清晰、验收明确，它放大的是效率；流程混乱，它放大的是混乱。
</script>


<script type="text/markdown" id="md-cpp-start">
很多人卡在第一步：装完编译器，不知道下一步该做什么。先把「一条链路」跑通，后面才有意义。

## 一、装什么

| 系统 | 装什么 | 验证命令 |
| --- | --- | --- |
| Windows | MinGW-w64（推荐 MSYS2）或 Visual Studio 的 C++ 工作负载 | `gcc --version` |
| macOS | `xcode-select --install` | `clang --version` |
| Linux | `sudo apt install build-essential` | `gcc --version` |

看到版本号就算成功。**编译器不是编辑器**：写代码用 VS Code / CLion / 记事本都行，编译靠 `gcc`。

## 二、第一个程序

新建 `hello.c`：

```c
#include <stdio.h>   /* 引入标准输入输出库的声明 */

int main(void) {     /* 程序入口，返回一个整数给操作系统 */
    printf("Hello, 阿飞\n");
    return 0;        /* 0 表示正常结束 */
}
```

编译并运行：

```bash
gcc hello.c -o hello     # 编译：源文件 -> 可执行文件 hello
./hello                  # 运行（Windows 下是 hello.exe，直接敲 hello）
```

输出：

```
Hello, 阿飞
```

## 三、这条命令拆开看

```
gcc    hello.c   -o hello
 ↑        ↑        ↑
编译器   源文件    输出文件名
```

一次 `gcc` 其实做了四件事：预处理 → 编译 → 汇编 → 链接。想看每一步：

```bash
gcc -E hello.c -o hello.i    # 只做预处理（展开 #include）
gcc -S hello.i -o hello.s    # 生成汇编
gcc -c hello.s -o hello.o    # 生成目标文件
gcc hello.o   -o hello       # 链接成可执行文件
```

初学阶段不必背，但知道它分四步，后面理解“编译错误”和“链接错误”的区别会轻松很多。

## 四、怎么读报错

编译器报错是有格式的，读三段就够：

```
hello.c:3:5: error: expected ';' before 'return'
   ↑      ↑ ↑    ↑                          ↑
 文件名  行 列  严重级别                    具体原因
```

- `error`：必须改，改完才能生成程序
- `warning`：能编过，但很可能是 bug（**建议加 `-Wall` 把所有警告打开**）
- 报错行号常常指向“发现问题的地方”，而不是“出错的地方”——少写一个分号，往往在下一行才报

## 五、一个能交互的小程序

```c
#include <stdio.h>

int main(void) {
    char name[32];
    int age;

    printf("你叫什么名字？");
    if (scanf("%31s", name) != 1) return 1;   /* 限制宽度，防止越界 */

    printf("你好，%s。你今年多大了？", name);
    if (scanf("%d", &age) != 1) return 1;     /* 注意：整数要取地址 */

    printf("%s，%d 岁，明年你就 %d 岁了。\n", name, age, age + 1);
    return 0;
}
```

两个关键点：
1. `scanf` 读整数、浮点数必须传**地址**（`&age`）；读字符串数组名本身就是地址，不用 `&`
2. `%31s` 里的 31 是“最多读 31 个字符”，留一位给结尾的 `\0`——不加宽度限制是缓冲区溢出的经典来源

## 六、常见起步错误

| 现象 | 原因 | 解决 |
| --- | --- | --- |
| `undefined reference to main` | 没有 `main` 或拼错 | 检查函数名与签名 |
| `'stdio.h' file not found` | 编译器没装好/环境变量没配 | 重装工具链，确认 `gcc -v` 能找到头文件 |
| 中文输出乱码（Windows） | 控制台编码与源文件不一致 | 源文件存 UTF-8，或 `chcp 65001` |
| 程序一闪就关 | 双击运行没有终端停住 | 在终端里运行，或末尾加 `getchar()` |

## 七、练习

1. 把 `hello.c` 改成打印你的名字和今天的日期
2. 用 `gcc -Wall -Wextra` 重新编译，把所有警告都改到零
3. 故意删掉一个分号，观察报错行号指向哪里

## 一句话总结

先让**编译链跑通**，再学语法。你在终端里看到自己写的字被打印出来那一刻，学习曲线才真正开始。
</script>


<script type="text/markdown" id="md-cpp-types">
变量不是“一个名字”，它是**一块有大小、有解释方式的内存**。类型决定这两件事。

## 一、sizeof：亲手量一遍

```c
#include <stdio.h>

int main(void) {
    printf("char      %zu 字节\n", sizeof(char));
    printf("short     %zu 字节\n", sizeof(short));
    printf("int       %zu 字节\n", sizeof(int));
    printf("long      %zu 字节\n", sizeof(long));
    printf("long long %zu 字节\n", sizeof(long long));
    printf("float     %zu 字节\n", sizeof(float));
    printf("double    %zu 字节\n", sizeof(double));
    printf("pointer   %zu 字节\n", sizeof(void *));
    return 0;
}
```

64 位机器上典型输出：1 / 2 / 4 / 8 / 8 / 4 / 8 / 8。

注意 `long` 在 Windows 是 4 字节、Linux 是 8 字节——**所以跨平台代码里慎用 `long`**，要确定宽度就用 `<stdint.h>` 的 `int32_t` / `int64_t`。

## 二、整数溢出：不是“变大”，是“绕回去”

```c
#include <limits.h>
int x = INT_MAX;      /* 2147483647 */
x = x + 1;            /* 有符号溢出：未定义行为，常见结果是 -2147483648 */
```

无符号则是明确的模运算：

```c
unsigned char c = 255;
c = c + 1;            /* 结果 0，模 256 */
```

两个实用结论：
1. 用 `unsigned` 做循环变量要小心 `for (unsigned i = n; i >= 0; i--)` 会死循环（无符号永远 ≥ 0）
2. 金额别用 `float`，用整数分或 `double`；`0.1 + 0.2 != 0.3` 是二进制浮点的固有特性

## 三、char 存不存得下中文

`char` 只有 1 字节，能表示 0–255。一个中文字符在 UTF-8 里占 3 字节，所以：

```c
char c = '中';        /* 编译可能通过，但只留下一个字节，后续输出必乱 */
```

字符串要按**字节序列**理解：`"中"` 是 3 个 `char` 加一个 `\0`，共 4 字节。

```c
printf("%zu\n", sizeof("中"));   /* 4 */
```

## 四、i++ 与 ++i

```c
int i = 0;
int a = i++;   /* a = 0，i 变 1：先取值，再自增 */
int b = ++i;   /* i 先变 2，b = 2 */
```

单独一行写 `i++;` 时两者没区别。差别只在“表达式里还要用这个值”时。团队代码里建议：**需要用到值时不要依赖自增顺序**，拆成两行更清楚。

## 五、类型转换的两条铁律

```c
int a = 7, b = 2;
double r = a / b;        /* 3.0，不是 3.5：先做整数除法再转 */
double ok = (double)a / b;  /* 3.5：先转再除 */
```

```c
printf("%d\n", 3.7);     /* 错：格式符与类型不匹配，输出垃圾 */
printf("%.0f\n", 3.7);   /* 对 */
```

- **整数除法会截断**，要小数必须先转浮点
- **`printf` 的格式符必须与参数类型一致**，编译器不检查（`-Wformat` 会警告，务必开）

## 六、常量与命名

```c
const double PI = 3.1415926;   /* 推荐：有类型、可调试 */
#define MAX 100                /* 宏：纯文本替换，没有类型 */

enum Color { RED, GREEN, BLUE };  /* 一组相关常量，比裸数字可读 */
```

宏没有作用域也不做类型检查，能用 `const` / `enum` 就别用 `#define`。

## 七、练习

1. 打印所有整型的最大最小值（用 `<limits.h>`），验证你机器上的宽度
2. 写 `int a = 2147483647; a++;` 并打印结果，解释你看到的数
3. 用 `printf` 输出 `1/3` 的三种写法：整数除法、`float`、`double`，比较精度

## 一句话总结

类型的两个作用：**占多大地方**、**怎么解释这串二进制**。理解了这两点，溢出、截断、精度问题都不再神秘。
</script>


<script type="text/markdown" id="md-cpp-flow">
控制流本身没有难点，难的是**边界**。把边界想清楚，代码就稳了。

## 一、if：把“区间”写对

```c
/* 需求：分数 90 以上 A，80-89 B，70-79 C，其余 D */
if (score >= 90)      grade = 'A';
else if (score >= 80) grade = 'B';   /* 不用再写 score < 90，因为上面的分支已排除 */
else if (score >= 70) grade = 'C';
else                  grade = 'D';
```

两个习惯：
1. **顺序检查**：`else if` 从上往下匹配，条件要按“从严格到宽松”排
2. **浮点不要用 `==`**：`if (fabs(a - b) < 1e-9)` 才是比较相等

```c
/* 经典坑：= 与 == */
if (x = 1) { }        /* 赋值，恒为真，编译器只给警告 */
if (1 == x) { }       /* 把常量放左边，写错就编译报错 */
```

## 二、循环：三种写法各有适用场景

```c
/* 1. 次数确定 */
for (int i = 0; i < n; i++) { sum += a[i]; }

/* 2. 条件驱动，可能一次都不执行 */
while (fgets(buf, sizeof buf, fp) != NULL) { process(buf); }

/* 3. 至少执行一次 */
do {
    show_menu();
    scanf("%d", &choice);
} while (choice != 0);
```

`for` 里三个表达式都可省略，但省略条件就是死循环：

```c
for (;;) { ... }        /* 等价 while(1)，要靠 break 退出 */
```

## 三、break / continue 的边界

```c
for (int i = 0; i < 10; i++) {
    if (i == 3) continue;   /* 跳过本次，i 仍会 ++ */
    if (i == 8) break;      /* 直接跳出整个循环 */
    printf("%d ", i);       /* 输出 0 1 2 4 5 6 7 */
}
```

嵌套循环里 `break` **只跳出最内层**。要跳两层，用标志位或 `goto`（`goto` 在“多层退出”这一种场景是可接受的）。

## 四、函数：接口先想清楚

```c
/* 计算数组平均值；n 为 0 时返回 0，避免除零 */
double average(const double *a, int n) {
    if (n <= 0) return 0.0;          /* 边界先处理，别放在最后 */
    double sum = 0.0;
    for (int i = 0; i < n; i++) sum += a[i];
    return sum / n;
}
```

三条约定：
1. `const` 修饰只读参数，表明“我不会改你的数据”
2. 参数里带长度（`n`），不要指望函数能知道数组多长（数组会退化成指针）
3. **失败要有返回值语义**：返回 `-1` / `NULL` / 设 `errno`，调用方必须检查

## 五、递归：出口写在最前面

```c
/* 阶乘 */
long fact(int n) {
    if (n <= 1) return 1;        /* 出口：必须有，且要先判断 */
    return n * fact(n - 1);
}

/* 斐波那契：朴素递归是指数级，n=40 就要等很久 */
long fib(int n) {
    if (n < 2) return n;
    return fib(n - 1) + fib(n - 2);   /* 时间复杂度 O(2^n) */
}
```

朴素 `fib` 慢的原因是**重复计算**。两种改法：

```c
/* 1. 加记忆化 */
long memo[100] = {0};
long fib2(int n) {
    if (n < 2) return n;
    if (memo[n]) return memo[n];
    return memo[n] = fib2(n - 1) + fib2(n - 2);   /* O(n) */
}

/* 2. 改迭代 */
long fib3(int n) {
    long a = 0, b = 1;
    for (int i = 0; i < n; i++) { long t = a + b; a = b; b = t; }
    return a;
}
```

递归深度也有上限：默认栈只有几 MB，递归一万层就会**栈溢出**（段错误）。深层递归改迭代。

## 六、把三个东西拼起来：一个猜数字游戏

```c
#include <stdio.h>
#include <stdlib.h>
#include <time.h>

int main(void) {
    srand((unsigned)time(NULL));
    int target = rand() % 100 + 1, guess, tries = 0;

    do {
        printf("猜一个 1-100 的数：");
        if (scanf("%d", &guess) != 1) return 1;
        tries++;
        if (guess < target)      puts("小了");
        else if (guess > target) puts("大了");
    } while (guess != target);

    printf("对了，用了 %d 次。\n", tries);
    return 0;
}
```

## 七、练习

1. 把猜数字改成“最多 7 次”，超时输出答案
2. 写 `int max_of(const int *a, int n)`，用 `-Wall` 确保零警告
3. 用递归和迭代各写一遍“反转字符串”，比较代码长度与可读性

## 一句话总结

控制流的可靠来自**边界明确**：if 想清区间、循环想清终止、递归先写出口。这三点做到了，逻辑题基本不会写出 bug。
</script>


<script type="text/markdown" id="md-cpp-stl">
到了能写指针、能分文件的阶段，下一个台阶就是 STL。它的价值不是“少写代码”，而是**把容易出错的手工操作变成有约束的类型**。

## 一、三大件

| 组件 | 作用 | 例子 |
| --- | --- | --- |
| 容器 | 存数据 | `vector` `map` `set` `deque` |
| 迭代器 | 统一的遍历接口 | `begin()` `end()` |
| 算法 | 对区间做操作 | `sort` `find` `accumulate` |

算法不认识容器，只认识迭代器区间 `[first, last)`——这是 STL 能用少数算法覆盖所有容器的原因。

## 二、vector：默认就用它

```cpp
#include <vector>
#include <algorithm>
#include <numeric>

std::vector<int> v{5, 2, 9, 1};

v.push_back(7);                       // 尾部追加，均摊 O(1)
std::sort(v.begin(), v.end());        // 1 2 5 7 9
auto it = std::find(v.begin(), v.end(), 7);
int sum = std::accumulate(v.begin(), v.end(), 0);

for (int x : v) std::cout << x << ' ';   // 范围 for，最常用
```

`vector` 的三个要点：
- 连续内存，`&v[0]` 可以当 C 数组传给老接口
- 扩容会让**所有迭代器和指针失效**（容量按倍数增长）
- 提前 `v.reserve(1000)` 能避免多次扩容拷贝

## 三、map 与 unordered_map

```cpp
#include <map>
#include <unordered_map>

std::map<std::string, int> ordered;        // 红黑树：有序，O(log n)
std::unordered_map<std::string, int> hash; // 哈希表：无序，平均 O(1)
```

选择标准很朴素：**要按 key 排序就 `map`，只查不排序就 `unordered_map`**。

```cpp
for (const auto &kv : ordered)         // kv.first 是 key，kv.second 是 value
    std::cout << kv.first << "=" << kv.second << '\n';
```

注意 `m[key]` 在 key 不存在时会**插入一个默认值**。只想查不改，用 `find` 或 `contains`（C++20）：

```cpp
if (auto it = hash.find("kobe"); it != hash.end()) use(it->second);
```

## 四、模板：为什么写在头文件里

```cpp
template <typename T>
T max_of(const std::vector<T> &xs) {
    T best = xs[0];
    for (const auto &x : xs) if (x > best) best = x;
    return best;
}

max_of<int>({1, 2, 3});        // T = int
max_of<double>({1.5, 2.5});    // T = double
```

模板不是“运行时通用的函数”，而是**编译器按需生成多份代码**。生成发生在使用处，所以必须让编译器在使用时看到完整定义——这就是“模板实现要放头文件”的真实原因（不是规定，是机制）。

## 五、五个常见误用

**1. 边遍历边删**

```cpp
// 错：it 失效，行为未定义
for (auto it = v.begin(); it != v.end(); ++it)
    if (*it < 0) v.erase(it);

// 对：erase 返回下一个有效迭代器
for (auto it = v.begin(); it != v.end(); )
    it = (*it < 0) ? v.erase(it) : it + 1;
```

**2. 在循环里反复 `push_back` 不用 `reserve`**：容量反复翻倍，拷贝开销大。

**3. 用 `[]` 访问不存在的 key**：会静默插入，逻辑错还看不出来。

**4. `vector<bool>`**：这是特化版本，不是真正的 `bool` 数组，取地址会出问题。需要位图用 `std::bitset` 或 `vector<char>`。

**5. 拿 `size()` 和 `int` 比较**：`size()` 返回无符号，`v.size() - 1` 在空容器上会变成极大值。

```cpp
for (int i = 0; i < (int)v.size(); i++)   // 显式转换，避免符号问题
```

## 六、算法比手写循环更清楚

```cpp
#include <algorithm>

std::sort(v.begin(), v.end(), [](int a, int b) { return a > b; });  // 降序
auto n = std::count_if(v.begin(), v.end(), [](int x) { return x % 2 == 0; });
bool any = std::any_of(v.begin(), v.end(), [](int x) { return x > 100; });
v.erase(std::remove_if(v.begin(), v.end(), [](int x) { return x < 0; }), v.end());
```

最后一行是经典的 **erase-remove 惯用法**：`remove_if` 只把要保留的元素挪到前面并返回新逻辑结尾，真正的删除要 `erase`。

## 七、练习

1. 读入 20 个整数，用 `vector` 去重（`sort` + `unique`）后输出
2. 统计一段文本里每个单词出现的次数，分别用 `map` 和 `unordered_map` 实现，比较输出顺序
3. 写一个 `template<typename T> void print_all(const std::vector<T>&)`，验证能打印 `int`、`double`、`std::string`

## 一句话总结

STL 的意义是**把内存管理交给类型系统**：你描述“要什么”，它负责“怎么放”。学会它，C++ 才从“危险的 C”变成“能写大项目的语言”。
</script>


<script type="text/markdown" id="md-py-start">
Python 的优势是“写完就能跑”，但前置的三件事必须清楚：解释器版本、包管理、报错阅读。

## 一、装什么

| 系统 | 建议 | 验证 |
| --- | --- | --- |
| Windows | 官网安装包（勾选 Add to PATH） | `python --version` |
| macOS | `brew install python` | `python3 --version` |
| Linux | `sudo apt install python3 python3-pip` | `python3 --version` |

**版本建议 3.10+**（能用到 `match`、更好的类型提示）。看到 `Python 3.x.x` 就算成功。

一个常见混淆：

```
python  → 可能是 Python 2（老系统）
python3 → 明确是 Python 3
```

统一用 `python3` 更保险。

## 二、第一个脚本

新建 `hello.py`：

```python
name = "阿飞"
print(f"你好，{name}")
print("今天是", 2026, "年")
```

运行：

```bash
python3 hello.py
```

```
你好，阿飞
今天是 2026 年
```

`f"..."` 是 f-string，`{}` 里可以直接写变量或表达式：

```python
price, qty = 19.9, 3
print(f"合计 {price * qty:.2f} 元")   # :.2f 表示保留两位小数
```

## 三、交互式环境：验证想法最快

```bash
python3          # 进入 REPL
>>> 1 + 1
2
>>> exit()
```

不确定某个函数怎么用的时候，REPL 比新建文件快得多：

```python
>>> help(str.split)
>>> "a,b,c".split(",")
['a', 'b', 'c']
```

## 四、包管理：pip 与虚拟环境

```bash
python3 -m venv .venv          # 建虚拟环境（每个项目一个）
source .venv/bin/activate      # Windows: .venv\Scripts\activate
pip install requests           # 装包
pip freeze > requirements.txt  # 记录依赖
pip install -r requirements.txt
```

**为什么一定要用虚拟环境**：不同项目依赖不同版本，装在全局会互相打架。这个习惯从第一天就养成。

## 五、读懂报错（这是最重要的技能）

```
Traceback (most recent call last):
  File "hello.py", line 3, in <module>
    print(name)
NameError: name 'name' is not defined
```

从下往上读：
1. **最后一行**是错误类型与原因：`NameError: name 'name' is not defined`
2. **往上一行**是出错位置：`hello.py` 第 3 行
3. 中间是调用栈（简单脚本可以忽略）

四个新手最常遇到的错误：

| 错误 | 典型原因 |
| --- | --- |
| `NameError` | 变量名拼错 / 用了未定义的变量 |
| `IndentationError` | 缩进不一致（Tab 与空格混用） |
| `TypeError` | 类型不匹配，如 `"1" + 1` |
| `KeyError` | 字典里没有这个 key |

## 六、一个小而完整的脚本

读完一个文本文件，统计每个词出现的次数，输出前 5：

```python
from collections import Counter
from pathlib import Path

def top_words(path, n=5):
    text = Path(path).read_text(encoding="utf-8")
    words = text.replace("，", " ").replace("。", " ").split()
    return Counter(words).most_common(n)

if __name__ == "__main__":
    for word, count in top_words("input.txt"):
        print(f"{word}: {count}")
```

三个值得记住的点：
- `Path.read_text(encoding="utf-8")` 比 `open()` 省事，中文不会乱码
- `Counter` 一行完成计数
- `if __name__ == "__main__":` 让这个文件既能被导入、也能直接运行

## 七、练习

1. 让脚本接收命令行参数（`sys.argv` 或 `argparse`），文件名从命令行传
2. 故意制造一次 `KeyError`，练习从 Traceback 定位到行
3. 建一个虚拟环境，装 `requests`，写三行代码请求一个网页并打印状态码

## 一句话总结

Python 没有编译步骤，所以**报错就是你的编译器**。学会读 Traceback，学习速度会快好几倍。
</script>


<script type="text/markdown" id="md-py-types">
Python 里没有“声明类型”这一步，但每个值都有类型，且类型决定了它能做什么。

## 一、五种常用容器，一句话区分

| 类型 | 有序 | 可变 | 重复 | 典型用途 |
| --- | --- | --- | --- | --- |
| `str` | 是 | 否 | 允许 | 文本 |
| `list` | 是 | 是 | 允许 | 一组有序数据 |
| `tuple` | 是 | 否 | 允许 | 不可变的记录（坐标、返回多值） |
| `dict` | 是（3.7+） | 是 | key 唯一 | 键值映射 |
| `set` | 否 | 是 | 不允许 | 去重、集合运算 |

## 二、字符串：最常用的 8 个操作

```python
s = "  Hello, Python  "

s.strip()                 # 'Hello, Python'   去首尾空白
s.lower()                 # 转小写
s.replace("Python", "世界")  # 替换
",".join(["a", "b"])      # 'a,b'  用分隔符拼接
"a,b,c".split(",")        # ['a', 'b', 'c']
s.startswith("  He")      # True
f"{3.14159:.2f}"          # '3.14'  格式化
"abc".upper().center(9, "-")  # '---ABC---'
```

**字符串不可变**：所有“修改”都返回新字符串。

```python
s = "abc"
s[0] = "A"       # TypeError: 'str' object does not support item assignment
s = "A" + s[1:]  # 正确写法
```

## 三、列表：增删改查

```python
xs = [3, 1, 2]

xs.append(4)        # 尾部加
xs.insert(0, 9)     # 头部插（O(n)，大列表避免）
xs.extend([5, 6])   # 合并另一个列表
xs.remove(1)        # 删除第一个值 1（按值）
xs.pop()            # 弹出末尾（按位置）
xs.sort()           # 原地排序
sorted(xs, reverse=True)   # 返回新列表

xs[1:3]             # 切片，左闭右开
xs[::-1]            # 反转
[x * 2 for x in xs if x > 2]   # 列表推导式
```

## 四、字典：查表与迭代

```python
user = {"name": "阿飞", "age": 18}

user["name"]              # '阿飞'
user.get("email", "-")    # '-'  不存在时给默认值，不抛异常
user["email"] = "a@b.c"   # 新增
user.keys(); user.values(); user.items()

for k, v in user.items():
    print(k, v)
```

**用 `get` 还是 `[]`**：确定 key 存在用 `[]`（出错能暴露问题），不确定用 `get`。

## 五、set：去重与集合运算

```python
a, b = {1, 2, 3}, {3, 4}

a | b    # 并集 {1,2,3,4}
a & b    # 交集 {3}
a - b    # 差集 {1,2}

list(set([1, 2, 2, 3]))   # 去重（注意：不保证顺序）
```

## 六、可变与不可变：一个必踩的坑

```python
def add_item(x, items=[]):      # 错：默认参数只创建一次
    items.append(x)
    return items

add_item(1)   # [1]
add_item(2)   # [1, 2]  ← 期望是 [2]
```

正确写法：

```python
def add_item(x, items=None):
    if items is None:
        items = []
    items.append(x)
    return items
```

同理：

```python
a = [1, 2]
b = a          # 同一个对象，改 b 会影响 a
c = a.copy()   # 浅拷贝，改 c 不影响 a
```

## 七、怎么选：三问

1. **要不要按 key 取值？** 要 → `dict`
2. **要不要去重 / 做集合运算？** 要 → `set`
3. **顺序重要吗？** 重要 → `list`；不需要修改 → `tuple`

## 八、练习

1. 统计一段文本里每个字出现的次数，输出前 10（用 `dict` 或 `Counter`）
2. 有两个列表，求“都在里面”和“只在前者”的元素（用 `set`）
3. 写一个函数 `merge(a, b)` 合并两个字典，重复 key 以后者为准（试试 `{**a, **b}`）

## 一句话总结

容器选择靠三个问题：**按键取值、要不要去重、顺序要紧吗**。选对了，代码短一半；选错了，性能和可读性都受损。
</script>


<script type="text/markdown" id="md-py-flow-module">
能跑的脚本和能复用的代码，差在**结构**。这篇把控制流、函数、模块三件事串起来。

## 一、控制流：Python 的写法习惯

```python
if score >= 90:
    grade = "A"
elif score >= 80:      # 不用再写 score < 90
    grade = "B"
else:
    grade = "D"
```

Python 用**缩进表示代码块**，同一块必须一致（推荐 4 个空格，别和 Tab 混用）。

```python
for i in range(5):          # 0..4
    print(i)

for i, ch in enumerate("abc"):   # 同时拿下标和值
    print(i, ch)

for a, b in zip([1, 2], ["x", "y"]):   # 并行遍历
    print(a, b)

while queue:
    task = queue.pop()
    handle(task)
```

三个辅助语句：

```python
for x in xs:
    if x < 0:
        continue     # 跳过本次
    if x > 100:
        break        # 结束循环
else:
    print("循环正常跑完才会执行（没被 break）")   # for-else 很好用
```

## 二、函数：五种参数形态

```python
def f(a, b=2, *args, c=3, **kwargs):
    # a      位置参数
    # b      默认参数
    # args   额外位置参数，收成 tuple
    # c      仅关键字参数
    # kwargs 额外关键字参数，收成 dict
    return a, b, args, c, kwargs

f(1)                          # (1, 2, (), 3, {})
f(1, 5, 7, 8, c=9, d=10)      # (1, 5, (7, 8), 9, {'d': 10})
```

**默认参数别用可变对象**（`[]`、`{}`），它们只在定义时创建一次：

```python
def bad(x, acc=[]):        # 错
    acc.append(x); return acc

def good(x, acc=None):     # 对
    acc = [] if acc is None else acc
    acc.append(x); return acc
```

## 三、返回值：多值返回其实是 tuple

```python
def divide(a, b):
    if b == 0:
        return None, "除数不能为 0"
    return a / b, None

value, err = divide(6, 3)
if err:
    print(err)
```

比抛异常轻，但**别用来吞错误**——真的异常情况还是 `raise`。

## 四、作用域：LEGB

```
Local → Enclosing → Global → Builtin
```

```python
count = 0

def inc():
    global count      # 想改全局变量必须声明
    count += 1

def outer():
    n = 0
    def inner():
        nonlocal n    # 改外层函数变量
        n += 1
    inner()
    return n
```

不需要修改时，读全局变量不用声明。**能不用 `global` 就不用**——它让数据流向变难追踪。

## 五、模块与包：从脚本到工程

```
project/
├─ main.py
├─ utils/
│  ├─ __init__.py
│  ├─ text.py
│  └─ net.py
└─ requirements.txt
```

```python
# utils/text.py
def clean(s: str) -> str:
    return s.strip().lower()

# main.py
from utils.text import clean          # 绝对导入，推荐
print(clean("  Hello  "))
```

三个要点：
1. 目录里有 `__init__.py`（3.3+ 可以没有，但显式建更清楚）
2. **用绝对导入**，相对导入（`from .text import`）只在包内部好用，跑脚本时容易报错
3. 每个模块只做一件事，别写 `utils.py` 什么都往里塞

## 六、让文件既能导入又能运行

```python
# utils/text.py
def clean(s):
    return s.strip().lower()

if __name__ == "__main__":
    # 只有直接 python text.py 时才执行，被 import 时不执行
    print(clean("  Test  "))
```

这个小节是**工程化的起点**：函数可被复用，测试代码留在文件里不干扰调用方。

## 七、练习

1. 把上一篇的词频脚本拆成 `utils/text.py`（纯函数）+ `main.py`（命令行入口）
2. 写一个 `retry(fn, times=3)` 函数，失败重试，用到 `*args, **kwargs` 透传
3. 用 `for...else` 实现“在列表里找第一个偶数，找不到就打印提示”

## 一句话总结

函数让逻辑可复用，模块让代码可组合。**先写函数，再拆模块**，工程结构是长出来的，不是一开始就设计好的。
</script>


<script type="text/markdown" id="md-py-oop">
到了要写几百行的阶段，函数会开始互相传一堆参数。类解决的就是这个问题：**把相关的数据和行为放在一起**。

## 一、一个够用的类

```python
class Article:
    # 一篇文章：标题、正文、标签

    site = "阿飞观察站"        # 类属性：所有实例共享

    def __init__(self, title: str, body: str, tags=None):
        self.title = title                      # 实例属性
        self.body = body
        self.tags = list(tags or [])

    def words(self) -> int:
        return len(self.body)

    def summary(self, n: int = 40) -> str:
        text = self.body.replace("\n", " ")
        return text[:n] + ("…" if len(text) > n else "")

    def __repr__(self) -> str:                  # 打印时好看
        return f"<Article {self.title!r} {self.words()} 字>"


a = Article("科比与凌晨四点", "他每天四点起床训练……", ["人物"])
print(a, a.summary())
```

四个必备成员：`__init__`（初始化）、普通方法、`__repr__`（调试友好）、类属性（共享常量）。

## 二、继承与组合：优先组合

```python
class Draft(Article):                 # 继承：is-a
    def __init__(self, title, body, tags=None):
        super().__init__(title, body, tags)
        self.published = False

    def publish(self):
        self.published = True

class Site:                           # 组合：has-a，更常用
    def __init__(self):
        self.articles = []            # 站点“有”文章

    def add(self, article):
        self.articles.append(article)
```

判断标准：**“是”用继承，“有”用组合**。滥用继承会让改动一层层传下去，组合更容易替换。

## 三、dataclass：只装数据的类

```python
from dataclasses import dataclass, field

@dataclass
class Point:
    x: float
    y: float = 0.0
    tags: list = field(default_factory=list)   # 可变默认值要这样写
```

`@dataclass` 自动生成 `__init__`、`__repr__`、`__eq__`，省掉一堆样板代码。

## 四、异常：三种用法

**1. 捕获：只捕你能处理的**

```python
try:
    n = int(input("数字："))
except ValueError:
    print("不是合法数字")
else:
    print("输入了", n)      # 没异常才执行
finally:
    print("无论如何都执行")
```

**2. 抛出：把问题交给上层**

```python
def load(path):
    if not path.exists():
        raise FileNotFoundError(f"找不到文件：{path}")
    return path.read_text(encoding="utf-8")
```

**3. 自定义：让调用方能区分错误**

```python
class ConfigError(Exception):
    pass

def parse(cfg):
    if "port" not in cfg:
        raise ConfigError("缺少 port 字段")
```

三个反模式：
- `except Exception: pass` —— 静默吞掉一切，bug 从此消失（其实是藏起来）
- 用 `try/except` 代替 `if` 判空 —— 可读性差
- 捕获后不记录 —— 出问题无从排查

## 五、文件与 JSON：安全的读写

```python
from pathlib import Path
import json

p = Path("data/articles.json")

# 读
if p.exists():
    data = json.loads(p.read_text(encoding="utf-8"))

# 写：先写临时文件再替换，避免写到一半崩溃留个坏文件
tmp = p.with_suffix(".tmp")
tmp.write_text(json.dumps(data, ensure_ascii=False, indent=2), encoding="utf-8")
tmp.replace(p)
```

两个细节：
- `ensure_ascii=False` 让中文不被转成 `\uXXXX`
- `tmp.replace(p)` 是原子操作，比直接覆盖安全

## 六、上下文管理器：with 帮你收尾

```python
with open("a.txt", "w", encoding="utf-8") as f:
    f.write("hello")
# 离开 with 自动 close，即使中途抛异常
```

自己写一个也不难：

```python
from contextlib import contextmanager

@contextmanager
def timer(label):
    import time
    t0 = time.perf_counter()
    yield
    print(f"{label} 用时 {time.perf_counter() - t0:.3f}s")

with timer("解析"):
    do_something()
```

## 七、练习

1. 用 `@dataclass` 定义 `Article`，加 `words` 与 `summary` 方法
2. 写一个 `load_articles(path)`，文件不存在抛 `FileNotFoundError`，JSON 坏了抛 `ValueError`
3. 用 `contextmanager` 写一个 `chdir(path)`，进入目录后自动切回

## 一句话总结

类的价值是**把散落的参数收进一个概念里**；异常的价值是**让错误有明确出口**；文件操作的价值是**出问题时不留半成品**。这三件事做好，Python 代码才开始“可维护”。
</script>


<script type="text/markdown" id="md-sec-start">
很多同学入门安全的方式是下载一堆工具，见洞就扫。这样能出结果，但**说不清为什么**。真正的起点是判断框架。

## 一、CIA 三元组：保护的到底是什么

| 维度 | 含义 | 被破坏的例子 |
| --- | --- | --- |
| 机密性 Confidentiality | 只有该看的人能看 | 数据库被拖库、配置泄露 AK |
| 完整性 Integrity | 数据只能被合法方式修改 | 订单金额被改成 0.01 |
| 可用性 Availability | 该用的时候能用 | DDoS 打挂登录接口 |

任何漏洞，最终都能落到这三条之一（或组合）。判断一个风险值不值得修，也先问：它破坏哪一条、影响面多大。

## 二、威胁建模：四个问题

1. **我们在保护什么？**（资产：用户数据、支付能力、后台权限）
2. **谁想动它？**（对手：脚本小子、黑产、内部人员、APT）
3. **他会从哪进来？**（入口：表单、上传、第三方回调、运维通道）
4. **进来了能干什么？**（影响：读数据、改数据、横向到内网）

把四个问题写成一张表，比任何扫描报告都更能指导加固顺序。

```
资产            对手        入口              影响
用户手机号      黑产爬虫    /api/user/list    批量泄露 → 撞库
后台管理员      内部/外包   VPN + 弱口令     全站数据可改
支付回调        外部        签名校验缺失      0 元下单
```

## 三、攻击面：比漏洞更重要的概念

攻击面 = 所有「能被外部输入影响」的地方。它包括：

- **网络层**：暴露的端口、老版本中间件、管理后台是否公网可达
- **应用层**：所有接收参数的接口、文件上传、URL 跳转、模板渲染
- **身份层**：登录、找回密码、Token 生命周期、越权校验
- **供应链**：第三方 JS、npm 依赖、CI 构建脚本
- **人**：钓鱼邮件、弱口令、U 盘

**减少攻击面往往比修漏洞更有效**：把测试环境、管理后台、调试接口从公网收回去，能一次性消掉一大片风险。

## 四、常见攻击分类（知道名字就够入门）

| 类别 | 代表 | 一句话 |
| --- | --- | --- |
| 注入 | SQL 注入、命令注入 | 把用户输入当代码执行 |
| 跨站 | XSS、CSRF | 借用户的浏览器做事 |
| 越权 | 水平/垂直越权 | 能操作不属于自己的对象 |
| 文件 | 上传、包含、反序列化 | 让服务器执行我的文件/对象 |
| 认证 | 爆破、会话固定、JWT 伪造 | 拿到本不该有的身份 |
| 网络 | 中间人、DNS 劫持、DDoS | 在链路上做手脚 |
| 社会工程 | 钓鱼、冒充 | 攻人比攻系统便宜 |

## 五、一条能走通的学习路线

**大一大二：打地基**

- 计算机网络（TCP/IP、HTTP、DNS）、操作系统、数据结构
- 一门能写工具的脚本语言（Python 优先）
- 熟悉 Linux 命令行、会看日志

**大二大三：进靶场**

- 装好虚拟机环境：Kali + 靶机（DVWA、sqli-labs、VulnHub）
- 按 OWASP Top 10 逐个复现「成因 → 利用 → 修复」
- 学 Burp Suite 抓包改包，学 nmap 做资产探测
- 打 CTF 的 Web 与 Misc 方向，练的是「快速定位」的能力

**大三之后：选方向**

| 方向 | 核心能力 | 入门抓手 |
| --- | --- | --- |
| Web 渗透 | 漏洞原理与利用链 | 靶场 + SRC 挖洞 |
| 安全研发 | 写检测/防护系统 | WAF、扫描器源码 |
| 代码审计 | 读代码找危险点 | 开源项目审计 |
| 蓝队/应急 | 日志分析与溯源 | ATT&CK + SIEM |
| 密码学/协议 | 数学与协议设计 | TLS、国密标准 |

## 六、一条必须刻在脑子里的边界

**只对自己拥有或获得书面授权的系统做测试。**

《网络安全法》《刑法》285/286 条对「非法侵入」「非法获取数据」有明确规定，「我只是试试」不构成免责。练习一律在靶场、CTF 平台、自建环境里做；对真实目标，必须有授权书并约定测试范围与时间窗。

## 七、练习

1. 给你常用的一个网站画攻击面清单（只做观察，不发请求）
2. 用 DVWA 搭起环境，把 SQL 注入的「成因 → 利用 → 修复代码」写成一篇笔记
3. 给自己定一个学期目标：例如「完成 30 道 Web 题 + 读 2 本专著 + 写 1 个检测脚本」

## 一句话总结

安全是**在约束下做权衡**：没有绝对安全，只有「把风险降到可接受」。先建立框架，工具只是执行手段。
</script>


<script type="text/markdown" id="md-sec-web-basics">
Web 安全的大部分问题，源于同一个结构性事实：**浏览器会执行服务器返回的内容，而内容里混进了用户输入**。

## 一、先把 HTTP 看明白

一次请求的关键要素：

```
POST /api/login HTTP/1.1
Host: example.com
Cookie: session=abc123
Content-Type: application/json

{"user":"afei","pass":"******"}
```

安全相关的四个位置：

| 位置 | 风险 |
| --- | --- |
| URL / Query | 被日志、Referer、分享链接泄露 |
| Header | 伪造 `X-Forwarded-For` 绕过 IP 限制 |
| Cookie | 未设 HttpOnly 时能被 JS 读取 |
| Body | 注入类漏洞的主战场 |

## 二、Cookie 的三个安全属性

```
Set-Cookie: session=abc123; HttpOnly; Secure; SameSite=Lax; Path=/
```

- **HttpOnly**：JS 读不到，XSS 偷不走会话
- **Secure**：只走 HTTPS，防明文嗅探
- **SameSite**：`Lax` 挡掉大部分跨站请求伪造；`Strict` 更严但影响跳转体验

这三个属性能挡掉一大票「低门槛」攻击，成本却几乎为零。

## 三、同源策略：浏览器的底线

同源 = 协议 + 域名 + 端口 三者完全一致。

- `https://a.com` 与 `http://a.com` 不同源（协议不同）
- `https://a.com` 与 `https://a.com:8443` 不同源（端口不同）

同源策略限制的是**读取**：`a.com` 的 JS 不能读 `b.com` 的响应内容。但它**不限制发送请求**——这正是 CSRF 能成立的原因。

CORS 是服务器主动放宽：

```
Access-Control-Allow-Origin: https://a.com
Access-Control-Allow-Credentials: true
```

**最常见的错误配置**是 `Allow-Origin: *` 搭配 `Allow-Credentials: true`（浏览器会拒绝），或者把 Origin 原样反射回去——后者等于取消同源保护。

## 四、SQL 注入：把输入当代码

**成因**：字符串拼接。

```python
# 危险：输入 ' OR '1'='1 就能改变语义
sql = "SELECT * FROM users WHERE name = '" + name + "'"
```

**修复**：参数化查询（预编译），把「代码」和「数据」彻底分开。

```python
cur.execute("SELECT * FROM users WHERE name = %s", (name,))   # 正确
```

补充防线：

- 最小权限的数据库账号（Web 账号不该有 `DROP` 权限）
- 报错信息不回显给前端
- 输入校验是**辅助**，不是替代品

在 sqli-labs 的 Less-1 里能直观看到：加一个单引号，页面就报语法错误——这是存在注入的第一信号。

## 五、XSS：把脚本注入页面

三类，区别只在「脚本从哪进、存在哪」：

| 类型 | 位置 | 特点 |
| --- | --- | --- |
| 反射型 | URL 参数 → 页面 | 需要诱导点击 |
| 存储型 | 数据库 → 页面 | 一次注入，所有访问者中招 |
| DOM 型 | 前端 JS 直接写入 | 服务端日志里看不到 payload |

**成因**：把用户输入当 HTML 插入。

```js
el.innerHTML = userInput;        // 危险
el.textContent = userInput;      // 安全：当纯文本
```

**修复三原则**：
1. **按上下文转义**：HTML 转义 `& < > " '`，属性、JS、URL 各有各的规则
2. **能用文本就不用 HTML**：优先 `textContent`
3. **CSP 兜底**：`Content-Security-Policy: default-src 'self'`，即使漏了转义也能挡住内联脚本

## 六、CSRF：借你的身份发请求

**成因**：浏览器会自动带上目标站点的 Cookie，而攻击页面能让浏览器「顺手」发一个请求。

典型场景：用户登录了银行，访问了恶意页面，页面里有一个自动提交的表单，向银行发「转账」请求。

**修复**：
1. **CSRF Token**：表单带一次性随机值，服务端校验
2. **SameSite Cookie**：`Lax` 能挡住跨站 POST
3. **校验 Origin / Referer**：只接受自家来源
4. **敏感操作二次确认**：转账、改密要求重新输入密码

## 七、复现环境怎么搭

```bash
docker run -d -p 8081:80 vulnerables/web-dvwa     # DVWA
docker run -d -p 8082:80 acgpiano/sqli-labs       # sqli-labs
```

默认账号 `admin / password`，把安全等级调到 Low，逐关复现：

1. 先用正常输入确认功能
2. 加单引号/特殊字符，看报错与行为变化
3. 判断是「拼接」还是「过滤不严」
4. 写修复代码，再回来验证打不通

**只在本地靶场做这一步。**

## 八、练习

1. 在 DVWA 里完成 SQL 注入（Low → High），记录每级过滤了什么、怎么绕过、怎么修
2. 写一个带 CSRF Token 的登录+转账 demo，用攻击页面验证防护有效
3. 给你自己的页面加上 `CSP` 与 `SameSite=Lax`，用浏览器控制台观察变化

## 一句话总结

Web 漏洞的本质是**信任错了边界**：把输入当代码、把请求当本人、把浏览器当保险箱。把这三条边界守住，八成问题不会出现。
</script>


<script type="text/markdown" id="md-sec-crypto">
密码学的难点不在数学，而在**选对原语**。用错地方，再强的算法也没用。

## 一、三类原语，三种用途

| 原语 | 解决什么 | 代表算法 | 关键特性 |
| --- | --- | --- | --- |
| 对称加密 | 加密大量数据 | AES-256-GCM、ChaCha20 | 快，但双方要共享密钥 |
| 非对称加密 | 密钥交换、签名 | RSA、ECDH、Ed25519 | 慢，解决「怎么安全地共享密钥」 |
| 哈希 | 完整性、口令存储 | SHA-256、SHA-3、BLAKE3 | 单向、抗碰撞 |

一句话记住分工：**非对称负责「安全地商量出对称密钥」，对称负责「快速加密数据」，哈希负责「校验没被改」**。

## 二、哈希的三个必须知道的性质

1. **单向**：从摘要推不回原文
2. **抗碰撞**：找不到两个不同输入有相同摘要
3. **雪崩效应**：改一个字符，摘要面目全非

```bash
echo -n "hello" | sha256sum
echo -n "hellp" | sha256sum   # 完全不同
```

**口令存储必须用专门算法**：`bcrypt` / `scrypt` / `argon2`。它们故意慢、带盐，能抵抗彩虹表与 GPU 爆破。直接 `md5(password)` 是历史遗留错误。

```python
import bcrypt
h = bcrypt.hashpw(pw.encode(), bcrypt.gensalt(rounds=12))
ok = bcrypt.checkpw(pw.encode(), h)
```

## 三、AES-GCM：正确用法就三行

```python
from cryptography.hazmat.primitives.ciphers.aead import AESGCM
import os

key = AESGCM.generate_key(bit_length=256)
aes = AESGCM(key)
nonce = os.urandom(12)                 # 每条消息唯一，绝不能重复
ct = aes.encrypt(nonce, b"secret", b"aad")
pt = aes.decrypt(nonce, ct, b"aad")
```

**nonce 复用是致命错误**：GCM 下同一密钥重复 nonce 会泄露明文异或关系，密钥也可能被还原。

## 四、TLS 握手：四次往返干了什么

以 TLS 1.3 为例（已简化为 1-RTT）：

```
1. Client → Server:  支持的套件、随机数、密钥协商参数（ECDHE 公钥）
2. Server → Client:  选定套件、服务器 ECDHE 公钥、证书、签名
3. Client:           验证证书链（域名、有效期、签发者、吊销）
                     用 ECDHE 算出共享密钥 → 发 Finished
4. Server:           校验 Finished → 开始用对称密钥通信
```

三个要点：
- **前向保密**：用 ECDHE 而非 RSA 密钥传输，长期私钥泄露也不解历史流量
- **证书验证是信任根**：浏览器信任的是 CA 体系，自签证书必须手动信任
- **握手之后全是对称加密**：因为对称快

## 五、五个真实世界的误用

**1. 用 ECB 模式**：相同明文块 → 相同密文块，图象能看出轮廓（经典「企鹅图」）。永远别用 ECB。

**2. 硬编码密钥**：密钥进了 Git 历史，等于公开。用 KMS / 环境变量 / 密钥管理服务。

**3. 自己发明加密方案**：把两次 base64 当加密、把异或当混淆。**不要自创密码学**。

**4. 只加密不认证**：没有 MAC 的加密可被篡改（padding oracle）。用 AEAD（GCM、ChaCha20-Poly1305）。

**5. 口令加盐但盐是固定的**：等于没加。每条口令一个随机盐。

## 六、签名与验签：别把加密当签名

- **加密**：用对方公钥加密，只有对方私钥能解 → 保机密性
- **签名**：用自己私钥签，任何人用公钥能验 → 保完整性与身份

两者方向相反，混用会出严重问题（比如用 RSA 加密当签名，可被伪造）。

```python
from cryptography.hazmat.primitives.asymmetric.ed25519 import Ed25519PrivateKey
priv = Ed25519PrivateKey.generate()
sig = priv.sign(b"msg")
priv.public_key().verify(sig, b"msg")     # 验不过会抛异常
```

## 七、练习

1. 用 `openssl` 生成自签证书，本地起 HTTPS，观察浏览器告警
2. 写一个口令注册/登录流程，用 bcrypt，并验证数据库泄露后无法直接还原口令
3. 用 AES-GCM 加密一个文件，再故意改一个字节，观察解密失败（认证生效）

## 一句话总结

密码学的安全来自**正确使用**：选 AEAD、管好密钥与 nonce、口令用慢哈希、别自创方案。算法本身很少被攻破，实现和用法才是破口。
</script>


<script type="text/markdown" id="md-sec-recon">
真正的渗透测试里，**找到入口比利用漏洞更难**。信息收集就是把「看不见的资产」变成「可枚举的清单」。

## 一、两类手段：被动与主动

| 类型 | 特点 | 代表手段 |
| --- | --- | --- |
| 被动 | 不直接接触目标，难被发现 | 搜索引擎、证书透明日志、代码托管、招聘信息 |
| 主动 | 直接与目标交互，可能留日志 | 端口扫描、目录爆破、指纹识别 |

授权测试通常先被动、后主动；主动扫描要避开业务高峰，并按约定控制速率。

## 二、资产测绘的五个维度

```
域名 → 子域 → IP → 端口/服务 → 应用（框架、版本、路径）
```

每一层都可能暴露下一层：

- 主域收得紧，但 `test.` `dev.` `admin.` 子域常常裸奔
- 同一个 IP 上可能挂着几十个站点（虚拟主机），扫端口时容易漏
- 应用指纹（框架、中间件版本）直接对应已知漏洞库

## 三、子域发现的思路（不用工具也能想）

1. **证书透明日志**：任何签发过证书的域名都会被记录，是子域的金矿
2. **DNS 爆破**：用常见字典（dev、test、staging、admin、api、oss…）查询是否存在
3. **搜索引擎语法**：`site:`、`inurl:` 找到散落在各处的入口
4. **代码与配置泄露**：公开仓库里的 `.env`、CI 配置、前端 bundle 里的接口域名
5. **证书与备案信息**：企业备案下的其他域名

> 以上手段请仅用于**你拥有或书面授权的目标**；对第三方做子域爆破可能触犯法律。

## 四、端口与服务的判断

```bash
nmap -sV -T3 -p- --min-rate 1000 10.0.0.5      # 全端口 + 版本识别
nmap -sC -sV -p 80,443,8080,3306 10.0.0.5      # 常用端口 + 默认脚本
```

怎么读结果：

| 端口 | 服务 | 关注点 |
| --- | --- | --- |
| 22 | SSH | 版本漏洞、弱口令、是否对公网开放 |
| 80/443 | Web | 虚拟主机、目录、指纹 |
| 3306/6379/27017 | 数据库 | **不应公网可达**，可达即为高危 |
| 8080/8888 | 管理后台 | 默认口令、未授权访问 |
| 9200 | Elasticsearch | 未授权读取数据 |

**「不该暴露却暴露了」比「有漏洞」更常见**：Redis 未授权、ES 未授权、Jenkins 未授权，都是配置问题而非代码问题。

## 五、Web 指纹与应用面

```bash
whatweb https://target.com           # 框架、CMS、中间件
curl -I https://target.com           # 响应头泄露 Server、X-Powered-By
```

重点看三样：
1. **中间件与版本**（Nginx 1.18 / Tomcat 9.0.x）
2. **框架与 CMS**（Spring Boot、Shiro、ThinkPHP、WordPress）
3. **特征路径**（`/actuator`、`/druid`、`/swagger-ui.html`、`/.git/config`）

后面这些路径一旦可达，往往直接等于「配置泄露」或「未授权访问」。

## 六、把结果整理成资产表

```csv
域名,IP,端口,服务/版本,应用指纹,暴露面判断,优先级
api.target.com,1.2.3.4,443,Nginx 1.18 / Spring Boot,/actuator 可达,配置泄露,高
test.target.com,1.2.3.5,8080,Jenkins 2.3,未授权访问,高危,最高
www.target.com,1.2.3.6,443,Nginx,/admin 需登录,常规,中
```

这张表的价值：**让后续测试有优先级**。先把「未授权 + 配置泄露」清掉，再谈漏洞利用。

## 七、容易被忽略的三类线索

1. **前端 bundle**：源码里的接口路径、内网地址、AK/SK（`grep -r "api\." dist/`）
2. **错误页**：堆栈信息会暴露框架、路径、数据库类型
3. **历史快照**：Wayback 里可能有已下线的旧接口与测试页面

## 八、练习

1. 对你自己搭的靶场（如 VulnHub 机器）做一次完整测绘：子域、端口、指纹、目录
2. 把结果整理成上面的 CSV，按「未授权 > 配置泄露 > 版本漏洞」排优先级
3. 写一个 Python 脚本，批量读取域名列表并抓取响应头，输出中间件与版本

## 一句话总结

信息收集的目标不是「找得多」，而是**把资产变成有优先级的清单**。清单清楚了，测试才有方向，报告才有说服力。
</script>


<script type="text/markdown" id="md-sec-web-adv">
进阶漏洞有个共同点：**功能本身是正常的，被用在异常场景就出问题**。这类漏洞最难靠扫描器发现。

## 一、SSRF：让服务器替你去访问

**成因**：服务端接收 URL 并请求它（图片抓取、Webhook、URL 预览、PDF 渲染）。

**危害**：访问内网服务、云元数据接口、绕过 IP 白名单。

判断信号：任何「填一个链接，服务器去取」的功能。

修复要点：
1. **协议白名单**：只允许 http/https
2. **域名/IP 白名单**，而非黑名单（黑名单永远补不完）
3. **解析后校验**：先 DNS 解析，判断 IP 是否内网，再发请求（防 DNS 重绑定）
4. **禁止跟随重定向**，或每跳都重新校验
5. 云上用 IMDSv2 并限制元数据访问

```python
import ipaddress, socket

def is_public(host):
    ip = ipaddress.ip_address(socket.gethostbyname(host))
    return ip.is_global          # 拒绝 10./172.16./192.168./127.
```

## 二、XXE：XML 解析器读文件

**成因**：解析外部 XML 时允许外部实体。

```xml
<!-- 危险示例（仅靶场） -->
<!DOCTYPE r [<!ENTITY x SYSTEM "file:///etc/passwd">]>
<r>&x;</r>
```

**修复**：禁用 DTD 与外部实体。

```python
from lxml import etree
parser = etree.XMLParser(resolve_entities=False, no_network=True, load_dtd=False)
```

如果业务不需要 XML（比如只用 JSON），**直接不接受 XML** 是最省事的修法。

## 三、反序列化：把数据变成对象

**成因**：把不可信输入直接反序列化成对象，触发魔术方法（`__wakeup`、`readObject`）形成利用链。

判断信号：Cookie、隐藏字段、RPC 参数里出现 base64 长串。

修复：
1. **不反序列化不可信数据**（优先 JSON + 严格 schema）
2. 必须用时，签名校验（HMAC）后再反序列化
3. 组件及时升级（很多链依赖老版本库）

## 四、文件上传：五层校验

| 层 | 校验内容 |
| --- | --- |
| 扩展名 | 白名单，而非黑名单 |
| MIME / Content-Type | 与扩展名一致 |
| 文件头 | 真实魔数（`PNG` 等） |
| 内容 | 图片二次渲染，剥离恶意载荷 |
| 存储 | **存到对象存储/独立域名，禁止解析执行** |

最关键的其实是最后一条：**上传目录不解析脚本**，即便传了 webshell 也执行不了。

## 五、JWT：三个常见攻击面

1. **alg 混淆**：把 `alg` 改成 `none`，或 HMAC/RSA 混用导致公钥当 HMAC 密钥
2. **密钥弱**：弱口令可离线爆破
3. **不校验声明**：不验 `exp`、不验 `aud`、不验签名

修复：服务端**固定算法**、强制验签与验 `exp/iat/aud`、密钥足够强、敏感操作不只看 JWT。

## 六、业务逻辑漏洞（扫不出来的一类）

| 类型 | 例子 | 测试思路 |
| --- | --- | --- |
| 越权 | 改 `userId` 看别人订单 | 水平/垂直越权各测一遍 |
| 支付 | 改金额、改数量为负 | 抓包改参数，看服务端是否重算 |
| 并发 | 优惠券重复领取 | 并发请求同一接口 |
| 流程绕过 | 跳过实名校验直接下单 | 按步骤乱序调用接口 |
| 枚举 | 手机号是否存在 | 对比不同输入的响应差异 |

**核心方法**：把业务流程拆成状态机，逐条边问「如果我不按顺序走会怎样」。

## 七、修复的通用思路

1. **服务端永远重算**：金额、权限、状态都以服务端为准
2. **每个对象都做归属校验**：`WHERE id=? AND owner_id=?`
3. **默认拒绝**：白名单优于黑名单
4. **危险功能隔离**：上传、解析、渲染放到独立服务与独立域名

## 八、练习

1. 在靶场（DVWA / PortSwigger Labs）复现 SSRF 与 XXE，写出修复代码
2. 给你的 demo 写一个「优惠券只能领一次」的接口，用并发脚本验证是否可重复领取
3. 审计一段 JWT 校验代码，找出至少两个缺陷

## 一句话总结

进阶漏洞考的是**想象力 + 对业务的理解**。工具只能覆盖已知模式，剩下的靠你把功能当成攻击面来推演。
</script>


<script type="text/markdown" id="md-sec-pentest">
渗透测试的价值在**报告与改进**，不在「攻进去」这个动作本身。以下七个阶段，缺一环就不算完整项目。

## 一、授权与范围（跳过这步，后面全是法律风险）

必须写进授权书的六项：

1. **目标资产清单**（域名、IP、接口，精确到子域）
2. **测试类型**（黑盒/灰盒/白盒）
3. **时间窗口**（含禁止时段，避免业务高峰）
4. **允许的手段**（是否允许社会工程、是否允许 DoS）
5. **数据处理**（取证数据如何存储、何时销毁）
6. **联系人**（出问题找谁、紧急停止方式）

> 口头同意不算授权。没有书面授权，任何主动测试都不要开始。

## 二、侦察：从资产到入口

把信息收集的产出整理成表（见上一篇），标注每个资产的「暴露面判断」。这一阶段的成果直接决定后面能挖多深。

## 三、漏洞验证：先证明，再利用

**验证**的标准是「可复现的最小证据」：

- 一个能说明问题的响应（报错、数据回显、时间延迟）
- 一张截图 + 完整请求报文
- 明确的前置条件（需要登录？需要特定参数？）

不要一上来就打 `sqlmap --os-shell`——先证明存在注入，再评估影响范围。

## 四、利用与提权：控制影响面

利用的原则：**用最小必要权限证明风险**。

- 拿到数据库读取权限即可，不必拖全库
- 拿到低权限 shell 即可，提权只验证可行性
- 不要在生产环境放后门、不要删改数据

常见提权方向（Linux）：

```bash
id; uname -a; sudo -l                 # 基础信息
find / -perm -4000 -type f 2>/dev/null # SUID 程序
cat /etc/crontab; ls -l /etc/cron.*    # 计划任务
```

Windows 侧关注：服务权限配置错误、未引用服务路径、AlwaysInstallElevated。

## 五、横向：从一台到一片

渗透测试是否「严重」，取决于能否横向。判断依据：

- 是否有域环境/统一认证
- 是否存在可复用的凭据（配置文件、内存、浏览器保存的口令）
- 内网是否有未加固的服务（Redis、数据库、Jenkins）

**注意**：横向必须在授权范围内，且要记录每一步的时间与命令。

## 六、清理与留痕

1. 删除上传的测试文件与临时账号
2. 恢复被修改的配置
3. 保留完整操作日志（时间、命令、结果），作为报告附件
4. 按约定销毁或加密保存取证数据

## 七、报告：决定这次测试值不值钱

一份能推动修复的报告，结构如下：

```
1. 摘要（给管理层看）：整体风险等级、最严重的 3 个问题、建议
2. 范围与方法：测了什么、没测什么、用了什么手段
3. 风险清单（表格）：编号 / 名称 / 等级 / 影响资产 / 状态
4. 详细发现（每个漏洞一页）：
   - 位置（URL / 参数 / 代码行）
   - 复现步骤（可被第三方照做）
   - 影响（能读到什么、能做到什么）
   - 证据（请求响应 / 截图）
   - 修复建议（具体到代码与配置）
5. 附录：工具输出、时间线
```

**写好「修复建议」是分水岭**：写「加强输入校验」没用，写「在 `UserService.java:88` 改用参数化查询，并对 `role` 字段做枚举校验」才有人改。

## 八、常见踩坑

| 坑 | 后果 |
| --- | --- |
| 未确认范围就打内网 | 越界，法律风险 |
| 生产环境跑高强度扫描 | 打挂业务 |
| 只测登录口 | 漏掉 API 与后台 |
| 报告只写「存在高危漏洞」 | 开发不知道怎么改 |
| 不记录时间线 | 出问题无法自证 |

## 九、练习

1. 用 VulnHub 一台靶机做完整流程，产出报告（含摘要、清单、5 个详细发现）
2. 给每个发现写「可执行的修复建议」，并注明验证方式
3. 自己写一份授权书模板，把上面六项都包含进去

## 一句话总结

渗透测试是**用攻击者的视角，产出防守者能执行的清单**。授权是前提，证据是底气，报告是交付物。
</script>


<script type="text/markdown" id="md-sec-defense">
蓝队的核心不是「买设备」，而是**让异常在发生时能被看见**。看不见的攻击，等于没发生。

## 一、日志体系：先有数据，才有分析

四类必收日志：

| 来源 | 关键字段 | 用途 |
| --- | --- | --- |
| 边界（WAF/防火墙/代理） | 源 IP、URL、状态码、规则命中 | 外部攻击尝试 |
| 主机（系统/审计） | 进程、命令行、登录、文件变更 | 落地痕迹 |
| 应用 | 用户、接口、参数、耗时 | 业务异常与越权 |
| 身份（AD/SSO） | 登录成功/失败、MFA、权限变更 | 账号侧入侵 |

三条落地要求：
1. **时间统一（NTP）**：时间不同步，关联分析全废
2. **保留足够久**：至少 90 天，关键日志 180 天以上
3. **集中存储**：本地日志被清是最常见的事后困境

## 二、告警降噪：从「一天三千条」到「十条要看」

降噪的四个手段：

1. **白名单**：已知扫描器、监控探针、内部健康检查
2. **聚合**：同一源 IP 的同类请求合并为一条事件
3. **分级**：按「是否成功、是否涉及敏感资产」分层
4. **基线**：偏离日常行为的才报（如某账号凌晨从境外登录）

告警的价值不在数量，而在**每一条都值得看**。

## 三、ATT&CK：把攻击翻译成可检测的行为

ATT&CK 把攻击拆成战术（为什么）与技术（怎么做）：

| 战术 | 典型技术 | 可检测信号 |
| --- | --- | --- |
| 初始访问 | 公开应用利用、钓鱼 | WAF 命中 + 异常 UA |
| 执行 | 命令行、脚本 | 可疑 `powershell -enc`、`curl \| bash` |
| 持久化 | 计划任务、服务、启动项 | cron 新增、systemd 新服务 |
| 提权 | 内核漏洞、SUID 滥用 | 异常 SUID 文件、sudo 日志 |
| 凭据访问 | 抓内存、读配置 | 访问 `/etc/shadow`、LSASS |
| 横向 | 远程服务、凭据复用 | 内网 SMB/RDP 异常连接 |
| 外传 | C2、云存储 | 非常规域名、大流量出站 |

用它做两件事：**设计检测规则**、**复盘时对齐攻击链**。

## 四、应急响应六步

```
准备 → 识别 → 遏制 → 根除 → 恢复 → 总结
```

**1. 准备**：预案、联系人、取证工具包、隔离手段（能否快速摘掉一台机器）

**2. 识别**：确认「是否真的被入侵」，避免误报搞停业务

**3. 遏制**：先止血。隔离主机、封禁 IP、吊销会话与密钥。**注意保留证据**（内存、磁盘镜像）再清理。

**4. 根除**：找到入口并修掉，否则清完还会再来

**5. 恢复**：从可信备份恢复，改密、加监控，观察一段时间

**6. 总结**：时间线、根因、改进项（每条要有负责人与期限）

## 五、Linux 主机排查顺序（实战）

```bash
# 1. 账号与登录
last -a | head -20
grep -i "accepted\|failed" /var/log/auth.log | tail -50

# 2. 进程与网络
ps auxf --sort=-%cpu | head -20
ss -antp | grep ESTAB

# 3. 持久化
crontab -l; ls -l /etc/cron.*; systemctl list-units --type=service --state=running

# 4. 文件痕迹（按时间找新增）
find / -mtime -3 -type f -newer /etc/hostname 2>/dev/null | head -50

# 5. 启动项与动态库劫持
cat /etc/rc.local 2>/dev/null; ls -l /etc/ld.so.preload
```

排查原则：**先看异常，再看关联**。一个陌生的外连 IP，配合一个 3 天前新增的 cron，往往就是完整故事。

## 六、一次典型入侵的复盘路径

```
WAF 告警：/upload 上传 .jsp
  → 主机日志：/var/www/upload 出现新文件
  → 进程：www-data 启动 /bin/sh
  → 网络：外连 45.x.x.x:443（C2）
  → 持久化：/etc/cron.d/ 新增任务
  → 凭据：/var/www/.env 被读取（数据库口令泄露）
```

每一环都要在日志里有对应证据，缺哪一环就说明**监控有盲区**——这比抓到这次攻击更有价值。

## 七、练习

1. 给你自己的 Linux 主机搭一套最小日志体系（auditd + nginx 日志 + 集中收集）
2. 写 5 条 ATT&CK 对应的检测规则（伪代码即可），并说明误报来源
3. 模拟一次「Webshell 上传」事件，按六步流程写处置记录

## 一句话总结

蓝队的能力等于**可见性 × 响应速度**。日志不全就没有可见性，预案不练就没有速度。
</script>


<script type="text/markdown" id="md-sec-code-audit">
渗透测试是「事后发现」，代码审计与安全开发是「事前拦截」。后者才是成本最低的防线。

## 一、审计四条主线

拿到一个项目，不要从第一行读起。按四条线找：

**1. 输入线**：所有外部输入进到哪
```
HTTP 参数 → Controller → Service → DAO / 执行 / 文件
```

**2. 认证与授权线**：谁能做什么
```
登录 → 会话 → 每个接口的权限注解/校验 → 数据归属校验
```

**3. 文件与命令线**：哪里碰了系统
```
上传、下载、解压、模板渲染、执行命令、反序列化
```

**4. 依赖线**：用了什么
```
pom.xml / package.json / requirements.txt → 已知漏洞版本
```

## 二、危险函数清单（按语言）

| 语言 | 危险点 | 安全替代 |
| --- | --- | --- |
| Java | `Statement` 拼接 SQL、`Runtime.exec`、`ObjectInputStream` | `PreparedStatement`、参数数组、JSON + 签名 |
| Python | `eval/exec`、`pickle.loads`、`subprocess(..., shell=True)` | `ast.literal_eval`、JSON、参数列表 |
| PHP | `eval`、`include $_GET`、`system` | 白名单包含、参数化 |
| Node | `child_process.exec`、`eval`、`innerHTML` | `execFile`、模板转义 |
| 通用 | 字符串拼接 SQL / 路径拼接 | 参数化、`os.path.join` + 规范化校验 |

看到这些函数不等于有漏洞，但**每一个都要追问「参数从哪来」**。

## 三、一个真实审计片段

```java
// 危险：id 来自请求参数，直接拼进 SQL
String sql = "SELECT * FROM orders WHERE id = " + request.getParameter("id");
stmt.executeQuery(sql);

// 修复
String sql = "SELECT * FROM orders WHERE id = ? AND user_id = ?";
try (PreparedStatement ps = conn.prepareStatement(sql)) {
    ps.setLong(1, Long.parseLong(id));
    ps.setLong(2, currentUserId());     // 归属校验同样重要
    ps.executeQuery();
}
```

审计时要同时看两件事：**注入**与**越权**。很多代码修了前者，忘了后者。

## 四、SAST / DAST / SCA 怎么配合

| 类型 | 看什么 | 优点 | 局限 |
| --- | --- | --- | --- |
| SAST（静态） | 源码模式 | 早、覆盖全 | 误报多，看不到运行时 |
| DAST（动态） | 运行中接口 | 真实、误报少 | 覆盖依赖用例 |
| SCA（依赖） | 第三方组件版本 | 快、可直接修 | 只管已知 CVE |
| 人工审计 | 业务逻辑 | 能发现逻辑漏洞 | 慢，依赖经验 |

**推荐顺序**：SCA（每次提交）→ SAST（每次 PR）→ DAST（每次发布前）→ 人工审计（核心模块 + 上线前）。

## 五、把检查嵌进 CI

```yaml
# 示例：GitHub Actions
- name: 依赖扫描
  run: pip install pip-audit && pip-audit
- name: 静态扫描
  run: pip install bandit && bandit -r src -ll
- name: 密钥扫描
  run: |
    pip install detect-secrets
    detect-secrets scan --baseline .secrets.baseline
```

三条原则：
1. **只拦「高置信 + 高危」**，否则团队会全量忽略
2. **基线管理**：历史问题进 baseline，新增问题才阻断
3. **修复有归属**：每个告警指定负责人，否则永远不修

## 六、安全开发的三条硬规矩

1. **服务端不信任任何输入**：包括前端校验过的、内部服务传的
2. **权限校验写在数据访问层**：`WHERE owner_id = ?`，而不是只在 Controller 判断
3. **密钥不进代码库**：`.env` 加 `.gitignore`，CI 用 Secrets，泄露立即轮换

## 七、练习

1. 找一个开源 Web 项目，按四条主线做一次审计，产出「发现清单 + 修复 PR」
2. 给你自己的项目配 SCA + SAST，让它在 PR 上自动评论
3. 写一份《安全开发检查清单》，覆盖输入、认证、文件、依赖、日志五块

## 一句话总结

安全开发的本质是**把安全检查变成流程的一部分**，而不是靠某个人记得。流程能持续，个人会疲劳。
