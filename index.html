<script type="text/markdown" id="md-reading-40-books">
去年这个时候，我在笔记本的扉页写下一行字：**今年读 40 本书**。

写的时候挺心虚的。因为前一年我大概只读完了 6 本，剩下的二十几本都停在第三章，书签像一排小小的墓碑。

## 我以前的读法是错的

很长一段时间，我把读书当成一项必须完成的任务：从第一页开始，逐字逐句，读完才算「读过」。这套方法在学校里管用，因为教材本来就是为了被完整读完而写的。但大部分书不是。

一本 300 页的书里，真正对你有用的可能只有 30 页。剩下的部分——铺垫、举例、作者的个人经历——不是不重要，只是此刻与你无关。

> 阅读不是把书从头到尾搬运一遍，而是在书里找到能解决你当下问题的那些句子。

想通这一点之后，我给自己定了四条规则。

## 规则一：允许弃书

这是最难的一条，也是最有效的一条。

我给自己一个「50 页豁免权」：读 50 页还没有任何一处想划线，就合上，放回书架。不内疚，不记账。

一年下来我弃了 17 本。听起来很浪费，但正因为我敢弃，才敢开始。

## 规则二：一次只读三本

同时读的书不超过三本，并且必须分工明确：

| 角色 | 类型 | 时间 |
| --- | --- | --- |
| 主读 | 需要连续思考的书 | 早上 40 分钟 |
| 副读 | 轻松的非虚构 | 通勤、排队 |
| 重读 | 读过的旧书 | 睡前 15 分钟 |

主读负责推进，副读负责填补碎片时间，重读负责把好东西再吸一遍。三本之外一律排队。

## 规则三：读完立刻写 300 字

不写笔记的书，等于没读。

我的笔记格式极其简单，只有三行：

1. 这本书想解决什么问题
2. 它给出的最反直觉的答案
3. 我下周打算拿它做什么

第三条最重要。**没有行动项的知识，只是收藏品。**

## 规则四：让书出现在路上

我在三个地方各放了一本书：床头、包里、办公室抽屉。手机上的读书 App 只留了一个，且删掉了所有推送。

原理很朴素：降低开始阅读的摩擦，提高开始刷手机的摩擦。

## 这一年读到了什么

四十本里，有 6 本值得反复读：

- 《深度工作》
- 《禅与摩托车维修艺术》
- 《写作这回事》
- 《设计中的设计》
- 《人类简史》
- 《瓦尔登湖》

它们有个共同点：都不是教你「怎么做」，而是让你重新看一遍「为什么要做」。

## 明年的目标

不设数量了。改成：**每季度重读一本旧书**。

书不是用来刷新的数字，是用来反复经过的路。走得慢一点，反而记得住。
</script>

<script type="text/markdown" id="md-container-queries">
做了六年响应式，我最近才彻底换掉一种习惯：不再用媒体查询给组件加断点。

## 老办法的问题

假设有一个卡片组件，它既在侧边栏里，也在主内容区里。用媒体查询，你只能这样写：

```css
@media (min-width: 720px) {
  .card { flex-direction: row; }
}
```

问题是：这句话描述的是**屏幕**，而组件关心的是**自己**。同一个卡片放在 280px 的侧边栏里，屏幕再宽它也不该横排。

于是你开始写 `.sidebar .card`、`.main .card` 这样越来越长的选择器，组件和布局耦合在一起，复用变成奢望。

## 容器查询解决什么

容器查询把「宽度」这个概念还给组件自己：

```css
.card-wrap {
  container-type: inline-size;
  container-name: card;
}

@container card (min-width: 480px) {
  .card { flex-direction: row; }
}
```

只要 `.card-wrap` 自己够宽，卡片就变成横向；它多宽取决于父级布局，而不是浏览器窗口。组件终于可以真正地「放到哪里都成立」。

## 三个实战细节

### 一、别忘了容器类型的代价

`container-type: inline-size` 会让元素建立独立的布局上下文，它的高度不再参与父级的内在尺寸计算。在 grid 或 flex 中这通常是你要的；但在需要「内容撑高」的场景里会踩坑。

### 二、把单位换成 cqw

容器单位让内部尺寸跟着容器走：

```css
@container card (min-width: 480px) {
  .card__title { font-size: clamp(1rem, 3.2cqw, 1.6rem); }
}
```

这比 `vw` 更符合直觉：字号跟着卡片走，而不是跟着窗口走。侧边栏里的标题不会因为屏幕宽就突然变大。

### 三、用容器查询做「密度」

我最喜欢的一个用法，是让它自动切换信息密度：

```css
@container card (max-width: 320px) {
  .card__excerpt,
  .card__tags { display: none; }
}
```

不用 JS，不用 ResizeObserver，也不用给每种布局各写一套组件。

## 什么时候还是该用媒体查询

媒体查询没有过时。它擅长的是「环境」：

- 暗色模式：`prefers-color-scheme`
- 减少动效：`prefers-reduced-motion`
- 打印样式
- 极端的全局断点，比如移动端隐藏侧边栏

一句话总结：**环境用媒体查询，组件用容器查询。**

## 兼容性

截至 2026 年，所有主流浏览器都已支持容器查询，包括内联尺寸查询和常用的样式查询子集。真正需要担心的不是浏览器，而是你的设计系统有没有把「组件宽度」当成一等公民。

如果你的设计稿里，同一个组件在不同位置有不同长相，那容器查询不是可选项，是必需品。
</script>

<script type="text/markdown" id="md-whitespace">
刚做设计的时候，我有个毛病：觉得页面上空着的地方浪费了。于是塞小图标、塞说明文字、塞分割线。结果页面很满，但没人愿意看。

后来才明白，留白不是没放东西的地方，**它就是设计的一部分**。

## 层次一：间距是关系

两个元素之间的距离，直接告诉用户它们有多亲。

- 8px：同一组内的兄弟
- 16px：同一个模块的不同部分
- 32px：不同模块之间
- 64px 以上：不同章节

这套数字本身不重要，重要的是**一致**。如果 12px 和 14px 混用，用户说不出哪里别扭，但会觉得「乱」。

> 规则：距离只有三档——很近、有点远、很远。超过三档，人眼就分辨不出来了。

## 层次二：留白是节奏

好的页面有呼吸。全篇等距的间距，像一段没有标点的句子。

我的做法是给每个区块一个「密度标签」：

| 区域 | 密度 | 行高 | 段距 |
| --- | --- | --- | --- |
| 首屏 | 疏 | 1.9 | 2em |
| 正文 | 中 | 1.75 | 1.2em |
| 列表 | 密 | 1.5 | 0.5em |

首屏疏，是为了让你停下来；正文中，是为了让你读下去；列表密，是为了让你扫得快。

## 层次三：留白是态度

这一层最玄，但也最真实。

一个页面上留了大片空白，意味着作者相信内容自己会说话。反过来，如果一个页面到处都在抢注意力——弹窗、角标、红点、跑马灯——它传达的其实是焦虑。

我喜欢的站大多有个共同点：一屏只说一件事。

## 一个可执行的练习

拿你正在做的页面，把所有非内容的元素（分割线、装饰图标、说明性小字）先全部删掉，截个图。

然后把它们一个个加回来，每加一个问自己：**没有它，用户会误解吗？**

如果答案是「不会，只是没那么好看」，那就别加。

留白的最高境界，是别人根本没注意到它。
</script>

<script type="text/markdown" id="md-workflow-2026">
每年我都会重装一次自己的工作流。今年这一次改动最小，但最稳。写下来，也给未来的自己留个存档。

## 全景图

我的流程只有四步：**收集 → 澄清 → 推进 → 归档**。

听起来像 GTD，但细节更粗糙，也更适合我这种容易把系统过度设计的人。

## 一、收集：只有一个入口

所有想法、链接、待办，全部进同一个 Inbox。不是三个，不是按项目分，就是一个。

我用的工具换过很多次，从 Notion 到 Obsidian 到纯文本，但入口数量始终是一。原因很简单：**多一个入口，就多一次「这条该放哪」的决策**，而决策会消耗意志力。

现在我的 Inbox 是一个 `inbox.md` 文件，手机和电脑都能一秒打开。

## 二、澄清：每天十分钟

早上的第一件事不是干活，是把昨晚和今早堆进 Inbox 的东西过一遍。

每条只问一个问题：**它下一步是什么？**

| 情况 | 处理 |
| --- | --- |
| 两分钟能做完 | 立刻做 |
| 有明确下一步 | 变成一个具体的任务 |
| 是个想法 | 移进「笔记」，标上主题 |
| 暂时没用 | 删掉 |

「删掉」这一步最容易被跳过。但不删，Inbox 就会变成一个越堆越高的杂物间，最后你连打开它的欲望都没有。

## 三、推进：每天只推三件事

我不做长清单。每天早上从任务池里挑三件，写在纸上，做完划掉。

三件里必须有一件是「推进型」的——写一段、做一版、跑一次——而不是「响应型」的（回消息、开会、填表）。

响应型的事永远做不完，它们会自己找上门。推进型的事不会，你不主动安排，它就永远停在原地。

## 四、归档：周五下午半小时

- 完成的任务 → 归档
- 没完成的 → 重新评估，超过三周没动的直接删
- 本周的笔记 → 打标签，放进永久笔记
- 写一段 200 字的周回顾

周回顾不写情绪，只写三件事：做成了什么、卡在哪、下周最重要的一件事是什么。

## 关于工具

我现在的组合：

- 纯文本 + Git：所有笔记
- 一个极简待办 App：只有今天
- 纸质笔记本：思考和画图
- 日历：只放真正有时间的约定

工具越少，系统越可能活下来。

## 一点提醒

不要为了工作流而工作流。如果你花在维护系统上的时间超过了你真正做事的时间，那这个系统就是负债。

好的系统应该让你**忘记它的存在**。
</script>

<script type="text/markdown" id="md-blog-as-second-brain">
我用过几乎所有笔记工具。它们很好，但有一个共同的问题：写给自己看的东西，很容易变成垃圾。

不是因为懒，是因为**没有读者**。

## 公开写作的压力是好的压力

同样一个想法，写在私人笔记里你会写：

> Kafka 好像和消息队列有关，改天查查。

写在博客里，你必须先查清楚，因为你不知道谁会看到。这个「先查清楚」的动作，就是学习的发生。

## 我的三层结构

现在我的知识管理分三层。

### 第一层：碎片

每天随手记的东西。不整理，不分类，一个月后清空一次。绝大多数会消失，这很正常。

### 第二层：笔记

值得展开的想法。每条笔记是一个独立的小卡片，有自己的标题，能用一段话说清楚。标准是：**如果三个月后的我看到它，能不能直接理解？**

### 第三层：文章

当某个主题积累了四五条笔记，我就把它们缝成一篇文章，发到博客上。

这一步是整条流水线的关键。因为「缝」的过程会暴露所有逻辑漏洞——你以为想通的地方，一写就露馅。

## 博客是索引，不是仓库

我不指望博客保存所有东西。它是**索引**：告诉未来的我，这个主题我曾经想到哪一步，证据在哪，结论是什么。

具体的资料留在笔记里，博客只放结论和推理过程。

## 一个副作用

写博客这几年，我最大的收获不是读者，是**检索能力**。

因为经常要回答「我以前是不是写过这个」，我养成了给每篇文章起清晰标题、给每段起小标题的习惯。这个习惯反过来让我的笔记也变得好找了。

> 你写下的东西的价值，取决于你以后能不能找到它。

## 从今天开始

如果你想开始，不要写「我的第一篇博客」。写你最近解决的一个具体问题，哪怕只有 500 字。

具体的、小的、真实的东西，永远比宏大的开场白更有价值。
</script>

<script type="text/markdown" id="md-vite-build-optimization">
接手一个中型后台项目，`vite build` 要 12.4 秒。听起来不算灾难，但加上 CI 和部署，一次发布要等三分钟。于是我花了一个下午，只做一件事：优化构建，不动业务代码。

结果是 2.8 秒。

## 先测量，别猜

第一件事是打开构建分析：

```bash
vite build --mode production
```

然后在 `vite.config.ts` 里加上可视化：

```ts
import { visualizer } from 'rollup-plugin-visualizer'

export default defineConfig({
  plugins: [
    visualizer({ gzipSize: true, filename: 'stats.html' })
  ]
})
```

打开 `stats.html`，问题一目了然：

1. 一个 UI 组件库被整包引入，占了四成
2. 图标库每个图标都打进来了
3. 有几个只在一处用到的图表库被静态引入
4. 所有路由都同步加载

## 改动一：按需引入组件库

原来是整包引入：

```ts
import { Button, Table, Modal } from 'antd'
```

改成按需引入，配合 `unplugin-vue-components` 或 `unplugin-react-components` 自动解析。这一项把包体砍掉了 38%。

## 改动二：图标按名引入

```ts
// 之前：整包
import * as Icons from '@ant-design/icons'

// 之后：只有用到的
import { SearchOutlined } from '@ant-design/icons'
```

图标库是最容易被忽略的胖子，一个 import 就可能带进几千个 SVG。

## 改动三：重库改动态引入

图表、富文本、代码高亮这类东西，首屏根本用不到：

```ts
const Chart = defineAsyncComponent(() => import('@/components/Chart.vue'))
```

配合路由级懒加载，首屏 JS 从 1.8MB 降到 620KB。

## 改动四：给构建减负

这一条不减少产物，但显著减少构建时间。把 `build.target` 提到项目实际支持的基线：

```ts
build: {
  target: 'es2020',
  cssCodeSplit: true,
  reportCompressedSize: false
}
```

`reportCompressedSize: false` 单独就能省 1 秒多——它只是不再计算并打印 gzip 体积，CI 里根本没人看。

## 结果

| 指标 | 之前 | 之后 |
| --- | --- | --- |
| 构建时间 | 12.4s | 2.8s |
| 首屏 JS（gzip） | 1.8MB | 620KB |
| 产物文件数 | 214 | 96 |

## 学到的

优化的顺序永远是：**测量 → 找出最大的那个 → 只改它 → 再测量**。

凭直觉猜的话，我大概率会去折腾 sourcemap 和压缩插件，而它们加起来只占 8%。

先看数据，比什么都快。
</script>

<script type="text/markdown" id="md-five-afternoons">
七月，我回到长大的小城住了半个月。每天下午四点出门，走到天黑回家。没有目的地，也没有耳机。

## 第一个下午：菜市场

菜市场在河边，棚顶是铁皮的，下过雨后叮叮当当。

卖鱼的女人坐在蓝色塑料盆中间，手里一把刀，杀鱼的动作像在削一支铅笔。她问我：「要哪条？」我说随便。她说：「随便的鱼不好吃。」

最后我买了一条鲫鱼，她帮我刮了鳞，又送了两根葱。

## 第二个下午：旧书店

新华书店二楼拐角，有一家开了二十年的旧书店。老板在打瞌睡，风扇对着他吹。

书架上的书按「老板觉得」分类：武侠在一摞，言情在另一摞，中间夹着一本《拖拉机维修手册》。

我翻到一本 1998 年的《读者》，定价 2.5 元。纸已经发黄，但字很清楚。里面有一篇文章讲「如何度过一个无聊的下午」，我站着读完了。

结账时老板说：「五块。」我说书后面写着 2.5。他说：「现在物价涨了。」

## 第三个下午：河堤

河堤上种了一排樟树，树荫很密。有老人在下棋，围观的人比下棋的多。

我坐在台阶上看水。水面有油污的光，也有晚霞的光，两种光混在一起，看不出哪个更脏。

一个小孩在放风筝，风筝卡在树上了。他仰着头看了很久，然后自己走了。我本来想去帮忙，但我也不会爬树。

## 第四个下午：中学门口

学校放假了，门口只有一家文具店开着。

老板娘还记得我，说：「你以前老来买笔芯。」我说是啊。她说：「现在没人买笔芯了，都买盲盒。」

店里确实有一整面墙的盲盒，塑料小人排得整整齐齐。我买了两支笔芯，一块钱。

## 第五个下午：下雨

最后一天下雨，我没带伞，站在便利店门口等。

雨点打在遮阳棚上，声音很密。便利店的店员在整理货架，把过期的饭团挑出来，摆成一排。

雨停了，我走回家。路过菜市场，卖鱼的女人正在收摊，她冲我点了点头。

## 之后

回到城市后，我偶尔会想起那五个下午。

什么都没发生，也没想明白什么道理。但那种「时间不被使用」的感觉，我很久没有过了。

我们总在问「今天做了什么」。或许有些日子，就是用来不做什么的。
</script>

<script type="text/markdown" id="md-deep-work">
五年前第一次读《深度工作》，我记住的是方法：关手机、定时间、做记录。

这次重读，我划下的全是另一类句子——关于**为什么**。

## 书里最扎心的一句话

> 深度工作的能力正在变得越来越稀有，而与此同时，它的价值正在变得越来越高。

这句话写于 2016 年。放到 2026 年看，前半句更真了，后半句也更真了。

## 我的三个误区

### 误区一：以为忙碌等于产出

以前我觉得，只要一天到晚在处理事情，就是努力工作。但书里区分得很清楚：

- **深度工作**：在无干扰状态下进行的高认知活动，能创造新价值，且难以复制
- **浮浅工作**：不需要太多认知努力的事务性任务，容易复制

回看我的一天，深度工作的时间大概只有 90 分钟，其余全是浮浅工作。而这 90 分钟贡献了 80% 的成果。

### 误区二：以为随时能进入状态

书里提到一个概念叫「注意力残留」：当你从任务 A 切换到任务 B，一部分注意力还留在 A 上。

频繁切换的人，从来没有真正进入过任何一个任务。

所以我以前那些「边写代码边回消息」的下午，实际上两边都做得很差。

### 误区三：以为休息是浪费时间

纽波特提出：**深度工作需要像运动员一样训练和恢复**。

不是「工作到累再休息」，而是「按节奏工作，按节奏恢复」。他建议每 90 分钟休息一次，且休息时不要碰屏幕。

## 我打算做的三件事

1. 每天一个 90 分钟的无干扰块，手机放另一个房间
2. 把收件箱集中处理两次，上午 11 点、下午 4 点，其余时间关闭通知
3. 给浮浅工作定量，每天不超过 2 小时，超出就砍

## 一点质疑

书里对社交媒体的态度偏严厉，认为它们只是「任何益处法」的产物——只要有一点点好处，就合理化大量使用。

我部分同意，但不完全。对创作者来说，平台也是分发渠道，完全退出并不现实。

我的折中方案是：**把消费和创作分开**。消费限时，创作专注。

## 最后

这本书真正改变我的不是技巧，是一种视角：

注意力不是取之不尽的资源，它更像体力——用完了就没了，而且需要恢复。

怎么花它，决定了你成为什么样的人。
</script>

<script type="text/markdown" id="md-letter-to-myself">
三年前的今天，你发出了第一篇博客。浏览量 12，其中 3 个是你自己刷的。

你在结尾写：「希望以后能一直写下去。」

现在我可以回答你了：写了 87 篇，没有断更超过一个月。但过程和你想的不一样。

## 你以为的坚持，是每天都写

不是的。

我试过日更，坚持了 19 天，然后崩了。崩的那天我写了三段废话，删掉，又写，又删，最后关电脑睡觉。

真正让我写下来的，不是意志力，是**降低门槛**：

- 不要求每篇都完整
- 允许写 300 字的短记
- 允许写「没想明白」的东西

## 你以为的读者，是很多人

不是的。

三年里，平均每篇阅读量不到 100。最多的一篇有 4000 多，是被某个社区转载了；最少的一篇有 3 个。

但那 3 个人里，有一个给我写了很长的邮件，说那篇文章帮他解决了一个困扰半年的问题。

那一刻我明白了：**写作的价值不取决于读者的数量，而取决于有没有一个人真的被帮到**。

## 你以为的瓶颈，是没东西可写

不是的。

瓶颈永远是「不敢写」。怕写得浅，怕被人笑，怕观点过时。

后来我发现一个真相：你觉得浅的东西，对三个月前的自己也是新的。而三个月前的你，比陌生人更接近你的读者。

## 你以为的收获，是流量

不是的。

三年写下来，我最大的收获是：

1. **想清楚了几个问题**。写之前以为懂，写的时候才发现漏洞
2. **认识了几个人**。都是通过文章找来的，聊得很深
3. **有了一个可以回看的时间轴**。翻旧文章，能看到自己怎么变的

## 给你的三条建议

**一、别等准备好。** 第一篇永远不完美，但它必须存在，否则第二篇不会来。

**二、别追热点。** 热点会过期，你的思考不会。写你真正在意的东西。

**三、别删旧文。** 哪怕写得幼稚，那也是你走过的路。我现在最珍惜的，就是那些现在写不出来的句子。

## 最后

三年后的你，还是会在深夜打开编辑器，还是会为一个句子纠结半小时，还是会在发布后反复刷新看有没有人留言。

但你已经不焦虑了。

因为你终于知道，写东西这件事，本来就是为了自己。
</script>

<script type="text/markdown" id="md-local-first">
去年我的一个笔记服务宣布停止运营，给了 30 天导出窗口。

我导出了 2000 多条笔记，格式是一堆嵌套的 JSON，图片链接全部指向一个即将关闭的 CDN。

那次之后，我开始认真对待「本地优先」。

## 什么是本地优先

本地优先（Local-first）不等于「不用云」，而是：

- **数据的主副本在你的设备上**
- 应用在离线时完整可用
- 同步是可选的增强，不是前提
- 你随时可以把数据完整带走

对比一下：

| | 云端优先 | 本地优先 |
| --- | --- | --- |
| 断网 | 不可用 | 完整可用 |
| 数据所有权 | 平台 | 你 |
| 迁移成本 | 高 | 低 |
| 协作 | 天然支持 | 需要额外方案 |
| 冲突处理 | 服务端 | 客户端（CRDT 等） |

## 我现在的组合

### 笔记：纯文本 + Git

所有笔记是 `.md` 文件，放在一个 Git 仓库里。同步靠私有远程仓库，冲突靠手动合并——一年也就发生两三次。

好处是：任何编辑器都能打开，二十年后大概也还能。

### 照片：本地硬盘 + 异地备份

原图在主机的硬盘里，按年月分目录。备份用增量同步到一块移动硬盘，每月一次。

云相册只用来分享，不作为唯一存储。

### 密码：开源密码管理器

数据加密后放在自己的服务器上，客户端本地解密。

### 阅读：RSS

不再依赖推荐算法。订阅的源存在本地，读完的标记也存在本地。

## 代价是什么

本地优先不是免费的：

1. **要自己备份**。3-2-1 原则：3 份副本，2 种介质，1 份异地
2. **协作更难**。别人没法直接编辑你的文件
3. **要付学习成本**。Git、同步工具、加密，都有门槛

如果你只是记个购物清单，这些都不值得。但如果你有十年份的笔记、照片、代码，那控制权就很重要。

## 一个判断标准

我现在的判断很简单：**这份数据，如果明天这个服务消失了，我还能不能拿回来？**

如果答案是「不能」，那它就不该是我唯一的副本。

方便很重要，但方便的前提是，东西还是你的。
</script>


<script type="text/markdown" id="md-robot-vision">
写一个能用手柄方向键控制的小车，大概是最容易「看起来做完了」的项目。真正花了时间的，全是做完之后才冒出来的账：固件看门狗、转发回环、速度不生效、以及视觉该放在哪一层。

这篇把那些账一次算清。

## 起点：一个只有方向盘的控制台

最初的需求只有一句：能用上下左右控制一个机器人。

最小实现是零依赖的 Node 服务 + 一个单页：服务端 20Hz 步进虚拟机器人，浏览器通过 SSE 看画面，按下方向键就 `POST /api/input`，多端同时按就取方向并集。键盘 WASD、触屏长按、急停，两天就顺手了。

顺到我一直以为它已经能用——直到开始接真实硬件。

## 问题一：按住两秒，车自己停了

固件里有看门狗：**1.5 秒收不到指令就停车**。这是必要的，WiFi 断了、页面关了，车不该继续冲。

但服务端当时只在「方向变化」时发一次请求。按住不动，就没有变化——1.5 秒后，车自己停了。

修法不是把看门狗调大（那等于把安全机制废掉），而是补心跳：

```js
function syncHardware(cmd) {
  if (!hardware.enabled) return;
  const now = Date.now();
  const changed = cmd !== hardware.lastDir;
  const needBeat = cmd !== 'stop' && now - hardware.lastSentAt > 500;
  if (!changed && !needBeat) return;
  hardware.lastDir = cmd;
  hardware.lastSentAt = now;
  forwardDir(cmd);
}
```

按住「上」两秒，硬件实际收到的是这样一串：

```
/api/speed?value=60      ← 开启转发时同步当前速度
/api/move?dir=stop       ← 初始状态
/api/move?dir=up         ← 按下，立刻发
/api/move?dir=up         ← 心跳 512ms
/api/move?dir=up         ← 心跳 502ms
/api/move?dir=up         ← 心跳 504ms
/api/move?dir=stop       ← 松手，立刻停
```

八条请求，有节奏、有上界。心跳不是「多发几次保险」，它是在**同时满足两个约束**：固件的安全阈值，和控制台的低流量。

## 问题二：我把转发地址填成了自己

测转发时图省事，硬件地址填了 `http://127.0.0.1:8787`——也就是这个控制台自己。

于是它把 `/api/move` 发给自己，那个路径不存在；顺手又发了一次 `/api/speed`，而这个接口会把速度再转发一次……

四秒，一万一千九百三十二次请求。

这看起来像「测试时的蠢操作」，其实是产品缺陷：只要用户填错地址（填了控制台自己的地址、或者同一台机器上的另一个实例），服务就会自己打自己，直到把 CPU 吃满。所谓「用户不会这么填」从来不是理由。

加自环检测：

```js
function isSelfTarget(baseUrl) {
  const u = new URL(baseUrl);
  const port = u.port || (u.protocol === 'https:' ? '443' : '80');
  if (String(port) !== String(PORT)) return false;
  // 同端口 + 本机任一地址（localhost / 127.0.0.1 / 网卡 IP / ::1）
  return localAddresses.has(u.hostname);
}
```

现在填自己会被直接拒绝，并关掉转发：

> 地址指向控制台自己，会形成回环，已拒绝

顺带把速度也做成「只在数值变化时下发」——同一类问题的另一面：高频重复的写操作，本身就是 bug 温床。

## 问题三：拖速度滑杆，车没变快

速度只改了服务端的仿真参数，没往硬件发。补了 `/api/speed?value=0..100`，固件用 PWM 改占空比。

## 加转向时，先承认一个事实

差速车**不能横移**。

虚拟画面里「左右」是平移，看着直观；真车上做不到。这个差异如果不写清楚，接车的人第一反应是「坏了」。

所以加了独立的旋转通道，而不是复用左右：

- 新增 `rotateLeft / rotateRight` 输入，和 `heading`（0° 朝上，顺时针）
- 左右同时按互相抵消，符合差速车的直觉
- 画布上的车头三角按 `heading` 画，旋转时外圈加虚线提示
- 固件里 `left/right` 和 `rotate-*` 是同一个动作：左右轮反向、原地转

要真横移，得换麦克纳姆轮或全向轮——那是另一套轮系，另一篇再写。

## token：挡的不是攻击者，是「随手打开」

服务监听所有网卡，同一局域网谁打开地址都能开走这台车。于是除 `/api/health` 外全部要 token：

- 启动时生成并打印**带 token 的完整地址**
- 三种传法：`x-robot-token` 请求头、`?token=` 查询参数、页面自动带
- 比较用 `crypto.timingSafeEqual`，等长才比，避免时序泄漏
- 页面从 URL 读一次就 `history.replaceState` 抹掉，免得截图或转发时把 token 带出去
- `/api/health` 故意开放：只回存活与在线端数，不暴露任何控制能力，方便探活

它挡不住真正想看的人，但它挡住了「随手点开一个链接就能开车」这件事。这个定位要说清楚，不能让用户以为它是账号体系。

## 视觉：为什么放在浏览器里

三条理由，按重要性排：

1. **画面不出本机**。摄像头帧如果先传到服务端再回来，等于把家里实时画面上传了一遍。
2. **延迟低**。本地像素运算，从取帧到出指令是毫秒级。
3. **不引入依赖**。服务端要跑 OpenCV 或模型，就得装一堆东西；浏览器已经自带摄像头和 Canvas。

链路不长：

```
摄像头帧 → 缩到 160×120 → 逐点 RGB→HSV
        → 色相距离 ≤ 容差，且 S≥0.35、V≥0.2（滤掉灰白黑）
        → 质心 + 包围盒 → 相对画面中心的偏差（-1 ~ 1）
        → 死区 0.10 → 上/下/左/右 → POST /api/input
```

几个刻意的选择：

- **控制环 12.5Hz**（80ms 一次），不是每帧都发请求。渲染可以 60fps，控制不需要。
- **目标丢失 400ms 就松手**，宁可停住，也不要拿过期坐标继续冲。
- **采样点少于 12 个、或面积 <0.4% 当噪声**，避免把反光点当目标。
- **状态回调限频 10Hz**，rAF 每帧写 DOM 会让低端机发涩。

最值得说的是这个：**视觉没有新开接口**。它就是一个 headless 客户端在发 `/api/input`，`clientId` 是 `<页面客户端>-vision`。

好处是全部的既有机制自动复用：硬件转发、多端方向合并、看门狗、急停，一行没改。而且它和手动方向盘各占一路，方向取并集——你按住 W 的时候，视觉的指令不会把你的覆盖掉，你松手它接着接管。

## 怎么确认它是对的

视觉最容易「看着能动就算过」。所以我把算法拆成纯函数单独测：

- 三原色 RGB→HSV（红 0°、绿 120°、蓝 240°、灰饱和度为 0）
- 色相跨 0/360 的最短距离（350° 与 10° 相差 20°，不是 340°）
- 居中红块 → 质心误差 ≤2px、包围盒宽度符合
- 偏右红块 → 质心落在右半侧、上半侧
- 空画面 / 纯灰画面 → 判空（灰色饱和度低，不能算目标）
- 4×4 的小红块 → 当噪声丢掉
- 容差 10 不认橙红（色相 ~30°），容差 45 才认
- 偏差 → 指令：左偏只发左、中心不动、右下同时发右和下、无目标全松

八条全过。浏览器里剩下的只有「取帧」和「画叠加层」——这两件事出错，眼睛一看就知道，不需要测试兜底。

## 还差什么

- **摄像头只在 https 或 localhost 下可用**。手机用 `http://192.168.x.x:8787` 访问会被浏览器直接拒绝，这不是代码问题，是安全策略。要手机端视觉，得给服务配 HTTPS。
- **颜色追踪吃光照**。取色时让目标占画面十分之一以上、避开强反光；换房间换灯就得重新取色。
- **不认语义**。它知道「这块红色在右边」，不知道「这是椅子」。要认类别得换模型——好在替换点在 `detect()` 一处，后面的「偏差 → 指令」逻辑一行不用改。

写完这些，我最大的感受是：**能动的 demo 和能用的工具之间，隔着的全是这类不起眼的账**。看门狗和心跳的配合、回环的自查、token 的定位、视觉该放在哪一层——没有一个写在最初的需求里，但每一个都决定它能不能真的拿去用。
</script>

<script type="text/markdown" id="md-cpp-memory">
很多人学 C 的方式是抄代码，抄到指针就开始崩。问题不在语法，在于脑子里没有一张内存地图。先把地图画出来，剩下的都是自然推论。

## 四块内存区

程序跑起来，内存大致分成四块：

| 区域 | 放什么 | 生命周期 |
| --- | --- | --- |
| 代码区 | 编译后的机器指令 | 整个进程 |
| 静态区（.data / .bss） | 全局变量、`static` 变量 | 整个进程 |
| 栈（stack） | 局部变量、函数参数、返回地址 | 随函数进出，自动回收 |
| 堆（heap） | `malloc` / `new` 出来的内存 | 手动申请，手动释放 |

一个例子就能看出区别：

```c
#include <stdio.h>
#include <stdlib.h>

int g_count = 0;            /* 静态区，已初始化 -> .data */
int g_zero;                 /* 静态区，未初始化 -> .bss，自动清零 */

void demo(void) {
    int local = 42;                     /* 栈：函数返回即失效 */
    static int calls = 0;               /* 静态区：只初始化一次，跨调用保持 */
    int *heap = malloc(sizeof(int));    /* 堆：指针在栈，数据在堆 */
    if (!heap) return;

    *heap = 7;
    calls++;
    printf("%d %d %d\n", local, calls, *heap);

    free(heap);   /* 释放的是堆上那块，指针本身仍是野指针 */
}
```

## 三个必须记住的结论

**1. 栈上的东西不能往外传。** 最经典的错误：

```c
char *bad(void) {
    char buf[16] = "hello";
    return buf;          /* 返回栈地址，函数一结束内容就被覆盖 */
}
```

编译器一般会警告，但很多人忽略警告。正确做法有三条：调用方传缓冲区进来、用 `static`（不可重入，慎用）、或者 `malloc` 后由调用方 `free`。

**2. `free` 之后指针不会变空。** `free(p)` 只把这块内存还给分配器，`p` 的值还在，再读就是未定义行为。习惯是 `free(p); p = NULL;`。

**3. 堆和栈的容量不是一个量级。** 栈通常只有几 MB（Linux 默认 8MB），递归太深或 `int arr[1000000]` 会直接栈溢出；堆能用到物理内存上限。

## 手写一个动态数组

把上面几条用起来，写个能自动扩容的 `int` 数组，这是理解「指针 + 堆 + 容量」最省力的练习：

```c
typedef struct {
    int *data;
    size_t len;
    size_t cap;
} IntVec;

int vec_push(IntVec *v, int x) {
    if (v->len == v->cap) {
        size_t ncap = v->cap ? v->cap * 2 : 4;
        int *np = realloc(v->data, ncap * sizeof(int));
        if (!np) return -1;          /* 失败时原指针仍然有效，别直接覆盖 */
        v->data = np;
        v->cap = ncap;
    }
    v->data[v->len++] = x;
    return 0;
}

void vec_free(IntVec *v) {
    free(v->data);
    v->data = NULL;
    v->len = v->cap = 0;
}
```

注意 `realloc` 那段：**必须用临时指针接返回值**。写成 `v->data = realloc(v->data, ...)` 一旦失败，原指针就丢了，那块内存再也释放不掉（内存泄漏）。

## 排查内存问题的工具

- **Valgrind**：`valgrind --leak-check=full ./a.out`，泄漏、越界、未初始化读都能报出来
- **AddressSanitizer**：编译时加 `-fsanitize=address -g`，比 Valgrind 快很多，日常开发更实用
- **`-Wall -Wextra`**：把警告当错误看（`-Werror`），能挡掉一半的低级错误

## 练习

用 `IntVec` 实现：读入一行数字，去重后排序输出。要求全程只用堆内存、最后只 `free` 一次，再用 ASan 跑一遍确认没有泄漏。

## 一句话总结

C 没有垃圾回收，不是因为它落后，而是因为**它把内存的控制权完整交给了你**。掌握了这份控制权，你才知道上层语言替你做了什么。
</script>


<script type="text/markdown" id="md-cpp-pointers-arrays">
「数组名就是指针」——这句话只在**表达式求值**的时候近似成立。一旦遇到 `sizeof`、`&`、`decltype`，它立刻不成立。

## 实验一：sizeof 的差别

```cpp
#include <cstdio>

void f(int a[]) {              // 形参里的 [] 等价于 *
    printf("%zu\n", sizeof(a));   // 8（64 位下指针大小）
}

int main() {
    int a[10];
    printf("%zu\n", sizeof(a));   // 40
    f(a);
}
```

同一个 `a`，在 `main` 里是 40 字节的数组对象，传进函数就退化成了 8 字节的指针。**这就是「退化」（decay）**：数组在多数表达式中会退化为指向首元素的指针。

## 实验二：& 的差别

```cpp
int a[10];
int (*p1)[10] = &a;   // 指向「整个数组」的指针，类型 int(*)[10]
int *p2 = a;          // 指向首元素，类型 int*
p1 + 1;               // 跳过 40 字节
p2 + 1;               // 跳过 4 字节
```

`&a` 的类型是「数组指针」，加一跨整个数组。这个知识点在读复杂声明时很关键。

## 实验三：不能赋值

```cpp
int a[10], b[10];
// a = b;             // 错误：数组不是左值，不能被赋值
std::copy(b, b + 10, a);   // 正确做法
```

数组名在大多数语境下是右值，不能被赋值、不能自增。

## 实验四：越界不报错，才是真危险

```cpp
int a[3] = {1, 2, 3};
a[3] = 42;      // 未定义行为，可能踩坏别的变量，也可能什么都不发生
```

C++ 不做边界检查。三种防法：
1. 用 `std::array<int,3>`，`at()` 会抛 `std::out_of_range`
2. 用 `std::vector<int>`，同样有 `at()`
3. 开发期开 `-fsanitize=address`，越界立即崩在出错那行

## 现代 C++ 的写法

裸数组只剩两个合理场景：需要极致性能的固定尺寸缓冲区、以及和外设/C 接口打交道。其余时候：

```cpp
#include <array>
#include <vector>
#include <span>

std::array<int, 4> fixed{1, 2, 3, 4};   // 编译期定长，零开销，知道自己的大小
std::vector<int> dyn{1, 2, 3};          // 运行期变长，自动管理内存

void process(std::span<const int> view);  // C++20：既能接数组也能接 vector，不退化
```

`std::span` 是目前传递「一段连续数据」的最佳参数类型：它同时携带指针和长度，解决了退化导致丢长度的问题。

## 传参的三条经验

| 场景 | 参数类型 |
| --- | --- |
| 只读、不修改 | `std::span<const T>` 或 `const std::vector<T>&` |
| 需要修改 | `std::span<T>` 或 `std::vector<T>&` |
| 需要接管所有权 | `std::vector<T>`（按值传，配合 `std::move`） |

## 练习

写一个 `void scale(std::span<int> xs, int k)`，对任意容器（`std::array`、`std::vector`、C 数组）都能调用，并验证三种实参都编译通过、长度信息没有丢失。

## 一句话总结

数组是**对象**，指针是**地址**。C++ 的演进方向，就是把「指针 + 长度」这种容易出错的手工组合，收进 `span` / `vector` / `array` 这些有类型的容器里。
</script>


<script type="text/markdown" id="md-cpp-raii">
Java 有 `try-finally`，Go 有 `defer`，C++ 有**析构函数**。只要对象是在栈上创建的，函数以任何方式退出——正常返回、`return`、抛异常——析构函数都会被执行。这就是 RAII（Resource Acquisition Is Initialization）。

## RAII 的本质：把资源绑到对象生命周期上

```cpp
class FileHandle {
public:
    explicit FileHandle(const char *path) : fp_(std::fopen(path, "rb")) {
        if (!fp_) throw std::runtime_error("open failed");
    }
    ~FileHandle() { if (fp_) std::fclose(fp_); }

    FileHandle(const FileHandle &) = delete;             // 禁止拷贝
    FileHandle &operator=(const FileHandle &) = delete;

    std::FILE *get() const { return fp_; }

private:
    std::FILE *fp_;
};

void read_once() {
    FileHandle f("data.bin");     // 构造即获取
    parse(f.get());               // 中途抛异常也没关系
}                                 // 离开作用域，文件自动关闭
```

如果没有 RAII，`parse` 抛异常的那条路径就会漏掉 `fclose`。手写 `try/catch` 兜底，代码会变成一坨。

## unique_ptr：独占所有权

```cpp
#include <memory>

auto p = std::make_unique<Widget>(1, 2);   // 推荐：make_ 系列，异常安全
// std::unique_ptr<Widget> q = p;          // 错误：不能拷贝
std::unique_ptr<Widget> q = std::move(p);   // 正确：转移所有权，p 变成 nullptr

void take(std::unique_ptr<Widget> w);       // 明确表示「我要接管」
void look(const Widget &w);                 // 明确表示「我只是看看」
```

`unique_ptr` 和裸指针一样快（大小为 0 开销，释放无额外成本），**默认就该用它**。

自定义删除器处理特殊资源：

```cpp
auto deleter = [](std::FILE *f) { std::fclose(f); };
std::unique_ptr<std::FILE, decltype(deleter)> fp(std::fopen("a.txt", "r"), deleter);
```

## shared_ptr：共享所有权，慎用

```cpp
auto a = std::make_shared<Config>();
auto b = a;                  // 引用计数 +1
std::weak_ptr<Config> w = a; // 不增加计数，用来看对象是否还活着
```

三个必须知道的坑：

1. **循环引用会泄漏**。A 持有 B 的 `shared_ptr`，B 也持有 A 的，计数永远不归零。解法是把其中一条边改成 `weak_ptr`。
2. **`shared_ptr` 有额外开销**：一个控制块 + 原子计数操作，别在热路径上传来传去。
3. **不要用同一个裸指针构造两个 `shared_ptr`**：

```cpp
Widget *raw = new Widget();
std::shared_ptr<Widget> a(raw);
std::shared_ptr<Widget> b(raw);   // 两个独立控制块，会 double free
```

## 选型口诀

| 需求 | 选择 |
| --- | --- |
| 默认场景、独占资源 | `std::unique_ptr` |
| 确实需要多方共享生命周期 | `std::shared_ptr` |
| 观察但不持有 | `std::weak_ptr` |
| 传递引用、不涉及所有权 | `T&` / `const T&` / `std::span` |
| 绝不能用的 | 裸 `new` / 裸 `delete` |

## 三条落地规则

1. 构造函数里获取资源，析构函数里释放；中间不写 `try/catch`。
2. 一个类最多持有一个「拥有型」裸指针（内部实现细节），对外一律智能指针或引用。
3. 容器里存 `unique_ptr` 是合法的：`std::vector<std::unique_ptr<Base>>` 常用来做多态集合。

## 练习

把一段手写的 `new[] / delete[]` 数组代码改成 `std::vector`，再把其中「传给别的函数」的部分改成 `std::span`，用 ASan 验证没有泄漏。

## 一句话总结

C++ 的资源管理不靠自觉，靠**作用域**。把资源交给对象，剩下的交给编译器。
</script>


<script type="text/markdown" id="md-cpp-build">
写 C++ 的人迟早被两类报错拦住：`undefined reference to ...` 和 `multiple definition of ...`。它们都不是语法错误，而是**链接错误**——说明编译已经过了，是符号没对上。

## 四个阶段

```bash
g++ -E main.cpp -o main.i    # 预处理：展开 #include、宏、条件编译
g++ -S main.i   -o main.s    # 编译：生成汇编
g++ -c main.s   -o main.o    # 汇编：生成目标文件
g++ main.o -o main           # 链接：合并目标文件与库，解析符号
```

日常 `g++ main.cpp -o main` 是一条命令跑完四步，出问题时才需要手工拆开看。

**看预处理结果**是排查宏问题的利器：`g++ -E x.cpp | wc -l`，一个 `#include <iostream>` 就能展开出两万多行。

## 符号：链接器的语言

编译后每个函数、全局变量在目标文件里都有一个**符号**：

```bash
nm -C main.o        # 列出符号；-C 把修饰名还原成可读形式
# T main            T = 已定义的代码段符号
# U printf          U = 未定义，需要别人提供
```

- `U`（undefined）：我用到了，但不在这个文件里，链接时得找到
- `T`（text）：我定义了一个函数
- `B` / `D`（bss/data）：我定义了全局变量

`undefined reference` 的含义就是：**某个 `U` 符号，所有目标文件和库都翻遍了，没人定义它**。

## 六种常见原因

**1. 忘记把 .cpp 加进编译命令**

```bash
g++ main.cpp -o app                       # 漏了 util.cpp，报 undefined reference to add
g++ main.cpp util.cpp -o app              # 正确
```

**2. 只声明没定义**

```cpp
int add(int, int);        // 声明，编译通过
int main() { add(1, 2); } // 链接报错：没人定义 add
```

**3. 定义在头文件里，被多个 .cpp 包含**

```cpp
// util.h
int add(int a, int b) { return a + b; }   // 错：每个包含它的 .cpp 都定义一份
```

会得到 `multiple definition of add`。三种修法：加 `inline`、放进匿名命名空间、或者把定义挪到 .cpp。

**4. 忘了链接库，或库的顺序不对**

```bash
g++ main.cpp -o app -lm -lpthread        # 数学库、线程库要显式链接
g++ main.cpp -o app -lfoo                # 静态库顺序：被依赖的放后面
```

**5. C / C++ 混编没加 extern "C"**

```cpp
// C 头文件被 C++ 包含时
extern "C" {
    #include "c_lib.h"
}
```

否则 C++ 的名字修饰（name mangling）会让符号对不上。

**6. 模板定义写在 .cpp 里**

模板在实例化时需要看到完整定义，所以通常写在头文件。若一定要分离，需要用显式实例化 `template class Vec<int>;`。

## 一个可复现的最小案例

```bash
# a.cpp
int add(int a, int b) { return a + b; }

# main.cpp
int add(int, int);
int main() { return add(1, 2); }

g++ -c a.cpp          # 生成 a.o
g++ -c main.cpp       # 生成 main.o，此时 main.o 里 add 是 U
g++ main.o -o app     # 链接失败：undefined reference to add(int, int)
g++ main.o a.o -o app # 成功
```

亲手跑一遍，比看十篇文章都管用。

- 调试构建加 `-g -O0`，发布构建 `-O2 -DNDEBUG`
- 静态分析：`clang-tidy`、`cppcheck`

<script type="text/markdown" id="md-py-containers">
Python 的容器用起来太顺手，顺手到很多人不去想代价。可一旦数据量到十万级，选错容器就是几百倍的差距。

## list 是动态数组

```
内存布局： [ 元素0 | 元素1 | 元素2 | ... ][空闲容量]
```

- **按下标访问 `a[i]` 是 O(1)**：地址 = 起始地址 + i × 元素指针大小
- **尾部 append 平均 O(1)**：容量不够时按比例扩容（约 1.125 倍），摊销后仍算 O(1)
- **头部插入 `insert(0, x)` 是 O(n)**：后面所有元素都要往后挪
- **`in` 判断是 O(n)**：只能从头比到尾

```python
import timeit

a = list(range(100_000))
print(timeit.timeit(lambda: 99_999 in a, number=1000))   # 慢：每次都从头扫
```

需要频繁在两端进出，用 `collections.deque`（双向链表块），`appendleft` / `popleft` 都是 O(1)。

## dict / set 是哈希表

```
哈希表结构：
  index 0 → 空
  index 1 → (hash(a), key='name', value='kobe')
  ...
装载因子超过 2/3 时扩容并重新散列
```

- 查找/插入/删除**平均 O(1)**，最坏 O(n)（大量哈希冲突时）
- **key 必须可哈希**：不可变的 `int / str / tuple` 可以，`list / dict / set` 不行
- Python 3.7+ 的 dict **保证插入顺序**，所以它同时能干「有序映射」的活

```python
# 反例：把 list 当 key，直接 TypeError
# {[1, 2]: 'x'}   -> unhashable type: 'list'

# 正解：转成 tuple
{(1, 2): 'x'}
```

## 复杂度对照表（务必记住）

| 操作 | list | deque | set / dict |
| --- | --- | --- | --- |
| 按下标取 | O(1) | O(n) | — |
| 按值查找 `in` | O(n) | O(n) | **O(1)** |
| 头部插入 | O(n) | **O(1)** | — |
| 尾部追加 | O(1) 摊销 | **O(1)** | O(1) 摊销 |
| 有序遍历 | 按插入序 | 按插入序 | 3.7+ 按插入序 |
| 去重 | 需 `set()` 辅助 | — | 天然 |

## 五个立刻能用的重写

**1. 成员判断：list → set**

```python
# 慢：每次 O(n)
if user_id in [1, 2, 3, ..., 10000]:

# 快：O(1)
VALID_IDS = {1, 2, 3, ...}
if user_id in VALID_IDS:
```

**2. 计数：手写循环 → Counter**

```python
from collections import Counter
c = Counter(words)            # 一行完成，C 层加速
c.most_common(10)             # Top N
```

**3. 分组：循环 + setdefault → defaultdict**

```python
from collections import defaultdict

groups = defaultdict(list)
for item in rows:
    groups[item["type"]].append(item)   # 不用先判断 key 是否存在
```

**4. 双端队列：list 做队列 → deque**

```python
from collections import deque
q = deque()
q.append(x)       # 入队
q.popleft()       # 出队 O(1)；list.pop(0) 是 O(n)
```

**5. 拼接字符串：`+=` → `"".join()`**

```python
# 慢：每次 += 都可能新建字符串
s = ""
for w in words:
    s += w

# 快：一次分配
s = "".join(words)
```

## 一个真实的数量级差异

对 10 万条数据做「是否在集合中」的批量判断：

```python
import random, timeit

data = list(range(100_000))
queries = [random.randrange(100_000) for _ in range(1000)]

as_list = timeit.timeit(lambda: [q in data for q in queries], number=1)
as_set  = timeit.timeit(lambda: [q in set(data) for q in queries], number=1)
```

`as_list` 通常在 1 秒级，`as_set` 在毫秒级——**差三个数量级**。这不是魔法，是 O(n) 与 O(1) 的区别。

## 练习

拿一段你项目里的代码，找出所有 `x in [...]`、`list.pop(0)`、字符串 `+=` 的地方，逐个替换成上面对应写法，用 `timeit` 量一下前后差异。

## 一句话总结

选容器看三件事：**要不要按下标、要不要判成员、在哪一端进出**。想清楚这三点，性能问题基本不会出在选择上。
</script>


<script type="text/markdown" id="md-py-generators">
`for x in something` 这句话背后有一个固定协议，叫**可迭代协议**。理解了它，生成器就不再神秘。

## for 循环做了什么

```python
for x in obj:
    ...
```

等价于：

```python
it = iter(obj)          # 1. 取迭代器：调用 obj.__iter__()
while True:
    try:
        x = next(it)    # 2. 取下一个：调用 it.__next__()
    except StopIteration:
        break           # 3. 取完了
    ...
```

所以只要一个对象实现了 `__iter__` 并返回带 `__next__` 的对象，它就能被 for 遍历。

## 手写一个迭代器（看清协议）

```python
class Countdown:
    def __init__(self, start):
        self.n = start

    def __iter__(self):
        return self          # 自己就是迭代器

    def __next__(self):
        if self.n <= 0:
            raise StopIteration
        self.n -= 1
        return self.n + 1
```

`iter()` 与 `next()` 各司其职：前者返回迭代器，后者产出值并在结束时抛 `StopIteration`。

## 生成器：用 yield 自动实现协议

同一个倒计时，用生成器写：

```python
def countdown(n):
    while n > 0:
        yield n
        n -= 1
```

调用时**函数体一行都不执行**，只返回一个生成器对象。每次 `next()` 才跑到下一个 `yield`，然后**冻结现场**——局部变量、执行位置全部保留，下次从这里继续。

这就是「暂停」的真正含义：**栈帧被挂起，不是销毁**。

```python
g = countdown(3)
next(g)   # 3，函数停在 yield 那一行
next(g)   # 2，从上次的位置继续
```

## 为什么省内存

```python
def read_lines(path):
    with open(path, encoding="utf-8") as f:
        for line in f:          # 文件对象本身就是迭代器
            yield line.strip()

total = sum(len(l) for l in read_lines("big.txt"))
```

`read_lines` 全程只持有一行；如果用 `f.readlines()`，1GB 的文件会先变成 1GB 的列表。**惰性求值 = 用时间换空间**，处理大文件、日志、流式 API 时是标配。

## 生成器表达式与管道

```python
lines = read_lines("access.log")

ips = (l.split()[0] for l in lines)                 # 取第一列
internal = (ip for ip in ips if ip.startswith("10."))  # 过滤
count = sum(1 for _ in internal)                     # 消费
```

三个生成器串起来，内存里始终只流动一条记录。这就是「管道式处理」，和数据流的思路一致。

## 五个必须知道的细节

**1. 生成器只能遍历一次**

```python
g = (x for x in range(3))
list(g)   # [0, 1, 2]
list(g)   # []   —— 已经耗尽
```

需要重复遍历就重新创建，或者落成 list。

**2. `yield from` 委托子生成器**

```python
def chain(*its):
    for it in its:
        yield from it     # 比手写 for + yield 更快、更短
```

**3. 生成器里的 `return` 会结束迭代**，值挂在 `StopIteration.value` 上（`yield from` 能拿到）。

**4. 异常会从调用处注入**：`g.throw(ValueError)` 把异常抛进生成器内部的 `yield` 位置，用来做清理。

**5. 别在生成器里改外部可变状态**，调试时会很痛苦。

## 什么时候不该用生成器

- 需要多次遍历、随机访问、`len()`
- 需要排序（排序必须先全部读出来）
- 数据量小而逻辑简单——普通 list 更易读

## 练习

写一个 `tail(path, n)` 生成器，只保留最后 n 行（用 `deque(maxlen=n)`），再用它统计一个大日志里出现最多的 10 个 URL。

## 一句话总结

生成器不是「更省事的列表」，它是**可暂停的计算**。把「取数据」和「处理数据」拆成两个惰性阶段，内存和可读性会同时变好。
</script>


<script type="text/markdown" id="md-py-decorators">
装饰器的语法只有一行 `@something`，但它背后是「函数是一等对象 + 闭包」两个概念。把这两件事说清，装饰器就没难度了。

## 第一步：函数能当参数

```python
def call_twice(fn, x):
    return fn(fn(x))

call_twice(lambda v: v + 1, 1)   # 3
```

函数可以作为参数传入、作为返回值传出——这是装饰器成立的前提。

## 第二步：闭包

```python
def make_adder(n):
    def add(x):
        return x + n      # n 来自外层作用域，被「记住」了
    return add

add5 = make_adder(5)
add5(1)      # 6
```

`add` 返回后，`make_adder` 的栈帧本该消失，但 `n` 被闭包捕获保留了下来。装饰器就是「接收一个函数，返回一个新函数」的闭包。

## 第三步：最简装饰器

```python
import functools, time

def timing(fn):
    @functools.wraps(fn)              # 保留原函数的 __name__ / __doc__
    def wrapper(*args, **kwargs):
        t0 = time.perf_counter()
        try:
            return fn(*args, **kwargs)
        finally:
            dt = time.perf_counter() - t0
            print(f"{fn.__name__} 用时 {dt*1000:.1f} ms")
    return wrapper

@timing
def slow():
    time.sleep(0.1)

slow()   # 用时 100.3 ms
```

`@timing` 完全等价于 `slow = timing(slow)`。

**`functools.wraps` 不能省**：不加的话 `slow.__name__` 会变成 `wrapper`，日志、调试、序列化都会出问题。

## 第四步：带参数的装饰器

```python
def retry(times=3, delay=0.5):
    def decorator(fn):
        @functools.wraps(fn)
        def wrapper(*args, **kwargs):
            last = None
            for i in range(times):
                try:
                    return fn(*args, **kwargs)
                except Exception as e:
                    last = e
                    time.sleep(delay)
            raise last
        return wrapper
    return decorator

@retry(times=5, delay=0.2)
def fetch(url): ...
```

看懂三层的方法：**最外层收参数，中间层收函数，最内层收调用参数**。`@retry(times=5)` 先执行 `retry(times=5)` 拿到 `decorator`，再用它去装饰 `fetch`。

## 第五步：类装饰器与方法装饰

装饰器也能是类（用 `__call__`），适合需要保存状态的场景：

```python
class CountCalls:
    def __init__(self, fn):
        functools.update_wrapper(self, fn)
        self.fn = fn
        self.count = 0

    def __call__(self, *args, **kwargs):
        self.count += 1
        return self.fn(*args, **kwargs)
```

装饰方法时注意 `self`：`*args` 会把实例作为第一个参数传进来，一般不用特殊处理，但写死签名的装饰器会出问题。

## 四个生产环境常用例子

**1. 缓存**

```python
from functools import lru_cache

@lru_cache(maxsize=1024)
def fib(n):
    return n if n < 2 else fib(n - 1) + fib(n - 2)
```

**2. 权限校验**

```python
def require(role):
    def deco(fn):
        @functools.wraps(fn)
        def wrapper(user, *a, **kw):
            if role not in user.roles:
                raise PermissionError(f"需要 {role}")
            return fn(user, *a, **kw)
        return wrapper
    return deco
```

**3. 注册表（插件系统常用）**

```python
HANDLERS = {}

def handler(name):
    def deco(fn):
        HANDLERS[name] = fn       # 导入即注册，靠装饰器的副作用
        return fn
    return deco
```

**4. 事务 / 连接管理**

```python
def with_tx(fn):
    @functools.wraps(fn)
    def wrapper(*a, **kw):
        conn = get_conn()
        try:
            result = fn(conn, *a, **kw)
            conn.commit()
            return result
        except Exception:
            conn.rollback()
            raise
    return wrapper
```

## 三个坑

1. **忘了 `functools.wraps`**：签名、文档全丢，`inspect.signature` 也读不到参数。
2. **装饰顺序有讲究**：`@a @b def f` 等价于 `f = a(b(f))`，离函数近的先执行。
3. **异步函数要用异步装饰器**：装饰 `async def` 时必须返回 `async def`，否则 `await` 会失效。

```python
def async_timing(fn):
    @functools.wraps(fn)
    async def wrapper(*a, **kw):
        t0 = time.perf_counter()
        try:
            return await fn(*a, **kw)
        finally:
            print(time.perf_counter() - t0)
    return wrapper
```

## 练习

写一个 `@memoize` 装饰器，用一个 dict 做缓存，支持自定义 key 函数（默认用 `args`），并处理不可哈希参数（转成 `repr`）。

## 一句话总结

装饰器 = **闭包 + 函数替换**。三层嵌套不是语法要求，是「先收配置、再收函数」的自然结果。想清楚每一层在等什么，就不会写错。
</script>


<script type="text/markdown" id="md-py-gil">
GIL（全局解释器锁）让 CPython 同一时刻只有一个线程执行字节码。于是「多线程没用」成了流传最广的半句话——**它只对 CPU 密集型任务成立**。

## 先分清两类任务

| 类型 | 特征 | 例子 |
| --- | --- | --- |
| CPU 密集 | 一直在算，不让出 CPU | 图像处理、加密、大量循环 |
| I/O 密集 | 大部分时间在等 | 网络请求、读写磁盘、查数据库 |

GIL 只在**执行字节码**时持有。一旦线程发起 I/O，会主动释放 GIL，别的线程就能跑。所以 I/O 密集任务用线程是**真并行**。

## 实测一：CPU 密集，线程反而更慢

```python
import threading, time

def burn(n):
    while n > 0:
        n -= 1

def run(fn, workers):
    ts = [threading.Thread(target=fn, args=(10_000_000,)) for _ in range(workers)]
    t0 = time.perf_counter()
    [t.start() for t in ts]
    [t.join() for t in ts]
    return time.perf_counter() - t0

print("1 线程", run(burn, 1))
print("4 线程", run(burn, 4))   # 通常 >= 1 线程，因为要抢 GIL，有切换开销
```

结论：**CPU 密集任务加线程，不会变快，通常还更慢**（切换开销）。

## 实测二：I/O 密集，线程有效

```python
import time, threading, urllib.request

URLS = ["https://example.com"] * 8

def fetch(u):
    with urllib.request.urlopen(u, timeout=5) as r:
        r.read()

# 串行
t0 = time.perf_counter()
for u in URLS: fetch(u)
print("串行", time.perf_counter() - t0)

# 8 线程
t0 = time.perf_counter()
ts = [threading.Thread(target=fetch, args=(u,)) for u in URLS]
[t.start() for t in ts]; [t.join() for t in ts]
print("线程", time.perf_counter() - t0)
```

8 个请求大致能压到「一次请求」的量级——因为等待期间 GIL 是放开的。

## 实测三：多进程绕过 GIL

```python
from concurrent.futures import ProcessPoolExecutor
import time

def burn(n):
    while n > 0: n -= 1

if __name__ == "__main__":
    t0 = time.perf_counter()
    with ProcessPoolExecutor(max_workers=4) as ex:
        list(ex.map(burn, [10_000_000] * 4))
    print("4 进程", time.perf_counter() - t0)
```

每个进程有独立解释器和独立 GIL，**真正并行**。代价是：进程启动慢、内存翻倍、跨进程传数据要序列化（pickle）。

## 决策表

| 场景 | 首选 | 理由 |
| --- | --- | --- |
| 网络请求、爬虫、调 API | `asyncio` 或 线程池 | 等待多，单线程事件循环开销最小 |
| 磁盘 IO、数据库 | 线程池 | 阻塞式库也能直接跑 |
| 纯计算（图像、数值） | `ProcessPoolExecutor`，或换 NumPy | 绕过 GIL |
| 混合型 | 异步做编排 + 进程池跑重计算 | 各用所长 |
| 需要极低延迟的并发连接 | `asyncio` | 上万连接不必上万线程 |

## asyncio 最小可用模板

```python
import asyncio, aiohttp

async def fetch(session, url):
    async with session.get(url, timeout=5) as r:
        return await r.text()

async def main(urls):
    async with aiohttp.ClientSession() as s:
        return await asyncio.gather(*(fetch(s, u) for u in urls))

# asyncio.run(main(["https://example.com"] * 20))
```

要点：`async def` 里每个等待点都必须 `await`，一旦有同步阻塞调用（比如 `time.sleep`、`requests.get`），整个事件循环会被卡住——这是新手最常犯的错。

## 线程池的正确用法

```python
from concurrent.futures import ThreadPoolExecutor, as_completed

with ThreadPoolExecutor(max_workers=8) as ex:
    futs = {ex.submit(fetch, u): u for u in urls}
    for f in as_completed(futs):
        url = futs[f]
        try:
            print(url, len(f.result()))
        except Exception as e:
            print(url, "失败", e)
```

比手写 `Thread` + `join` 好在：异常能回传、有超时、能拿完成顺序。

## 三个容易踩的坑

1. **共享可变状态要加锁**：即使有 GIL，`x += 1` 也不是原子的（读-改-写三步），多个线程会丢更新。用 `threading.Lock`。
2. **进程池里不能传不可序列化对象**：lambda、打开的文件、数据库连接都不行。
3. **asyncio 里别用阻塞库**：`requests` 要换成 `aiohttp` / `httpx`，`time.sleep` 要换成 `asyncio.sleep`。

## 练习

拿一个「下载 20 个页面并统计词频」的任务，分别用串行、线程池、`asyncio` 实现，记录耗时；再把词频统计换成 CPU 密集版本，观察线程方案是否变慢。

## 一句话总结

GIL 不是「Python 不能并发」，而是**「CPython 的字节码只能一个一个跑」**。I/O 等的不是 CPU，所以线程和异步照样有效；真要并行算，就开进程。
</script>


<script type="text/markdown" id="md-ai-prompt">
大多数人写提示词的方式是「想到什么问什么」，然后抱怨模型不稳定。不稳定的根源往往不是模型，而是**输入本身有多种合理解释**。

## 一个五段式结构

任何稍复杂的任务，都按这五段写：

```
1. 角色与目标   你是谁，要完成什么
2. 输入         数据从哪来，格式是什么
3. 约束         必须遵守什么，禁止什么
4. 输出格式     要什么结构，给一个示例
5. 边界情况     信息不足时怎么办
```

例子（把会议记录整理成待办）：

```
你是会议纪要助理。目标：把下面的原始记录整理成可执行的待办清单。

输入：一段中文会议速记，可能有口语、重复、错别字。

约束：
- 只提取明确指派了「人 + 事」的条目
- 没有责任人的，归到「待认领」
- 不要脑补记录里没提到的截止日期

输出格式（JSON，不要多余文字）：
{"owner": "张伟", "task": "…", "due": "2026-12-01 或 null", "source": "原句摘录"}

边界：若整段没有可执行项，返回 {"items": []} 并在末尾用一句中文说明原因。
```

对比一句「帮我整理下会议纪要」，差别不在礼貌用语，而在**输出可被程序消费**。

## 三个真正有效的技巧

**1. Few-shot：给例子比给形容词有用**

「写得专业一点」是模糊指令；给两个「好 / 不好」的对照例子，模型立刻对齐。

```
示例 1（不合格）：这个功能已经做完了，没什么问题。
示例 2（合格）：该功能已完成开发并通过 12 条单测，剩余风险是并发写入未压测。
请按示例 2 的粒度重写下面这段：
```

**2. 拆步骤：把一次大判断拆成多次小判断**

一次性让模型「读懂合同并判断风险」准确率低；改成先抽取条款、再逐条判风险、最后汇总，准确率明显上升。原因很朴素：**每一步的上下文都更短、更聚焦**。

**3. 给格式：能约束就约束**

要求 JSON 就给 schema，要求列表就说「每行一条，不加序号」。结构化输出能省掉后面大量解析代码。

## 让模型「先想再答」

对推理类任务，加一句：

```
先列出你的判断依据（不超过 5 条），再给结论。
```

显式要求中间步骤，能减少跳跃式错误。注意：这只是提示技巧，不是保证——**结论仍然要抽查**。

## 怎么判断改动有效：建个小测试集

改提示词最大的坑是「感觉变好了」。做法很简单：

1. 收集 20–50 条真实输入，覆盖典型场景 + 边界（空输入、超长、含歧义）
2. 为每条写期望结果（关键字段值，不必逐字）
3. 每次改提示词，跑一遍，统计通过率
4. 只接受「通过率上升且没引入新失败」的改动

```python
cases = [
    {"input": "...", "expect_owner": "张伟"},
    {"input": "", "expect_items": []},
]

def score(prompt, cases):
    ok = 0
    for c in cases:
        out = call_llm(prompt, c["input"])
        ok += check(out, c)
    return ok / len(cases)
```

这段代码不到 20 行，却能把「调提示词」从玄学变成工程。

## 五个高频错误

| 错误 | 后果 | 改法 |
| --- | --- | --- |
| 一次塞太多任务 | 每个都做一半 | 拆成多轮或多次调用 |
| 只说「要准确」 | 模型无从对齐 | 给正反例 |
| 不给输出格式 | 每次结构都不一样 | 给 JSON schema 或示例 |
| 长文档不分段 | 中段信息被忽略 | 分块处理再汇总 |
| 把模型当数据库 | 编造事实 | 提供原文，要求「只依据给定材料」 |

## 一句关键的护栏

凡是要事实的场合，都加上：

```
只依据我提供的材料回答；材料里没有的，直接说「材料中未提及」，不要补充常识。
```

这句能挡掉相当一部分幻觉，代价是有时过于保守——但**宁可说不知道，也不要编**。

## 练习

把「总结这篇文章」改写成五段式提示，要求输出 `{summary, key_points[], open_questions[]}`，然后在 10 篇真实文章上跑，记录结构合规率。

## 一句话总结

提示词工程的本质是**接口设计**：输入有界、输出有型、失败有兜底。做到这三点，效果稳定一大半。

<script type="text/markdown" id="md-ai-rag">
RAG（检索增强生成）的目标很明确：**让模型的回答有出处，而不是靠记忆**。但实际效果差别巨大，差别几乎全在检索这一侧。

## 完整数据流

```
离线：文档 → 解析 → 切块 → 加语境 → 向量化 → 入库
在线：问题 → 改写 → 检索（向量 + 关键词） → 重排 → 拼上下文 → 生成 → 引用
```

每一步都能毁掉最终效果，下面按重要性排。

## 一、切块：最容易被低估的一步

固定按 500 字切，会把一个句子的主语和谓语切开，语义碎片化。

四条实践：

1. **按结构切**：Markdown 按标题、代码按函数、合同按条款、网页按段落
2. **块要有重叠**：前后各留 10–15% 重叠，避免边界信息丢失
3. **块要带语境**：每个块前面补一句「这是《XX 文档》第 3 章关于退款时效的部分」，再向量化
4. **块别太大**：300–800 字较常见；太大稀释语义，太小丢上下文

第 3 条是收益最高的一条。同一段「申请后 7 天内可退」，加上「退款政策」的语境后，被检索到的概率显著提升。

```python
def make_chunk(doc_title, section, text):
    header = f"《{doc_title}》{section}："
    return {
        "text": header + text,
        "meta": {"doc": doc_title, "section": section},
    }
```

## 二、混合检索：向量 + 关键词

纯向量检索的弱点很具体：**专有名词、型号、错误码、人名**。用户搜「ERR_5021」，向量模型未必认为它和文档里的那句相近，但 BM25 一搜就中。

所以生产环境基本都用两路召回再融合：

```python
def hybrid_search(q, k=20):
    vec_hits = vector_store.search(embed(q), k=k)
    kw_hits  = bm25.search(q, k=k)
    # RRF（倒数排名融合）：不比较分数，只比较名次
    scores = {}
    for rank, h in enumerate(vec_hits):
        scores[h.id] = scores.get(h.id, 0) + 1 / (60 + rank)
    for rank, h in enumerate(kw_hits):
        scores[h.id] = scores.get(h.id, 0) + 1 / (60 + rank)
    return sorted(scores.items(), key=lambda x: -x[1])[:k]
```

RRF 的好处是不用调权重，两路的分数尺度不同也能融合。

## 三、重排：把「相关」变成「最相关」

初检 20 条里往往有正确答案，但排在第 9 位，模型只读前 3 条就漏了。交叉编码器重排（cross-encoder）把「问题 + 候选块」一起送进模型打分，精度明显高于向量相似度。

```python
top = rerank(question, candidates, top_n=5)   # 常见做法：20 进 5 出
```

成本是多一次模型推理，收益是**上下文更短、答案更准**，通常划算。

## 四、问题改写

用户的问题是口语的、含指代的（「那它多久到账？」）。直接检索效果差。两步改写：

- **指代消解**：用对话历史把「它」替换成实体
- **多查询扩展**：生成 2–3 个同义问法，分别检索再合并

```python
def rewrite(q, history):
    prompt = (
        "把用户问题改写成独立的检索语句，补全指代，不要回答。
"
        f"历史：{history}
"
        f"问题：{q}
"
        "只输出改写后的句子。"
    )
    return llm(prompt)
```

## 五、生成：必须带引用

拼上下文时给每块编号，要求模型在句末标注来源：

```
材料：
[1] 《退款政策》第 3 条：签收后 7 天内可申请退款。
[2] 《物流说明》：偏远地区延迟 1-2 天。

要求：只依据材料回答，每个结论后标注 [编号]；材料不足则回答「资料中未提及」。
```

拿到 `[1]` 这样的标记后，前端就能做「点击跳原文」，用户可自行核验——这是 RAG 相对纯生成最大的价值。

## 六、评估：别只看「感觉答得好」

至少四个指标：

| 指标 | 含义 | 怎么测 |
| --- | --- | --- |
| 召回率 | 正确块有没有被检索到 | 人工标注 50 个问题的最佳块 |
| 命中排位 | 正确块排在第几 | 看前 5 的命中率 |
| 忠实度 | 答案是否只用了材料 | 人工抽查 + 断言检查 |
| 引用准确 | 标注的编号对不对 | 抽样比对 |

其中**先修召回**：召回不到，后面全白搭。

## 常见失败与对应修法

| 现象 | 多半是 | 修法 |
| --- | --- | --- |
| 答非所问 | 块太大/无语境 | 按结构切块 + 加语境头 |
| 型号搜不到 | 只有向量检索 | 加 BM25 混合 |
| 答案泛泛 | 上下文太长稀释 | 重排后只留 3–5 块 |
| 编造条款 | 没约束「只依据材料」 | 加护栏 + 强制引用 |
| 多轮跑偏 | 没做指代消解 | 先改写再检索 |

## 练习

拿一份 50 页的 PDF 手册，实现「结构切块 + 语境头 + 混合检索 + 重排」，用 20 个真实问题对照纯向量方案，记录前 5 命中率的变化。

## 一句话总结

RAG 的质量上限由**检索**决定，不是由模型决定。切块带语境、混合召回、重排收敛、强制引用——这四件事做完，才算「能用」。

<script type="text/markdown" id="md-ai-agent">
Agent 没有那么神秘。剥掉所有框架，它就是这段伪代码：

```
while 未达成目标 and 步数 < 上限:
    输出 = 模型(历史对话)
    if 输出是最终答案: break
    动作 = 解析(输出)
    结果 = 执行(动作)
    历史 += (动作, 结果)
```

所有复杂度都在**怎么让这个循环不出岔子**。

## 最小实现（不依赖任何框架）

```python
import json

TOOLS = {
    "read_file": lambda path: open(path, encoding="utf-8").read()[:4000],
    "list_dir":  lambda path: "
".join(os.listdir(path)),
}

def run(goal, max_steps=8):
    history = [{"role": "user", "content": goal}]
    for step in range(max_steps):
        msg = llm(history, tools=list(TOOLS))     # 要求模型输出 JSON 动作
        history.append(msg)

        if msg.get("final"):
            return msg["final"]

        name = msg.get("tool")
        if name not in TOOLS:                      # 幻觉工具名
            history.append({"role": "tool", "content": f"没有工具 {name}，可用：{list(TOOLS)}"})
            continue

        try:
            result = TOOLS[name](**msg.get("args", {}))
        except Exception as e:
            result = f"工具执行失败：{e}"           # 错误也要回灌，让模型自己纠
        history.append({"role": "tool", "content": str(result)[:4000]})

    return "达到最大步数仍未完成"
```

八十行以内能跑起来的 Agent，比任何框架都更容易调。

## 为什么工具设计比提示词重要

模型只会挑工具、填参数。工具定义模糊，它必然乱填。

```python
# 差：参数含义不清
{"name": "search", "params": {"q": "string"}}

# 好：名字自解释、参数有类型与示例、说明边界
{
  "name": "search_orders",
  "description": "按用户 ID 查订单，只能查最近 90 天；超过 90 天请改用 export_orders",
  "params": {
    "user_id": {"type": "string", "example": "u_10293"},
    "limit":   {"type": "integer", "default": 10, "max": 50}
  }
}
```

三条经验：
1. **一个工具只做一件事**，宁可多几个工具，也不要一个「万能工具」
2. **说明写清边界**（能做什么、不能做什么、失败时怎么办）
3. **参数尽量用枚举或 ID**，别让模型自由发挥字符串

## 五条防跑飞规则

**1. 步数上限**。没有上限的循环迟早烧钱。8–15 步对多数任务是合理区间。

**2. 幂等与授权**。写操作（发邮件、下单、删文件）必须显式确认，或至少记日志可回溯。

**3. 观察要截断**。工具返回 5 万字会挤爆上下文，取前 N 字 + 提示「已截断」。

**4. 允许失败重试，但要计数**。同一个工具连续失败 3 次，就该跳出循环并汇报，而不是无限重试。

**5. 全程留痕**。每一步的思考、动作、结果都落盘，出问题能复盘——这也是调试 Agent 唯一的办法。

## 让它「想清楚再动手」

在系统提示里固定三段式：

```
每轮先输出：
1) 我现在知道什么（事实）
2) 我还缺什么（缺口）
3) 下一步做什么（动作 + 参数）

再输出 JSON 动作。
```

这个结构能显著减少「跳步乱调工具」。

## 什么时候不该用 Agent

- 流程固定、步骤可枚举 → 直接写代码/工作流，更稳更便宜
- 一次问答能解决 → 普通 RAG 就够
- 对确定性要求极高（财务计算、合规判断）→ 用规则 + 模型只做解释

**Agent 的成本是不确定性**。只有当「路径无法预先枚举」时，它才划算。

## 一个真实的任务拆解示例

目标：「找出本周新增的 500 错误并定位到代码行」。

```
Step 1  query_logs(level="ERROR", code=500, since="7d")   → 得到 12 条
Step 2  group_by_stack(trace_ids)                          → 3 个堆栈
Step 3  search_code(symbol="OrderService::submit")         → 命中 2 个文件
Step 4  read_file(OrderService.cpp, 120-180)               → 定位到空指针
Step 5  final: 汇总原因 + 文件行号 + 建议
```

每一步的输出都是下一步的输入，中间任何一步失败都能停下来汇报——这才是「可控」。

## 练习

用上面的最小实现，做一个「查日志 → 定位代码 → 输出结论」的 Agent，要求：工具不超过 4 个、步数上限 8、每步落盘 JSONL，跑 3 个真实问题看它会在哪一步卡住。

## 一句话总结

Agent = **循环 + 工具 + 终止条件**。把它当工程问题而不是魔法：限制步数、约束工具、留下痕迹，它就能干活；否则它只是在替你烧 token。
